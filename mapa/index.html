<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#1a1a18"/>
<title>PMOC Mapa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../shared/pmoc.css"/>
<link rel="stylesheet" href="xmap.css"/>
<style>
html,body{height:100%}
#app{height:100vh;flex-direction:column}
.topbar{flex-shrink:0;position:static}
.shell-footer{margin-top:0}
.body-layout{display:flex;flex:1;min-height:0}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto}
.sidebar-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:12px}
.mod-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;margin-bottom:6px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff);text-align:left;transition:.15s}
.mod-btn:hover{color:var(--text)}
.mod-btn.active{border-color:var(--accent);color:var(--text)}
.mod-badge-demo{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:8px;background:rgba(201,168,76,.15);color:var(--yellow);flex-shrink:0}
.map-area{flex:1;min-width:0;height:100%}
#mapa{width:100%;height:100%}
</style>
</head>
<body>
<div id="login-screen"></div>

<div id="app">
  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div> PMOC <span class="logo-accent">Mapa</span></div>
    <div class="topbar-right">
      <span class="user-chip" id="user-chip">—</span>
      <button class="btn btn-s btn-sm" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="body-layout">
    <div class="sidebar">
      <div class="sidebar-title">Módulos</div>
      <button class="mod-btn" onclick="alternarModulo('aguada', this)">
        <span>Aguada — monitoramento hídrico</span>
        <span class="mod-badge-demo">demo</span>
      </button>
      <button class="mod-btn" onclick="alternarModulo('grama', this)">
        <span>Grama — controle vegetal</span>
        <span class="mod-badge-demo">demo</span>
      </button>
      <button class="mod-btn" onclick="alternarModulo('eletrica', this)">
        <span>Elétrica — sistema elétrico</span>
        <span class="mod-badge-demo">demo</span>
      </button>
    </div>
    <div class="map-area">
      <div id="mapa"></div>
    </div>
  </div>
</div>

<script src="xmap.js"></script>
<script src="xmap-layers-aguada.js"></script>
<script src="xmap-layers-grama.js"></script>
<script src="xmap-layers-eletrica.js"></script>

<script type="module">
const modulo = location.protocol === 'file:'
  ? './app.js'
  : `${location.pathname.endsWith('/') ? location.pathname : `${location.pathname}/`}app.js`
import(modulo)
</script>
</body>
</html>
