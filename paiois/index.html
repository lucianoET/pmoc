<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#1a1a18"/>
<script>(function(){try{var t=localStorage.getItem('pmoc-tema');if(t!=='claro'&&t!=='escuro'){t=(typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','escuro')}})()/* script classico de proposito: modulo ES e adiado, rodaria depois do primeiro desenho e reintroduziria a piscada de tema */</script>
<title>PMOC Paióis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="../shared/pmoc.css"/>
<!-- Caminho de raiz (D-td4-07). Em /paiois, sem barra final (é o link do
     portal), "./estilo.css" virava /estilo.css, 404 — e a regra
     #app.pronto{display:block} mora nessa folha: o app montava e ficava
     escondido, tela em branco depois do login (medido em 13/09/2026). -->
<link rel="stylesheet" href="/paiois/estilo.css"/>
<style>:root{--accent:#8a9a55}</style>
</head>
<body>
<div id="login-screen"></div>
<div id="app"></div>
<!-- Tag estática, caminho de raiz: a forma de /maquinas, /gestao, /transportes
     e /mapa, que abandonaram o loader por location.pathname em 05/09/2026. -->
<script type="module" src="/paiois/app.js"></script>
</body>
</html>
