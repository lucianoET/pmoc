<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMASM — Controle de Calibração</title>
<!-- Caminho absoluto de raiz, nao relativo: o vercel.json reescreve /calibracao (sem
     barra final) para calibracao/index.html, entao href relativo resolve contra a raiz
     do site e da 404. Mesmo padrao ja usado em maquinas/ e mapa/. -->
<link rel="stylesheet" href="/calibracao/assets/fonts.css">
<link rel="stylesheet" href="/calibracao/assets/erp-module-shell.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111f;--sf:#0f2035;--sf2:#0d1e33;--bd:#1f3552;--bd2:#2e4b72;
  --tx:#e2e8f0;--tx2:#9fb4d1;--tx3:#6f86a8;
  --blue:#00b4d8;--blue-bg:#0b2b45;--blue-lt:#16456b;
  --green:#22c55e;--green-bg:#0b2f1c;
  --red:#ef4444;--red-bg:#351316;--red-lt:#5a1e24;
  --amber:#f59e0b;--amber-bg:#3b2a0d;
  --orange:#fb923c;--orange-bg:#3a220f;
  --purple:#8b5cf6;--purple-bg:#251a3c;
  --r:8px;--rl:12px;
}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:220px;background:#0f172a;color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sb.c{width:52px}
.sb-logo{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid #1e293b}
.sb-icon{width:28px;height:28px;background:#1d4ed8;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.sb-txt{font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap}
.sb-sub{font-size:11px;color:#64748b}
nav{flex:1;padding:8px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:#94a3b8;transition:all .15s;border:none;background:none;width:100%;text-align:left;white-space:nowrap;overflow:hidden;font-size:13px}
.ni:hover{background:#1e293b;color:#fff}
.ni.act{background:#1d4ed8;color:#fff}
.ni-ico{font-size:16px;flex-shrink:0}
.ni-lbl{flex:1;font-weight:500}
.ni-bdg{background:#ef4444;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center}
.sb-tog{padding:10px;border-top:1px solid #1e293b;cursor:pointer;color:#64748b;display:flex;justify-content:center;border:none;background:none;width:100%}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:6px;font-size:13px;flex-shrink:0}
.tb-c{color:var(--tx3)}
.tb-s{color:var(--bd2)}
.tb-p{font-weight:600}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 20px}
.ct{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.kpi-g{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.kpi{border-radius:var(--rl);padding:14px 16px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.kpi:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.kv{font-size:28px;font-weight:700;line-height:1}
.kl{font-size:11px;margin-top:4px;opacity:.8}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.twrap{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--sf2);border-bottom:1px solid var(--bd)}
th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--bd);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--sf2)}
td{padding:9px 12px;vertical-align:middle}
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-d{background:var(--red-bg);color:var(--red)}
.b-w{background:var(--amber-bg);color:var(--amber)}
.b-i{background:var(--blue-bg);color:var(--blue)}
.b-o{background:var(--orange-bg);color:var(--orange)}
.b-p{background:var(--purple-bg);color:var(--purple)}
.b-s{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.tag{background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:500;color:var(--tx2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--sf);color:var(--tx);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn:hover{background:var(--sf2)}
.btn.pr{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pr:hover{background:#1e40af}
.btn.dr{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px}
.bico{padding:5px;border-radius:var(--r);border:none;background:none;cursor:pointer;font-size:14px}
.bico:hover{background:var(--sf2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fr.f{grid-template-columns:1fr}
.fr.c3{grid-template-columns:1fr 1fr 1fr}
.fld{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;font-weight:600;color:var(--tx2)}
input,select,textarea{padding:7px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;color:var(--tx);background:var(--sf);width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:var(--sf);border-radius:var(--rl);width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mod.sm{max-width:420px}
.mod.md{max-width:640px}
.mod.lg{max-width:880px}
.mh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:16px;font-weight:700}
.mb{padding:20px}
.mf{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.filt{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sw{position:relative;flex:1;min-width:200px}
.sw input{padding-left:32px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.ptit{font-size:20px;font-weight:700}
.psub{font-size:13px;color:var(--tx3);margin-top:2px}
.br{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bl{width:140px;font-size:12px;color:var(--tx2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:6px;background:var(--sf2);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px}
.bc{font-size:12px;color:var(--tx2);width:32px;text-align:right;flex-shrink:0}
.ai{padding:10px 12px;border-radius:var(--r);margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-left:3px solid}
.ai-d{background:var(--red-bg);border-color:var(--red)}
.ai-w{background:var(--amber-bg);border-color:var(--amber)}
.ai-i{background:var(--blue-bg);border-color:var(--blue)}
.pst{display:flex;flex-direction:column;gap:6px}
.psi{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf2)}
.psn{font-family:monospace;font-weight:700;font-size:13px;color:var(--blue);width:140px;flex-shrink:0}
.emp{text-align:center;padding:40px;color:var(--tx3);font-size:13px}
.snt{font-family:monospace;font-size:11px;background:var(--sf2);border:1px solid var(--bd);padding:1px 6px;border-radius:4px;color:var(--tx2)}
.rbox{background:var(--red-bg);border:1px solid var(--red-lt);border-radius:var(--r);padding:10px 12px;display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:12px;color:var(--red)}
.ssep{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
html[data-theme="light"]{
  --bg:#eef2f7;--sf:#ffffff;--sf2:#f4f7fb;--bd:#dbe4ef;--bd2:#b6c6da;
  --tx:#16233a;--tx2:#44597a;--tx3:#7d92b0;
  --blue:#0369a1;--blue-bg:#e0f2fe;--blue-lt:#7dd3fc;
  --green:#15803d;--green-bg:#dcfce7;
  --red:#dc2626;--red-bg:#fee2e2;--red-lt:#fca5a5;
  --amber:#b45309;--amber-bg:#fef3c7;
  --orange:#c2410c;--orange-bg:#ffedd5;
  --purple:#6d28d9;--purple-bg:#ede9fe;
}
@media print{:root{
  --bg:#ffffff;--sf:#ffffff;--sf2:#f4f7fb;--bd:#dbe4ef;--bd2:#b6c6da;
  --tx:#16233a;--tx2:#44597a;--tx3:#7d92b0;
  --blue:#0369a1;--blue-bg:#e0f2fe;--blue-lt:#7dd3fc;
  --green:#15803d;--green-bg:#dcfce7;
  --red:#dc2626;--red-bg:#fee2e2;--red-lt:#fca5a5;
  --amber:#b45309;--amber-bg:#fef3c7;
  --orange:#c2410c;--orange-bg:#ffedd5;
  --purple:#6d28d9;--purple-bg:#ede9fe;
}}
.hbg{display:none;background:none;border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);font-size:16px;cursor:pointer;padding:2px 9px;margin-right:4px}
.thm{margin-left:auto;background:none;border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);font-size:13px;cursor:pointer;padding:3px 10px;white-space:nowrap}
.thm:hover{background:var(--sf2)}
.tipw{position:relative;display:inline-flex;margin-left:5px;vertical-align:middle}
.tipq{width:14px;height:14px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help;border:1px solid var(--blue-lt);line-height:1}
.tipbox{display:none;position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;font-size:11px;font-weight:400;color:var(--tx2);width:250px;z-index:150;box-shadow:0 8px 24px rgba(0,0,0,.3);line-height:1.5;text-transform:none;letter-spacing:0;white-space:normal}
.tipw:hover .tipbox,.tipw:focus-within .tipbox{display:block}
.hlp-term{font-weight:700;color:var(--tx);font-size:13px}
.hlp-def{font-size:12.5px;color:var(--tx2);line-height:1.6;margin:2px 0 10px}
.mbk{display:none}
@media(max-width:900px){.kpi-g{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:768px){
.hbg{display:inline-flex}
.sb{position:fixed;left:0;top:0;bottom:0;z-index:60;width:240px;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.35)}
.sb.mo{transform:translateX(0)}
.sb.c{width:240px}
.mbk.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
.content{padding:12px}
.kpi-g{grid-template-columns:repeat(2,1fr)}
.fr,.fr.c3{grid-template-columns:1fr}
.filt{flex-direction:column}
.sw{min-width:0}
.ph{flex-direction:column;align-items:stretch;gap:10px}
.mod.md,.mod.lg{max-width:100%}
}
</style>
</head>
<body class="erp-calibracao-body">
<a href="/" class="calib-home" title="Portal CMASM">⇚ CMASM</a>
<!-- Tela de login (D-06). shared/auth.js desenha com os nomes de token da
     plataforma (--surface, --border, --text…); este módulo tem os seus
     (--sf, --bd, --tx…). Sem esta ponte o cartão sai escuro sobre o tema
     claro. É CSS, não cor nova: cada linha aponta para um token daqui. -->
<style>
#login-cal{
  --surface:var(--sf); --surface2:var(--sf2); --border:var(--bd);
  --text:var(--tx); --text2:var(--tx2); --text3:var(--tx3);
  --yellow:var(--blue);
  --ff:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
</style>
<div id="login-cal"></div>
<div id="root"></div>

// Normaliza um tipo de equipamento (EQS.tipo) para uma chave do catálogo
function catKey(tipo) {
  if (!tipo) return null;
  const u = tipo.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const has = s => u.includes(s);
  if (has('TORQUIMETRO')) return 'TORQUÍMETRO';
  if (has('MULTIMETRO')) return 'MULTÍMETRO';
  if (has('MANOMETRO') && has('BACS')) return 'MANÔMETRO ANALÓGICO  BACS';
  if (has('MANOMETRO') && has('DIGITAL')) return 'MANÔMETRO DIGITAL';
  if (has('MANOMETRO')) return 'MANÔMETRO ANALÓGICO';

  if (has('CONTADOR')) return 'CONTADOR';
  if (has('FONTE DC')) return 'FONTE DC';
  if (has('OSCILOSCOPIO')) return 'OSCILOSCÓPIO';
  if (has('MEGOHMETRO')) return 'MEGÔHMETRO';
  if (has('GERADOR')) return 'GERADOR DE FUNÇÕES';
  if (has('OHMIMETRO')) return 'OHMÍMETRO';
  if (has('DINAMOMETRO') && has('DIGITAL')) return 'DINAMÔMETRO DIGITAL';
  if (has('DINAMOMETRO')) return 'DINAMÔMETRO';
  if (has('NIVEL LINEAR')) return 'NÍVEL LINEAR DE PRECISÃO';
  if (has('TERMOMETRO')) return 'TERMÔMETRO';
  if (has('DIFFERENTIAL')) return 'DIFFERENTIAL PROBE';
  if (has('ALICATE')) return 'ALICATE AMPERÍMETRO';
  if (has('IGNITER')) return 'IGNITER CIRCUIT TEST';

// Normaliza o separador decimal. Mesma regra de `celulaParaDecimal`
// (/refrigeracao, migração 56) e de `normalizarDecimal` (/maquinas): ponto
// separando exatamente três casas pode ser milhar ou decimal, e adivinhar é
// o que transforma mil e duzentos em um vírgula dois.
function numNormalizar(texto) {
  const t = String(texto == null ? '' : texto).trim();
  if (t === '') return { ok: true, texto: '' };
  const virgulas = (t.match(/,/g) || []).length;
  const pontos = (t.match(/\./g) || []).length;
  if (virgulas > 1) return { ok: false, erro: 'tem mais de uma vírgula' };
  if (virgulas === 1 && pontos > 0) return { ok: true, texto: t.replace(/\./g, '').replace(',', '.') };
  if (virgulas === 1) return { ok: true, texto: t.replace(',', '.') };
  if (pontos > 1) return { ok: false, erro: 'tem mais de um ponto' };
  if (pontos === 1 && /^-?\d{1,3}\.\d{3}$/.test(t)) {
    return { ok: false, erro: 'é ambíguo — ponto separando três casas pode ser milhar ou decimal; escreva sem separador de milhar' };
  }
  return { ok: true, texto: t };
}

// Três respostas onde o `+e.target.value` de antes dava uma só: vazio,
// número válido, e recusa com motivo escrito. Colapsar "não preenchi" e
// "escrevi bobagem" em zero é o que fazia um campo em branco virar uma
// afirmação numérica.
function numValidar(texto, spec) {
  const s = spec || {};
  const nome = s.rotulo || 'Valor';
  const norm = numNormalizar(texto);
  if (!norm.ok) return { ok: false, erro: `${nome}: "${String(texto).trim()}" ${norm.erro}` };
  if (norm.texto === '') {
    if (s.obrigatorio) return { ok: false, erro: `${nome}: preencha este campo` };
    return { ok: true, valor: 'vazio' in s ? s.vazio : null };
  }
  // Number() e não parseFloat(): parseFloat('12abc') devolve 12 e engole o
  // resto, que é a leitura silenciosa que esta porta existe para acabar.
  const valor = Number(norm.texto);
  if (!Number.isFinite(valor)) return { ok: false, erro: `${nome}: "${norm.texto}" não é um número` };
  if (s.inteiro && !Number.isInteger(valor)) return { ok: false, erro: `${nome}: precisa ser um número inteiro` };
  if (s.min != null) {
    if (s.exclusivo && !(valor > s.min)) return { ok: false, erro: `${nome}: precisa ser maior que ${s.min}` };
    if (!s.exclusivo && valor < s.min) return { ok: false, erro: `${nome}: não pode ser menor que ${s.min}` };
  }
  if (s.max != null && valor > s.max) {
    return { ok: false, erro: `${nome}: ${valor} está acima do limite de ${s.max} — confira se não sobrou um dígito` };
  }
  return { ok: true, valor };
}

// Escreve um número no campo na forma que este leitor lê de volta — com
// VÍRGULA, que é como se escreve decimal em português. Sem esta metade o
// aplicativo preencheria o campo com um texto que ele próprio recusa.
function numParaCampo(valor) {
  if (valor == null || valor === '') return '';
  const n = Number(valor);
  if (!Number.isFinite(n)) return '';
  return String(n).replace('.', ',');
}

// O campo. Guarda o TEXTO enquanto se digita e entrega o NÚMERO ao redor:
// um controlado por número não deixa digitar vírgula (ela some no
// ida-e-volta) nem escapa do `.toFixed(2)` que inutilizou o preço.
//
// Enquanto o texto é inválido o valor de fora NÃO é atualizado — o campo
// fica vermelho e diz por quê, e quem tem botão Salvar o desabilita por
// `aoErro`. Escrever null ali seria gravar em silêncio o contrário do que
// está na tela.

  // instrumento, formulário reaberto) — nunca quando foi este campo que o
  // mudou, senão "12," viraria "12" no meio da digitação.
  useEffect(() => {
    const lido = numValidar(texto, spec);
    if (lido.ok && lido.valor === valor) return;
    setTexto(numParaCampo(valor));
    setErro('');
    if (aoErro) aoErro(chave, '');
  }, [valor]);
  function mudou(t) {
    setTexto(t);
    const lido = numValidar(t, spec);
    setErro(lido.ok ? '' : lido.erro);
    if (aoErro) aoErro(chave, lido.ok ? '' : lido.erro);
    if (lido.ok) aoMudar(lido.valor);

    h('input', {
      ...resto,
      type: 'text',
      inputMode: spec && spec.inteiro ? 'numeric' : 'decimal',
      value: texto,
      onChange: e => mudou(e.target.value),
      style: { ...(resto.style || {}), ...(erro ? { borderColor: 'var(--red)' } : {}) }
    }),

    // a frase inteira derrama por cima das colunas vizinhas da linha do

    // sob o campo nas células alinhadas à direita, e a frase continua
    // inteira: encurtá-la por corte é como nasceram "TRIMES" e "FORMUL".
    erro && h('div', { style: { color: 'var(--red)', fontSize: 11, marginTop: 3,
                                maxWidth: 200, marginLeft: 'auto', whiteSpace: 'normal' } }, erro)

// objeto do app → linha do banco. Só os campos presentes viajam, para
// que um update parcial continue parcial.
function paraLinha(obj, campos, datas = []) {
  const linha = {};
  for (const [campo, coluna] of Object.entries(campos)) {
    if (!(campo in obj)) continue;
    linha[coluna] = datas.includes(campo) ? paraISO(obj[campo]) : obj[campo];
  }
  return linha;
}
// linha do banco → objeto do app
function daLinha(linha, campos, datas = []) {
  const obj = {};
  for (const [campo, coluna] of Object.entries(campos)) {
    obj[campo] = datas.includes(campo) ? paraBR(linha[coluna]) : linha[coluna];
  }
  return obj;
}

// Com o host inalcançável, uma consulta do supabase-js NÃO rejeita nem
// resolve: ela retenta o fetch indefinidamente (conferido no navegador —
// 8,8 s sem qualquer desfecho, console cheio de ERR_NAME_NOT_RESOLVED).
// try/catch não pega isso; só prazo pega. Sem ele o módulo ficava preso
// em "Carregando dados do banco…" para sempre e uma gravação perdida
// jamais avisava — a tela mostrando salvo e o banco sem receber nada.
const PRAZO_MS = 15000;
function comPrazo(p) {
  return Promise.race([
    Promise.resolve(p),
    new Promise((_, rej) =>
      setTimeout(() => rej(new Error('O banco não respondeu em 15 s — verifique a conexão.')), PRAZO_MS))
  ]);
}

function useStore() {
  const [eqs, setEqs] = useState([]);
  const [labs, setLabs] = useState([]);
  const [pss, setPss] = useState([]);
  const [lotes, setLotes] = useState([]);
  const [catalog, setCatalogState] = useState({});
  const [carregando, setCarregando] = useState(true);
  const [erroCarga, setErroCarga] = useState(null);

  // Uma consulta por tabela, em paralelo, no padrão carregarTudo() do
  // resto do pmoc.
  async function carregarTudo() {
    if (!supa) { setErroCarga('SDK do Supabase não carregou.'); setCarregando(false); return; }
    setCarregando(true);
    try {
      await _carregar();
    } catch (e) {
      // Tabela ausente devolve {error}; rede fora REJEITA a promessa. Sem
      // este catch a função morria antes de setCarregando(false) e o
      // módulo ficava preso em "Carregando dados do banco…" para sempre —
      // era exatamente o caso que o aviso existia para cobrir.
      setErroCarga(e && e.message ? e.message : String(e));

    const [rl, re, rp, rt, rc] = await comPrazo(Promise.all([
      // `order` em tudo, sempre. Sem ele o Postgres devolve na ordem que
      // quiser, e um UPDATE reescreve a linha noutra posição do heap: a
      // lista de instrumentos se reembaralhava sozinha a cada edição.
      // Por id porque e001…e038 é justamente a ordem do cadastro, que
      // agrupa por divisão.
      supa.from('cal_labs').select('*').order('id'),
      supa.from('cal_equipamentos').select('*').order('id'),
      supa.from('cal_ps').select('*').order('id'),
      supa.from('cal_lotes').select('*').order('id'),
      supa.from('cal_catalogo').select('*').order('equip_tipo').order('ord')
    ]));
    const falha = [rl, re, rp, rt, rc].find(r => r.error);
    if (falha) {
      // Sem as migrações 35/36 o módulo avisa em vez de mostrar tela
      // quebrada — mesmo princípio de carregarCatalogoReparos() no Máquinas.
      setErroCarga(falha.error.message);
      setCarregando(false);
      return;
    }
    setLabs((rl.data || []).map(l => daLinha(l, CAMPOS_LAB)));
    setEqs((re.data || []).map(e => daLinha(e, CAMPOS_EQ, DATAS.eq)));
    setPss((rp.data || []).map(p => daLinha(p, CAMPOS_PS, DATAS.ps)));
    setLotes((rt.data || []).map(t => daLinha(t, CAMPOS_LOTE, DATAS.lote)));
    const mapa = {};
    for (const r of rc.data || []) {
      (mapa[r.equip_tipo] = mapa[r.equip_tipo] || []).push({
        forn: r.forn, contrato: r.contrato, preco: r.preco, item: r.item, tipo: r.tipo
      });
    }
    setCatalogState(mapa);
    setErroCarga(null);
    setCarregando(false);
  }

  useEffect(() => { carregarTudo(); }, []);

  // Escrita em segundo plano. A tela já mostrou a mudança; se o banco
  // recusar, avisa e recarrega para a tela voltar a contar a verdade.
  // ponytail: gravação otimista para não ter de tornar assíncronas as
  // 11 páginas React, que consomem estes mutators de forma síncrona.
  function gravar(q, oque) {
    if (!supa) return;
    comPrazo(q).then(({ error }) => {
      if (error) { alert(`Erro ao salvar ${oque}: ${error.message}`); carregarTudo(); }
    }).catch(e => {
      // Rede fora rejeita em vez de devolver {error}. Sem este catch a
      // rejeição era engolida: a tela mostrava a alteração salva e o
      // banco nunca recebia nada — a pior falha possível aqui.
      alert(`Erro ao salvar ${oque}: ${e && e.message ? e.message : e}`);
      carregarTudo();
    });

  // de sequência mantido no cliente geraria PS-CMS-26-013 duplicado
  // assim que duas pessoas emitissem ao mesmo tempo. `cal_ps.num` é
  // unique, então uma colisão vira erro visível, não dado torto.
  const ano = new Date().getFullYear().toString().slice(2);
  const cnt = useMemo(() => {
    let max = 0;
    const re = new RegExp(`^PS-CMS-${ano}-(\\d+)$`);
    for (const p of pss) {
      const m = re.exec(p.num || '');
      if (m) max = Math.max(max, +m[1]);
    }
    return max + 1;
  }, [pss, ano]);

  const lm = useMemo(() => Object.fromEntries(labs.map(l => [l.id, l])), [labs]);
  const em = useMemo(() => Object.fromEntries(eqs.map(e => [e.id, e])), [eqs]);

  function getPSByEq(id) {
    return pss.filter(p => p.eqId === id);
  }

  function addEq(d) {
    const e = { ...d, id: `e${Date.now()}`, ativo: true };
    setEqs(p => [...p, e]);
    gravar(supa.from('cal_equipamentos').insert(paraLinha(e, CAMPOS_EQ, DATAS.eq)), 'o instrumento');
    return e;
  }

  function updEq(id, d) {
    setEqs(p => p.map(e => e.id === id ? { ...e, ...d } : e));
    gravar(supa.from('cal_equipamentos').update(paraLinha(d, CAMPOS_EQ, DATAS.eq)).eq('id', id), 'o instrumento');
  }

    const ab = pss.find(p => p.eqId === id && !['CONCLUIDO', 'CANCELADO'].includes(p.status));

    setEqs(p => p.map(e => e.id === id ? { ...e, ativo: false } : e));
    gravar(supa.from('cal_equipamentos').update({ ativo: false }).eq('id', id), 'a baixa do instrumento');
    return null;
  }

    const l = { ...d, id: `lab${Date.now()}`, ativo: true };
    setLabs(p => [...p, l]);

  }

    return `<div class="lb">${svg}<div class="li"><div class="lp">${esc(e.pat || e.sn || '—')}</div><div class="lt">${esc([e.tipo, e.mod].filter(Boolean).join(' '))}</div><div class="ld">Próx. cal: <b>${esc(e.prox || '—')}</b></div><div class="lmz">CMASM · Metrologia${lm[e.labId] ? ' · ' + esc(lm[e.labId].code) : ''}</div></div></div>`;

<style>
body{font-family:Arial,Helvetica,sans-serif;margin:8mm;color:#111}

@media print{.hint{display:none}body{margin:6mm}}

function printRelatorioISO(s) {

  const psConcl = pss.filter(p => p.status === 'CONCLUIDO' && (p.cal || '').endsWith('/' + ano));

  const compMed = comps.length ? Math.round(comps.reduce((a, b) => a + b, 0) / comps.length) : 0;
  const fracas = at.filter(e => completudeFicha(e).pct < 70);

    return `<tr><td>${esc(p.cal)}</td><td>${esc(eq.pat || eq.sn)}</td><td>${esc([eq.tipo, eq.mod].filter(Boolean).join(' '))}</td><td>${esc((lm[p.labId] || {}).code)}</td><td>${esc(p.cert)}</td><td>${esc(p.res === 'reprovado' ? 'REPROVADO' : p.res === 'aprovado' ? 'Aprovado' : null)}</td><td>${p.vE ? BRL(p.vE) : '—'}</td></tr>`;
  }).join('');
  const linhaNc = ncs.map(n => `<tr><td>${esc(n.p.cal)}</td><td>${esc(n.eq.pat || n.eq.sn)}</td><td>${esc([n.eq.tipo, n.eq.mod].filter(Boolean).join(' '))}</td><td>${esc(n.p.num)}</td><td>${esc(n.motivo)}</td></tr>`).join('');
  const linhaDesc = at.filter(e => e.status === 'DESCALIBRADO').map(e => `<tr><td>${esc(e.pat || e.sn)}</td><td>${esc([e.tipo, e.mod].filter(Boolean).join(' '))}</td><td>${esc(e.div)}</td><td>${esc(e.prox)}</td></tr>`).join('');
  const linhaFraca = fracas.map(e => { const c = completudeFicha(e); return `<tr><td>${esc(e.pat || e.sn)}</td><td>${esc([e.tipo, e.mod].filter(Boolean).join(' '))}</td><td>${c.pct}%</td><td>${esc(c.faltam.join(' · '))}</td></tr>`; }).join('');

  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório Anual ${ano} — CMASM Calibração</title>

<script type="module">
import { Auth } from '../shared/auth.js';

// O tema é aplicado pelo React, que só monta depois do login: sem estas
// duas linhas a tela de login pisca no tema errado para quem escolheu claro.
try {
  const t = localStorage.getItem('cmasm_erp_theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}

const alvo = document.getElementById('login-cal');
if (!window.__calSupa) {
  // SDK fora do ar: sem client não há login nem dado. Abrir o app aqui
  // mostraria onze telas vazias, que é pior do que dizer o que houve.
  alvo.innerHTML = '<div style="padding:40px;text-align:center;color:var(--tx)">' +
    'Não foi possível carregar o SDK do Supabase (cdn.jsdelivr.net). Sem ele o módulo não acessa o banco de dados. Verifique a conexão — se a rede bloqueia CDN externo, esse endereço precisa ser liberado.</div>';
} else {
  // `mount` checa a sessão salva E escuta onAuthStateChange: com sessão
  // válida no navegador, onLogin chega duas vezes para o mesmo login. Sem
  // esta trava seriam dois createRoot no mesmo nó.
  let iniciado = false;
  new Auth(window.__calSupa, { appNome: 'Calibração', appIcone: '⚓' })
    .onLogin((usuario) => {
      if (iniciado) return;
      iniciado = true;
      alvo.remove();
      window.__calIniciar(usuario);
    })
    .mount('#login-cal');
}
</script>
