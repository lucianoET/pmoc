/* ── ficha: medições acompanhadas ── */
/* D-q57-11: SVG escrito à mão, no idioma de dvDonut — zero build, sem
   biblioteca de gráfico. As cores abaixo são cópia literal dos hexadecimais
   já validados no arquivo (DV_CAT/DV_SEQ, CRIT_COLORS — todos definidos mais
   abaixo): não são referenciadas as variáveis porque, em ordem de execução
   top-level, elas ainda não têm valor no momento em que este bloco roda —
   o hex é o mesmo, só escrito de novo, nenhuma cor nova inventada. */
var MEDICOES_FICHA = [
  {chave:'insuflamento', rotulo:'Temp. insuflamento', unidade:'°C', cor:'#1351B4'},
  {chave:'retorno',      rotulo:'Temp. retorno',       unidade:'°C', cor:'#00897B'},
  {chave:'deltaT',       rotulo:'ΔT',                  unidade:'°C', cor:'#7B1FA2'},
  {chave:'corrente',     rotulo:'Corrente',             unidade:'A',  cor:'#E65100'},
  {chave:'tensaoMedida', rotulo:'Tensão medida',        unidade:'V',  cor:'#1565C0'},
  {chave:'pressao',      rotulo:'Pressão de sucção',    unidade:'psi',cor:'#33691E'},
  {chave:'capMarcha',    rotulo:'Capacitor de marcha',  unidade:'µF', cor:'#5E85CB'},
  {chave:'capPartida',   rotulo:'Capacitor de partida', unidade:'µF', cor:'#B8CBEA'}
];

/* Do mais antigo ao mais novo — _logCache vem ordenado ao contrário (mais
   novo primeiro). Só Number.isFinite entra; null, '', undefined e texto não
   numérico são descartados sem erro. Núcleo puro, testável em Node. */
function serieMedicoes(logs, chave){
  var out = [];
  (logs||[]).forEach(function(entry){
    if (!entry) return;
    var n = parseFloat(entry[chave]);
    if (Number.isFinite(n)) out.push({date:entry.date, valor:n});
  });
  return out.reverse();
}

/* Compara a PRIMEIRA leitura com a ÚLTIMA, nunca o mínimo com o máximo — a
   pergunta é "caiu com o tempo?", não "oscilou?". null com menos de dois
   pontos: não há tendência para calcular. */
function tendenciaMedicao(serie){
  if (!serie || serie.length<2) return null;
  var primeiro = serie[0].valor, ultimo = serie[serie.length-1].valor;
  return {primeiro:primeiro, ultimo:ultimo, delta: Math.round((ultimo-primeiro)*100)/100};
}

/* Mesmo idioma manual de dvDonut — nenhuma biblioteca. Série constante
   (mínimo igual ao máximo) desenha a linha no meio, sem divisão por zero. */
function sparklineSVG(serie, cor){
  var w=100, h=28, m=3;
  var vals = serie.map(function(p){return p.valor;});
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var pontos = serie.map(function(p,i){
    var x = serie.length>1 ? m+(w-2*m)*i/(serie.length-1) : w/2;
    var y = max>min ? (h-m)-(h-2*m)*(p.valor-min)/(max-min) : h/2;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var ultimo = pontos[pontos.length-1].split(',');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100" height="28" role="img" aria-hidden="false">' +
    '<title>'+serie.length+' leituras</title>' +
    '<polyline points="'+pontos.join(' ')+'" fill="none" stroke="'+esc(cor)+'" stroke-width="1.6"/>' +
    '<circle cx="'+ultimo[0]+'" cy="'+ultimo[1]+'" r="2.2" fill="'+esc(cor)+'"/>' +
    '</svg>';
}

/* Uma linha por série com pelo menos uma leitura. Série com um ponto mostra
   o valor e diz que ainda não há tendência, sem <svg>. Nenhuma série com
   leitura ⇒ a subseção inteira vira a frase de vazio, sem gráfico nenhum
   (D-q57-11) — hoje é o estado de todos os 171 equipamentos. */
function renderMedicoesFicha(logs){
  var linhas = MEDICOES_FICHA.map(function(m){
    var serie = serieMedicoes(logs, m.chave);
    if (!serie.length) return '';
    var ultimo = serie[serie.length-1].valor;
    if (serie.length===1) {
      return '<div class="dfield"><label>'+esc(m.rotulo)+'</label><div class="dval">'+ultimo+' '+esc(m.unidade)+
        '<div style="font-size:10px;color:#999;margin-top:2px">1 leitura — sem tendência ainda</div></div></div>';
    }
    var tend = tendenciaMedicao(serie);
    var seta = tend.delta>0 ? '↑' : (tend.delta<0 ? '↓' : '→');
    var corTend = tend.delta>0 ? '#B46800' : (tend.delta<0 ? '#1565C0' : '#888');
    return '<div class="dfield"><label>'+esc(m.rotulo)+'</label><div class="dval">'+ultimo+' '+esc(m.unidade)+
      ' <span style="color:'+corTend+';font-size:11px;font-weight:700">'+seta+' '+(tend.delta>0?'+':'')+tend.delta+' '+esc(m.unidade)+'</span>' +
      '<div style="margin-top:4px">'+sparklineSVG(serie, m.cor)+'</div></div></div>';
  }).filter(function(x){ return x; });

  if (!linhas.length) {
    return '<div class="empty" style="padding:8px 0"><p>Nenhuma medição registrada ainda — as leituras aparecem aqui à medida que as OS forem executadas.</p></div>';
  }
  return '<div style="margin-top:10px;border-top:1px dashed #DDD;padding-top:8px">' +
    '<div style="font-size:11px;font-weight:700;color:#666;text-transform:uppercase;margin-bottom:6px">Medições acompanhadas</div>' +
    '<div class="dfields2">'+linhas.join('')+'</div></div>';
}

/* Mesma informação, sem SVG, para o documento em papel — as leituras com
   data, uma linha row2 por série (reusa a tabela de duas colunas de
   imprimirDocumento; não abre seção numerada própria — entra dentro do
   bloco "3 · Estado e PMOC" da ficha impressa). */
function medicoesFichaLinhasImpressao(logs){
  return MEDICOES_FICHA.map(function(m){
    var serie = serieMedicoes(logs, m.chave);
    if (!serie.length) return '';
    var leituras = serie.map(function(p){ return fmtDate(p.date)+': '+p.valor+' '+m.unidade; }).join(' · ');
    return row2(esc(m.rotulo), esc(leituras));
  }).join('');
}

/* ── encerramento de OS: última manutenção ── */
async function atualizarUltimaManutencao(equipId, data){
  if(!data) return false;
  var e = DATA.find(function(r){ return r.id===equipId; });
  if(!e) return false;
  if(e.ultimaManutencao && e.ultimaManutencao>=data) return false; // D-jpd-03: nunca retrocede
  var { error } = await supa.from('equipamentos').update({ultima_manutencao:data}).eq('id',equipId);
  if(error){ showToast('Erro ao atualizar última manutenção','error'); return false; }
  e.ultimaManutencao = data;
  return true;
}

/* D-q57-04: o estado do equipamento muda na própria conferência da OS que o
   causou. Normaliza por normalizarEstadoEquip; não grava quando o valor não
   é da lista fechada NEM quando já é o estado atual — não existe update que
   não muda nada. */
async function atualizarEstadoEquip(equipId, estado){
  var novo = normalizarEstadoEquip(estado);
  if(!novo) return false;
  var e = DATA.find(function(r){ return r.id===equipId; });
  if(!e) return false;
  if(equipEstado(e)===novo) return false;
  var { error } = await supa.from('equipamentos').update({funciona:novo}).eq('id',equipId);
  if(error){ showToast('Erro ao atualizar estado do equipamento','error'); return false; }
  e.funciona = novo;
  return true;
}

/* D-uyz-15: CONVERGENTES e IDEMPOTENTES — calculam o estado-alvo a partir
   das colunas da própria OS, comparam com o atual e não escrevem quando já
   é igual (mesma técnica de atualizarEstadoEquip/atualizarUltimaManutencao
   e de baixarPecasDaOS() em Máquinas). Um único .update( cada uma — é o
   que torna conferir a mesma OS duas vezes (ou um retry de rede)
   inofensivo. */
async function aplicarInstalacao(equipId, entry){
  if (!LOCAIS_CARREGADOS) await carregarLocais();
  var r = rotuloLocalDestino(entry.localDestinoId, LOCAIS_POR_ID);
  if (!r) { showToast('Não foi possível resolver o local de destino — nada foi gravado', 'error'); return false; } // D-uyz-25: recusa em vez de gravar meia coisa
  var e = DATA.find(function(x){ return x.id===equipId; });
  if (!e) return false;
  if (equipBaixado(e)) { showToast('Máquina baixada não pode ser instalada', 'error'); return false; } // D-uyz-05: baixado é terminal
  if (entry.equipSubstituidoId) {
    var substituida = DATA.find(function(x){ return x.id===entry.equipSubstituidoId; });
    if (substituida && equipInstalado(substituida)) {
      // D-uyz-14: a instalação de B não remove A — A precisa da própria OS de remoção.
      showToast('#'+substituida.id+' ainda está instalada — abra a OS de Remoção dela antes', 'error');
      return false;
    }
  }
  var alvo = { local_id: entry.localDestinoId, predio: r.predio, local: r.local, data_instalacao: entry.date, situacao: 'instalado' };
  var jaEstaAssim = e.localId===alvo.local_id && e.predio===alvo.predio && e.local===alvo.local &&
    e.dataInstalacao===alvo.data_instalacao && equipSituacao(e)==='instalado';
  if (jaEstaAssim) return true; // conferir duas vezes não grava duas vezes
  var res = await supa.from('equipamentos').update(alvo).eq('id', equipId);
  if (res.error) { showToast('Erro ao aplicar instalação: '+res.error.message, 'error'); return false; }
  e.localId = alvo.local_id; e.predio = alvo.predio; e.local = alvo.local;
  e.dataInstalacao = alvo.data_instalacao; e.situacao = alvo.situacao;
  return true;
}

async function aplicarRemocao(equipId, entry){
  var destino = entry.destinoRemocao;
  if (['guardada','baixa'].indexOf(destino) < 0) { showToast('Destino da remoção inválido', 'error'); return false; }
  if (destino==='baixa' && !podeDarBaixa()) { showToast('Só admin pode dar baixa patrimonial', 'error'); return false; } // D-uyz-07/23: guarda de tela — UX apenas, RLS não distingue cargo
  var e = DATA.find(function(x){ return x.id===equipId; });
  if (!e) return false;
  var situacaoAlvo = destino==='baixa' ? 'baixado' : 'removido';
  var alvo = { local_id: null, predio: null, local: null, lat: null, lon: null, data_remocao: entry.date, situacao: situacaoAlvo };
  // D-uyz-19: a remoção limpa lat/lon junto do local — coordenada própria de
  // máquina numa prateleira é dado falso.
  if (destino==='baixa') alvo.data_baixa = entry.date; // D-uyz-18
  var jaEstaAssim = e.localId==null && e.predio==null && e.local==null && (e.lat==null) && (e.lon==null) &&
    e.dataRemocao===alvo.data_remocao && equipSituacao(e)===situacaoAlvo &&
    (destino!=='baixa' || e.dataBaixa===alvo.data_baixa);
  if (jaEstaAssim) return true;
  var res = await supa.from('equipamentos').update(alvo).eq('id', equipId);
  if (res.error) { showToast('Erro ao aplicar remoção: '+res.error.message, 'error'); return false; }
  e.localId = null; e.predio = null; e.local = null; e.lat = null; e.lon = null;
  e.dataRemocao = alvo.data_remocao; e.situacao = alvo.situacao;
  if (destino==='baixa') e.dataBaixa = alvo.data_baixa;
  return true; // funciona NÃO é tocada (D-uyz-20) — situacao e funciona são eixos ortogonais
}

  }
  if (MAN_FLUXO_OK) {
    // A OS nasce ABERTA — o status nunca é lido de campo (D-l7n-06/11).

  return tabela[tipoEquip] || tabela['SPLIT'];

/* D-uyz-03: os três casos de instalação são DERIVADOS do dado gravado,
   nunca digitados. Ordem exata: substituída preenchida → substituição
   (mesmo com o destino já ocupado); senão destino com ao menos um
   equipamento instalado → adicional; senão → novo local.
   ocupantesDoDestino é NÚMERO, calculado pelo chamador a partir de DATA. */
var CASOS_INSTALACAO = {
  'substituicao': 'Substituição de máquina removida',
  'adicional':    'Mais uma máquina no mesmo local',
  'novo-local':   'Novo local'
};
function casoDeInstalacao(destinoId, substituidoId, ocupantesDoDestino){
  if (substituidoId) return 'substituicao';
  if ((ocupantesDoDestino||0) > 0) return 'adicional';
  return 'novo-local';
}

/* D-uyz-25: predio/local são derivados de cmasm_locais no momento da
   escolha do destino, nunca congelados na OS — a árvore tem exatamente
   dois níveis (sala → edificação), então um único passo por parent_id já
   resolve o par. Guarda de ciclo (mesma técnica de localAscendente em
   mapa/mapa-geometria.js): parent_id não tem restrição de aciclicidade no
   Postgres, e um cadastro circular travaria a aba sem erro nenhum.
   Devolve null quando o id não está no índice — é o que faz
   aplicarInstalacao recusar em vez de gravar meia coisa. */
function rotuloLocalDestino(id, porId){
  if (id===undefined || id===null || !porId || !Object.prototype.hasOwnProperty.call(porId, id)) return null;
  var no = porId[id];
  var predioNo = no;
  var visitados = {};
  visitados[no.id] = true;
  while (predioNo.parent_id!==undefined && predioNo.parent_id!==null &&
         !visitados[predioNo.parent_id] &&
         Object.prototype.hasOwnProperty.call(porId, predioNo.parent_id)) {
    visitados[predioNo.parent_id] = true;
    predioNo = porId[predioNo.parent_id];
  }
  var rotulo = (predioNo===no) ? String(no.nome) : (predioNo.nome+' / '+no.nome);
  return { predio: predioNo.nome, local: no.nome, rotulo: rotulo };
}

/* ── movimentação: carga dos locais, sob demanda ── */
/* Fora do Promise.all principal, como carregarCatalogoReparos()/
   carregarItensOS()/carregarCompras() em Máquinas — sob demanda, ao abrir
   o formulário de movimentação e ao aplicar uma instalação. No erro,
   deixa LOCAIS vazio e LOCAIS_CARREGADOS falso, e o formulário desabilita
   o salvar em vez de oferecer um <select> vazio que grava null. */
var LOCAIS = [];
var LOCAIS_POR_ID = {};
var LOCAIS_CARREGADOS = false;
async function carregarLocais(){
  try {
    var r = await supa.from('cmasm_locais').select('id,nome,tipo,parent_id,ativo').eq('ativo', true).order('nome');
    if (r.error) throw r.error;
    LOCAIS = r.data || [];
    LOCAIS_POR_ID = {};
    LOCAIS.forEach(function(l){ LOCAIS_POR_ID[l.id] = l; });
    LOCAIS_CARREGADOS = true;
    return true;
  } catch(e) {
    LOCAIS = []; LOCAIS_POR_ID = {}; LOCAIS_CARREGADOS = false;
    return false;
  }
}

function movAtualizarChkCnt(){
  var host = el('mov-checklist'); if (!host) return;
  var done = host.querySelectorAll('.chk-item input:checked').length;
  var tot = host.querySelectorAll('.chk-item input').length;
  var cnt = el('mov-chk-cnt'); if (cnt) cnt.textContent = done+' / '+tot+' verificados';

function movMarcarTodos(n){
  var host = el('mov-checklist'); if (!host) return;
  var chks = host.querySelectorAll('.chk-item input');
  var allOn = Array.from(chks).every(function(c){ return c.checked; });
  chks.forEach(function(c){ c.checked=!allOn; });
  movAtualizarChkCnt();
}

  var destinoId = parseInt(val('mov-destino-sel'));
  var equipAtual = movEquipSelecionado();
  var ocupantes = DATA.filter(function(e){ return equipInstalado(e) && e.localId===destinoId; });
  var sel = el('mov-substituido-sel');
  if (sel) {
    sel.innerHTML = '<option value="">— nenhuma —</option>' +
      ocupantes.map(function(e){ return '<option value="'+e.id+'">#'+e.id+' — '+esc(e.fabricante||'')+' '+esc(e.tipo||'')+'</option>'; }).join('');
  }
  movAtualizarCaso();
}

function movAtualizarCaso(){
  var destinoId = parseInt(val('mov-destino-sel'));
  var substituidoId = val('mov-substituido-sel') ? parseInt(val('mov-substituido-sel')) : null;
  var equipAtual = movEquipSelecionado();
  var ocupantes = DATA.filter(function(e){ return equipInstalado(e) && e.localId===destinoId; }).length;
  var caso = casoDeInstalacao(destinoId, substituidoId, ocupantes);
  var host = el('mov-caso'); if (!host) return;
  var aviso = '';
  if (substituidoId) {
    var substituida = DATA.find(function(e){ return e.id===substituidoId; });
    if (substituida && equipInstalado(substituida)) {
      aviso = '<div style="color:#E52207;margin-top:4px"><i class="fas fa-exclamation-triangle mr1" aria-hidden="true"></i>' +
        '#'+substituida.id+' ainda está instalada — abra a OS de Remoção dela antes de confirmar esta instalação.</div>';
    }
  }
  host.innerHTML = 'Caso: '+esc(CASOS_INSTALACAO[caso]||'')+aviso;
}

function movOnChangeEquipRemocao(){
  var e = movEquipSelecionado();
  var host = el('mov-origem');
  if (host) host.textContent = e ? ('Origem: '+(e.predio||'')+' / '+(e.local||'')) : '';
  movRenderChecklist('REMOÇÃO', e ? e.tipo : 'SPLIT');
  movOnChangeDestinoRemocao();
}

function movOnChangeDestinoRemocao(){
  var destino = val('mov-destino-remocao-sel');
  var aviso = el('mov-aviso-baixa');
  if (aviso) aviso.style.display = destino==='baixa' ? 'block' : 'none';
}

async function salvarMovOS(){
  if (somenteLeitura()) { showToast('Modo somente leitura', ''); return; }
  if (!manPode('abrir')) { showToast('Sem permissão para abrir OS', 'error'); return; }
  var tipo = val('mov-tipo');
  if (MOV_TIPOS.indexOf(tipo) < 0) { showToast('Tipo inválido', 'error'); return; }
  var date = val('mov-data');
  if (!date) { showToast('Preencha a data', 'error'); return; }
  var equip = movEquipSelecionado();
  if (!equip) { showToast('Selecione o equipamento', 'error'); return; }

  var host = el('mov-checklist');
  var checklist = [];
  if (host) {
    host.querySelectorAll('.chk-item').forEach(function(row, i){
      var chk = row.querySelector('input'), lbl = row.querySelector('span');
      if (chk && lbl) checklist.push({i:i, label:lbl.textContent.trim(), done:chk.checked});
    });
  }

  var patch = {
    date: date, tipo: tipo, status: 'ABERTA', // D-l7n-06: status nunca vem de campo
    tecnico: val('mov-tec').trim(), desc: val('mov-desc').trim(), checklist: checklist
  };

  if (tipo==='INSTALAÇÃO') {
    if (equipBaixado(equip)) { showToast('Máquina baixada não pode ser instalada', 'error'); return; }
    var destinoId = parseInt(val('mov-destino-sel'));
    if (!destinoId || !LOCAIS_POR_ID[destinoId]) { showToast('Selecione o local de destino', 'error'); return; }
    patch.localDestinoId = destinoId;
    var substituidoVal = val('mov-substituido-sel');
    if (substituidoVal) patch.equipSubstituidoId = parseInt(substituidoVal);
  } else {
    var destinoRem = val('mov-destino-remocao-sel');
    if (['guardada','baixa'].indexOf(destinoRem) < 0) { showToast('Selecione o destino da remoção', 'error'); return; }
    if (destinoRem==='baixa' && !podeDarBaixa()) { showToast('Só admin pode dar baixa', 'error'); return; } // guarda na ação (D-l7n-03)
    patch.destinoRemocao = destinoRem;
    patch.localOrigemId = equip.localId || null;
  }

  var logId = await addLogEntryAsync(equip.id, patch);
  if (!logId) return;
  showToast('OS aberta com sucesso', 'ok');
  manAbrirOS(logId);
  renderMovim();
  setTimeout(function(){ renderDash(); }, 100);
}

/* Painel próprio da movimentação na gaveta (chamado por manAbrirOS logo
   depois do bloco "1 · Abertura"): origem, destino, caso derivado
   (instalação) ou destino da remoção (com a baixa em destaque), máquina
   substituída com link para a ficha, e o checklist de partes item a item
   — não só o done/total que o cabeçalho já mostra. */
function movPainelDaOS(entry, equipId, logId){
  var h = '<div class="ds"><div class="ds-title"><i class="fas fa-truck-loading mr1" aria-hidden="true"></i>Movimentação</div>';
  if (entry.tipo==='INSTALAÇÃO') {
    var r = rotuloLocalDestino(entry.localDestinoId, LOCAIS_POR_ID);
    var ocupantes = ocupantesDoLocal(entry.localDestinoId, equipId);
    var caso = casoDeInstalacao(entry.localDestinoId, entry.equipSubstituidoId, ocupantes);
    h += '<div class="dfield"><label>Destino</label><div class="dval">'+(r?esc(r.rotulo):'—')+'</div></div>' +
      '<div class="dfield"><label>Caso</label><div class="dval">'+esc(CASOS_INSTALACAO[caso]||'')+'</div></div>';
    if (entry.equipSubstituidoId) {
      h += '<div class="dfield"><label>Máquina substituída</label><div class="dval">' +
        '<a href="#" onclick="openDetail('+entry.equipSubstituidoId+');return false;">#'+entry.equipSubstituidoId+'</a></div></div>';
    }
  } else {
    var origemNo = LOCAIS_POR_ID[entry.localOrigemId];
    h += '<div class="dfield"><label>Origem</label><div class="dval">'+(origemNo?esc(origemNo.nome):'—')+'</div></div>' +
      '<div class="dfield"><label>Destino</label><div class="dval">' +
      (entry.destinoRemocao==='baixa' ? '<strong style="color:#E52207">Baixa patrimonial</strong>' : 'Guardada — volta ao inventário') +
      '</div></div>';
  }
  var itens = entry.checklist||[];
  /* O técnico marca durante a execução; o gestor corrige depois, em
     qualquer estado — mesma regra do botão Corrigir do bloco 1. */
  var podeMarcar = (entry.status==='EM_EXECUCAO' && manPode('executar')) || podeEditarCadastro();
  h += '<label class="fgl" style="margin-top:8px">Checklist de partes</label>' +
    itens.map(function(item,i){
      return '<label class="chk-item"><input type="checkbox" '+(podeMarcar?'':'disabled ')+(item.done?'checked ':'')+
        'onchange="manMarcarChecklist(\''+esc(logId)+'\','+i+',this.checked)"/><span>'+esc(item.label)+'</span></label>';
    }).join('') +
    '</div>';
  return h;
}

/* Em EM_EXECUCAO e com manPode('executar'), os itens do checklist são
   marcáveis — grava o array inteiro pela porta de escrita de sempre
   (manAtualizarOS). */
async function manMarcarChecklist(logId, indice, marcado){
  var achado = manEntrada(logId); if(!achado) return;
  if (!manPode('executar') && !podeEditarCadastro()) { showToast('Sem permissão para marcar checklist','error'); return; }
  var lista = (achado.entry.checklist||[]).map(function(item, i){
    if (i!==indice) return item;
    var novo = {}; for (var k in item) novo[k] = item[k]; novo.done = marcado; return novo;
  });
  var ok = await manAtualizarOS(logId, achado.equipId, {checklist:lista});
  if (ok) manAbrirOS(logId);
}

/* ── correção de dados pelo gestor ──
   A gaveta da OS sempre foi só leitura: um erro de digitação na data, no
   tipo ou numa medição só saía com um UPDATE no SQL editor. Pior no fim do
   fluxo — em CONFERIDA e em CANCELADA manProximos() devolve [] e a gaveta
   não oferece ação nenhuma, exatamente onde o erro já está congelado.
   Aqui o gestor (podeEditarCadastro: admin/gestor, nunca observador)
   corrige os dados em QUALQUER estado, terminal inclusive, e também nas
   linhas legadas sem fluxo.
   O que este formulário NÃO faz é mover a OS: `status` fica fora do patch.
   Corrigir um dado e reabrir um processo encerrado são atos diferentes —
   quem confere assina a conferência, e uma OS que voltasse a andar por um
   campo de formulário deixaria a assinatura no lugar afirmando algo que
   não vale mais. */
var MAN_EDIT_ID = null;

function manEditarDados(logId){
  if (!podeEditarCadastro()) { showToast('Sem permissão para corrigir a OS','error'); return; }
  MAN_EDIT_ID = logId;
  manAbrirOS(logId);
}
function manCancelarEdicao(logId){ MAN_EDIT_ID = null; manAbrirOS(logId); }

/* Número de campo: vazio vira null (a coluna é anulável), texto inválido
   vira null também — nunca NaN, que o PostgREST recusaria com um erro que
   não diz qual campo. */
/* esc() devolve '' para qualquer valor falso — inclusive o número 0, que é
   medição legítima (pressão, corrente). Daí este par próprio: só null e
   string vazia viram campo vazio. */
function manValCampo(v){ return (v===null || v===undefined || v==='') ? '' : esc(String(v)); }

function manNumOuNull(id){
  var campo = el(id); if (!campo) return null;
  var v = String(campo.value||'').trim();
  if (v === '') return null;
  var n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function manFormDados(entry, logId){
  var mov = osEhMovimentacao(entry);
  var tipoHtml = mov
    ? '<div class="dval" style="font-size:13px">'+esc(entry.tipo||'—')+'</div>' +
      '<div style="font-size:11px;color:#999">Tipo fixo: OS de movimentação (D-uyz-21).</div>'
    : '<select class="fgs" id="man-ed-tipo">' +
      MAINT_TIPOS.map(function(t){ return '<option value="'+t+'"'+(entry.tipo===t?' selected':'')+'>'+t+'</option>'; }).join('') +
      (MAINT_TIPOS.indexOf(entry.tipo)<0 && entry.tipo ? '<option value="'+esc(entry.tipo)+'" selected>'+esc(entry.tipo)+'</option>' : '') +
      '</select>';
  return '<div class="fg2">' +
    '<div><label class="fgl">Data</label><input class="fgi" id="man-ed-data" type="date" value="'+esc(entry.date||'')+'"/></div>' +
    '<div><label class="fgl">Tipo</label>'+tipoHtml+'</div></div>' +
    '<label class="fgl" style="margin-top:8px">Técnico</label>' +
    '<input class="fgi" id="man-ed-tecnico" type="text" value="'+esc(entry.tecnico||'')+'"/>' +
    '<label class="fgl" style="margin-top:8px">Problema relatado / serviço</label>' +
    '<textarea class="fgt" id="man-ed-desc">'+esc(entry.desc||'')+'</textarea>' +
    '<label class="fgl" style="margin-top:10px;display:block">Medições</label>' +
    '<div class="fg2">' +
    '<div><label class="fgl">Insuflamento (°C)</label><input class="fgi" id="man-ed-ins" type="number" step="0.1" value="'+manValCampo(entry.insuflamento)+'"/></div>' +
    '<div><label class="fgl">Retorno (°C)</label><input class="fgi" id="man-ed-ret" type="number" step="0.1" value="'+manValCampo(entry.retorno)+'"/></div>' +
    '<div><label class="fgl">Corrente (A)</label><input class="fgi" id="man-ed-corr" type="number" step="0.1" value="'+manValCampo(entry.corrente)+'"/></div>' +
    '<div><label class="fgl">Pressão (psi)</label><input class="fgi" id="man-ed-press" type="number" step="1" value="'+manValCampo(entry.pressao)+'"/></div>' +
    '<div><label class="fgl">Cap. marcha (µF)</label><input class="fgi" id="man-ed-cap-marcha" type="number" step="0.1" value="'+manValCampo(entry.capMarcha)+'"/></div>' +
    '<div><label class="fgl">Cap. partida (µF)</label><input class="fgi" id="man-ed-cap-partida" type="number" step="0.1" value="'+manValCampo(entry.capPartida)+'"/></div>' +
    '<div><label class="fgl">Tensão (V)</label><input class="fgi" id="man-ed-tensao" type="number" step="0.1" value="'+manValCampo(entry.tensaoMedida)+'"/></div></div>' +
    '<div class="ct-btn-row" style="margin-top:10px">' +
    '<button class="btn-success" onclick="manSalvarDados(\''+esc(logId)+'\')"><i class="fas fa-save mr1" aria-hidden="true"></i>Salvar correção</button>' +
    '<button class="btn-secondary" onclick="manCancelarEdicao(\''+esc(logId)+'\')"><i class="fas fa-times mr1" aria-hidden="true"></i>Cancelar</button></div>' +
    '<div style="font-size:11px;color:#999;margin-top:6px">O estado da OS não muda aqui — correção de dado não move o processo.</div>';
}

async function manSalvarDados(logId){
  var achado = manEntrada(logId); if(!achado) return;
  // guarda na ação, não só no botão (D-l7n-03)
  if (!podeEditarCadastro()) { showToast('Sem permissão para corrigir a OS','error'); return; }
  var data = (el('man-ed-data')||{}).value || '';
  if (!data) { showToast('A data da OS não pode ficar vazia','error'); return; }
  var ins = manNumOuNull('man-ed-ins'), ret = manNumOuNull('man-ed-ret');
  var patch = {
    date: data,
    tecnico: (el('man-ed-tecnico')||{}).value || '',
    desc: (el('man-ed-desc')||{}).value || '',
    insuflamento: ins,
    retorno: ret,
    deltaT: manDeltaT(ins, ret),
    corrente: manNumOuNull('man-ed-corr'),
    pressao: manNumOuNull('man-ed-press'),
    capMarcha: manNumOuNull('man-ed-cap-marcha'),
    capPartida: manNumOuNull('man-ed-cap-partida'),
    tensaoMedida: manNumOuNull('man-ed-tensao')
  };
  var campoTipo = el('man-ed-tipo'); // ausente em OS de movimentação: o tipo fica como está
  if (campoTipo) patch.tipo = campoTipo.value;
  var ok = await manAtualizarOS(logId, achado.equipId, patch, 'Dados corrigidos');
  if (!ok) return;
  MAN_EDIT_ID = null;
  manAbrirOS(logId);
  renderOS(); renderMovim();
}

/* ── fluxo da OS interna: tela e ações ── */
function manEntrada(logId){
  var achado = null;
  Object.keys(_logCache).forEach(function(equipIdStr){
    (_logCache[equipIdStr]||[]).forEach(function(entry){
      if (entry.id === logId) {
        var equipId = parseInt(equipIdStr);
        achado = { equipId: equipId, equip: DATA.find(function(r){ return r.id===equipId; }), entry: entry };
      }
    });
  });
  return achado;
}

function manAbrirOS(logId){
  var achado = manEntrada(logId); if(!achado) return;
  var equipId = achado.equipId, e = achado.equip || {local:'—',predio:''}, entry = achado.entry;
  var st = entry.status;

  el('dh-id').textContent = 'OS · #'+equipId;
  el('dh-local').textContent = e.local;
  el('dh-predio').textContent = e.predio;
  el('dh-pills').innerHTML = statusPillOS(st);

  var h = '';
  if (manSemFluxo(st)) {
    // D-l7n-02: linha sem fluxo não mostra régua — afirmaria uma aprovação que ninguém deu.
    h += '<div style="font-size:12px;color:#999;margin-bottom:8px"><i class="fas fa-info-circle mr1" aria-hidden="true"></i>Registro direto — não percorreu as etapas de aprovação.</div>';
  } else {
    h += reguaPassos(manPasso(st), MAN_STEPS);
  }

  var done = (entry.checklist||[]).filter(function(c){ return c.done; }).length;
  var tot = (entry.checklist||[]).length;
  var editando = (MAN_EDIT_ID === logId);
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i>1 · Abertura' +
    (podeEditarCadastro() && !editando
      ? '<button class="btn-secondary" style="float:right;padding:2px 10px;font-size:11px" onclick="manEditarDados(\''+esc(logId)+'\')" title="Corrigir os dados desta OS"><i class="fas fa-pen mr1" aria-hidden="true"></i>Corrigir</button>'
      : '') +
    '</div>';
  h += editando ? manFormDados(entry, logId) :
    ('<div class="dfields2">' +
    '<div class="dfield"><label>Data</label><div class="dval" style="font-size:13px">'+fmtDate(entry.date)+'</div></div>' +
    '<div class="dfield"><label>Tipo</label><div class="dval" style="font-size:13px">'+esc(entry.tipo||'—')+'</div></div>' +
    '</div>' +
    (entry.tecnico?'<div class="dfield"><label>Técnico</label><div class="dval" style="font-size:13px">'+esc(entry.tecnico)+'</div></div>':'') +
    (entry.desc?'<div class="dfield"><label>Problema relatado</label><div class="dval" style="font-size:13px">'+esc(entry.desc)+'</div></div>':'') +
    (tot?'<div class="le-chk"><i class="fas fa-tasks mr1" aria-hidden="true"></i>'+done+'/'+tot+' itens do checklist</div>':''));
  h += '</div>';

  if (osEhMovimentacao(entry)) {
    // D-uyz: painel próprio de movimentação, logo depois do bloco 1 — não
    // é um quinto bloco solto, é a mesma OS.
    h += movPainelDaOS(entry, equipId, logId);
  }

  if (!manSemFluxo(st)) {
    /* 2 · Delineamento */
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-stethoscope mr1" aria-hidden="true"></i>2 · Delineamento</div>';
    if (entry.delineadoPor) {
      h += '<div style="font-size:12px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Delineado por '+esc(entry.delineadoPor)+' em '+fmtDate((entry.delineadoEm||'').slice(0,10))+'</div>';
    }
    if (st==='ABERTA' && manPode('delinear') && manPodeIrPara(st,'DELINEAMENTO')) {
      h += '<button class="btn-primary" style="width:100%;margin-top:8px" onclick="manMudarStatus(\''+esc(logId)+'\',\'DELINEAMENTO\')"><i class="fas fa-play mr1" aria-hidden="true"></i>Iniciar delineamento</button>';
    }
    if (st==='DELINEAMENTO' && manPode('delinear') && manPodeIrPara(st,'APROVACAO')) {
      h += '<label class="fgl" style="margin-top:8px">Diagnóstico / serviços a executar</label>' +
        '<textarea class="fgt" id="man-delin-desc">'+esc(entry.desc||'')+'</textarea>' +
        '<button class="btn-primary" style="width:100%;margin-top:8px" onclick="manDelinear(\''+esc(logId)+'\')"><i class="fas fa-paper-plane mr1" aria-hidden="true"></i>Enviar para aprovação</button>';
    }
    if (entry.parecerAprovacao && (st==='DELINEAMENTO'||st==='APROVACAO')) {
      h += '<div style="margin-top:8px;font-size:11px;color:#B46800;background:#FEF3E2;border-radius:8px;padding:8px"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolvida: '+esc(entry.parecerAprovacao)+'</div>';
    }
    if (entry.aprovador) {
      h += '<div style="margin-top:8px;font-size:11px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Aprovado por '+esc(entry.aprovador)+' em '+fmtDate(entry.dataAprovacao)+'</div>';
    }
    if (st==='APROVACAO' && manPode('aprovar') && manPodeIrPara(st,'EM_EXECUCAO')) {
      h += '<div class="ct-btn-row">' +
        '<button class="btn-success" onclick="manAprovar(\''+esc(logId)+'\')"><i class="fas fa-check mr1" aria-hidden="true"></i>Aprovar</button>' +
        '<button class="btn-danger" onclick="manDevolver(\''+esc(logId)+'\')"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolver</button></div>';
    }
    h += '</div>';

    /* 3 · Execução — evidência: fotos comprimidas + as cinco medições (D-l7n-09) */
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-hard-hat mr1" aria-hidden="true"></i>3 · Execução</div>';
    h += manRenderEvidencia(entry);
    if (st==='EM_EXECUCAO' && manPode('executar')) {
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<div class="fg2">' +
        '<div><label class="fgl">Insufl. (°C)</label><input class="fgi" id="man-ex-ti" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Retorno (°C)</label><input class="fgi" id="man-ex-tr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Corrente (A)</label><input class="fgi" id="man-ex-corr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Pressão (psi)</label><input class="fgi" id="man-ex-press" type="number" step="1"/></div></div>' +
        '<label class="fgl" style="margin-top:10px;display:block">Elétrico</label>' +
        '<div class="fg2">' +
        '<div><label class="fgl">Capacitor de marcha (µF)</label><input class="fgi" id="man-ex-cap-marcha" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Capacitor de partida (µF)</label><input class="fgi" id="man-ex-cap-partida" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Tensão medida (V)</label><input class="fgi" id="man-ex-tensao" type="number" step="0.1"/></div></div>' +
        '<label class="fgl" style="margin-top:8px">Fotos</label>' +
        '<input class="fgi" id="man-ex-fotos" type="file" accept="image/*" capture="environment" multiple/>' +
        '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="manRegistrarEvidencia(\''+esc(logId)+'\')"><i class="fas fa-camera mr1" aria-hidden="true"></i>Registrar evidência</button></div>';
      if (manTemEvidencia(entry) && manPode('executar') && manPodeIrPara(st,'EXECUTADA')) {
        h += '<button class="btn-success" style="width:100%;margin-top:8px" onclick="manMudarStatus(\''+esc(logId)+'\',\'EXECUTADA\')"><i class="fas fa-flag-checkered mr1" aria-hidden="true"></i>Concluir execução</button>';
      }
    }
    h += '</div>';

    /* 4 · Conferência — o gestor confere e encerra, ou devolve com parecer obrigatório */
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-user-shield mr1" aria-hidden="true"></i>4 · Conferência</div>';
    if (entry.conferente) {
      h += '<div style="font-size:12px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Conferido por '+esc(entry.conferente)+' em '+fmtDate(entry.dataConferencia)+'</div>' +

/* ── fluxo da OS interna: evidência da execução (fotos + as cinco medições) ── */
function manTemEvidencia(entry){
  // D-uyz-17: OS de movimentação — foto OU checklist de partes COMPLETO.
  // Medição de insuflamento não faz sentido em remoção (não há o que
  // medir), então o ramo é por tipo de OS.
  if (osEhMovimentacao(entry)) {
    var temFoto = !!(entry.fotos && entry.fotos.length);
    var lista = entry.checklist||[];
    var checklistCompleto = lista.length>0 && lista.every(function(c){ return c.done; });
    return temFoto || checklistCompleto;
  }
  // D-q57-12: as três medições novas contam como evidência — são leitura de
  // instrumento igual às cinco de hoje.
  return !!((entry.fotos && entry.fotos.length) || entry.insuflamento || entry.retorno || entry.corrente || entry.pressao || entry.capMarcha || entry.capPartida || entry.tensaoMedida);
}

function manRenderEvidencia(entry){
  var medTxt = [];
  if (entry.insuflamento!==undefined && entry.insuflamento!==null && entry.insuflamento!=='') medTxt.push('Insufl.: '+entry.insuflamento+'°C');
  if (entry.retorno!==undefined && entry.retorno!==null && entry.retorno!=='') medTxt.push('Retorno: '+entry.retorno+'°C');
  if (entry.deltaT!==undefined && entry.deltaT!==null && entry.deltaT!=='') medTxt.push('ΔT: '+entry.deltaT+'°C');
  if (entry.corrente!==undefined && entry.corrente!==null && entry.corrente!=='') medTxt.push('Corrente: '+entry.corrente+'A');
  if (entry.pressao!==undefined && entry.pressao!==null && entry.pressao!=='') medTxt.push('Pressão: '+entry.pressao+' psi');
  if (entry.capMarcha!==undefined && entry.capMarcha!==null && entry.capMarcha!=='') medTxt.push('Cap. marcha: '+entry.capMarcha+'µF');
  if (entry.capPartida!==undefined && entry.capPartida!==null && entry.capPartida!=='') medTxt.push('Cap. partida: '+entry.capPartida+'µF');
  if (entry.tensaoMedida!==undefined && entry.tensaoMedida!==null && entry.tensaoMedida!=='') medTxt.push('Tensão: '+entry.tensaoMedida+'V');
  var fotos = (entry.fotos||[]).map(function(p){
    var u = supa.storage.from('os-fotos').getPublicUrl(p).data.publicUrl;
    return '<a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'" loading="lazy"/></a>';
  }).join('');
  var h = '';
  if (medTxt.length) h += '<div class="le-chk"><i class="fas fa-thermometer-half mr1" aria-hidden="true"></i>'+medTxt.join(' · ')+'</div>';
  if (fotos) h += '<div class="foto-grid">'+fotos+'</div>';
  return h;
}

// LIMITE_FOTOS_EVIDENCIA: até 6 arquivos por chamada de registro — o campo aceita seleção
// múltipla e um envio sem teto é a única forma de abuso barata aqui (T-l7n-04).
var LIMITE_FOTOS_EVIDENCIA = 6;

async function manRegistrarEvidencia(logId){
  var achado = manEntrada(logId); if(!achado) return;
  if (!manPode('executar')) { showToast('Sem permissão para registrar evidência','error'); return; }
  var entry = achado.entry;
  var ti = val('man-ex-ti'), tr = val('man-ex-tr'), corr = val('man-ex-corr'), press = val('man-ex-press');
  var capM = val('man-ex-cap-marcha'), capP = val('man-ex-cap-partida'), tensaoM = val('man-ex-tensao');
  var files = (el('man-ex-fotos')||{files:[]}).files;
  if (ti==='' && tr==='' && corr==='' && press==='' && capM==='' && capP==='' && tensaoM==='' && !files.length) { showToast('Registre ao menos uma medição ou uma foto','error'); return; }
  showToast('Enviando evidência…', '');
  var novos = [];
  var limite = Math.min(files.length, LIMITE_FOTOS_EVIDENCIA);
  for (var i=0; i<limite; i++) {
    var f = files[i];
    if (!f.type || f.type.indexOf('image/')!==0) continue; // arquivo que não é imagem é ignorado
    try {
      var blob = await ctCompressFoto(f); // reusa a compressão da contratação — não copia (mesmo teto 1280px/JPEG 0.8)
      var path = 'manutencao/'+logId+'/'+Date.now()+'_'+i+'.jpg';
      var up = await supa.storage.from('os-fotos').upload(path, blob, {contentType:'image/jpeg'});
      if (up.error) throw up.error;
      novos.push(path);
    } catch(e) { console.error('foto', e); showToast('Falha no upload de uma foto', 'error'); }
  }
  var patch = { fotos: (entry.fotos||[]).concat(novos) }; // acrescenta, nunca substitui
  if (ti !== '') patch.insuflamento = parseFloat(ti);
  if (tr !== '') patch.retorno = parseFloat(tr);
  if (corr !== '') patch.corrente = parseFloat(corr);
  if (press !== '') patch.pressao = parseFloat(press);
  if (capM !== '') patch.capMarcha = parseFloat(capM);
  if (capP !== '') patch.capPartida = parseFloat(capP);
  if (tensaoM !== '') patch.tensaoMedida = parseFloat(tensaoM);
  if (ti !== '' || tr !== '') patch.deltaT = manDeltaT(ti, tr); // ΔT é sempre derivado, nunca digitado
  var ok = await manAtualizarOS(logId, achado.equipId, patch, 'Evidência registrada');
  if (ok) manAbrirOS(logId);
}

async function manConferir(logId, aprovado){
  var achado = manEntrada(logId); if(!achado) return;
  var movimentacao = osEhMovimentacao(achado.entry);
  // D-uyz-07: uma remoção com destino baixa exige podeDarBaixa() ALÉM de
  // manPode('conferir') — um gestor confere remoção comum, não confere
  // baixa. Guarda na ação, não só na renderização (D-l7n-03).
  var exigeBaixa = movimentacao && achado.entry.tipo==='REMOÇÃO' && achado.entry.destinoRemocao==='baixa';
  if (!manPode('conferir') || (exigeBaixa && !podeDarBaixa())) { showToast('Ação não permitida','error'); return; }
  var parecer = (val('man-conf-parecer')||'').trim();
  if (aprovado) {
    if (!manPodeIrPara(achado.entry.status,'CONFERIDA')) { showToast('Ação não permitida','error'); return; }
    if (movimentacao) {
      // D-uyz-15: cadastro gravado ANTES do status terminal — CONFERIDA é
      // terminal (manProximos devolve []), então uma falha DEPOIS deixaria
      // a OS fechada com o cadastro não aplicado e sem caminho de repetição.
      // Falha aqui deixa a OS em EXECUTADA para o gestor repetir.
      var aplicado = achado.entry.tipo==='INSTALAÇÃO'
        ? await aplicarInstalacao(achado.equipId, achado.entry)
        : await aplicarRemocao(achado.equipId, achado.entry);
      if (!aplicado) return; // aborta sem mudar o status
    }
    var nome = ctUser?ctUser.nome:'';
    var ok = await manAtualizarOS(logId, achado.equipId, {status:'CONFERIDA', conferente:nome, dataConferencia:today(), parecerConferencia:parecer||null}, 'OS conferida');
    if (ok) {
      if (!movimentacao) {
        // O ramo de manutenção NÃO muda: ultima_manutencao/estado são
        // idempotentes por si (não retrocedem, não gravam igual) e não há
        // o que repetir — ordem intacta, gate atual intacto.
        await atualizarUltimaManutencao(achado.equipId, achado.entry.date); // D-l7n-11: a data da OS, não a de hoje
        await atualizarEstadoEquip(achado.equipId, val('man-conf-estado')); // D-q57-04: o estado escolhido na conferência
      }
      manAbrirOS(logId); renderOS();
    }
  } else {
    if (!manPodeIrPara(achado.entry.status,'EM_EXECUCAO')) { showToast('Ação não permitida','error'); return; }
    if (!parecer) { showToast('Informe o parecer da devolução','error'); return; }
    var ok2 = await manAtualizarOS(logId, achado.equipId, {status:'EM_EXECUCAO', parecerConferencia:parecer}, 'Devolvida p/ correção');
    if (ok2) { manAbrirOS(logId); renderOS(); }
  }
}

/* gestoFechaGaveta é pura, fora da IIFE (D-tyx-03), para o gate exercitá-la
   em Node como função de números — não uma regex sobre o arquivo. Fecha só
   em dois casos (D-tyx-04): o toque começou fora do corpo rolável (alça,
   cabeçalho, rodapé), ou começou com o conteúdo já no topo (scrollTop<=0).
   Rolar a ficha (scrollTop>0) nunca fecha — é o defeito relatado. Gesto
   predominantemente lateral cancela (D-tyx-05). */
var GESTO_MIN_PX = 60;

function gestoFechaGaveta(inicioForaDoCorpo, rolagemInicial, dy, dx){
  if(!(dy > GESTO_MIN_PX)) return false;
  if(Math.abs(dx) > Math.abs(dy)) return false;
  if(inicioForaDoCorpo) return true;
  return rolagemInicial <= 0;
}

(function(){
  var startY, startX, startScroll, inicioForaDoCorpo, dragging;
  document.addEventListener('touchstart', function(e){
    if(TELA_LARGA) return; // D-8rz-17: painel lateral de notebook não fecha por arrastar
    if(!el('drawer').classList.contains('open')) return;
    var panel = el('drawer-panel');
    var body = el('drawer-body');
    if(!panel || !panel.contains(e.target)) return;
    var touch = e.touches[0];
    startY = touch.clientY;
    startX = touch.clientX;
    startScroll = body ? body.scrollTop : 0;
    inicioForaDoCorpo = !(body && body.contains(e.target));
    dragging = false;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!el('drawer').classList.contains('open')) return;
    var touch = e.touches[0];
    var dy = touch.clientY - startY;
    var dx = touch.clientX - startX;
    dragging = gestoFechaGaveta(inicioForaDoCorpo, startScroll, dy, dx);
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(dragging){ closeDrawer(); dragging=false; }
  });
})();

/* ── link profundo: ?equip= ── */
/* O nome do parâmetro mora só aqui — a ficha (bloco de QR) o consome para
   escrever a URL. lerAlvoFicha/buscaSemAlvo são puros, sem API de navegador,
   o que os torna testáveis em Node (D-s3h-04). */
var PARAM_FICHA = 'equip';
var ALVO_FICHA = null;

function lerAlvoFicha(busca) {
  if (!busca) return null;
  var s = String(busca).split('#')[0];
  if (s.charAt(0) === '?') s = s.slice(1);
  if (!s) return null;
  var partes = s.split('&');
  for (var i = 0; i < partes.length; i++) {
    var par = partes[i];
    var idx = par.indexOf('=');
    var chave = idx === -1 ? par : par.slice(0, idx);
    var valor = idx === -1 ? '' : par.slice(idx + 1);
    if (chave === PARAM_FICHA) {
      if (/^\d{1,9}$/.test(valor)) return parseInt(valor, 10);
      return null;
    }
  }
  return null;
}

function buscaSemAlvo(busca) {
  var s = busca || '';
  if (s.charAt(0) === '?') s = s.slice(1);
  if (!s) return '';
  var partes = s.split('&');
  var restantes = [];
  for (var i = 0; i < partes.length; i++) {
    var par = partes[i];
    var idx = par.indexOf('=');
    var chave = idx === -1 ? par : par.slice(0, idx);
    if (chave !== PARAM_FICHA) restantes.push(par);
  }
  return restantes.length ? '?' + restantes.join('&') : '';
}

function limparUrlDoAlvo() {
  try {
    if (typeof history !== 'undefined' && typeof history.replaceState === 'function') {
      history.replaceState(null, '', location.pathname + buscaSemAlvo(location.search) + location.hash);
    }
  } catch (e) {}
}

function aplicarAlvoFicha() {
  var alvo = ALVO_FICHA;
  ALVO_FICHA = null; // consumido: só abre uma vez por carga
  if (alvo === null) return false;
  limparUrlDoAlvo(); // antes da busca — o não-encontrado também não se repete a cada F5 (D-s3h-03)
  var achado = DATA.find(function (r) { return r.id === alvo; });
  if (!achado) {
    showToast('Equipamento ' + alvo + ' não encontrado', 'error');
    return false;
  }
  navTo('inv', el('nav-inv'));
  openDetail(alvo);
  return true;
}

ALVO_FICHA = lerAlvoFicha(location.search);

/* ── sessão e modo observador: leitura única, porta única ── */
/* D-48m-01: as ocorrências de window._modoObservador ficam confinadas a
   esta seção (escrita em entrarModoObservador/sairModoObservador, leitura
   em somenteLeitura()). Os nove pontos espalhados pelo arquivo
   (podeEditarCadastro, podeDarBaixa, manPode, salvarEquip, salvarEquipNovo,
   saveLogEntry, salvarMovOS, ctCan e o `var ro` de ctOpenOS) passam a
   chamar somenteLeitura() — nenhum deles volta a tocar a flag direto.
   tests/refrigeracao-modo-observador.test.js falha se um décimo ponto de
   leitura direta aparecer fora daqui. */
var _sessaoAtiva = false; // D-48m-03: escrita só em sincronizarSessao()

/* D-48m-02: leitura derivada, não confiada — uma sessão real vence uma
   flag de observador esquecida, por construção. A fórmula é conjuntiva
   de propósito: se _sessaoAtiva errar para false por algum motivo, quem
   nunca passou pelo modo observador continua se comportando exatamente
   como hoje (modo de falha seguro). */
function somenteLeitura() {
  return window._modoObservador === true && _sessaoAtiva !== true;
}

function entrarModoObservador() {
  window._modoObservador = true;
  var banner = document.createElement('div');
  banner.id = 'obs-banner';
  banner.innerHTML = '<i class="fas fa-eye" style="margin-right:6px"></i>Modo visualização — somente leitura';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#856404;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:600;z-index:9999;';
  document.body.prepend(banner);
}

function sairModoObservador() {
  window._modoObservador = false;
  var banner = document.getElementById('obs-banner');
  if (banner) banner.remove();
}

/* D-48m-03: única porta por onde uma mudança de sessão é aplicada — os
   dois ramos do onAuthStateChange logo abaixo de "Auth state" (mais
   adiante no arquivo) chamam esta função. */
function sincronizarSessao(sessao) {
  _sessaoAtiva = !!sessao;
  if (sessao) {
    sairModoObservador();
  } else {
    // D-48m-04: sem isto o conserto da flag desmascara uma escalada de
    // privilégio — initAppOnce() retornaria pela guarda _appInited sem
    // recarregar o perfil, mantendo o ctUser da sessão anterior.
    // _appInited e ctUser são declarados adiante no arquivo; funciona
    // porque esta função só é CHAMADA em tempo de execução (mesma
    // observação já feita acima, sobre carregarPerfil).
    _appInited = false;
    ctUser = null;
    sairModoObservador(); // D-48m-05: a tarja some também no ramo sem sessão
  }
}
window.sincronizarSessao = sincronizarSessao;

<script>
/* ══ ESTADO ══ */
var ctMode = 'pmoc';           // 'pmoc' | 'contrat'
var ctChipSel = 'todas';
var ctOS = [];                 // os_contratacao
var ctOrc = {};                // os_id -> itens orçamento
var ctExec = {};               // os_id -> registros execução
var ctComp = {};               // os_id -> composição ata
var ctEvt = {};                // os_id -> eventos de auditoria
var ctArp = [];                // arp_itens
var ctUser = null;             // linha de usuarios do logado
var ctLoaded = false;

var CT_STATUS = {
  'SOLICITADA':   {label:'Aguard. orçamento', bg:'#FEF3E2', fg:'#B46800', step:0},
  'ORCAMENTO':    {label:'Orçamento p/ aprovação', bg:'#E3F2FD', fg:'#1565C0', step:1},
  'APROVADA':     {label:'Aprovada p/ execução', bg:'#E8ECF5', fg:'#1351B4', step:2},
  'EM_EXECUCAO':  {label:'Em execução', bg:'#FFF3E0', fg:'#E65100', step:3},
  'EXECUTADA':    {label:'Aguard. fiscal', bg:'#F3E5F5', fg:'#7B1FA2', step:4},
  'FISCALIZADA':  {label:'Aguard. NF/certificação', bg:'#E0F2F1', fg:'#00695C', step:5},
  'ENCERRADA':    {label:'Encerrada', bg:'#E6F4EA', fg:'#168821', step:6},
  'CANCELADA':    {label:'Cancelada', bg:'#F5F5F5', fg:'#999', step:-1}
};
var CT_STEPS = ['Solicit.','Orçam.','Aprov.','Execução','Fiscal','NF','Encerr.'];

function fmtMoney(v){ return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ctStatusPill(s){ var c=CT_STATUS[s]||CT_STATUS['SOLICITADA']; return '<span class="ct-status" style="background:'+c.bg+';color:'+c.fg+'">'+c.label+'</span>'; }
function ctEvtTexto(ev){ return ev && ev.detalhe ? String(ev.detalhe) : ''; }
function ctEquip(id){ return DATA.find(function(r){return r.id===id;}) || {local:(id?'#'+id:'Sem equipamento'),predio:'',tipo:'',funciona:'',criticidade:''}; }

/* ══ PERMISSÕES ══ */
function ctCan(acao){
  if (somenteLeitura()) return false;
  var r = ctUser ? ctUser.role : 'admin';
  var m = {
    criar:      ['admin','gestor','tecnico'],
    orcar:      ['admin','gestor','tecnico','empresa'],
    aprovar:    ['admin','gestor'],
    executar:   ['admin','gestor','tecnico','empresa','executor'],
    fiscalizar: ['admin','fiscal','gestor'],
    certificar: ['admin','gestor'],
    cancelar:   ['admin','gestor']
  };
  return (m[acao]||[]).indexOf(r) >= 0;
}

/* ══ CARGA DE DADOS ══ */
async function ctLoad(){
  try{
    var r1 = await supa.from('os_contratacao').select('*').order('criado_em',{ascending:false});
    if(r1.error) throw r1.error;
    ctOS = r1.data||[];
    var r2 = await supa.from('os_orcamento_itens').select('*').order('ordem');
    ctOrc = {}; (r2.data||[]).forEach(function(i){ (ctOrc[i.os_id]=ctOrc[i.os_id]||[]).push(i); });
    var r3 = await supa.from('os_execucao').select('*').order('data');
    ctExec = {}; (r3.data||[]).forEach(function(i){ (ctExec[i.os_id]=ctExec[i.os_id]||[]).push(i); });
    var r4 = await supa.from('os_composicao').select('*');
    ctComp = {}; (r4.data||[]).forEach(function(i){ (ctComp[i.os_id]=ctComp[i.os_id]||[]).push(i); });
    var r4b = await supa.from('os_eventos').select('*').order('criado_em');
    ctEvt = {}; ((r4b&&r4b.data)||[]).forEach(function(i){ (ctEvt[i.os_id]=ctEvt[i.os_id]||[]).push(i); });
    var r5 = await supa.from('arp_itens').select('*').order('item');
    ctArp = r5.data||[];
    if(!ctUser) await carregarPerfil();
    ctLoaded = true;
    return true;
  }catch(e){ console.error('ctLoad',e); showToast('Erro ao carregar contratações','error'); return false; }
}

async function ctEnsureLoaded(){ if(!ctLoaded) await ctLoad(); }

function ctSetupRealtime(){
  supa.channel('ct-contratacao')
    .on('postgres_changes',{event:'*',schema:'public',table:'os_contratacao'},function(){ ctLoad().then(function(){ if(ctMode==='contrat') ctRenderList(); }); })
    .on('postgres_changes',{event:'*',schema:'public',table:'os_orcamento_itens'},function(){ ctLoad(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'os_execucao'},function(){ ctLoad(); })
    .subscribe();
}

/* ══ SALDO DAS ATAS ══ */
function ctConsumo(item){
  var q = 0;
  Object.keys(ctComp).forEach(function(osId){
    var os = ctOS.find(function(o){return o.id===osId;});
    if(!os || os.status==='CANCELADA') return;
    ctComp[osId].forEach(function(c){ if(c.item_arp===item) q += Number(c.qtd)||0; });
  });
  return q;
}
function ctSaldoItem(it){ return (it.qtd_empenhada||0) - ctConsumo(it.item); }
/* NEs são GLOBAIS (conferido nos PDFs SIAFI de 28/07/2026): o teto financeiro
   é o valor da NE — a soma dos itens aderidos da RLP (R$ 43.467,13) EXCEDE a
   NE334 em R$ 4.541,02, portanto o controle financeiro usa o valor da NE. */
var CT_NES = {
  '2026NE000335': {forn:'WINS', valor:26521.75},
  '2026NE000334': {forn:'RLP',  valor:38926.11}
};
function ctConsumoNE(ne){
  var t=0;
  Object.keys(ctComp).forEach(function(osId){
    var os = ctOS.find(function(o){return o.id===osId;});
    if(!os || os.status==='CANCELADA') return;
    ctComp[osId].forEach(function(c){
      var it = ctArp.find(function(a){return a.item===c.item_arp;});
      if(it && it.ne===ne) t += (Number(c.qtd)||0)*Number(it.valor_unit);
    });
  });
  return t;
}
function ctSaldoNE(ne){
  var cfg = CT_NES[ne];
  return (cfg?cfg.valor:0) - ctConsumoNE(ne);
}

/* ══ TOGGLE / LISTA ══ */
/* D-uyz-01: terceiro segmento — Manutenção | Contratações | Inst./Remoção —
   só entra quando MAN_FLUXO_OK && MOV_OK (D-uyz-24). Sem as duas flags a
   função faz EXATAMENTE o que fazia antes: dois botões, sem a classe
   `tres`. */
function ctInjectToggle(){
  if(el('ct-toggle')) return;
  var page = el('page-os'); if(!page) return;
  var tresSegmentos = MAN_FLUXO_OK && MOV_OK;
  var div = document.createElement('div');
  div.id = 'ct-toggle';
  div.className = 'seg-toggle' + (tresSegmentos ? ' tres' : '');
  div.innerHTML =
    '<button class="seg-btn active" id="seg-pmoc" onclick="ctSetMode(\'pmoc\')" title="Manutenção" aria-label="Manutenção"><i class="fas fa-tools mr1" aria-hidden="true"></i>Manutenção</button>' +
    '<button class="seg-btn" id="seg-contrat" onclick="ctSetMode(\'contrat\')" title="Contratações" aria-label="Contratações"><i class="fas fa-file-signature mr1" aria-hidden="true"></i>Contratações</button>' +
    (tresSegmentos ? '<button class="seg-btn" id="seg-movim" onclick="ctSetMode(\'movim\')" title="Instalação e Remoção" aria-label="Instalação e Remoção"><i class="fas fa-truck-loading mr1" aria-hidden="true"></i>Inst./Remoção</button>' : '');
  page.insertBefore(div, page.firstChild);
  var chips = document.createElement('div');
  chips.id = 'ct-chips';
  chips.className = 'chips';
  chips.style.display = 'none';
  chips.innerHTML =
    '<button class="chip active" onclick="ctSetChip(this,\'todas\')">Todas</button>' +
    '<button class="chip" onclick="ctSetChip(this,\'andamento\')">Em andamento</button>' +
    '<button class="chip" onclick="ctSetChip(this,\'aprovacao\')">P/ aprovar</button>' +
    '<button class="chip" onclick="ctSetChip(this,\'encerradas\')">Encerradas</button>' +
    '<button class="chip" onclick="ctSetChip(this,\'saldo\')">Saldo Atas</button>';
  page.insertBefore(chips, el('os-chips'));
  if (tresSegmentos) {
    var movChips = document.createElement('div');
    movChips.id = 'movim-chips';
    movChips.className = 'chips';
    movChips.style.display = 'none';
    movChips.innerHTML =
      '<button class="chip active" onclick="ctSetMovChip(this,\'todas\')">Todas</button>' +
      '<button class="chip" onclick="ctSetMovChip(this,\'aberto\')">Em aberto</button>' +
      '<button class="chip" onclick="ctSetMovChip(this,\'aprovacao\')">P/ aprovar</button>' +
      '<button class="chip" onclick="ctSetMovChip(this,\'instalacoes\')">Instalações</button>' +
      '<button class="chip" onclick="ctSetMovChip(this,\'remocoes\')">Remoções</button>';
    page.insertBefore(movChips, el('os-chips'));
  }
}

async function ctSetMode(m){
  ctMode = m;
  var sp=el('seg-pmoc'), sc=el('seg-contrat'), sm=el('seg-movim');
  if(sp) sp.className = 'seg-btn'+(m==='pmoc'?' active':'');
  if(sc) sc.className = 'seg-btn'+(m==='contrat'?' active':'');
  if(sm) sm.className = 'seg-btn'+(m==='movim'?' active':'');
  el('os-chips').style.display = m==='pmoc'?'flex':'none';
  el('ct-chips').style.display = m==='contrat'?'flex':'none';
  var mc = el('movim-chips'); if(mc) mc.style.display = m==='movim'?'flex':'none';
  var title = document.querySelector('#page-os .sec-title');
  if(title) title.textContent = m==='contrat' ? 'Contratações (ARP)' : (m==='movim' ? 'Instalação e Remoção' : 'Ordens de Serviço');
  if(m==='contrat'){ await ctEnsureLoaded(); ctRenderList(); }
  else if(m==='movim'){ if(!LOCAIS_CARREGADOS) await carregarLocais(); renderMovim(); }
  else renderOS();
}

function ctSetMovChip(btn, v){
  document.querySelectorAll('#movim-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  movChipSel = v;
  renderMovim();
}
var movChipSel = 'todas';

function ctSetChip(btn, v){
  document.querySelectorAll('#ct-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  ctChipSel = v;
  ctRenderList();
}

function ctRenderList(){
  if(ctChipSel==='saldo'){ ctRenderSaldo(); return; }
  var list = ctOS.filter(function(o){
    if(ctChipSel==='andamento') return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;
    if(ctChipSel==='aprovacao') return o.status==='ORCAMENTO' || o.status==='EXECUTADA';
    if(ctChipSel==='encerradas') return o.status==='ENCERRADA' || o.status==='CANCELADA';
    return true;
  });
  el('os-cnt').textContent = list.length;
  if(!list.length){
    el('os-list').innerHTML = '<div class="empty"><i class="fas fa-file-signature" aria-hidden="true"></i>' +
      '<p>Nenhuma contratação neste filtro.<br>Toque <strong>+</strong> para abrir uma solicitação.</p></div>';
    return;
  }
  if(TELA_LARGA){ el('os-list').innerHTML = tabDesenhar('contrat', COLS_CONTRAT, list, 'ctOpenOS'); return; }
  el('os-list').innerHTML = list.map(function(o){
    var e = ctEquip(o.equip_id);
    var st = CT_STATUS[o.status]||CT_STATUS['SOLICITADA'];
    var total = ctOrcTotal(o.id);
    return '<div class="ct-card" style="border-left-color:'+st.fg+'" onclick="ctOpenOS(\''+o.id+'\')">' +
      '<div class="os-hdr"><div><div class="ct-num">'+esc(o.numero)+'</div>' +
      '<div class="os-local">'+esc(e.local)+'</div>' +
      '<div class="os-predio">'+esc(e.predio)+(o.empresa?' · '+esc(o.empresa):'')+'</div></div>' +
      ctStatusPill(o.status)+'</div>' +
      '<div class="os-meta">' +
      '<span style="font-size:11px;color:#888"><i class="fas fa-calendar mr1" aria-hidden="true"></i>'+fmtDate(o.data_solicitacao)+'</span>' +
      (total>0?'<span style="font-size:12px;font-weight:800;color:#1351B4">'+fmtMoney(o.valor_orcado||total)+'</span>':'') +
      (o.ne?'<span class="pill pill-tipo">'+esc(o.ne)+'</span>':'') +
      '</div>' +
      (o.problema?'<div class="os-desc">'+esc(o.problema)+'</div>':'') +
      '</div>';
  }).join('');
}

function ctRenderSaldo(){
  el('os-cnt').textContent = ctArp.length;
  var html = '<div class="kpi-row">' +
    '<div class="kpi-card" style="border-left-color:#1351B4"><div class="kpi-label">Saldo WINS · NE335</div>' +
    '<div class="kpi-val" style="color:#1351B4;font-size:18px">'+fmtMoney(ctSaldoNE('2026NE000335'))+'</div><div class="kpi-sub">de '+fmtMoney(CT_NES['2026NE000335'].valor)+' (NE global)</div></div>' +
    '<div class="kpi-card" style="border-left-color:#168821"><div class="kpi-label">Saldo RLP · NE334</div>' +
    '<div class="kpi-val" style="color:#168821;font-size:18px">'+fmtMoney(ctSaldoNE('2026NE000334'))+'</div><div class="kpi-sub">de '+fmtMoney(CT_NES['2026NE000334'].valor)+' (NE global)</div></div></div>' +
    '<div style="background:#FEF3E2;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:10px;color:#B46800;line-height:1.4">' +
    '<i class="fas fa-info-circle mr1" aria-hidden="true"></i>As NEs são globais: o teto de pagamento é o valor da NE. ' +
    'Os saldos por item abaixo controlam as <strong>quantidades</strong> aderidas na ata (soma dos itens RLP = R$ 43.467,13, acima da NE334 — nem toda quantidade caberá no empenho).</div>';
  ['2026NE000335','2026NE000334'].forEach(function(ne){
    var itens = ctArp.filter(function(i){return i.ne===ne;});
    if(!itens.length) return;
    html += '<div class="sec-head"><span class="sec-title">'+(ne==='2026NE000335'?'WINS':'RLP')+' — '+ne+'</span><span class="sec-count">'+itens.length+' itens</span></div>';
    html += itens.map(function(it){
      var saldo = ctSaldoItem(it);
      var pct = it.qtd_empenhada? Math.max(0,Math.min(100,Math.round(saldo/it.qtd_empenhada*100))) : 0;
      return '<div class="saldo-row"><div class="saldo-hdr">' +
        '<span style="font-size:12px;font-weight:800;color:#1351B4">Item '+it.item+'</span>' +
        '<span style="font-size:12px;font-weight:700">'+saldo+' / '+it.qtd_empenhada+' · '+fmtMoney(saldo*it.valor_unit)+'</span></div>' +
        '<div class="saldo-desc">'+esc(it.descricao)+' <span style="color:#999">('+fmtMoney(it.valor_unit)+'/un)</span></div>' +
        '<div class="saldo-bar"><div class="saldo-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'"></div></div></div>';
    }).join('');
  });
  el('os-list').innerHTML = html;
}

/* ══ NOVA SOLICITAÇÃO ══ */
function ctNovaOS(){
  if(!ctCan('criar')){ showToast('Sem permissão para criar solicitação',''); return; }

  el('dh-predio').textContent = 'Selecione a máquina e descreva o problema';
  el('dh-pills').innerHTML = '';
  // D-uyz-10: não se abre contratação para máquina que não está instalada.
  var opts = equipamentosOperacionais(DATA).slice().sort(function(a,b){ return (equipInoperante(a)?0:1)-(equipInoperante(b)?0:1); })
    .map(function(e){ return '<option value="'+e.id+'">'+(equipInoperante(e)?'⛔ ':'')+'#'+e.id+' — '+esc(e.predio)+' / '+esc(e.local)+' ('+esc(e.tipo)+')</option>'; }).join('');
  el('drawer-body').innerHTML =
    '<div class="ds"><div class="ds-title"><i class="fas fa-snowflake mr1" aria-hidden="true"></i>Máquina</div>' +
    '<select class="fgs" id="ct-equip-sel">'+opts+'</select>' +
    '<div style="font-size:10px;color:#999;margin-top:6px">⛔ = inoperantes aparecem primeiro</div></div>' +
    '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i>Problema / Serviço Necessário</div>' +
    '<textarea class="fgt" id="ct-problema" placeholder="Descreva o defeito ou serviço a contratar…"></textarea>' +
    '<div class="fg2" style="margin-top:8px">' +
    '<div><label class="fgl">Empresa</label><select class="fgs" id="ct-empresa" onchange="ctSyncNE()">' +
    '<option value="RLP">RLP</option><option value="WINS">WINS</option><option value="">A definir</option></select></div>' +
    '<div><label class="fgl">NE</label><select class="fgs" id="ct-ne">' +
    '<option value="2026NE000334">2026NE000334 (RLP)</option><option value="2026NE000335">2026NE000335 (WINS)</option><option value="">—</option></select></div>' +
    '</div></div>';
  el('drawer-footer').innerHTML =
    '<button class="btn-secondary" onclick="closeDrawer()">Cancelar</button>' +
    '<button class="btn-primary" onclick="ctSalvarNova()"><i class="fas fa-paper-plane mr1" aria-hidden="true"></i>Abrir Solicitação</button>';
  openDrawer();
}

function ctSyncNE(){
  var emp = val('ct-empresa');
  var ne = el('ct-ne');
  if(!ne) return;
  if(emp==='RLP') ne.value='2026NE000334';
  else if(emp==='WINS') ne.value='2026NE000335';
}

async function ctSalvarNova(){
  var equipId = parseInt(val('ct-equip-sel'));
  var problema = val('ct-problema').trim();
  if(!equipId || !problema){ showToast('Selecione a máquina e descreva o problema','error'); return; }
  var ano = new Date().getFullYear();
  var seq = ctOS.filter(function(o){ return (o.numero||'').indexOf('/'+ano)>=0; }).length + 1;
  var numero = 'OSC '+String(seq).padStart(3,'0')+'/'+ano;
  var nome = ctUser ? ctUser.nome : '';
  var ins = await supa.from('os_contratacao').insert({
    numero:numero, equip_id:equipId, status:'SOLICITADA', problema:problema,
    empresa:val('ct-empresa')||null, ne:val('ct-ne')||null,
    solicitante:nome, data_solicitacao:today()
  }).select().single();
  if(ins.error){
    if((ins.error.message||'').indexOf('duplicate')>=0){ showToast('Nº já existe — tente de novo','error'); }
    else showToast('Erro ao criar solicitação','error');
    return;
  }
  ctOS.unshift(ins.data);
  showToast(numero+' criada','ok');
  closeDrawer();
  ctRenderList();
}

/* ══ DETALHE DA OS ══ */
function ctOrcTotal(osId){
  return (ctOrc[osId]||[]).reduce(function(s,i){ return s + (Number(i.qtd)||0)*(Number(i.valor_unit)||0); },0);
}
function ctCompTotal(osId){
  return (ctComp[osId]||[]).reduce(function(s,c){
    var it = ctArp.find(function(a){return a.item===c.item_arp;});
    return s + (it? (Number(c.qtd)||0)*Number(it.valor_unit) : 0);
  },0);
}

/* D-l7n-10: régua com dois consumidores — casca que injeta CT_STATUS/CT_STEPS
   sobre reguaPassos (bloco de vocabulário do fluxo interno). CT_STATUS não é
   tocada. */
function ctTimeline(status){
  return reguaPassos((CT_STATUS[status]||{}).step, CT_STEPS);
}

      return '<div class="orc-item"><span class="orc-tipo '+i.tipo+'">'+(i.tipo==='SERVICO'?'SERV':'MAT')+'</span>' +

/* ══ AÇÕES ══ */
function ctNomeEvento(msg){
  return msg || 'Atualização';
}
function ctDetalheEvento(statusAnterior, patch){
  if(!patch || patch.status===undefined || patch.status===statusAnterior) return '';
  var de = statusAnterior ? (CT_STATUS[statusAnterior] ? CT_STATUS[statusAnterior].label : statusAnterior) : '—';
  var para = CT_STATUS[patch.status] ? CT_STATUS[patch.status].label : patch.status;
  return de + ' → ' + para;
}
function ctUsuarioEvento(u){
  if(!u) return '';
  return u.nome + (u.role ? ' ('+u.role+')' : '');
}

async function ctRegistrarEvento(osId, statusAnterior, patch, msg){
  try{
    var r = await supa.from('os_eventos').insert({
      os_id: osId,
      evento: ctNomeEvento(msg),
      detalhe: ctDetalheEvento(statusAnterior, patch) || null,
      usuario: ctUsuarioEvento(ctUser) || null
    }).select().single();
    if(r.error){ console.warn('ctRegistrarEvento', r.error); return false; }
    (ctEvt[osId]=ctEvt[osId]||[]).push(r.data); // D-jpd-06: cache atualizado na hora, sem realtime
    return true;
  }catch(e){ console.warn('ctRegistrarEvento', e); return false; }
}

async function ctUpd(osId, patch, msg){
  var anterior = ctOS.find(function(o){return o.id===osId;});
  var statusAnterior = anterior ? anterior.status : undefined; // lido ANTES do update (senão sai X → X)
  var r = await supa.from('os_contratacao').update(patch).eq('id',osId).select().single();
  if(r.error){ showToast('Erro ao atualizar','error'); return false; }
  var i = ctOS.findIndex(function(o){return o.id===osId;});
  if(i>=0) ctOS[i]=r.data;
  await ctRegistrarEvento(osId, statusAnterior, patch, msg); // D-jpd-05: falha aqui não derruba a ação
  if(msg) showToast(msg,'ok');
  return true;
}

async function ctMudarStatus(osId, novo){
  var patch = {status:novo};
  if(novo==='ORCAMENTO'){ patch.valor_orcado = ctOrcTotal(osId); patch.parecer_aprovacao = null; }
  if(await ctUpd(osId, patch, 'Status: '+(CT_STATUS[novo]||{}).label)){ ctOpenOS(osId); ctRenderList(); }
}

async function ctAprovar(osId){
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'APROVADA',aprovador:nome,data_aprovacao:today(),valor_orcado:ctOrcTotal(osId)},'Orçamento aprovado')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctDevolver(osId){
  var motivo = prompt('Motivo da devolução do orçamento:');
  if(motivo===null) return;
  if(await ctUpd(osId,{status:'SOLICITADA',parecer_aprovacao:motivo},'Devolvida p/ ajuste')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctFiscalizar(osId, aprovado){
  var parecer = val('fis-parecer').trim();
  var nome = ctUser?ctUser.nome:'';
  if(aprovado){
    if(await ctUpd(osId,{status:'FISCALIZADA',fiscal:nome,data_fiscalizacao:today(),parecer_fiscal:parecer},'Execução aprovada pelo fiscal')){ ctOpenOS(osId); ctRenderList(); }
  } else {
    if(!parecer){ showToast('Informe o motivo no parecer','error'); return; }
    if(await ctUpd(osId,{status:'EM_EXECUCAO',parecer_fiscal:parecer},'Devolvida p/ correção')){ ctOpenOS(osId); ctRenderList(); }
  }
}

/* ── histórico da contratação ── */
function ctMarcadorHistorico(o){
  return 'Contratação ' + (o.numero || o.id);
}
function ctDescricaoHistorico(o){
  var desc = ctMarcadorHistorico(o) + ' — ' + (o.problema || 'Serviço executado por empresa contratada');
  if(o.nf) desc += ' · NF ' + o.nf;
  return desc;
}
function ctJaTemHistorico(linhas, marcador){
  return (linhas||[]).some(function(l){
    var texto = l.descricao!==undefined ? l.descricao : l.desc;
    return typeof texto==='string' && texto.indexOf(marcador)===0;
  });
}
async function ctEncerrarHistorico(o){
  if(!o.equip_id) return false;
  var data = o.data_nf || today();
  var r = await supa.from('logs_manutencao').select('id,descricao').eq('equip_id', o.equip_id);
  if(r.error){ console.warn('ctEncerrarHistorico', r.error); return false; }
  if(ctJaTemHistorico(r.data||[], ctMarcadorHistorico(o))) return false;
  var id = await addLogEntryAsync(o.equip_id, {date:data, tipo:'CORRETIVA', status:'CONCLUÍDA', tecnico:(o.empresa||''), desc:ctDescricaoHistorico(o), checklist:[]});
  if(id) await atualizarUltimaManutencao(o.equip_id, data);
  return !!id;
}

/* — execução: fotos comprimidas + upload — */
function ctCompressFoto(file){
  return new Promise(function(res, rej){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1280;
      var w = img.width, hh = img.height;
      if(w>max||hh>max){ var k=Math.min(max/w,max/hh); w=Math.round(w*k); hh=Math.round(hh*k); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/jpeg',0.8);
    };
    img.onerror = rej;
    img.src = url;
  });
}

async function ctAddExec(osId){
  var desc = val('ex-desc').trim();
  var files = (el('ex-fotos')||{files:[]}).files;
  if(!desc && !files.length){ showToast('Descreva o serviço ou anexe fotos','error'); return; }
  showToast('Enviando registro…','');
  var paths = [];
  for(var i=0;i<files.length;i++){
    try{
      var blob = await ctCompressFoto(files[i]);
      var path = osId+'/'+Date.now()+'_'+i+'.jpg';
      var up = await supa.storage.from('os-fotos').upload(path, blob, {contentType:'image/jpeg'});
      if(up.error) throw up.error;
      paths.push(path);
    }catch(e){ console.error('foto',e); showToast('Falha no upload de uma foto','error'); }
  }
  var med = {};
  if(val('ex-ti')) med.temp_insuflamento = parseFloat(val('ex-ti'));
  if(val('ex-tr')) med.temp_retorno = parseFloat(val('ex-tr'));
  if(val('ex-corr')) med.corrente = parseFloat(val('ex-corr'));
  if(val('ex-press')) med.pressao = parseFloat(val('ex-press'));
  var nome = ctUser?ctUser.nome:'';
  var r = await supa.from('os_execucao').insert({
    os_id:osId, data:today(), executor:nome, descricao:desc, medicoes:med, fotos:paths
  }).select().single();
  if(r.error){ showToast('Erro ao registrar execução','error'); return; }
  (ctExec[osId]=ctExec[osId]||[]).push(r.data);
  showToast('Execução registrada','ok');
  ctOpenOS(osId);
}

/* — composição da ata — */
async function ctAddComp(osId){
  var item = parseInt(val('cp-item'));
  var qtd = parseFloat(val('cp-qtd'))||0;
  if(!item || qtd<=0){ showToast('Selecione item e quantidade','error'); return; }
  var it = ctArp.find(function(a){return a.item===item;});
  if(!it){ showToast('Item inválido','error'); return; }
  var saldo = ctSaldoItem(it);
  if(qtd>saldo){ showToast('Excede o saldo do item ('+saldo+')','error'); return; }
  // teto financeiro da NE (empenho global)
  var dispNE = ctSaldoNE(it.ne);
  if(qtd*Number(it.valor_unit) > dispNE + 0.005){
    showToast('Excede o teto da NE — disponível '+fmtMoney(dispNE),'error'); return;
  }
  var r = await supa.from('os_composicao').insert({os_id:osId,item_arp:item,qtd:qtd}).select().single();
  if(r.error){ showToast('Erro ao adicionar','error'); return; }
  (ctComp[osId]=ctComp[osId]||[]).push(r.data);
  ctOpenOS(osId);
}

async function ctDelComp(osId, compId){
  var r = await supa.from('os_composicao').delete().eq('id',compId);
  if(r.error){ showToast('Erro ao remover','error'); return; }
  ctComp[osId] = (ctComp[osId]||[]).filter(function(c){return c.id!==compId;});
  ctOpenOS(osId);
}
