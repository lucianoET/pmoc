/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,::before,::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#F0F2F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;color:#1B1B1B;overflow:hidden}

/* ═══════════════════════════════════════════
   LAYOUT PRINCIPAL
═══════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#topbar{background:#071D41;color:#fff;padding:0 16px;display:flex;align-items:center;gap:10px;height:56px;flex-shrink:0;z-index:10}
#topbar .logo{font-size:13px;font-weight:800;letter-spacing:.5px;line-height:1.1;flex:1}
#topbar .logo span{display:block;font-weight:400;font-size:11px;opacity:.7}
#topbar-action{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:8px;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#topbar-action:active{background:rgba(255,255,255,.15)}

#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0)}
#content::-webkit-scrollbar{display:none}

/* ═══════════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════════ */
#bottom-nav{
  background:#fff;
  border-top:1px solid #E0E0E0;
  display:flex;
  align-items:stretch;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0);
  z-index:10;
  box-shadow:0 -2px 8px rgba(0,0,0,.08)
}
.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:8px 4px;
  background:none;
  border:none;
  cursor:pointer;
  color:#888;
  font-size:10px;
  font-weight:600;
  letter-spacing:.2px;
  transition:color .15s;
  position:relative;
  -webkit-user-select:none;user-select:none
}
.nav-btn i{font-size:20px;line-height:1}
.nav-btn.active{color:#1351B4}
.nav-btn.active i{color:#1351B4}
.nav-badge{
  position:absolute;top:5px;right:50%;
  transform:translateX(calc(50% + 6px));
  background:#E52207;color:#fff;
  font-size:9px;font-weight:800;
  border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;
  line-height:14px
}

var _logCache = {};

async function loadDataFromSupabase() {
  try {
    var { data, error } = await supa.from('equipamentos').select('*').order('id');

    DATA = data.map(dbToEquip);
    localStorage.setItem('pmoc_cache_v1', JSON.stringify(DATA));

    var s = localStorage.getItem('pmoc_cache_v1');

    return false;
  }
}

async function loadLogsFromSupabase() {
  try {
    var { data, error } = await supa.from('logs_manutencao')
      .select('*').order('data_os', { ascending: false });
    if (error) throw error;
    _logCache = {};
    data.forEach(function(r) {
      if (!_logCache[r.equip_id]) _logCache[r.equip_id] = [];
      _logCache[r.equip_id].push(dbToLog(r));
    });
    return true;
  } catch(e) {
    // fallback legado
    try {
      var s = localStorage.getItem('cmasm13_log_v1');
      if (s) {
        var lg = JSON.parse(s);
        _logCache = {};

      }
    } catch(e2) {}
    return false;

function getLog(){ return _logCache; }

function getLatestLogDate(id){
  var e = getEquipLog(id);
  if (!e.length) return null;
  return e.sort(function(a,b){return b.date.localeCompare(a.date);})[0].date;
}

  try {
    var { data, error } = await supa.from('logs_manutencao').insert({
      equip_id: equipId, data_os: entry.date, tipo: entry.tipo,
      status: entry.status, tecnico: entry.tecnico || null,
      descricao: entry.desc || null, checklist: entry.checklist || []
    }).select().single();
    if (error) throw error;
    if (!_logCache[equipId]) _logCache[equipId] = [];

    '<button id="li-btn" onclick="doLoginMobile()"' +
    ' style="width:100%;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer">Entrar</button>' +
    '<div id="li-err" style="margin-top:10px;color:#E52207;font-size:12px;text-align:center;display:none"></div>' +
    '<div style="margin-top:12px;text-align:center">' +
    '<button onclick="acessoLivre()" style="background:none;border:1.5px solid #ccc;color:#666;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;width:100%">' +
    '<i class=\"fas fa-eye\" style=\"margin-right:6px\"></i>Visualizar sem login</button>' +
    '</div>' +
    '</div></div>';
  document.body.appendChild(wrap);
}

async function doLoginMobile() {
  var email = document.getElementById('li-email').value.trim();
  var pass  = document.getElementById('li-pass').value;
  var btn   = document.getElementById('li-btn');
  var err   = document.getElementById('li-err');
  btn.textContent = 'Entrando…'; btn.disabled = true; err.style.display = 'none';
  var { error } = await supa.auth.signInWithPassword({ email, password: pass });
  if (error) {
    err.textContent = 'Usuário ou senha incorretos.';
    err.style.display = 'block';
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
}

// Auth state — aguarda DOM antes de manipular elementos
document.addEventListener('DOMContentLoaded', function() {
  supa.auth.onAuthStateChange(async function(event, session) {
    if (!session) {
      renderLoginMobile();
    } else {
      var lw = document.getElementById('login-mobile');
      if (lw) {
        lw.remove();
        var appEl = document.getElementById('app');
        if (appEl) appEl.style.display = 'flex';
      }
      // v2 fix: carrega os dados também no login manual (antes só carregava
      // quando a sessão já existia no carregamento da página)
      if (window.initAppOnce) window.initAppOnce();
    }
  });
});
</script>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA & STORAGE
═══════════════════════════════════════════════════════════ */
var STORAGE_KEY = 'cmasm13_data_v1';
var LOG_KEY     = 'cmasm13_log_v1';

/* v2: INITIAL_DATA legado removido — os equipamentos são carregados do
   Supabase (loadDataFromSupabase) com fallback no cache localStorage. */
var INITIAL_DATA = [];

var PMOC_INT = {
  'CRÍTICA': {inspecao:30,  preventiva:90,  revisao:180},
  'ALTA':    {inspecao:60,  preventiva:180, revisao:365},
  'MÉDIA':   {inspecao:90,  preventiva:365, revisao:730},
  'BAIXA':   {inspecao:180, preventiva:365, revisao:730}
};
var MAINT_TIPOS = ['INSPEÇÃO','PREVENTIVA','CORRETIVA','REVISÃO','LIMPEZA','RECARGA GÁS','SUBSTITUIÇÃO'];
var CHECKLIST = {
  'SPLIT':['Limpeza dos filtros de ar da evaporadora','Limpeza e desobstrução do dreno de condensado','Verificação do nível de gás refrigerante','Medição de tensão (V) e corrente (A)','Verificação do funcionamento (termostato, modos)','Limpeza da serpentina evaporadora','Inspeção de vazamentos no circuito frigorífico','Verificação de contactores e capacitores','Lubrificação das partes móveis'],
  'PISO/TETO':['Limpeza dos filtros de ar','Limpeza e desobstrução do dreno de condensado','Verificação do nível de gás refrigerante','Medição de tensão (V) e corrente (A)','Verificação do funcionamento geral','Limpeza da serpentina evaporadora e condensadora','Inspeção de vazamentos','Verificação de contactores e capacitores','Lubrificação das partes móveis'],
  'SELF CONTAINED':['Verificação das pressões de alta e baixa (manômetro)','Inspeção e ajuste da correia de transmissão','Limpeza e inspeção dos filtros de ar','Medição de tensão, corrente e potência','Verificação do nível de gás refrigerante','Inspeção do circuito frigorífico (vazamentos)','Limpeza da serpentina condensadora','Verificação dos controles e termostatos','Inspeção do quadro elétrico (fusíveis, contactores)','Análise de vibração e ruídos anormais','Verificação do sistema de drenagem','Lubrificação de rolamentos e partes móveis'],
  'JANELA':['Limpeza do filtro de ar','Verificação do funcionamento geral','Limpeza geral da unidade','Verificação da vedação na parede','Medição de corrente (A)','Verificação de vibração excessiva']
};
var CRIT_COLORS = {'CRÍTICA':'#E52207','ALTA':'#E65100','MÉDIA':'#1565C0','BAIXA':'#33691E'};

var DATA = [];
var invChip = 'todos', osChip = 'todos', pmocChip = 'todos';

/* ═══════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════ */
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e?e.value:''; }
function fmtDate(iso){ if(!iso)return''; try{var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('pt-BR');}catch(e){return iso;} }
function today(){ return new Date().toISOString().slice(0,10); }

function showToast(msg, type){
  var t = el('toast');
  t.textContent = msg;
  t.className = 'show ' + (type||'');
  setTimeout(function(){ t.className = type||''; }, 2200);
}

function autoCrit(e){
  if(e.criticidadeManual) return e.criticidade;
  if(e.funciona==='NOK') return e.criticidade;
  return e.criticidade;
}

/* ── Persistência → delegada para camada Supabase (ver bloco SDK) ── */
function addLogEntry(e,r){ console.warn('addLogEntry sync obsoleto'); }
function delLogEntry(e,i){ console.warn('delLogEntry sync obsoleto'); }
function saveLog(l){ /* no-op */ }

function nextPmoc(e, tipo){
  var crit = autoCrit(e);
  var interval = (PMOC_INT[crit]||PMOC_INT['BAIXA'])[tipo];
  var lastDate = e.ultimaManutencao || getLatestLogDate(e.id);
  if(!lastDate) return null;
  var d = new Date(lastDate+'T12:00:00');
  d.setDate(d.getDate()+interval);
  return d;
}

function dueBadgeHtml(d){
  if(!d) return '<span class="due-badge due-none">Sem hist.</span>';
  var now=new Date(); var diff=Math.round((d-now)/86400000);
  if(diff<0) return '<span class="due-badge due-late">Vencida '+Math.abs(diff)+'d</span>';
  if(diff<30) return '<span class="due-badge due-soon">'+diff+'d</span>';
  return '<span class="due-badge due-ok">'+fmtDate(d.toISOString().slice(0,10))+'</span>';
}

function critPill(crit){
  var map={'CRÍTICA':'pill-crit','ALTA':'pill-alta','MÉDIA':'pill-media','BAIXA':'pill-baixa'};
  return '<span class="pill '+(map[crit]||'')+'">'+esc(crit)+'</span>';
}
function statusPill(fn){
  if(fn==='OK') return '<span class="pill pill-ok"><i class="fas fa-check"></i> OK</span>';
  if(fn==='NOK') return '<span class="pill pill-nok"><i class="fas fa-times"></i> NOK</span>';
  return '<span class="pill pill-ver"><i class="fas fa-question"></i> VERIFICAR</span>';
}
function statusPillOS(s){
  if(s==='CONCLUÍDA') return '<span class="pill pill-ok">CONCLUÍDA</span>';
  if(s==='PENDENTE') return '<span class="pill pill-nok">PENDENTE</span>';
  return '<span class="pill pill-ver">PARCIAL</span>';
}

function navTo(page, btn){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  el('page-'+page).classList.add('active');
  if(btn) btn.classList.add('active');
  el('fab').style.display = page==='os' ? 'flex' : 'none';
  if(page==='inv') renderInv();
  if(page==='os') renderOS();
  if(page==='pmoc') renderPmoc();
  if(page==='alert') renderAlerts();
  if(page==='dash') renderDash();
}

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════════════════ */
function renderDash(){
  var now = new Date();
  var total = DATA.length;
  var nok = DATA.filter(function(e){ return e.funciona==='NOK'; }).length;
  var ok = DATA.filter(function(e){ return e.funciona==='OK'; }).length;
  var pct = total?Math.round(ok/total*100):0;
  var critica = DATA.filter(function(e){ return autoCrit(e)==='CRÍTICA'; }).length;
  var semHist = DATA.filter(function(e){ return !e.ultimaManutencao && !getLatestLogDate(e.id); }).length;
  var vencidas = DATA.filter(function(e){ var nx=nextPmoc(e,'inspecao'); return nx&&nx<now; }).length;
  var alertCount = nok + vencidas + semHist;

  el('kpi-area').innerHTML =
    '<div class="kpi-card" style="border-left-color:#1351B4">' +
    '<div class="kpi-label"><i class="fas fa-database mr1"></i> Total</div>' +
    '<div class="kpi-val" style="color:#1351B4">'+total+'</div>' +
    '<div class="kpi-sub">equipamentos cadastrados</div></div>' +
    '<div class="kpi-card" style="border-left-color:#168821">' +
    '<div class="kpi-label"><i class="fas fa-check-circle mr1"></i> Operacionais</div>' +
    '<div class="kpi-val" style="color:#168821">'+ok+'</div>' +
    '<div class="kpi-sub">'+pct+'% do total</div></div>' +
    '<div class="kpi-card" style="border-left-color:#E52207">' +
    '<div class="kpi-label"><i class="fas fa-times-circle mr1"></i> Fora de Operação</div>' +
    '<div class="kpi-val" style="color:#E52207">'+nok+'</div>' +
    '<div class="kpi-sub">'+(total?Math.round(nok/total*100):0)+'% do total</div></div>' +
    '<div class="kpi-card" style="border-left-color:#B71C1C">' +
    '<div class="kpi-label"><i class="fas fa-exclamation-circle mr1"></i> Área Crítica</div>' +
    '<div class="kpi-val" style="color:#B71C1C">'+critica+'</div>' +
    '<div class="kpi-sub">equipamentos críticos</div></div>' +
    '<div class="kpi-card kpi-wide" style="border-left-color:#F57F17">' +
    '<div class="kpi-label"><i class="fas fa-calendar-times mr1"></i> Atenção PMOC</div>' +
    '<div class="kpi-val" style="color:#F57F17">'+alertCount+'</div>' +
    '<div class="kpi-sub">'+vencidas+' vencidas · '+semHist+' sem histórico</div></div>';

  // Alertas top 5
  var alerts = DATA.filter(function(e){
    var nx=nextPmoc(e,'inspecao');
    return e.funciona==='NOK' || (nx&&nx<now) || (!e.ultimaManutencao && !getLatestLogDate(e.id));
  }).sort(function(a,b){
    var ord=['CRÍTICA','ALTA','MÉDIA','BAIXA'];
    return ord.indexOf(autoCrit(a))-ord.indexOf(autoCrit(b));
  }).slice(0,5);

  var alertHtml = '<div class="sec-head"><span class="sec-title">Prioridade Imediata</span>' +
    '<span class="sec-count">'+alerts.length+'</span></div>';
  alerts.forEach(function(e){
    var crit=autoCrit(e);
    var cc = CRIT_COLORS[crit]||'#999';
    var reason = e.funciona==='NOK' ? 'NOK — '+esc(e.obs||'Verificar') :
                 !getLatestLogDate(e.id)&&!e.ultimaManutencao ? 'Sem histórico de manutenção' : 'Manutenção vencida';
    alertHtml += '<div class="alert-card" style="border-left-color:'+cc+'" onclick="openDetail('+e.id+')">' +
      '<div class="alert-icon"><i class="fas '+(e.funciona==='NOK'?'fa-times-circle':'fa-calendar-exclamation')+'" style="color:'+cc+'"></i></div>' +
      '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
      '<div class="alert-sub">'+esc(e.predio)+' · '+esc(reason)+'</div></div>' +
      critPill(crit)+'</div>';
  });
  el('dash-alerts-section').innerHTML = alertHtml;

  // PMOC próximas
  var pmocDue = DATA.filter(function(e){
    var nx=nextPmoc(e,'inspecao');
    return nx && ((nx-now)/86400000)<30;
  }).sort(function(a,b){
    var na=nextPmoc(a,'inspecao'),nb=nextPmoc(b,'inspecao');
    return na-nb;
  }).slice(0,6);

  if(pmocDue.length){
    var pmocHtml = '<div class="sec-head"><span class="sec-title">PMOC — Próximas 30d</span>' +
      '<span class="sec-count">'+pmocDue.length+'</span></div>';
    pmocDue.forEach(function(e){
      var nx = nextPmoc(e,'inspecao');
      pmocHtml += '<div class="pmoc-row" onclick="openDetail('+e.id+')">' +
        critPill(autoCrit(e)) +
        '<div class="pmoc-info"><div class="pmoc-predio">'+esc(e.predio)+'</div><div class="pmoc-local">'+esc(e.local)+'</div></div>' +
        dueBadgeHtml(nx)+'</div>';
    });
    el('dash-pmoc-section').innerHTML = pmocHtml;
  } else {
    el('dash-pmoc-section').innerHTML = '';
  }

  // Update badges
  el('alert-badge').textContent = alertCount;
  el('alert-badge').style.display = alertCount>0?'block':'none';
  var osAll = getAllOSEntries();
  var osPend = osAll.filter(function(o){return o.status==='PENDENTE';}).length;
  el('os-badge').textContent = osPend;
  el('os-badge').style.display = osPend>0?'block':'none';
  var pmocVenc = DATA.filter(function(e){ var nx=nextPmoc(e,'inspecao'); return nx&&nx<now; }).length;
  el('pmoc-badge').textContent = pmocVenc;
  el('pmoc-badge').style.display = pmocVenc>0?'block':'none';
  el('os-cnt').textContent = osAll.length;
  el('pmoc-cnt').textContent = pmocVenc;
}

function renderInv(){
  var q = (el('inv-search')||{value:''}).value.toLowerCase().trim();
  var list = DATA.filter(function(e){
    if(q && !(e.local.toLowerCase().includes(q)||e.predio.toLowerCase().includes(q)||(e.fabricante||'').toLowerCase().includes(q))) return false;
    if(invChip==='nok') return e.funciona==='NOK';
    if(invChip==='ok') return e.funciona==='OK';
    if(invChip==='ver') return e.obs && e.obs.toLowerCase().includes('verificar');
    if(invChip==='critica') return autoCrit(e)==='CRÍTICA';
    if(invChip==='vermelha') return e.area==='VERMELHA';
    if(invChip==='azul') return e.area==='AZUL';
    return true;
  });

  el('inv-cnt').textContent = list.length;
  el('inv-label').textContent = list.length===DATA.length ? 'Todos os Equipamentos' : 'Filtrado';

  if(!list.length){
    el('inv-list').innerHTML = '<div class="empty"><i class="fas fa-search"></i><p>Nenhum equipamento encontrado</p></div>';
    return;
  }
  el('inv-list').innerHTML = list.map(function(e){
    var fn = e.funciona==='OK'?'ok':e.funciona==='NOK'?'nok':'ver';
    var horas = (e.horasDia||0)*(e.diasSemana||0);
    var btuK = e.btu? (e.btu>=1000?(e.btu/1000).toFixed(0)+'K BTU':e.btu+' BTU'):'—';
    return '<div class="equip-card '+fn+'" onclick="openDetail('+e.id+')">' +
      '<div class="ec-row1">' +
      '<span class="ec-num">#'+e.id+'</span>' +
      '<div class="ec-main">' +
      '<div class="ec-local">'+esc(e.local)+'</div>' +
      '<div class="ec-predio">'+esc(e.predio)+' · '+esc(e.area)+'</div>' +
      '</div></div>' +
      '<div class="ec-status">' +
      statusPill(e.funciona)+critPill(autoCrit(e))+
      '<span class="pill pill-tipo">'+esc(e.tipo)+'</span></div>' +
      '<div class="ec-info">' +
      '<span><i class="fas fa-snowflake"></i>'+btuK+'</span>' +
      '<span><i class="fas fa-clock"></i>'+(horas||'—')+'h/sem</span>' +
      (e.fabricante&&e.fabricante!=='-'?'<span><i class="fas fa-industry"></i>'+esc(e.fabricante)+'</span>':'') +
      (e.obs?'<span style="color:#E52207"><i class="fas fa-exclamation-triangle"></i>Obs.</span>':'')+
      '</div></div>';
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   OS (extrai de todos os logs)
═══════════════════════════════════════════════════════════ */
function getAllOSEntries(){
  var log = getLog();
  var entries = [];
  Object.keys(log).forEach(function(equipId){
    var e = DATA.find(function(r){ return r.id===parseInt(equipId); });
    if(!e) return;
    (log[equipId]||[]).forEach(function(entry){
      entries.push({ equipId:parseInt(equipId), equip:e, entry:entry });
    });
  });
  entries.sort(function(a,b){ return b.entry.date.localeCompare(a.entry.date); });
  return entries;
}

function setOSChip(btn, val){
  document.querySelectorAll('#os-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');

}

      '<div class="os-predio">'+esc(o.equip.predio)+'</div></div>' +
      statusPillOS(st)+'</div>' +
      '<div class="os-meta">'+critPill(autoCrit(o.equip))+

      '<span style="font-size:11px;color:#888"><i class="fas fa-calendar mr1"></i>'+fmtDate(o.entry.date)+'</span>' +

   PMOC PAGE
═══════════════════════════════════════════════════════════ */
function setPmocChip(btn, val){
  document.querySelectorAll('#pmoc-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  pmocChip = val;
  renderPmoc();
}

function renderPmoc(){
  var now = new Date();
  var list = DATA.filter(function(e){
    var nx = nextPmoc(e,'inspecao');
    if(pmocChip==='vencida') return nx && nx<now;
    if(pmocChip==='sem-hist') return !e.ultimaManutencao && !getLatestLogDate(e.id);
    if(pmocChip==='critica') return autoCrit(e)==='CRÍTICA';
    return true;
  }).sort(function(a,b){
    var ord=['CRÍTICA','ALTA','MÉDIA','BAIXA'];
    var ca=ord.indexOf(autoCrit(a)), cb=ord.indexOf(autoCrit(b));
    if(ca!==cb) return ca-cb;
    var na=nextPmoc(a,'inspecao'), nb=nextPmoc(b,'inspecao');
    if(!na&&!nb) return 0; if(!na) return 1; if(!nb) return -1;
    return na-nb;
  });

  el('pmoc-cnt').textContent = list.length;

  if(!list.length){
    el('pmoc-list').innerHTML = '<div class="empty"><i class="fas fa-calendar-check"></i><p>Tudo em dia neste filtro!</p></div>';
    return;
  }

  el('pmoc-list').innerHTML = list.map(function(e){
    var nx = nextPmoc(e,'inspecao');
    var np = nextPmoc(e,'preventiva');
    var logCnt = getEquipLog(e.id).length;
    return '<div class="pmoc-row" onclick="openDetail('+e.id+')">' +
      critPill(autoCrit(e)) +
      '<div class="pmoc-info">' +
      '<div class="pmoc-predio">'+esc(e.predio)+'</div>' +
      '<div class="pmoc-local">'+esc(e.local)+' · '+esc(e.tipo)+'</div>' +
      '<div style="font-size:11px;color:#999;margin-top:2px">' +
      'Inspeção: '+dueBadgeHtml(nx)+' Prev.: '+dueBadgeHtml(np)+'</div>' +
      '</div>' +
      '<div style="font-size:11px;color:#aaa;text-align:right"><i class="fas fa-clipboard-list mr1"></i>'+logCnt+'</div>' +
      '</div>';
  }).join('');
}

   ALERTS PAGE

function renderAlerts(){
  var now = new Date();
  var nokList = DATA.filter(function(e){ return e.funciona==='NOK'; })
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var vencList = DATA.filter(function(e){ var nx=nextPmoc(e,'inspecao'); return nx&&nx<now; })
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var semHist = DATA.filter(function(e){ return !e.ultimaManutencao&&!getLatestLogDate(e.id)&&autoCrit(e)==='CRÍTICA'; });

  var html = '';

  if(nokList.length){
    html += '<div class="sec-head"><span class="sec-title" style="color:#E52207"><i class="fas fa-times-circle mr1"></i>NOK — Fora de Operação</span><span class="sec-count">'+nokList.length+'</span></div>';
    html += nokList.map(function(e){
      return '<div class="alert-card" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-times-circle" style="color:#E52207"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+(e.obs?' · '+esc(e.obs):'')+'</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(vencList.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title" style="color:#F57F17"><i class="fas fa-calendar-times mr1"></i>PMOC Vencida</span><span class="sec-count">'+vencList.length+'</span></div>';
    html += vencList.map(function(e){
      var nx = nextPmoc(e,'inspecao');
      var diff = nx?Math.round((now-nx)/86400000):0;
      return '<div class="alert-card" style="border-left-color:#F57F17" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-calendar-times" style="color:#F57F17"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+' · Vencida há '+diff+'d</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(semHist.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title"><i class="fas fa-question-circle mr1"></i>Críticos Sem Histórico</span><span class="sec-count">'+semHist.length+'</span></div>';
    html += semHist.map(function(e){
      return '<div class="alert-card" style="border-left-color:#B71C1C" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-history" style="color:#B71C1C"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+' · Nenhum registro de manutenção</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(!html) html = '<div class="empty"><i class="fas fa-check-circle" style="color:#168821"></i><p>Nenhum alerta ativo!</p></div>';

  el('alert-list').innerHTML = html;

  var total = nokList.length + vencList.length;
  el('alert-badge').textContent = total;
  el('alert-badge').style.display = total>0?'block':'none';
}

function openDrawer(){ el('drawer').classList.add('open'); document.body.style.overflow='hidden'; }
function closeDrawer(){ el('drawer').classList.remove('open'); document.body.style.overflow=''; }

function openDetail(id){
  var e = DATA.find(function(r){ return r.id===id; }); if(!e) return;
  var logs = getEquipLog(id);
  var lastDate = e.ultimaManutencao || getLatestLogDate(id);
  var crit = autoCrit(e);
  var horas = (e.horasDia||0)*(e.diasSemana||0);
  var ni = nextPmoc(e,'inspecao'); var np = nextPmoc(e,'preventiva');
  var btuK = e.btu? (e.btu/1000).toFixed(0)+'K BTU' : '—';
  var kw = e.btu? (e.btu/3412).toFixed(2)+' kW' : '—';

  el('dh-id').textContent = '#'+id+' · '+esc(e.area);
  el('dh-local').textContent = e.local;
  el('dh-predio').textContent = e.predio;
  el('dh-pills').innerHTML = statusPill(e.funciona)+critPill(crit);

  var logHtml = '';
  if(logs.length){
    logHtml = '<div class="ds"><div class="ds-title"><i class="fas fa-history mr1"></i>Histórico de Manutenção ('+logs.length+')</div>';
    logs.forEach(function(entry){
      var stCls = entry.status==='CONCLUÍDA'?'pill-ok':entry.status==='PARCIAL'?'pill-ver':'pill-nok';
      var done = (entry.checklist||[]).filter(function(c){return c.done;}).length;
      var tot = (entry.checklist||[]).length;
      logHtml += '<div class="log-entry">' +
        '<div class="le-hdr">' +
        '<span class="le-date">'+fmtDate(entry.date)+'</span>' +
        '<span class="le-tipo">'+esc(entry.tipo||'')+'</span>' +
        '<span class="le-status '+stCls+'">'+esc(entry.status||'')+'</span>' +
        '</div>' +
        (entry.tecnico?'<div class="le-tec"><i class="fas fa-user mr1"></i>'+esc(entry.tecnico)+'</div>':'') +
        (entry.desc?'<div class="le-desc">'+esc(entry.desc)+'</div>':'') +

async function saveLogEntry(equipId, clistLen){
  if (window._modoObservador) { showToast('Modo somente leitura', ''); return; }
  var date=val('log-date'), tipo=val('log-tipo'), status=val('log-status');
  if(!date||!tipo){ showToast('Preencha data e tipo','error'); return; }
  var checklist=[];
  for(var i=0;i<clistLen;i++){
    var chk=el('chk-'+i);

    if(chk&&lbl) checklist.push({i:i,label:lbl.textContent.trim(),done:chk.checked});
  }
  await addLogEntryAsync(equipId,{date:date,tipo:tipo,status:status,tecnico:val('log-tec').trim(),desc:val('log-desc').trim(),checklist:checklist});

(function(){
  var panel, startY, startScroll, dragging;
  document.addEventListener('touchstart', function(e){
    panel = el('drawer-panel');
    if(!el('drawer').classList.contains('open')) return;
    var touch = e.touches[0];
    startY = touch.clientY;
    dragging = false;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!el('drawer').classList.contains('open')) return;
    var touch = e.touches[0];
    var dy = touch.clientY - startY;
    if(dy>60){ dragging=true; }
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(dragging){ closeDrawer(); dragging=false; }
  });
})();

/* ══ CARGA DE DADOS ══ */
async function ctLoad(){
  try{
    var r1 = await supa.from('os_contratacao').select('*').order('criado_em',{ascending:false});
    if(r1.error) throw r1.error;
    ctOS = r1.data||[];
    var r2 = await supa.from('os_orcamento_itens').select('*').order('ordem');
    ctOrc = {}; (r2.data||[]).forEach(function(i){ (ctOrc[i.os_id]=ctOrc[i.os_id]||[]).push(i); });
    var r3 = await supa.from('os_execucao').select('*').order('data');
    ctExec = {}; (r3.data||[]).forEach(function(i){ (ctExec[i.os_id]=ctExec[i.os_id]||[]).push(i); });
    var r4 = await supa.from('os_composicao').select('*');
    ctComp = {}; (r4.data||[]).forEach(function(i){ (ctComp[i.os_id]=ctComp[i.os_id]||[]).push(i); });
    var r4b = await supa.from('os_eventos').select('*').order('criado_em');
    ctEvt = {}; ((r4b&&r4b.data)||[]).forEach(function(i){ (ctEvt[i.os_id]=ctEvt[i.os_id]||[]).push(i); });
    var r5 = await supa.from('arp_itens').select('*').order('item');
    ctArp = r5.data||[];
    var s = await supa.auth.getSession();
    var uid = s.data && s.data.session ? s.data.session.user.id : null;
    if(uid){
      var r6 = await supa.from('usuarios').select('*').eq('auth_id',uid).maybeSingle();
      ctUser = r6.data||null;
    }
    ctLoaded = true;
    return true;
  }catch(e){ console.error('ctLoad',e); showToast('Erro ao carregar contratações','error'); return false; }
}

function ctSetupRealtime(){
  supa.channel('ct-contratacao')
    .on('postgres_changes',{event:'*',schema:'public',table:'os_contratacao'},function(){ ctLoad().then(function(){ if(ctMode==='contrat') ctRenderList(); }); })
    .on('postgres_changes',{event:'*',schema:'public',table:'os_orcamento_itens'},function(){ ctLoad(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'os_execucao'},function(){ ctLoad(); })
    .subscribe();

/* ══ SALDO DAS ATAS ══ */
function ctConsumo(item){
  var q = 0;
  Object.keys(ctComp).forEach(function(osId){
    var os = ctOS.find(function(o){return o.id===osId;});
    if(!os || os.status==='CANCELADA') return;
    ctComp[osId].forEach(function(c){ if(c.item_arp===item) q += Number(c.qtd)||0; });
  });
  return q;
}
function ctSaldoItem(it){ return (it.qtd_empenhada||0) - ctConsumo(it.item); }
/* NEs são GLOBAIS (conferido nos PDFs SIAFI de 28/07/2026): o teto financeiro
   é o valor da NE — a soma dos itens aderidos da RLP (R$ 43.467,13) EXCEDE a
   NE334 em R$ 4.541,02, portanto o controle financeiro usa o valor da NE. */
var CT_NES = {
  '2026NE000335': {forn:'WINS', valor:26521.75},
  '2026NE000334': {forn:'RLP',  valor:38926.11}
};
function ctConsumoNE(ne){
  var t=0;
  Object.keys(ctComp).forEach(function(osId){
    var os = ctOS.find(function(o){return o.id===osId;});
    if(!os || os.status==='CANCELADA') return;
    ctComp[osId].forEach(function(c){
      var it = ctArp.find(function(a){return a.item===c.item_arp;});
      if(it && it.ne===ne) t += (Number(c.qtd)||0)*Number(it.valor_unit);
    });
  });
  return t;
}
function ctSaldoNE(ne){
  var cfg = CT_NES[ne];
  return (cfg?cfg.valor:0) - ctConsumoNE(ne);
}

    '<button class="chip" onclick="ctSetChip(this,\'saldo\')">Saldo Atas</button>';
  page.insertBefore(chips, el('os-chips'));
}

async function ctSetMode(m){
  ctMode = m;
  var sp=el('seg-pmoc'), sc=el('seg-contrat');
  if(sp) sp.className = 'seg-btn'+(m==='pmoc'?' active':'');
  if(sc) sc.className = 'seg-btn'+(m==='contrat'?' active':'');
  el('os-chips').style.display = m==='pmoc'?'flex':'none';
  el('ct-chips').style.display = m==='contrat'?'flex':'none';
  var title = document.querySelector('#page-os .sec-title');
  if(title) title.textContent = m==='contrat' ? 'Contratações (ARP)' : 'Ordens de Serviço';
  if(m==='contrat'){ await ctEnsureLoaded(); ctRenderList(); }
  else renderOS();
}

function ctSetChip(btn, v){
  document.querySelectorAll('#ct-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  ctChipSel = v;
  ctRenderList();
}

function ctRenderList(){
  if(ctChipSel==='saldo'){ ctRenderSaldo(); return; }
  var list = ctOS.filter(function(o){
    if(ctChipSel==='andamento') return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;
    if(ctChipSel==='aprovacao') return o.status==='ORCAMENTO' || o.status==='EXECUTADA';
    if(ctChipSel==='encerradas') return o.status==='ENCERRADA' || o.status==='CANCELADA';
    return true;
  });
  el('os-cnt').textContent = list.length;
  if(!list.length){
    el('os-list').innerHTML = '<div class="empty"><i class="fas fa-file-signature"></i>' +
      '<p>Nenhuma contratação neste filtro.<br>Toque <strong>+</strong> para abrir uma solicitação.</p></div>';
    return;
  }
  el('os-list').innerHTML = list.map(function(o){
    var e = ctEquip(o.equip_id);
    var st = CT_STATUS[o.status]||CT_STATUS['SOLICITADA'];
    var total = ctOrcTotal(o.id);
    return '<div class="ct-card" style="border-left-color:'+st.fg+'" onclick="ctOpenOS(\''+o.id+'\')">' +
      '<div class="os-hdr"><div><div class="ct-num">'+esc(o.numero)+'</div>' +
      '<div class="os-local">'+esc(e.local)+'</div>' +
      '<div class="os-predio">'+esc(e.predio)+(o.empresa?' · '+esc(o.empresa):'')+'</div></div>' +
      ctStatusPill(o.status)+'</div>' +
      '<div class="os-meta">' +
      '<span style="font-size:11px;color:#888"><i class="fas fa-calendar mr1"></i>'+fmtDate(o.data_solicitacao)+'</span>' +
      (total>0?'<span style="font-size:12px;font-weight:800;color:#1351B4">'+fmtMoney(o.valor_orcado||total)+'</span>':'') +
      (o.ne?'<span class="pill pill-tipo">'+esc(o.ne)+'</span>':'') +
      '</div>' +
      (o.problema?'<div class="os-desc">'+esc(o.problema)+'</div>':'') +
      '</div>';
  }).join('');
}

function ctRenderSaldo(){
  el('os-cnt').textContent = ctArp.length;
  var html = '<div class="kpi-row">' +
    '<div class="kpi-card" style="border-left-color:#1351B4"><div class="kpi-label">Saldo WINS · NE335</div>' +
    '<div class="kpi-val" style="color:#1351B4;font-size:18px">'+fmtMoney(ctSaldoNE('2026NE000335'))+'</div><div class="kpi-sub">de '+fmtMoney(CT_NES['2026NE000335'].valor)+' (NE global)</div></div>' +
    '<div class="kpi-card" style="border-left-color:#168821"><div class="kpi-label">Saldo RLP · NE334</div>' +
    '<div class="kpi-val" style="color:#168821;font-size:18px">'+fmtMoney(ctSaldoNE('2026NE000334'))+'</div><div class="kpi-sub">de '+fmtMoney(CT_NES['2026NE000334'].valor)+' (NE global)</div></div></div>' +
    '<div style="background:#FEF3E2;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:10px;color:#B46800;line-height:1.4">' +
    '<i class="fas fa-info-circle mr1"></i>As NEs são globais: o teto de pagamento é o valor da NE. ' +
    'Os saldos por item abaixo controlam as <strong>quantidades</strong> aderidas na ata (soma dos itens RLP = R$ 43.467,13, acima da NE334 — nem toda quantidade caberá no empenho).</div>';
  ['2026NE000335','2026NE000334'].forEach(function(ne){
    var itens = ctArp.filter(function(i){return i.ne===ne;});
    if(!itens.length) return;
    html += '<div class="sec-head"><span class="sec-title">'+(ne==='2026NE000335'?'WINS':'RLP')+' — '+ne+'</span><span class="sec-count">'+itens.length+' itens</span></div>';
    html += itens.map(function(it){
      var saldo = ctSaldoItem(it);
      var pct = it.qtd_empenhada? Math.max(0,Math.min(100,Math.round(saldo/it.qtd_empenhada*100))) : 0;
      return '<div class="saldo-row"><div class="saldo-hdr">' +
        '<span style="font-size:12px;font-weight:800;color:#1351B4">Item '+it.item+'</span>' +
        '<span style="font-size:12px;font-weight:700">'+saldo+' / '+it.qtd_empenhada+' · '+fmtMoney(saldo*it.valor_unit)+'</span></div>' +
        '<div class="saldo-desc">'+esc(it.descricao)+' <span style="color:#999">('+fmtMoney(it.valor_unit)+'/un)</span></div>' +
        '<div class="saldo-bar"><div class="saldo-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'"></div></div></div>';
    }).join('');
  });
  el('os-list').innerHTML = html;
}

/* ══ NOVA SOLICITAÇÃO ══ */
function ctNovaOS(){
  if(!ctCan('criar')){ showToast('Sem permissão para criar solicitação',''); return; }
  el('dh-id').textContent = 'Nova Contratação';
  el('dh-local').textContent = 'Solicitação de serviço';
  el('dh-predio').textContent = 'Selecione a máquina e descreva o problema';
  el('dh-pills').innerHTML = '';
  var opts = DATA.slice().sort(function(a,b){ return (a.funciona==='NOK'?0:1)-(b.funciona==='NOK'?0:1); })
    .map(function(e){ return '<option value="'+e.id+'">'+(e.funciona==='NOK'?'⛔ ':'')+'#'+e.id+' — '+esc(e.predio)+' / '+esc(e.local)+' ('+esc(e.tipo)+')</option>'; }).join('');
  el('drawer-body').innerHTML =
    '<div class="ds"><div class="ds-title"><i class="fas fa-snowflake mr1"></i>Máquina</div>' +
    '<select class="fgs" id="ct-equip-sel">'+opts+'</select>' +
    '<div style="font-size:10px;color:#999;margin-top:6px">⛔ = máquinas NOK aparecem primeiro</div></div>' +
    '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1"></i>Problema / Serviço Necessário</div>' +
    '<textarea class="fgt" id="ct-problema" placeholder="Descreva o defeito ou serviço a contratar…"></textarea>' +
    '<div class="fg2" style="margin-top:8px">' +
    '<div><label class="fgl">Empresa</label><select class="fgs" id="ct-empresa" onchange="ctSyncNE()">' +
    '<option value="RLP">RLP</option><option value="WINS">WINS</option><option value="">A definir</option></select></div>' +
    '<div><label class="fgl">NE</label><select class="fgs" id="ct-ne">' +
    '<option value="2026NE000334">2026NE000334 (RLP)</option><option value="2026NE000335">2026NE000335 (WINS)</option><option value="">—</option></select></div>' +
    '</div></div>';
  el('drawer-footer').innerHTML =
    '<button class="btn-secondary" onclick="closeDrawer()">Cancelar</button>' +
    '<button class="btn-primary" onclick="ctSalvarNova()"><i class="fas fa-paper-plane mr1"></i>Abrir Solicitação</button>';
  openDrawer();
}

function ctSyncNE(){
  var emp = val('ct-empresa');
  var ne = el('ct-ne');
  if(!ne) return;
  if(emp==='RLP') ne.value='2026NE000334';
  else if(emp==='WINS') ne.value='2026NE000335';
}

async function ctSalvarNova(){
  var equipId = parseInt(val('ct-equip-sel'));
  var problema = val('ct-problema').trim();
  if(!equipId || !problema){ showToast('Selecione a máquina e descreva o problema','error'); return; }
  var ano = new Date().getFullYear();
  var seq = ctOS.filter(function(o){ return (o.numero||'').indexOf('/'+ano)>=0; }).length + 1;
  var numero = 'OSC '+String(seq).padStart(3,'0')+'/'+ano;
  var nome = ctUser ? ctUser.nome : '';
  var ins = await supa.from('os_contratacao').insert({
    numero:numero, equip_id:equipId, status:'SOLICITADA', problema:problema,
    empresa:val('ct-empresa')||null, ne:val('ct-ne')||null,
    solicitante:nome, data_solicitacao:today()
  }).select().single();
  if(ins.error){
    if((ins.error.message||'').indexOf('duplicate')>=0){ showToast('Nº já existe — tente de novo','error'); }
    else showToast('Erro ao criar solicitação','error');
    return;
  }
  ctOS.unshift(ins.data);
  showToast(numero+' criada','ok');
  closeDrawer();
  ctRenderList();
}

/* ══ DETALHE DA OS ══ */
function ctOrcTotal(osId){
  return (ctOrc[osId]||[]).reduce(function(s,i){ return s + (Number(i.qtd)||0)*(Number(i.valor_unit)||0); },0);
}
function ctCompTotal(osId){
  return (ctComp[osId]||[]).reduce(function(s,c){
    var it = ctArp.find(function(a){return a.item===c.item_arp;});
    return s + (it? (Number(c.qtd)||0)*Number(it.valor_unit) : 0);
  },0);
}

function ctTimeline(status){
  var cur = (CT_STATUS[status]||{}).step;
  if(cur===-1) return '<div style="font-size:12px;color:#999;margin-bottom:8px"><i class="fas fa-ban mr1"></i>OS cancelada</div>';
  var h = '<div class="ct-timeline">';
  CT_STEPS.forEach(function(s,i){
    var cls = i<cur?'done':(i===cur?'curr':'');
    h += '<div class="ct-step '+cls+'"><div class="ct-dot">'+(i<cur?'<i class="fas fa-check"></i>':(i+1))+'</div><span>'+s+'</span></div>';
    if(i<CT_STEPS.length-1) h += '<div class="ct-bar '+(i<cur?'done':'')+'"></div>';
  });
  return h+'</div>';
}

function ctOpenOS(osId){
  var o = ctOS.find(function(x){return x.id===osId;}); if(!o) return;
  var e = ctEquip(o.equip_id);
  var itens = ctOrc[osId]||[];
  var regs = ctExec[osId]||[];
  var comps = ctComp[osId]||[];
  var total = ctOrcTotal(osId);
  var ro = window._modoObservador;

  el('dh-id').textContent = o.numero+' · '+(o.ne||'sem NE');
  el('dh-local').textContent = e.local;
  el('dh-predio').textContent = e.predio+(o.empresa?' · '+o.empresa:'');
  el('dh-pills').innerHTML = ctStatusPill(o.status);

  var h = ctTimeline(o.status);

  /* — Solicitação — */
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1"></i>1 · Solicitação</div>' +
    '<div class="dfield"><label>Problema / serviço</label><div class="dval" style="font-size:13px">'+esc(o.problema||'—')+'</div></div>' +
    '<div class="dfields2">' +
    '<div class="dfield"><label>Solicitante</label><div class="dval" style="font-size:12px">'+esc(o.solicitante||'—')+'</div></div>' +
    '<div class="dfield"><label>Data</label><div class="dval" style="font-size:12px">'+fmtDate(o.data_solicitacao)+'</div></div>' +
    '</div></div>';

  /* — Orçamento — */
  var podeOrcar = !ro && ctCan('orcar') && (o.status==='SOLICITADA'||o.status==='ORCAMENTO');
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-file-invoice-dollar mr1"></i>2 · Delineamento / Orçamento</div>';
  if(itens.length){
    h += itens.map(function(i){
      return '<div class="orc-item"><span class="orc-tipo '+i.tipo+'">'+(i.tipo==='SERVICO'?'SERV':'MAT')+'</span>' +
        '<div class="orc-desc">'+esc(i.descricao)+'<div style="color:#999;font-size:10px">'+i.qtd+' × '+fmtMoney(i.valor_unit)+'</div></div>' +
        '<span class="orc-val">'+fmtMoney(i.qtd*i.valor_unit)+'</span>' +
        (podeOrcar?'<button class="orc-del" onclick="ctDelOrcItem(\''+osId+'\',\''+i.id+'\')"><i class="fas fa-trash"></i></button>':'') +
        '</div>';
    }).join('');
    h += '<div class="ct-total-row"><span>TOTAL ORÇADO</span><span style="color:#1351B4">'+fmtMoney(total)+'</span></div>';
  } else {
    h += '<div style="font-size:12px;color:#999">Nenhum item lançado ainda.</div>';
  }
  if(podeOrcar){
    h += '<div style="margin-top:10px;border-top:1px dashed #DDD;padding-top:10px">' +
      '<div class="fg2"><div><label class="fgl">Tipo</label><select class="fgs" id="oi-tipo"><option value="SERVICO">Serviço</option><option value="MATERIAL">Material/Peça</option></select></div>' +
      '<div><label class="fgl">Qtd</label><input class="fgi" id="oi-qtd" type="number" value="1" min="0.01" step="0.01"/></div></div>' +
      '<label class="fgl">Descrição</label><input class="fgi" id="oi-desc" placeholder="Ex.: Substituição do compressor 36.000 BTU"/>' +
      '<label class="fgl" style="margin-top:8px">Valor unitário (R$)</label><input class="fgi" id="oi-vu" type="number" min="0" step="0.01" placeholder="0,00"/>' +
      '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="ctAddOrcItem(\''+osId+'\')"><i class="fas fa-plus mr1"></i>Adicionar item</button></div>';
  }
  if(o.status==='ORCAMENTO' && o.parecer_aprovacao){
    h += '<div style="margin-top:8px;font-size:11px;color:#B46800;background:#FEF3E2;border-radius:8px;padding:8px"><i class="fas fa-undo mr1"></i>Devolvida: '+esc(o.parecer_aprovacao)+'</div>';
  }
  if(o.aprovador){
    h += '<div style="margin-top:8px;font-size:11px;color:#168821"><i class="fas fa-check-circle mr1"></i>Aprovado por '+esc(o.aprovador)+' em '+fmtDate(o.data_aprovacao)+'</div>';
  }
  /* botões do orçamento */
  h += '<div class="ct-btn-row">';
  if(!ro && o.status==='SOLICITADA' && itens.length && ctCan('orcar'))
    h += '<button class="btn-primary" onclick="ctMudarStatus(\''+osId+'\',\'ORCAMENTO\')"><i class="fas fa-paper-plane mr1"></i>Enviar p/ aprovação</button>';
  if(!ro && o.status==='ORCAMENTO' && ctCan('aprovar')){
    h += '<button class="btn-success" onclick="ctAprovar(\''+osId+'\')"><i class="fas fa-check mr1"></i>Aprovar orçamento</button>';
    h += '<button class="btn-danger" onclick="ctDevolver(\''+osId+'\')"><i class="fas fa-undo mr1"></i>Devolver</button>';
  }
  h += '</div></div>';

  /* — Execução — */
  var stepExec = (CT_STATUS[o.status]||CT_STATUS['SOLICITADA']).step;
  if(stepExec>=2 && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-hard-hat mr1"></i>3 · Execução ('+regs.length+' registro'+(regs.length===1?'':'s')+')</div>';
    regs.forEach(function(r){
      var med = r.medicoes||{};
      var medTxt = [];
      if(med.temp_insuflamento) medTxt.push('Insufl.: '+med.temp_insuflamento+'°C');
      if(med.temp_retorno) medTxt.push('Retorno: '+med.temp_retorno+'°C');
      if(med.corrente) medTxt.push('Corrente: '+med.corrente+'A');
      if(med.pressao) medTxt.push('Pressão: '+med.pressao+' psi');
      var fotos = (r.fotos||[]).map(function(p){
        var u = supa.storage.from('os-fotos').getPublicUrl(p).data.publicUrl;
        return '<a href="'+u+'" target="_blank"><img src="'+u+'" loading="lazy"/></a>';
      }).join('');
      h += '<div class="exec-reg"><div class="le-hdr"><span class="le-date">'+fmtDate(r.data)+'</span>' +
        (r.executor?'<span class="le-tec"><i class="fas fa-user mr1"></i>'+esc(r.executor)+'</span>':'')+'</div>' +
        (r.descricao?'<div class="le-desc">'+esc(r.descricao)+'</div>':'') +
        (medTxt.length?'<div class="le-chk"><i class="fas fa-thermometer-half mr1"></i>'+medTxt.join(' · ')+'</div>':'') +
        (fotos?'<div class="foto-grid">'+fotos+'</div>':'') +
        '</div>';
    });
    var podeExec = !ro && ctCan('executar');
    if(podeExec && o.status==='EM_EXECUCAO'){
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<label class="fgl">Descrição do serviço executado</label>' +
        '<textarea class="fgt" id="ex-desc" placeholder="O que foi feito, peças aplicadas…"></textarea>' +
        '<div class="fg2" style="margin-top:8px">' +
        '<div><label class="fgl">Insufl. (°C)</label><input class="fgi" id="ex-ti" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Retorno (°C)</label><input class="fgi" id="ex-tr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Corrente (A)</label><input class="fgi" id="ex-corr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Pressão (psi)</label><input class="fgi" id="ex-press" type="number" step="1"/></div></div>' +
        '<label class="fgl" style="margin-top:8px">Fotos</label>' +
        '<input class="fgi" id="ex-fotos" type="file" accept="image/*" capture="environment" multiple/>' +
        '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="ctAddExec(\''+osId+'\')"><i class="fas fa-camera mr1"></i>Registrar execução</button></div>';
    }
    h += '<div class="ct-btn-row">';
    if(podeExec && o.status==='APROVADA')
      h += '<button class="btn-primary" onclick="ctMudarStatus(\''+osId+'\',\'EM_EXECUCAO\')"><i class="fas fa-play mr1"></i>Iniciar execução</button>';
    if(podeExec && o.status==='EM_EXECUCAO' && regs.length)
      h += '<button class="btn-success" onclick="ctMudarStatus(\''+osId+'\',\'EXECUTADA\')"><i class="fas fa-flag-checkered mr1"></i>Concluir execução</button>';
    h += '</div></div>';
  }

  /* — Fiscalização — */
  if(((CT_STATUS[o.status]||{}).step>=4) && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-user-shield mr1"></i>4 · Fiscalização</div>';
    if(o.fiscal){
      h += '<div style="font-size:12px;color:#168821"><i class="fas fa-check-circle mr1"></i>Aprovada por '+esc(o.fiscal)+' em '+fmtDate(o.data_fiscalizacao)+'</div>' +
        (o.parecer_fiscal?'<div class="le-desc" style="margin-top:4px">'+esc(o.parecer_fiscal)+'</div>':'');
    } else if(!ro && o.status==='EXECUTADA' && ctCan('fiscalizar')){
      h += '<label class="fgl">Parecer do fiscal</label>' +
        '<textarea class="fgt" id="fis-parecer" placeholder="Serviços conferidos conforme orçamento aprovado…"></textarea>' +
        '<div class="ct-btn-row">' +
        '<button class="btn-success" onclick="ctFiscalizar(\''+osId+'\',true)"><i class="fas fa-check mr1"></i>Aprovar execução</button>' +
        '<button class="btn-danger" onclick="ctFiscalizar(\''+osId+'\',false)"><i class="fas fa-undo mr1"></i>Devolver</button></div>';
    } else {
      h += '<div style="font-size:12px;color:#999">Aguardando conclusão da execução.</div>';
    }
    h += '</div>';
  }

  /* — Certificação / NF + composição da ata — */
  if(((CT_STATUS[o.status]||{}).step>=5) && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-file-invoice mr1"></i>5 · NF · Composição da Ata · Certificação</div>';
    /* composição */
    var compTotal = ctCompTotal(osId);
    if(comps.length){
      h += comps.map(function(c){
        var it = ctArp.find(function(a){return a.item===c.item_arp;})||{descricao:'',valor_unit:0};
        return '<div class="orc-item"><span class="orc-tipo SERVICO">ATA</span>' +
          '<div class="orc-desc">Item '+c.item_arp+' — '+esc(it.descricao)+'<div style="color:#999;font-size:10px">'+c.qtd+' × '+fmtMoney(it.valor_unit)+'</div></div>' +
          '<span class="orc-val">'+fmtMoney(c.qtd*it.valor_unit)+'</span>' +
          (!ro && o.status==='FISCALIZADA' && ctCan('certificar')?'<button class="orc-del" onclick="ctDelComp(\''+osId+'\',\''+c.id+'\')"><i class="fas fa-trash"></i></button>':'') +
          '</div>';
      }).join('');
      var dif = (o.valor_orcado||total) - compTotal;
      h += '<div class="ct-total-row"><span>COMPOSTO (ATA)</span><span>'+fmtMoney(compTotal)+'</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:'+(Math.abs(dif)<1?'#168821':'#E52207')+';margin-top:2px">' +
        '<span>Diferença vs orçado</span><span>'+fmtMoney(dif)+'</span></div>';
    }
    if(!ro && o.status==='FISCALIZADA' && ctCan('certificar')){
      var arpOpts = ctArp.map(function(it){
        var saldo = ctSaldoItem(it);
        return '<option value="'+it.item+'" '+(saldo<=0?'disabled':'')+'>'+it.item+' · '+(it.ne==='2026NE000335'?'WINS':'RLP')+' · '+fmtMoney(it.valor_unit)+' · saldo '+saldo+'</option>';
      }).join('');
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<label class="fgl">Item da ata</label><select class="fgs" id="cp-item">'+arpOpts+'</select>' +

  /* — Histórico / auditoria — */
  var evts = ctEvt[osId]||[];

      evts.map(function(ev){

        var tx = ev.evento==='MUDANÇA DE STATUS'
          ? ((CT_STATUS[ev.de_status]||{label:ev.de_status||'—'}).label+' → '+(CT_STATUS[ev.para_status]||{label:ev.para_status||'—'}).label)

          (ev.usuario?'<div style="color:#888">'+esc(ev.usuario)+(ev.role?' ('+esc(ev.role)+')':'')+'</div>':'')+'</div></div>';

    foot += '<button class="btn-danger" style="flex:1" onclick="ctCancelar(\''+osId+'\')"><i class="fas fa-ban mr1"></i>Cancelar OS</button>';

/* ══ AÇÕES ══ */
async function ctUpd(osId, patch, msg){
  var r = await supa.from('os_contratacao').update(patch).eq('id',osId).select().single();
  if(r.error){ showToast('Erro ao atualizar','error'); return false; }
  var i = ctOS.findIndex(function(o){return o.id===osId;});
  if(i>=0) ctOS[i]=r.data;
  if(msg) showToast(msg,'ok');
  return true;
}

async function ctMudarStatus(osId, novo){
  var patch = {status:novo};
  if(novo==='ORCAMENTO'){ patch.valor_orcado = ctOrcTotal(osId); patch.parecer_aprovacao = null; }
  if(await ctUpd(osId, patch, 'Status: '+(CT_STATUS[novo]||{}).label)){ ctOpenOS(osId); ctRenderList(); }
}

async function ctAprovar(osId){
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'APROVADA',aprovador:nome,data_aprovacao:today(),valor_orcado:ctOrcTotal(osId)},'Orçamento aprovado')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctDevolver(osId){
  var motivo = prompt('Motivo da devolução do orçamento:');
  if(motivo===null) return;
  if(await ctUpd(osId,{status:'SOLICITADA',parecer_aprovacao:motivo},'Devolvida p/ ajuste')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctFiscalizar(osId, aprovado){
  var parecer = val('fis-parecer').trim();
  var nome = ctUser?ctUser.nome:'';
  if(aprovado){
    if(await ctUpd(osId,{status:'FISCALIZADA',fiscal:nome,data_fiscalizacao:today(),parecer_fiscal:parecer},'Execução aprovada pelo fiscal')){ ctOpenOS(osId); ctRenderList(); }
  } else {
    if(!parecer){ showToast('Informe o motivo no parecer','error'); return; }
    if(await ctUpd(osId,{status:'EM_EXECUCAO',parecer_fiscal:parecer},'Devolvida p/ correção')){ ctOpenOS(osId); ctRenderList(); }
  }
}

async function ctCertificar(osId){
  var nf = val('cf-nf').trim();
  if(!nf){ showToast('Informe o nº da NF','error'); return; }
  var comps = ctComp[osId]||[];
  if(!comps.length){ showToast('Adicione a composição de itens da ata','error'); return; }
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'ENCERRADA',nf:nf,data_nf:val('cf-datanf')||today(),certificador:nome,data_certificacao:today()},'OS certificada e encerrada')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctCancelar(osId){
  if(!confirm('Cancelar esta OS?')) return;
  if(await ctUpd(osId,{status:'CANCELADA'},'OS cancelada')){ closeDrawer(); ctRenderList(); }
}

/* — orçamento itens — */
async function ctAddOrcItem(osId){
  var desc = val('oi-desc').trim();
  var qtd = parseFloat(val('oi-qtd'))||0;
  var vu = parseFloat(val('oi-vu'))||0;
  if(!desc || qtd<=0 || vu<0){ showToast('Preencha descrição, qtd e valor','error'); return; }
  var r = await supa.from('os_orcamento_itens').insert({
    os_id:osId, tipo:val('oi-tipo'), descricao:desc, qtd:qtd, valor_unit:vu,
    ordem:(ctOrc[osId]||[]).length
  }).select().single();
  if(r.error){ showToast('Erro ao adicionar item','error'); return; }
  (ctOrc[osId]=ctOrc[osId]||[]).push(r.data);
  ctOpenOS(osId);
}

async function ctDelOrcItem(osId, itemId){
  var r = await supa.from('os_orcamento_itens').delete().eq('id',itemId);
  if(r.error){ showToast('Erro ao remover','error'); return; }
  ctOrc[osId] = (ctOrc[osId]||[]).filter(function(i){return i.id!==itemId;});
  ctOpenOS(osId);
}

/* — execução: fotos comprimidas + upload — */
function ctCompressFoto(file){
  return new Promise(function(res, rej){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1280;
      var w = img.width, hh = img.height;
      if(w>max||hh>max){ var k=Math.min(max/w,max/hh); w=Math.round(w*k); hh=Math.round(hh*k); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/jpeg',0.8);
    };
    img.onerror = rej;
    img.src = url;
  });
}

async function ctAddExec(osId){
  var desc = val('ex-desc').trim();
  var files = (el('ex-fotos')||{files:[]}).files;
  if(!desc && !files.length){ showToast('Descreva o serviço ou anexe fotos','error'); return; }
  showToast('Enviando registro…','');
  var paths = [];
  for(var i=0;i<files.length;i++){
    try{
      var blob = await ctCompressFoto(files[i]);
      var path = osId+'/'+Date.now()+'_'+i+'.jpg';
      var up = await supa.storage.from('os-fotos').upload(path, blob, {contentType:'image/jpeg'});
      if(up.error) throw up.error;
      paths.push(path);
    }catch(e){ console.error('foto',e); showToast('Falha no upload de uma foto','error'); }
  }
  var med = {};
  if(val('ex-ti')) med.temp_insuflamento = parseFloat(val('ex-ti'));
  if(val('ex-tr')) med.temp_retorno = parseFloat(val('ex-tr'));
  if(val('ex-corr')) med.corrente = parseFloat(val('ex-corr'));
  if(val('ex-press')) med.pressao = parseFloat(val('ex-press'));
  var nome = ctUser?ctUser.nome:'';
  var r = await supa.from('os_execucao').insert({
    os_id:osId, data:today(), executor:nome, descricao:desc, medicoes:med, fotos:paths
  }).select().single();
  if(r.error){ showToast('Erro ao registrar execução','error'); return; }
  (ctExec[osId]=ctExec[osId]||[]).push(r.data);
  showToast('Execução registrada','ok');
  ctOpenOS(osId);
}

/* — composição da ata — */
async function ctAddComp(osId){
  var item = parseInt(val('cp-item'));
  var qtd = parseFloat(val('cp-qtd'))||0;
  if(!item || qtd<=0){ showToast('Selecione item e quantidade','error'); return; }
  var it = ctArp.find(function(a){return a.item===item;});
  if(!it){ showToast('Item inválido','error'); return; }
  var saldo = ctSaldoItem(it);
  if(qtd>saldo){ showToast('Excede o saldo do item ('+saldo+')','error'); return; }
  // teto financeiro da NE (empenho global)
  var dispNE = ctSaldoNE(it.ne);
  if(qtd*Number(it.valor_unit) > dispNE + 0.005){
    showToast('Excede o teto da NE — disponível '+fmtMoney(dispNE),'error'); return;
  }
  var r = await supa.from('os_composicao').insert({os_id:osId,item_arp:item,qtd:qtd}).select().single();
  if(r.error){ showToast('Erro ao adicionar','error'); return; }
  (ctComp[osId]=ctComp[osId]||[]).push(r.data);
  ctOpenOS(osId);
}

async function ctDelComp(osId, compId){
  var r = await supa.from('os_composicao').delete().eq('id',compId);
  if(r.error){ showToast('Erro ao remover','error'); return; }
  ctComp[osId] = (ctComp[osId]||[]).filter(function(c){return c.id!==compId;});
  ctOpenOS(osId);
}

<script>
/* paleta categórica (validada dataviz: CVD-safe sobre superfície clara) */
var DV_CAT = {'SPLIT':'#1351B4','PISO/TETO':'#E65100','SELF CONTAINED':'#7B1FA2','JANELA':'#00897B'};
var DV_SEQ = ['#B8CBEA','#5E85CB','#1351B4'];        /* NOVA→SEMI→VELHA (um matiz, claro→escuro) */

function dvFmt(n,dec){ return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }

function dvPotenciaW(e){
  var v=e.tensao||220, i=e.correnteNominal||0;
  return v===380 ? Math.round(1.732*v*i) : Math.round(v*i);
}

function dvDonut(segs, centerTop, centerBot){
  var total = segs.reduce(function(s,x){return s+x.value;},0)||1;
  var R=40, C=2*Math.PI*R, off=C*0.25, gap=2;
  var h='<svg viewBox="0 0 100 100" width="112" height="112" style="flex-shrink:0">';
  segs.forEach(function(s){
    var frac=s.value/total, len=Math.max(0,frac*C-gap);
    h+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="13" stroke-linecap="butt" '+
       'stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+off+'"><title>'+s.label+': '+dvFmt(s.value)+'</title></circle>';
    off-=frac*C;
  });
  h+='<text x="50" y="48" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#1B1B1B">'+centerTop+'</text>' +
     '<text x="50" y="61" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:#999">'+centerBot+'</text></svg>';
  return h;
}

function dvGetTarifa(){
  var t = parseFloat(localStorage.getItem('pmoc_tarifa_kwh'));
  return (t>0&&t<20)?t:0.85;
}
function dvSetTarifa(v){
  var t=parseFloat(String(v).replace(',','.'))||0.85;
  try{ localStorage.setItem('pmoc_tarifa_kwh',t); }catch(e){}
  renderDash();
}

function dvRenderCharts(){
  var host = el('dash-charts');
  if(!host){
    host = document.createElement('div');
    host.id = 'dash-charts';
    var kpi = el('kpi-area');
    kpi.insertAdjacentElement('afterend', host);
  }
  var ativos = DATA.filter(function(e){ return e.tipo!=='RETIRADO'; });
  var oks = ativos.filter(function(e){ return e.funciona==='OK'; });

  /* ── capacidade térmica ── */
  var btuTotal = ativos.reduce(function(s,e){return s+(e.btu||0);},0);
  var btuOk = oks.reduce(function(s,e){return s+(e.btu||0);},0);
  var tr = btuTotal/12000, kwTerm = btuTotal/3412;
  var tipos = ['SPLIT','PISO/TETO','SELF CONTAINED','JANELA'];
  var segTipo = tipos.map(function(t){
    var lst = ativos.filter(function(e){return e.tipo===t;});
    return {label:t, color:DV_CAT[t], value:lst.reduce(function(s,e){return s+(e.btu||0);},0), n:lst.length};
  }).filter(function(s){return s.value>0;});
  var htmlCap =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-snowflake"></i>Capacidade Térmica Instalada</div>' +
    '<div class="hero-num">'+dvFmt(tr,1)+' TR</div>' +
    '<div class="hero-sub">'+dvFmt(btuTotal)+' BTU/h · '+dvFmt(kwTerm)+' kW térmicos · '+dvFmt(btuOk/btuTotal*100)+'% operacional</div>' +
    '<div class="donut-wrap">'+dvDonut(segTipo, dvFmt(tr,0)+' TR', ativos.length+' equip.')+
    '<div class="donut-legend">'+segTipo.map(function(s){
      return '<div class="dl-row"><span class="dl-dot" style="background:'+s.color+'"></span>' +
        '<span class="dl-name">'+s.label+' ('+s.n+')</span>' +
        '<span class="dl-val">'+dvFmt(s.value/1000)+'K</span>' +
        '<span class="dl-pct">'+dvFmt(s.value/btuTotal*100)+'%</span></div>';
    }).join('')+'</div></div></div>';

  /* ── energia elétrica ── */
  var FATOR_CICLO = 0.7;
  var potW = oks.reduce(function(s,e){return s+dvPotenciaW(e);},0);
  var kwhMes = oks.reduce(function(s,e){
    return s + dvPotenciaW(e)/1000*(e.horasDia||0)*(e.diasSemana||0)*4.345*FATOR_CICLO;
  },0);
  var tarifa = dvGetTarifa();
  var custoMes = kwhMes*tarifa;
  var areas = ['AZUL','VERMELHA'];
  var kwhArea = areas.map(function(a){
    return {label:'Área '+a, value: oks.filter(function(e){return e.area===a;})
      .reduce(function(s,e){return s+dvPotenciaW(e)/1000*(e.horasDia||0)*(e.diasSemana||0)*4.345*FATOR_CICLO;},0)};
  });
  var maxA = Math.max.apply(null, kwhArea.map(function(x){return x.value;}))||1;
  var htmlEn =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-bolt"></i>Energia Elétrica — Estimativa</div>' +
    '<div class="stat-grid" style="margin-top:0">' +
    '<div class="stat-mini"><div class="v">'+dvFmt(potW/1000,1)+' kW</div><div class="l">Potência instalada (OK)</div></div>' +
    '<div class="stat-mini"><div class="v">'+dvFmt(kwhMes)+'</div><div class="l">kWh / mês estimado</div></div></div>' +
    '<div style="margin-top:8px">'+kwhArea.map(function(x){
      return '<div class="hbar-row"><span class="hbar-label">'+x.label+'</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+(x.value/maxA*100)+'%;background:'+(x.label.indexOf('AZUL')>=0?'#1351B4':'#E52207')+'" title="'+dvFmt(x.value)+' kWh/mês"></div></div>' +
        '<span class="hbar-val">'+dvFmt(x.value)+' kWh</span></div>';
    }).join('')+'</div>' +
    '<div class="tarifa-row"><span style="font-size:11px;color:#666;font-weight:600;flex:1">Tarifa (R$/kWh)</span>' +
    '<input type="number" step="0.01" min="0" value="'+tarifa.toFixed(2)+'" onchange="dvSetTarifa(this.value)"/>' +
    '<span style="font-size:15px;font-weight:800;color:#1351B4">'+('R$ '+dvFmt(custoMes,2))+'/mês</span></div>' +
    '<div class="chart-note">Estimativa: corrente nominal de placa × tensão (380 V trifásico ×√3), horas de uso semanais cadastradas e fator de ciclo do compressor de 70%. Considera apenas máquinas operacionais (OK). O consumo real varia com carga térmica e regulagem.</div></div>';

  /* ── BTU por prédio (top 8) ── */
  var byPredio = {};
  ativos.forEach(function(e){ byPredio[e.predio]=(byPredio[e.predio]||0)+(e.btu||0); });
  var predios = Object.keys(byPredio).map(function(p){return {label:p,value:byPredio[p]};})
    .sort(function(a,b){return b.value-a.value;});
  var top = predios.slice(0,8);
  var resto = predios.slice(8).reduce(function(s,x){return s+x.value;},0);
  if(resto>0) top.push({label:'Outros ('+(predios.length-8)+')',value:resto,outro:true});
  var maxP = top[0]?top[0].value:1;
  var htmlPred =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-building"></i>Capacidade por Prédio (BTU/h)</div>' +
    top.map(function(x){
      return '<div class="hbar-row"><span class="hbar-label">'+esc(x.label)+'</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+(x.value/maxP*100)+'%;background:'+(x.outro?'#B8CBEA':'#1351B4')+'" title="'+dvFmt(x.value)+' BTU/h"></div></div>' +
        '<span class="hbar-val">'+dvFmt(x.value/1000)+'K</span></div>';
    }).join('')+'</div>';

  /* ── estado da frota ── */
  var nOK = oks.length, nNOK = ativos.filter(function(e){return e.funciona==='NOK';}).length;
  var idades = ['NOVA','SEMI','VELHA'].map(function(st,i){
    return {label:st, value:ativos.filter(function(e){return e.estado===st;}).length, color:DV_SEQ[i]};
  });
  var nIdade = idades.reduce(function(s,x){return s+x.value;},0)||1;
  var htmlFrota =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-heartbeat"></i>Estado da Frota</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:2px">' +
    '<span style="color:#168821"><i class="fas fa-check-circle"></i> OK '+nOK+' ('+dvFmt(nOK/(nOK+nNOK||1)*100)+'%)</span>' +
    '<span style="color:#E52207">NOK '+nNOK+' <i class="fas fa-times-circle"></i></span></div>' +
    '<div class="seg-bar">' +
    '<div style="width:'+(nOK/(nOK+nNOK||1)*100)+'%;background:#168821" title="OK: '+nOK+'"></div>' +
    '<div style="flex:1;background:#E52207" title="NOK: '+nNOK+'"></div></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:#666;margin-top:12px;margin-bottom:2px">' +
    idades.map(function(x){return '<span><span class="dl-dot" style="display:inline-block;background:'+x.color+';vertical-align:-1px"></span> '+x.label+' '+x.value+'</span>';}).join('') + '</div>' +
    '<div class="seg-bar">'+idades.map(function(x){
      return '<div style="width:'+(x.value/nIdade*100)+'%;background:'+x.color+'" title="'+x.label+': '+x.value+'"></div>';
    }).join('')+'</div>' +
    '<div class="chart-note">Idade aparente conforme inventário (NOVA → VELHA).</div></div>';

  /* ── manutenções últimos 12 meses ── */
  var allLogs = [];
  Object.keys(_logCache).forEach(function(id){ (_logCache[id]||[]).forEach(function(x){ allLogs.push(x); }); });
  var months=[], now=new Date();
  for(var m=11;m>=0;m--){
    var d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    months.push({key:d.toISOString().slice(0,7), lbl:['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()], count:0});
  }
  allLogs.forEach(function(x){
    var k=(x.date||'').slice(0,7);
    var mo=months.find(function(mm){return mm.key===k;});
    if(mo) mo.count++;
  });
  var maxM = Math.max.apply(null, months.map(function(x){return x.count;}))||1;
  var tot12 = months.reduce(function(s,x){return s+x.count;},0);
  var semHist = DATA.filter(function(e){ return !e.ultimaManutencao && !getLatestLogDate(e.id); }).length;
  var porTipo = {};
  allLogs.forEach(function(x){ porTipo[x.tipo]=(porTipo[x.tipo]||0)+1; });
  var htmlMnt =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-tools"></i>Manutenções — Últimos 12 Meses</div>' +
    '<div class="stat-grid" style="margin-top:0">' +
    '<div class="stat-mini"><div class="v">'+tot12+'</div><div class="l">registros em 12 meses</div></div>' +
    '<div class="stat-mini"><div class="v" style="color:'+(semHist>0?'#E52207':'#168821')+'">'+semHist+'</div><div class="l">sem histórico</div></div></div>' +
    '<div class="colchart">'+months.map(function(x){
      return '<div class="col-item">'+(x.count?'<span class="col-cnt">'+x.count+'</span>':'')+
        '<div class="col-fill" style="height:'+Math.max(2,x.count/maxM*66)+'px" title="'+x.key+': '+x.count+'"></div>' +
        '<span class="col-lbl">'+x.lbl+'</span></div>';
    }).join('')+'</div>' +
    (Object.keys(porTipo).length?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">'+
      Object.keys(porTipo).sort(function(a,b){return porTipo[b]-porTipo[a];}).map(function(t){
        return '<span class="pill pill-tipo">'+esc(t)+' · '+porTipo[t]+'</span>';
      }).join('')+'</div>':'')+'</div>';

  /* ── contratações / saldo das atas ── */
  var htmlCt = '';
  if(ctLoaded && ctArp.length){
    var nes = Object.keys(CT_NES).map(function(k){ return {ne:k, forn:CT_NES[k].forn, emp:CT_NES[k].valor}; });
    var andamento = ctOS.filter(function(o){return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;}).length;
    var aprovar = ctOS.filter(function(o){return o.status==='ORCAMENTO'||o.status==='EXECUTADA';}).length;
    var encerradas = ctOS.filter(function(o){return o.status==='ENCERRADA';}).length;
    htmlCt = '<div class="chart-card"><div class="chart-title"><i class="fas fa-file-signature"></i>Contratações (ARP) — Saldos</div>' +
      nes.map(function(x){
        var saldo = ctSaldoNE(x.ne);
        var pct = Math.max(0,Math.min(100,saldo/x.emp*100));
        return '<div class="hbar-row"><span class="hbar-label">'+x.forn+' · NE'+x.ne.slice(-3)+'</span>' +
          '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'" title="Saldo: R$ '+dvFmt(saldo,2)+'"></div></div>' +
          '<span class="hbar-val">'+dvFmt(pct)+'%</span></div>';
      }).join('') +
      '<div style="font-size:11px;color:#666;margin-top:2px;font-weight:600">Saldo total: <span style="color:#1351B4;font-weight:800">R$ '+dvFmt(ctSaldoNE('2026NE000335')+ctSaldoNE('2026NE000334'),2)+'</span> de R$ 65.447,86</div>' +
      '<div class="stat-grid"><div class="stat-mini"><div class="v">'+andamento+'</div><div class="l">OS em andamento</div></div>' +
      '<div class="stat-mini"><div class="v" style="color:'+(aprovar>0?'#B46800':'#1B1B1B')+'">'+aprovar+'</div><div class="l">aguardando aprovação</div></div>' +
      '<div class="stat-mini"><div class="v" style="color:#168821">'+encerradas+'</div><div class="l">encerradas</div></div>' +
      '<div class="stat-mini"><div class="v">'+ctOS.length+'</div><div class="l">total de OS</div></div></div></div>';
  }

  host.innerHTML = htmlCap + htmlEn + htmlFrota + htmlMnt + htmlPred + htmlCt;
}

/* integração: roda o dashboard original e acrescenta os gráficos */
var _origRenderDash = renderDash;
renderDash = function(){
  _origRenderDash();
  try{ dvRenderCharts(); }catch(e){ console.error('dashboard charts', e); }
};

/* quando as contratações terminarem de carregar, atualiza o dashboard */
var _origCtLoad = ctLoad;
ctLoad = function(){
  return _origCtLoad().then(function(r){
    try{
      var pg = el('page-dash');
      if(pg && pg.classList.contains('active')) renderDash();
    }catch(e){}
    return r;
  });
};
</script>

function rlPick(i){
  _rlSel = CT_LOGINS[i];
  CT_LOGINS.forEach(function(_,j){
    var b = document.getElementById('rl-'+j);
    if(b) b.className = 'rl-btn'+(j===i?' sel':'');
  });
  var w = document.getElementById('rl-pass-wrap');
  if(w) w.style.display = 'block';
  var n = document.getElementById('rl-sel-nome');
  if(n) n.textContent = _rlSel.label;
  var p = document.getElementById('rl-pass');
  if(p){ p.value=''; p.focus(); }
  var e = document.getElementById('rl-err');
  if(e) e.style.display = 'none';
}

function rlToggleModo(){
  var f = document.getElementById('rl-modo-funcao');
  var m = document.getElementById('rl-modo-email');
  var t = document.getElementById('rl-toggle');
  var emailOn = m.style.display === 'none';
  m.style.display = emailOn ? 'block' : 'none';
  f.style.display = emailOn ? 'none' : 'block';
  t.innerHTML = emailOn ? '<i class="fas fa-th-large mr1"></i>Entrar por função'
                        : '<i class="fas fa-at mr1"></i>Entrar com e-mail (admin)';
}

async function doLoginRole(){
  if(!_rlSel) return;
  var pass = (document.getElementById('rl-pass')||{value:''}).value;
  var btn = document.getElementById('rl-btn-entrar');
  var err = document.getElementById('rl-err');
  if(!pass){ err.textContent='Digite a senha.'; err.style.display='block'; return; }
  btn.textContent = 'Entrando…'; btn.disabled = true; err.style.display = 'none';
  var r = await supa.auth.signInWithPassword({ email:_rlSel.email, password:pass });
  if(r.error){

function qrGetUrl(){
  var saved = '';
  try{ saved = localStorage.getItem('pmoc_app_url')||''; }catch(e){}
  if(saved) return saved;
  if(location.protocol==='http:'||location.protocol==='https:') return location.href.split('#')[0];
  return CT_APP_URL;
}
function qrSetUrl(v){
  try{ localStorage.setItem('pmoc_app_url', (v||'').trim()); }catch(e){}
  qrRender();
}
function qrRender(){
  var wrap = document.getElementById('qr-svg-wrap');
  if(!wrap) return;
  var url = qrGetUrl();
  if(!url){
    wrap.innerHTML = '<div style="padding:26px 12px;color:#999;font-size:12px;line-height:1.5"><i class="fas fa-link" style="font-size:22px;display:block;margin-bottom:8px;color:#DDD"></i>Informe abaixo o endereço (URL) onde o app está hospedado para gerar o QR.</div>';
    return;
  }
  // QR oficial (com logo central) quando aponta para o endereço padrão do app
  if(url.replace(/\/$/,'') === CT_APP_URL || url.indexOf(CT_APP_URL) === 0){
    wrap.innerHTML = '<img src="'+CT_QR_BRAND+'" style="width:100%;max-width:250px" alt="QR"/>';
    return;
  }
  try{
    var q = qrcode(0,'M');
    q.addData(url);
    q.make();
    wrap.innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true});
  }catch(e){
    wrap.innerHTML = '<div style="padding:20px;color:#E52207;font-size:12px">URL longa demais para o QR.</div>';
  }
}
function qrOpen(){
  var pop = document.createElement('div');
  pop.id = 'qr-pop';
  pop.onclick = function(ev){ if(ev.target===pop) qrClose(); };
  pop.innerHTML = '<div id="qr-card">' +
    '<img src="'+CT_LOGO_URI+'" style="width:44px;height:44px;margin-bottom:8px" alt=""/>' +
    '<div style="font-size:15px;font-weight:800;color:#071D41;margin-bottom:2px">Acesse pelo celular</div>' +
    '<div style="font-size:11px;color:#888;margin-bottom:12px">Aponte a câmera para o código</div>' +
    '<div id="qr-svg-wrap"></div>' +
    '<input id="qr-url" placeholder="https://…" value="'+esc(qrGetUrl())+'" onchange="qrSetUrl(this.value)"' +
    ' style="width:100%;margin-top:12px;padding:9px 10px;border:1.5px solid #E0E0E0;border-radius:9px;font-size:11px;color:#666;text-align:center;outline:none"/>' +
    '<button onclick="qrClose()" style="width:100%;margin-top:12px;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer">Fechar</button>' +
    '</div>';
  document.body.appendChild(pop);
  qrRender();
}
function qrClose(){
  var p = document.getElementById('qr-pop');
  if(p) p.remove();
}

var _v4RenderLogin = renderLoginMobile;
renderLoginMobile = function(){
  _v4RenderLogin();

    var b = document.createElement('button');
    b.id = 'qr-mini';
    b.title = 'QR code de acesso';
    b.innerHTML = '<i class="fas fa-qrcode"></i>';
    b.onclick = qrOpen;
    lm.firstChild.style.position = 'relative';
    lm.firstChild.appendChild(b);
  }
};

function ctPrintOS(osId){

  var e = ctEquip(o.equip_id);

  var h = '<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"/><title>'+esc(o.numero)+'</title><style>' +

    'h1{font-size:14pt;color:#071D41;margin:0}h2{font-size:10pt;color:#1351B4;border-bottom:1.5px solid #1351B4;padding-bottom:2px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}' +
    'table{width:100%;border-collapse:collapse;font-size:9pt}td,th{padding:4px 6px;border:1px solid #CCC;vertical-align:top;text-align:left}' +
    'th{background:#E8ECF5;color:#071D41}td.l{width:130px;font-weight:700;background:#F8F9FA}' +
    '.num{text-align:right;white-space:nowrap}.tot td{font-weight:800;background:#F0F2F5}' +
    '.hdr{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #071D41;padding-bottom:8px}' +
    '.fotos{display:flex;gap:5mm;flex-wrap:wrap;margin:3mm 0}.fotos img{max-height:42mm;max-width:60mm;border:1px solid #CCC}' +
    '.ass{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:14mm}.ass div{border-top:1px solid #000;padding-top:2mm;text-align:center;font-size:8pt}' +
    '.meta{font-size:8pt;color:#888}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}' +
    '@page{size:A4;margin:12mm}</style></head><body>' +
    '<div class="hdr"><img src="'+CT_LOGO_URI+'" style="width:52px;height:52px"/>' +
    '<div style="flex:1"><h1>ORDEM DE SERVIÇO — '+esc(o.numero)+'</h1>' +
    '<div class="meta">CMASM · Divisão de Manutenção Especializada · UASG 744030 · ARP Nº 04/2024 (PE 90026/2024 — CMRJ) · Processo 63099.002208/2025-06</div></div>' +
    '<div style="text-align:right;font-size:9pt"><strong>'+esc(st)+'</strong><br/><span class="meta">'+(o.ne?esc(o.ne):'')+'</span></div></div>' +
    '<h2>1. Identificação</h2><table>' +
    row2('Equipamento', '#'+o.equip_id+' — '+esc(e.predio)+' / '+esc(e.local)+' ('+esc(e.tipo)+(e.btu?', '+(e.btu/1000).toFixed(0)+'K BTU':'')+')') +
    row2('Empresa', esc(o.empresa||'')+' · '+esc(o.ne||'')) +
    row2('Solicitante', esc(o.solicitante||'')+' em '+fmtDate(o.data_solicitacao)) +
    row2('Problema / serviço', esc(o.problema||'')) + '</table>';
  if(itens.length){
    h += '<h2>2. Orçamento aprovado</h2><table><tr><th>Tipo</th><th>Descrição</th><th class="num">Qtd</th><th class="num">Vlr Unit.</th><th class="num">Total</th></tr>' +
      itens.map(function(i){ return '<tr><td>'+(i.tipo==='SERVICO'?'Serviço':'Material')+'</td><td>'+esc(i.descricao)+'</td>' +
        '<td class="num">'+i.qtd+'</td><td class="num">'+fmtMoney(i.valor_unit)+'</td><td class="num">'+fmtMoney(i.qtd*i.valor_unit)+'</td></tr>'; }).join('') +
      '<tr class="tot"><td colspan="4">TOTAL ORÇADO</td><td class="num">'+fmtMoney(o.valor_orcado||total)+'</td></tr></table>' +
      (o.aprovador?'<div class="meta" style="margin-top:2mm">Aprovado por '+esc(o.aprovador)+' em '+fmtDate(o.data_aprovacao)+'.</div>':'');
  }
  if(regs.length){
    h += '<h2>3. Execução</h2>';
    regs.forEach(function(r){
      var med = r.medicoes||{}, mt=[];
      if(med.temp_insuflamento!=null) mt.push('Insuflamento: '+med.temp_insuflamento+'°C');
      if(med.temp_retorno!=null) mt.push('Retorno: '+med.temp_retorno+'°C');
      if(med.corrente!=null) mt.push('Corrente: '+med.corrente+' A');
      if(med.pressao!=null) mt.push('Pressão: '+med.pressao+' psi');
      h += '<table style="margin-bottom:3mm">'+row2('Data / Executor', fmtDate(r.data)+' · '+esc(r.executor||''))+
        row2('Serviços', esc(r.descricao||''))+(mt.length?row2('Medições', mt.join(' · ')):'')+'</table>';
      var fs = (r.fotos||[]).map(function(p){
        var u = supa.storage.from('os-fotos').getPublicUrl(p).data.publicUrl;
        return '<img src="'+u+'"/>';
      }).join('');
      if(fs) h += '<div class="fotos">'+fs+'</div>';
    });
  }
  h += '<h2>4. Fiscalização</h2><table>'+row2('Fiscal', esc(o.fiscal||'—')+(o.data_fiscalizacao?' em '+fmtDate(o.data_fiscalizacao):''))+

      }).join('') +
      '<tr class="tot"><td colspan="4">TOTAL COMPOSTO</td><td class="num">'+fmtMoney(compTotal)+'</td></tr></table>' +
      '<div class="meta" style="margin-top:2mm">Diferença vs orçado: '+fmtMoney((o.valor_orcado||total)-compTotal)+'. Em atendimento ao art. 86 da Lei 14.133/2021 — pagamento composto por itens registrados na ARP; orçamento aprovado anexo.</div>';
  }
  h += '<h2>'+(comps.length?'6':'5')+'. Certificação</h2><table>'+row2('Nota Fiscal', esc(o.nf||'—')+(o.data_nf?' de '+fmtDate(o.data_nf):''))+
    row2('Certificador', esc(o.certificador||'—')+(o.data_certificacao?' em '+fmtDate(o.data_certificacao):''))+'</table>';
  if(evts.length){
    h += '<h2>'+(comps.length?'7':'6')+'. Histórico (auditoria)</h2><table><tr><th>Data/Hora</th><th>Evento</th><th>De → Para</th><th>Usuário</th></tr>' +
      evts.map(function(ev){
        return '<tr><td>'+(ev.criado_em?new Date(ev.criado_em).toLocaleString('pt-BR'):'')+'</td><td>'+esc(ev.evento)+'</td>' +
          '<td>'+(ev.de_status?esc(ev.de_status)+' → ':'')+esc(ev.para_status||ev.detalhes||'')+'</td>' +
          '<td>'+esc(ev.usuario||'')+(ev.role?' ('+esc(ev.role)+')':'')+'</td></tr>';
      }).join('')+'</table>';
  }
  h += '<div class="ass"><div>Solicitante<br/>'+esc(o.solicitante||'')+'</div><div>Gestor Administrativo<br/>'+esc(o.aprovador||'')+'</div>' +
    '<div>Fiscal<br/>'+esc(o.fiscal||'')+'</div><div>Certificador<br/>'+esc(o.certificador||'')+'</div></div>' +
    '<div class="meta" style="margin-top:8mm;border-top:1px solid #CCC;padding-top:2mm">Documento gerado pelo PMOC.Refrigeração · CMASM/DME em '+new Date().toLocaleString('pt-BR')+'</div>' +
    '</body></html>';
  var w = window.open('','_blank','width=900,height=700');
  if(!w){ showToast('Permita pop-ups para imprimir','error'); return; }
  w.document.write(h);
  w.document.close();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 700);
}
</script>
