/* Marca de ordem de byte escrita como sequência de escape (nunca colada
   literal — colada, é invisível no editor e a próxima pessoa a mexer no
   arquivo a apaga sem ver). URL.revokeObjectURL no fim: maquinas/app.js
   nunca revoga (vazamento de objeto por download); aqui não se repete. */
function baixarPlanilha(texto, nome){
  var blob = new Blob(['\uFEFF' + texto], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Guardada no idioma de _aoCriarEquipCallback — uma global só, lida por
   renderConferenciaPlanilha e aplicarPlanoPlanilha. */
var PLANO_PLANILHA = null;

/* D-5hy-05: guarda dupla na AÇÃO (somenteLeitura + podeEditarCadastro), não
   só no botão. input.value='' no fim para que escolher o MESMO arquivo de
   novo volte a disparar onchange. */
function aoEscolherArquivoPlanilha(input){
  if (somenteLeitura()){ showToast('Modo somente leitura', ''); input.value=''; return; }
  if (!podeEditarCadastro()){ showToast('Sem permissão para importar cadastro','error'); input.value=''; return; }
  var file = input.files && input.files[0];
  if (!file){ return; }
  var reader = new FileReader();
  reader.onerror = function(){ showToast('Erro ao ler o arquivo','error'); };
  reader.onload = function(){
    PLANO_PLANILHA = planoDeImportacao(String(reader.result || ''), DATA);
    renderConferenciaPlanilha(PLANO_PLANILHA);
  };
  reader.readAsText(file, 'utf-8');
  input.value = '';
}

function planilhaFraseItem(item){
  return '#' + item.id + ' · ' + esc(item.predio || '') + ' · ' + esc(item.local || '');
}

/* D-5hy-03: reescreve o corpo da gaveta — nada foi gravado ainda. Ordem de
   leitura deliberada, do mais perigoso ao menos: arquivar primeiro (a
   operação que o usuário não pode descobrir depois), erros, atualizar,
   criar, ignorados — nunca calar nenhum bloco. */
function renderConferenciaPlanilha(plano){
  var htmlArquivar;
  if (plano.bloqueios.length === 0){
    htmlArquivar = plano.arquivar.length
      ? '<ul style="margin:0;padding-left:18px">' + plano.arquivar.map(function(a){ return '<li>' + planilhaFraseItem(a) + '</li>'; }).join('') + '</ul>'
      : '<div style="font-size:12px;color:#666">Nenhum equipamento seria arquivado.</div>';
  } else {
    htmlArquivar =
      '<ul style="margin:0 0 8px;padding-left:18px;color:#B46800;font-size:12px">' +
      plano.bloqueios.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') +
      '</ul>' +
      (plano.candidatosArquivar.length
        ? '<div style="font-size:11px;color:#999;margin-bottom:4px">Arquivamento desligado — lista abaixo é só informativa:</div>' +
          '<ul style="margin:0;padding-left:18px;color:#999">' + plano.candidatosArquivar.map(function(a){ return '<li>' + planilhaFraseItem(a) + '</li>'; }).join('') + '</ul>'
        : '');
  }

  var htmlErros = '';
  if (plano.erros.length){
    htmlErros =
      '<div class="ds"><div class="ds-title" style="color:#E52207"><i class="fas fa-times-circle mr1" aria-hidden="true"></i>Erros (' + plano.erros.length + ')</div>' +
      '<div style="font-size:11px;color:#666;margin-bottom:6px">Um arquivo com linha recusada não arquiva nada (D-5hy-11) — atualizar e criar das linhas boas continuam valendo.</div>' +
      '<table class="tbl"><tr><th>Linha</th><th>Coluna</th><th>Motivo</th></tr>' +
      plano.erros.map(function(e){ return '<tr><td>' + e.linha + '</td><td>' + esc(e.coluna) + '</td><td>' + esc(e.mensagem) + '</td></tr>'; }).join('') +
      '</table></div>';
  }

  var htmlAtualizar =
    '<div class="ds"><div class="ds-title"><i class="fas fa-edit mr1" aria-hidden="true"></i>Atualizar (' + plano.atualizar.length + ')</div>' +
    (plano.atualizar.length
      ? '<ul style="margin:0;padding-left:18px;font-size:12px">' + plano.atualizar.map(function(a){
          return '<li>#' + a.id + ' — ' + a.campos.map(function(c){ return esc(EQUIP_ROTULOS[c] || c); }).join(', ') + '</li>';
        }).join('') + '</ul>'
      : '<div style="font-size:12px;color:#666">Nada a atualizar.</div>') +
    '</div>';

  var htmlCriar =
    '<div class="ds"><div class="ds-title"><i class="fas fa-plus mr1" aria-hidden="true"></i>Criar (' + plano.criar.length + ')</div>' +
    (plano.criar.length
      ? '<ul style="margin:0;padding-left:18px;font-size:12px">' + plano.criar.map(function(c){
          return '<li>linha ' + c.linha + ' — ' + esc(c.patch.predio || '') + ' / ' + esc(c.patch.local || '') + '</li>';
        }).join('') + '</ul>'
      : '<div style="font-size:12px;color:#666">Nada a criar.</div>') +
    '</div>';

  var ignoradosPartes = [];
  if (plano.ignoradas.length) ignoradosPartes.push(plano.ignoradas.length + ' coluna(s) desconhecida(s): ' + plano.ignoradas.map(function(c){ return esc(c); }).join(', '));
  if (plano.leituraIgnorada.length) ignoradosPartes.push(plano.leituraIgnorada.length + ' célula(s) em coluna somente-leitura ignorada(s)'); // D-5hy-07
  var htmlIgnorados =
    '<div class="ds"><div class="ds-title"><i class="fas fa-eye-slash mr1" aria-hidden="true"></i>Ignorados</div>' +
    (ignoradosPartes.length
      ? '<div style="font-size:12px;color:#666">' + ignoradosPartes.join('<br/>') + '</div>'
      : '<div style="font-size:12px;color:#666">Nada ignorado.</div>') +
    '</div>';

  el('dh-id').textContent = 'Conferência da planilha';
  el('dh-local').textContent = '';
  el('dh-predio').textContent = '';
  el('dh-pills').innerHTML = '';
  el('drawer-body').innerHTML =
    '<div class="ds"><div class="ds-title"><i class="fas fa-box mr1" aria-hidden="true"></i>Arquivar (' + plano.arquivar.length + ')</div>' + htmlArquivar + '</div>' +
    htmlErros + htmlAtualizar + htmlCriar + htmlIgnorados;

  var podeAplicar = (plano.atualizar.length + plano.criar.length + plano.arquivar.length) > 0;
  var resumo = plano.atualizar.length + ' atualizar · ' + plano.criar.length + ' criar · ' + plano.arquivar.length + ' arquivar';
  el('drawer-footer').innerHTML =
    '<button class="btn-secondary" onclick="abrirPainelPlanilha()">Cancelar</button>' +
    '<button class="btn-primary"' + (podeAplicar ? '' : ' disabled') + ' onclick="aplicarPlanoPlanilha()"><i class="fas fa-save mr1" aria-hidden="true"></i>Aplicar (' + resumo + ')</button>';
}

/* A ÚNICA porta de gravação da planilha. Reconfere as duas guardas (não só
   na abertura do arquivo). Três blocos, nesta ordem: atualizar (um update
   por linha, payloads diferentes, acumulando falhas sem abortar as demais),
   criar (um único insert — situação não vai no payload, nasce do default do
   banco), arquivar (uma única chamada, FORA de equipParaDb — que
   descartaria a chave, e com razão: a coluna não está em EQUIP_EDITAVEIS —
   e sem nenhum outro campo no payload, D-5hy-02/17). */
async function aplicarPlanoPlanilha(){
  if (somenteLeitura()){ showToast('Modo somente leitura', ''); return; }
  if (!podeEditarCadastro()){ showToast('Sem permissão para importar cadastro','error'); return; }
  var plano = PLANO_PLANILHA;
  if (!plano) return;
  var falhas = 0;

  for (var i = 0; i < plano.atualizar.length; i++){
    var item = plano.atualizar[i];
    var r = await supa.from('equipamentos').update(equipParaDb(item.patch)).eq('id', item.id);
    if (r.error) falhas++;
  }

  if (plano.criar.length){
    var payload = plano.criar.map(function(c){ return equipParaDb(c.patch); });
    var rc = await supa.from('equipamentos').insert(payload);
    if (rc.error) falhas++;
  }

  if (plano.arquivar.length){
    var ids = plano.arquivar.map(function(a){ return a.id; });
    // fora de equipParaDb (descartaria a chave — situacao não está em
    // EQUIP_EDITAVEIS) e sem nenhum outro campo no payload (D-5hy-02/17).
    var ra = await supa.from('equipamentos').update({situacao: SITUACAO_ORDEM[1]}).in('id', ids);
    if (ra.error) falhas++;
  }

  PLANO_PLANILHA = null;
  await loadDataFromSupabase();
  saveData();
  renderDash();
  renderInv();
  closeDrawer();
  showToast(falhas ? (falhas + ' gravação(ões) falharam — confira o inventário') : 'Planilha aplicada', falhas ? 'error' : 'ok');
}

<script>
/* Nota (D-8rz-04): o CSS de computador desta tarefa mora dentro do bloco
   de estilo que já existe logo acima do carregamento de qrcode.js, não num
   bloco novo — um bloco a mais DEPOIS da folha de impressão embutida em
   texto de JavaScript deslocaria a impressão digital do CSS de celular por
   uma quebra de linha (o gate mede blocos de estilo concatenados na ordem
   em que aparecem no arquivo), mesmo sem mudar um pixel do celular. */

/* ═══════════════════════════════════════════════════════════════════════
   VERSÃO DE COMPUTADOR (quick-260822-8rz) — D-8rz-01: todo o layout de
   computador vive dentro de @media (min-width:1024px) em refrigeracao/
   index.html, o mesmo arquivo, sempre congelado e standalone (D-04). Nada
   de dado, fluxo ou regra de negócio muda — é camada de apresentação.

   D-8rz-03: a ideia de um núcleo genérico de ordenação/filtro de tabela já
   usada noutros módulos é REPLICADA aqui, nunca importada — D-04 proíbe
   este módulo de puxar qualquer coisa da pasta comum a outros módulos.
═══════════════════════════════════════════════════════════════════════ */

/* ── tabelas de desktop: núcleo puro ── */
/* Nenhuma API de navegador nesta seção — testável em Node puro, mesmo
   padrão núcleo-puro/aplicador-de-DOM já usado noutros pontos da
   plataforma. */
var BP_DESKTOP = 1024;

function modoDaTela(largura){ return largura>=BP_DESKTOP ? 'tabela' : 'cartao'; }

/* Ciclo travado, uma coluna por vez: sem ordem → crescente → decrescente →
   sem ordem. Qualquer valor que não seja 'asc'/'desc' entra como "sem
   ordem" — mesma queda defensiva do núcleo de ordenação já usado noutros
   módulos. */
function tabProximaOrdem(dir){
  if(dir==='asc') return 'desc';
  if(dir==='desc') return null;
  return 'asc';
}

/* minúsculas + NFD sem diacríticos, tolerando nulo/indefinido/número. */
function tabNormalizar(texto){
  return String(texto===null||texto===undefined?'':texto).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
}

/* Vazio para fins de ordenação: nulo/indefinido/texto vazio/NaN. Zero NÃO
   é vazio — 0 é informação real, não ausência dela. */
function tabVazio(v){
  return v===null || v===undefined || v==='' || (typeof v==='number' && isNaN(v));
}

function _tabColuna(colunas, id){
  for(var i=0;i<(colunas||[]).length;i++){ if(colunas[i].id===id) return colunas[i]; }
  return null;
}

/* Ordena sempre pelo DADO PRINCIPAL (valor()), nunca pelo texto que a
   célula imprime nem pelo que o filtro casa (texto()) — é o que faz
   "Prédio · Área" ordenar pelo prédio, e criticidade ordenar pela ordem
   semântica em vez da alfabética. Vazio sempre no fim, nas duas direções:
   não é "menor", é "não informado". Coluna ausente de `colunas` devolve 0
   — nem ordena, nem quebra. */
function tabComparar(a, b, coluna, dir, colunas){
  var col = _tabColuna(colunas, coluna);
  if(!col) return 0;

  if(col.tipo==='numero'){
    var va = col.valor(a), vb = col.valor(b);
    var vaVazio = tabVazio(va), vbVazio = tabVazio(vb);
    if(vaVazio && vbVazio) return 0;
    if(vaVazio) return 1;
    if(vbVazio) return -1;
    return dir==='desc' ? (vb-va) : (va-vb);
  }

  var ta = col.valor(a), tb = col.valor(b);
  var taVazio = tabVazio(ta), tbVazio = tabVazio(tb);
  if(taVazio && tbVazio) return 0;
  if(taVazio) return 1;
  if(tbVazio) return -1;
  var cmp = String(ta).localeCompare(String(tb), 'pt-BR');
  return dir==='desc' ? -cmp : cmp;
}

/* Filtra por subcadeia normalizada sobre texto() de cada coluna com filtro
   preenchido (conjunção — todos os filtros ativos precisam casar), depois
   ordena. Sem ord.coluna preserva a ordem de entrada. Sem sintaxe de
   comparação — '>'/'<' num campo de filtro são texto como qualquer outro
   caractere. Coluna de filtro ausente de `colunas` é ignorada, não zera a
   lista inteira. */
function tabAplicar(lista, ord, filtros, colunas){
  var filtrosAtivos = [];
  for(var k in (filtros||{})){
    if(Object.prototype.hasOwnProperty.call(filtros||{}, k) && filtros[k]) filtrosAtivos.push([k, filtros[k]]);
  }
  var resultado = filtrosAtivos.length
    ? (lista||[]).filter(function(item){
        return filtrosAtivos.every(function(par){
          var col = _tabColuna(colunas, par[0]);
          if(!col) return true;
          return tabNormalizar(col.texto(item)).indexOf(tabNormalizar(par[1])) >= 0;
        });
      })
    : (lista||[]).slice();

  if(ord && ord.coluna){
    resultado = resultado.slice().sort(function(a,b){ return tabComparar(a,b,ord.coluna,ord.dir,colunas); });
  }
  return resultado;
}

/* ── tabelas de desktop: colunas ── */
/* Cada coluna é {id, rotulo, tipo:'texto'|'numero', valor(x), texto(x),
   celula(x)}. valor() é o DADO PRINCIPAL, usado para ordenar. texto() é o
   que aparece na célula sem celula() E o que o filtro casa — por isso tem
   de conter a palavra que o usuário digitaria. celula() é opcional e
   devolve HTML já escapado (pílula, distintivo); sem celula(), a tabela
   imprime esc(texto(x)). */

/* D-3a6-22: varre getEquipLog(id) pelo maior date entre as entradas de
   tipo 'INSPEÇÃO', sem ordenar o array no lugar — getEquipLog(id) é o
   próprio _logCache[id], e um .sort() aqui reordenaria o cache real
   (mesmo efeito colateral que getLatestLogDate já tem e que este plano

/* Achata o agregado de alertasPmoc numa lista de {motivo, equip, detalhe},
   uma linha por par motivo×equipamento, na ordem das seções de hoje
   (inoperante, restrição, vencida, sem histórico) e, dentro das três
   primeiras, na mesma ordem de criticidade que renderAlerts já aplica —
   sem histórico não é reordenada por criticidade em nenhum dos dois
   lugares, hoje ou aqui. */
function linhasAlertas(ag, agora){
  agora = agora || new Date();
  var ordemCrit = ['CRÍTICA','ALTA','MÉDIA','BAIXA'];
  function porCriticidade(lista){
    return (lista||[]).slice().sort(function(a,b){
      return ordemCrit.indexOf(autoCrit(a)) - ordemCrit.indexOf(autoCrit(b));
    });
  }
  var linhas = [];
  porCriticidade(ag.nok).forEach(function(e){
    linhas.push({motivo:'Inoperante', equip:e, detalhe:e.obs||''});
  });
  porCriticidade(ag.restricao).forEach(function(e){
    linhas.push({motivo:'Com restrições', equip:e, detalhe:e.obs||''});
  });
  porCriticidade(ag.vencidos).forEach(function(e){
    var nx = nextPmoc(e,'inspecao');
    var diff = nx ? Math.round((agora-nx)/86400000) : 0;
    linhas.push({motivo:'PMOC vencida', equip:e, detalhe:'Vencida há '+diff+'d'});
  });
  (ag.semHist||[]).forEach(function(e){
    linhas.push({motivo:'Sem histórico', equip:e, detalhe:'Nenhum registro de manutenção'});
  });
  return linhas;
}

var TELA_LARGA = false;

function aplicarModoDeTela(largura){

/* Descobre a página ativa pela marcação (.page.active, a mesma que navTo()
   já usa) e chama o renderizador dela. A aba de OS despacha sozinha entre
   manutenção/contratações/movimentação via ctMode — chamar renderOS() é
   suficiente e não duplica aquela regra. */
function renderPaginaAtiva(){
  var ativa = document.querySelector('.page.active');
  if(!ativa) return;
  var id = ativa.id || '';
  if(id==='page-dash') renderDash();
  else if(id==='page-inv') renderInv();
  else if(id==='page-os') renderOS();
  else if(id==='page-pmoc') renderPmoc();
  else if(id==='page-alert') renderAlerts();
}

function iniciarModoDeTela(){
  var mq = window.matchMedia('(min-width:'+BP_DESKTOP+'px)');
  aplicarModoDeTela(window.innerWidth);
  function aoMudar(){
    aplicarModoDeTela(window.innerWidth);
    renderPaginaAtiva(); // D-8rz-24: só a página ativa é redesenhada
  }
  if(mq.addEventListener) mq.addEventListener('change', aoMudar);
  else if(mq.addListener) mq.addListener(aoMudar); // fallback ES5 seguro
}

document.addEventListener('DOMContentLoaded', function(){
  iniciarModoDeTela();
});

/* Escape fecha a gaveta nas duas larguras — num celular não há teclado, e
   num painel lateral de computador é o caminho esperado. Dois ramos, nesta
   ordem (D-92t, Task 2): gaveta aberta fecha a gaveta e retorna; senão,
   ficha-página ativa volta à origem. A ordem é o ponto — um formulário
   aberto SOBRE a ficha-página tem que fechar o formulário, nunca navegar
   para longe do que o usuário estava digitando. */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(el('drawer') && el('drawer').classList.contains('open')){ closeDrawer(); return; }
  var pf = el('page-ficha');
  if(pf && pf.classList.contains('active')) voltarDaFicha();
});

/* Resolve, por tabela, o argumento (já pronto para virar texto de

   item. Uma entrada por tabela, mesmo espírito de TAB_ESTADO (D-8rz-16):

var TAB_ARG = {
  inv:     function(e){ return String(e.id); },
  pmoc:    function(e){ return String(e.id); },
  alert:   function(l){ return String(l.equip.id); },
  contrat: function(o){ return "'"+String(o.id).replace(/'/g,"\\'")+"'"; },
  os:      function(o){ return MAN_FLUXO_OK ? ("'"+esc(o.entry.id||'')+"'") : String(o.equipId); },

/* Lembra colunas/itens/aoAbrir do último desenho de cada tabela — é o que
   permite tabAplicarFiltro (disparado a cada tecla) redesenhar só o
   <tbody> sem precisar que o onchange inline carregue a lista inteira. */
var TAB_CACHE = {};

function tabDesenhar(tid, colunas, itens, aoAbrir){
  TAB_CACHE[tid] = {colunas:colunas, itens:itens, aoAbrir:aoAbrir};
  var estado = TAB_ESTADO[tid];
  var visiveis = tabAplicar(itens, estado.ord, estado.filtros, colunas);
  return tabBarra(tid, visiveis.length, itens.length) +
    '<table class="lista-tabela">' +
    tabCabecalho(tid, colunas) +
    '<tbody id="tbody-'+tid+'">' + tabCorpo(tid, colunas, itens, aoAbrir) + '</tbody>' +
    '</table>';
}

function tabCabecalho(tid, colunas){
  var estado = TAB_ESTADO[tid];
  var linhaRotulos = '<tr>' + colunas.map(function(col){
    var ativo = estado.ord.coluna===col.id;
    var dir = ativo ? estado.ord.dir : null;
    var ariaSort = dir==='asc' ? 'ascending' : (dir==='desc' ? 'descending' : 'none');
    var seta = dir==='asc' ? '↑' : (dir==='desc' ? '↓' : '⇅');
    var classeNum = col.tipo==='numero' ? ' class="num"' : '';
    var filtroPreenchido = !!(estado.filtros && estado.filtros[col.id]);
    return '<th'+classeNum+' aria-sort="'+ariaSort+'">' +
      '<button type="button" class="th-acao" onclick="tabOrdenarColuna(\''+tid+'\',\''+col.id+'\')" title="Ordenar por '+esc(col.rotulo)+'" aria-label="Ordenar por '+esc(col.rotulo)+'">'+esc(col.rotulo)+' '+seta+'</button>' +
      '<button type="button" class="th-acao" onclick="tabAlternarFiltros(\''+tid+'\',\''+col.id+'\')" title="Filtrar '+esc(col.rotulo)+'" aria-label="Filtrar '+esc(col.rotulo)+'"'+(filtroPreenchido?' style="color:#1351B4;font-weight:800"':'')+'>⌕</button>' +
      '</th>';
  }).join('') + '</tr>';

  var linhaFiltros = '';
  if(estado.aberto){
    linhaFiltros = '<tr>' + colunas.map(function(col){
      var valor = (estado.filtros && estado.filtros[col.id]) || '';
      return '<th><input type="search" id="tabf-'+tid+'-'+col.id+'" aria-label="Filtrar '+esc(col.rotulo)+'" value="'+esc(valor)+'" oninput="tabAplicarFiltro(\''+tid+'\',\''+col.id+'\',this.value)"/></th>';
    }).join('') + '</tr>';
  }
  return '<thead>'+linhaRotulos+linhaFiltros+'</thead>';
}

function tabCorpo(tid, colunas, itens, aoAbrir){
  var estado = TAB_ESTADO[tid];
  var visiveis = tabAplicar(itens, estado.ord, estado.filtros, colunas);
  var resolverArg = TAB_ARG[tid] || function(){ return ''; };
  return visiveis.map(function(item){
    var onclickLinha = aoAbrir+'('+resolverArg(item)+')';
    var celulas = colunas.map(function(col, idx){
      var classeNum = col.tipo==='numero' ? ' class="num"' : '';
      var conteudo = col.celula ? col.celula(item) : esc(col.texto(item));
      if(idx===0){
        // D-8rz-22: a primeira célula é um <button> de verdade — caminho
        // por teclado sem tabindex fingido — e para o clique dela não
        // disparar duas vezes o onclick da <tr>.
        conteudo = '<button type="button" class="cel-abrir" onclick="event.stopPropagation();'+onclickLinha+'">'+conteudo+'</button>';
      }
      return '<td'+classeNum+'>'+conteudo+'</td>';
    }).join('');
    return '<tr onclick="'+onclickLinha+'">'+celulas+'</tr>';
  }).join('');
}

function tabBarra(tid, visiveis, total){
  var estado = TAB_ESTADO[tid];
  var temOrdem = !!(estado.ord && estado.ord.coluna);
  var temFiltro = Object.keys(estado.filtros||{}).some(function(k){ return estado.filtros[k]; });
  if(!temOrdem && !temFiltro) return '';
  var html = '<div class="tab-barra"><span>'+visiveis+' de '+total+'</span>';
  if(temOrdem) html += '<button type="button" onclick="tabLimparOrdem(\''+tid+'\')">Limpar ordenação</button>';
  if(temFiltro) html += '<button type="button" onclick="tabLimparFiltros(\''+tid+'\')">Limpar filtros</button>';
  html += '</div>';
  return html;
}

/* Chama o renderizador DONO daquela tabela — a contagem de #inv-cnt/
   #os-cnt/#pmoc-cnt e o rótulo continuam saindo de um lugar só. */
function tabRedesenhar(tid){
  if(tid==='inv') renderInv();
  else if(tid==='os') renderOS();
  else if(tid==='movim') renderMovim();
  else if(tid==='pmoc') renderPmoc();
  else if(tid==='alert') renderAlerts();
  else if(tid==='contrat') ctRenderList();
}

function tabOrdenarColuna(tid, coluna){
  var estado = TAB_ESTADO[tid];
  if(estado.ord.coluna!==coluna){
    estado.ord = {coluna:coluna, dir:'asc'};
  } else {
    estado.ord.dir = tabProximaOrdem(estado.ord.dir);
    if(!estado.ord.dir) estado.ord.coluna = null;
  }
  tabRedesenhar(tid);
}

/* Abre/fecha a linha de filtro. Fechar LIMPA os filtros — um filtro
   invisível escondendo linhas é pior que nenhum filtro. */
function tabAlternarFiltros(tid, coluna){
  var estado = TAB_ESTADO[tid];
  if(estado.aberto){
    estado.aberto = false;
    estado.filtros = {};
  } else {
    estado.aberto = true;
  }
  tabRedesenhar(tid);
  if(estado.aberto){
    var campo = document.getElementById('tabf-'+tid+'-'+coluna);
    if(campo) campo.focus();
  }
}

/* D-8rz-15: grava e redesenha SÓ o corpo — redesenhar o cabeçalho a cada
   tecla mataria o foco e o cursor do campo de filtro. */
function tabAplicarFiltro(tid, coluna, valor){
  TAB_ESTADO[tid].filtros[coluna] = valor;
  var cache = TAB_CACHE[tid];
  if(!cache) return;
  var tbody = document.getElementById('tbody-'+tid);
  if(tbody) tbody.innerHTML = tabCorpo(tid, cache.colunas, cache.itens, cache.aoAbrir);
}

function tabLimparOrdem(tid){
  TAB_ESTADO[tid].ord = {coluna:null, dir:null};
  tabRedesenhar(tid);
}
function tabLimparFiltros(tid){
  TAB_ESTADO[tid].filtros = {};
  tabRedesenhar(tid);
}

/* Publicadas no escopo global — o arquivo usa onclick/oninput embutidos
   como idioma, e estas funções precisam ser alcançáveis por nome. */
if(typeof window!=='undefined'){
  window.tabOrdenarColuna = tabOrdenarColuna;
  window.tabAlternarFiltros = tabAlternarFiltros;
  window.tabAplicarFiltro = tabAplicarFiltro;
  window.tabLimparOrdem = tabLimparOrdem;
  window.tabLimparFiltros = tabLimparFiltros;
}
</script>
