async function ctSetMode(m){
  ctMode = m;
  var sp=el('seg-pmoc'), sc=el('seg-contrat');
  if(sp) sp.className = 'seg-btn'+(m==='pmoc'?' active':'');
  if(sc) sc.className = 'seg-btn'+(m==='contrat'?' active':'');
  el('os-chips').style.display = m==='pmoc'?'flex':'none';
  el('ct-chips').style.display = m==='contrat'?'flex':'none';
  var title = document.querySelector('#page-os .sec-title');
  if(title) title.textContent = m==='contrat' ? 'Contratações (ARP)' : 'Ordens de Serviço';
  if(m==='contrat'){ await ctEnsureLoaded(); ctRenderList(); }
  else renderOS();
}

function ctSetChip(btn, v){
  document.querySelectorAll('#ct-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  ctChipSel = v;
  ctRenderList();
}

function ctRenderList(){
  if(ctChipSel==='saldo'){ ctRenderSaldo(); return; }
  var list = ctOS.filter(function(o){
    if(ctChipSel==='andamento') return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;
    if(ctChipSel==='aprovacao') return o.status==='ORCAMENTO' || o.status==='EXECUTADA';
    if(ctChipSel==='encerradas') return o.status==='ENCERRADA' || o.status==='CANCELADA';
    return true;
  });
  el('os-cnt').textContent = list.length;
  if(!list.length){
    el('os-list').innerHTML = '<div class="empty"><i class="fas fa-file-signature" aria-hidden="true"></i>' +
      '<p>Nenhuma contratação neste filtro.<br>Toque <strong>+</strong> para abrir uma solicitação.</p></div>';
    return;
  }
  el('os-list').innerHTML = list.map(function(o){
    var e = ctEquip(o.equip_id);
    var st = CT_STATUS[o.status]||CT_STATUS['SOLICITADA'];
    var total = ctOrcTotal(o.id);
    return '<div class="ct-card" style="border-left-color:'+st.fg+'" onclick="ctOpenOS(\''+o.id+'\')">' +
      '<div class="os-hdr"><div><div class="ct-num">'+esc(o.numero)+'</div>' +
      '<div class="os-local">'+esc(e.local)+'</div>' +
      '<div class="os-predio">'+esc(e.predio)+(o.empresa?' · '+esc(o.empresa):'')+'</div></div>' +
      ctStatusPill(o.status)+'</div>' +
      '<div class="os-meta">' +
      '<span style="font-size:11px;color:#888"><i class="fas fa-calendar mr1" aria-hidden="true"></i>'+fmtDate(o.data_solicitacao)+'</span>' +
      (total>0?'<span style="font-size:12px;font-weight:800;color:#1351B4">'+fmtMoney(o.valor_orcado||total)+'</span>':'') +
      (o.ne?'<span class="pill pill-tipo">'+esc(o.ne)+'</span>':'') +
      '</div>' +
      (o.problema?'<div class="os-desc">'+esc(o.problema)+'</div>':'') +
      '</div>';
  }).join('');
}

function ctRenderSaldo(){
  el('os-cnt').textContent = ctArp.length;
  var html = '<div class="kpi-row">' +
    '<div class="kpi-card" style="border-left-color:#1351B4"><div class="kpi-label">Saldo WINS · NE335</div>' +
    '<div class="kpi-val" style="color:#1351B4;font-size:18px">'+fmtMoney(ctSaldoNE('2026NE000335'))+'</div><div class="kpi-sub">de '+fmtMoney(CT_NES['2026NE000335'].valor)+' (NE global)</div></div>' +
    '<div class="kpi-card" style="border-left-color:#168821"><div class="kpi-label">Saldo RLP · NE334</div>' +
    '<div class="kpi-val" style="color:#168821;font-size:18px">'+fmtMoney(ctSaldoNE('2026NE000334'))+'</div><div class="kpi-sub">de '+fmtMoney(CT_NES['2026NE000334'].valor)+' (NE global)</div></div></div>' +
    '<div style="background:#FEF3E2;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:10px;color:#B46800;line-height:1.4">' +
    '<i class="fas fa-info-circle mr1" aria-hidden="true"></i>As NEs são globais: o teto de pagamento é o valor da NE. ' +
    'Os saldos por item abaixo controlam as <strong>quantidades</strong> aderidas na ata (soma dos itens RLP = R$ 43.467,13, acima da NE334 — nem toda quantidade caberá no empenho).</div>';
  ['2026NE000335','2026NE000334'].forEach(function(ne){
    var itens = ctArp.filter(function(i){return i.ne===ne;});
    if(!itens.length) return;
    html += '<div class="sec-head"><span class="sec-title">'+(ne==='2026NE000335'?'WINS':'RLP')+' — '+ne+'</span><span class="sec-count">'+itens.length+' itens</span></div>';
    html += itens.map(function(it){
      var saldo = ctSaldoItem(it);
      var pct = it.qtd_empenhada? Math.max(0,Math.min(100,Math.round(saldo/it.qtd_empenhada*100))) : 0;
      return '<div class="saldo-row"><div class="saldo-hdr">' +
        '<span style="font-size:12px;font-weight:800;color:#1351B4">Item '+it.item+'</span>' +
        '<span style="font-size:12px;font-weight:700">'+saldo+' / '+it.qtd_empenhada+' · '+fmtMoney(saldo*it.valor_unit)+'</span></div>' +
        '<div class="saldo-desc">'+esc(it.descricao)+' <span style="color:#999">('+fmtMoney(it.valor_unit)+'/un)</span></div>' +
        '<div class="saldo-bar"><div class="saldo-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'"></div></div></div>';
    }).join('');
  });
  el('os-list').innerHTML = html;
}

/* ══ NOVA SOLICITAÇÃO ══ */
function ctNovaOS(){
  if(!ctCan('criar')){ showToast('Sem permissão para criar solicitação',''); return; }
  el('dh-id').textContent = 'Nova Contratação';
  el('dh-local').textContent = 'Solicitação de serviço';
  el('dh-predio').textContent = 'Selecione a máquina e descreva o problema';

  // D-uyz-10: não se abre contratação para máquina que não está instalada.
  var opts = equipamentosOperacionais(DATA).slice().sort(function(a,b){ return (equipInoperante(a)?0:1)-(equipInoperante(b)?0:1); })
    .map(function(e){ return '<option value="'+e.id+'">'+(equipInoperante(e)?'⛔ ':'')+'#'+e.id+' — '+esc(e.predio)+' / '+esc(e.local)+' ('+esc(e.tipo)+')</option>'; }).join('');
  el('drawer-body').innerHTML =
    '<div class="ds"><div class="ds-title"><i class="fas fa-snowflake mr1" aria-hidden="true"></i>Máquina</div>' +
    '<select class="fgs" id="ct-equip-sel">'+opts+'</select>' +
    '<div style="font-size:10px;color:#999;margin-top:6px">⛔ = inoperantes aparecem primeiro</div></div>' +
    '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i>Problema / Serviço Necessário</div>' +
    '<textarea class="fgt" id="ct-problema" placeholder="Descreva o defeito ou serviço a contratar…"></textarea>' +
    '<div class="fg2" style="margin-top:8px">' +
    '<div><label class="fgl">Empresa</label><select class="fgs" id="ct-empresa" onchange="ctSyncNE()">' +
    '<option value="RLP">RLP</option><option value="WINS">WINS</option><option value="">A definir</option></select></div>' +
    '<div><label class="fgl">NE</label><select class="fgs" id="ct-ne">' +
    '<option value="2026NE000334">2026NE000334 (RLP)</option><option value="2026NE000335">2026NE000335 (WINS)</option><option value="">—</option></select></div>' +
    '</div></div>';
  el('drawer-footer').innerHTML =
    '<button class="btn-secondary" onclick="closeDrawer()">Cancelar</button>' +
    '<button class="btn-primary" onclick="ctSalvarNova()"><i class="fas fa-paper-plane mr1" aria-hidden="true"></i>Abrir Solicitação</button>';
  openDrawer();
}

function ctSyncNE(){
  var emp = val('ct-empresa');
  var ne = el('ct-ne');
  if(!ne) return;
  if(emp==='RLP') ne.value='2026NE000334';
  else if(emp==='WINS') ne.value='2026NE000335';
}

async function ctSalvarNova(){
  var equipId = parseInt(val('ct-equip-sel'));
  var problema = val('ct-problema').trim();
  if(!equipId || !problema){ showToast('Selecione a máquina e descreva o problema','error'); return; }
  var ano = new Date().getFullYear();
  var seq = ctOS.filter(function(o){ return (o.numero||'').indexOf('/'+ano)>=0; }).length + 1;
  var numero = 'OSC '+String(seq).padStart(3,'0')+'/'+ano;
  var nome = ctUser ? ctUser.nome : '';
  var ins = await supa.from('os_contratacao').insert({
    numero:numero, equip_id:equipId, status:'SOLICITADA', problema:problema,
    empresa:val('ct-empresa')||null, ne:val('ct-ne')||null,
    solicitante:nome, data_solicitacao:today()
  }).select().single();
  if(ins.error){
    if((ins.error.message||'').indexOf('duplicate')>=0){ showToast('Nº já existe — tente de novo','error'); }
    else showToast('Erro ao criar solicitação','error');
    return;
  }
  ctOS.unshift(ins.data);
  showToast(numero+' criada','ok');
  closeDrawer();
  ctRenderList();
}

/* ══ DETALHE DA OS ══ */
function ctOrcTotal(osId){
  return (ctOrc[osId]||[]).reduce(function(s,i){ return s + (Number(i.qtd)||0)*(Number(i.valor_unit)||0); },0);
}
function ctCompTotal(osId){
  return (ctComp[osId]||[]).reduce(function(s,c){
    var it = ctArp.find(function(a){return a.item===c.item_arp;});
    return s + (it? (Number(c.qtd)||0)*Number(it.valor_unit) : 0);
  },0);
}

/* D-l7n-10: régua com dois consumidores — casca que injeta CT_STATUS/CT_STEPS
   sobre reguaPassos (bloco de vocabulário do fluxo interno). CT_STATUS não é
   tocada. */
function ctTimeline(status){
  return reguaPassos((CT_STATUS[status]||{}).step, CT_STEPS);
}

function ctOpenOS(osId){
  var o = ctOS.find(function(x){return x.id===osId;}); if(!o) return;
  var e = ctEquip(o.equip_id);
  var itens = ctOrc[osId]||[];
  var regs = ctExec[osId]||[];
  var comps = ctComp[osId]||[];
  var total = ctOrcTotal(osId);
  var ro = window._modoObservador;

  el('dh-id').textContent = o.numero+' · '+(o.ne||'sem NE');
  el('dh-local').textContent = e.local;
  el('dh-predio').textContent = e.predio+(o.empresa?' · '+o.empresa:'');
  el('dh-pills').innerHTML = ctStatusPill(o.status);

  var h = ctTimeline(o.status);

  /* — Solicitação — */
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i>1 · Solicitação</div>' +
    '<div class="dfield"><label>Problema / serviço</label><div class="dval" style="font-size:13px">'+esc(o.problema||'—')+'</div></div>' +
    '<div class="dfields2">' +
    '<div class="dfield"><label>Solicitante</label><div class="dval" style="font-size:12px">'+esc(o.solicitante||'—')+'</div></div>' +
    '<div class="dfield"><label>Data</label><div class="dval" style="font-size:12px">'+fmtDate(o.data_solicitacao)+'</div></div>' +
    '</div></div>';

  /* — Orçamento — */
  var podeOrcar = !ro && ctCan('orcar') && (o.status==='SOLICITADA'||o.status==='ORCAMENTO');
  h += '<div class="ds"><div class="ds-title"><i class="fas fa-file-invoice-dollar mr1" aria-hidden="true"></i>2 · Delineamento / Orçamento</div>';
  if(itens.length){
    h += itens.map(function(i){
      return '<div class="orc-item"><span class="orc-tipo '+i.tipo+'">'+(i.tipo==='SERVICO'?'SERV':'MAT')+'</span>' +
        '<div class="orc-desc">'+esc(i.descricao)+'<div style="color:#999;font-size:10px">'+i.qtd+' × '+fmtMoney(i.valor_unit)+'</div></div>' +
        '<span class="orc-val">'+fmtMoney(i.qtd*i.valor_unit)+'</span>' +
        (podeOrcar?'<button class="orc-del" title="Excluir item" aria-label="Excluir item" onclick="ctDelOrcItem(\''+osId+'\',\''+i.id+'\')"><i class="fas fa-trash" aria-hidden="true"></i></button>':'') +
        '</div>';
    }).join('');
    h += '<div class="ct-total-row"><span>TOTAL ORÇADO</span><span style="color:#1351B4">'+fmtMoney(total)+'</span></div>';
  } else {
    h += '<div style="font-size:12px;color:#999">Nenhum item lançado ainda.</div>';
  }
  if(podeOrcar){
    h += '<div style="margin-top:10px;border-top:1px dashed #DDD;padding-top:10px">' +
      '<div class="fg2"><div><label class="fgl">Tipo</label><select class="fgs" id="oi-tipo"><option value="SERVICO">Serviço</option><option value="MATERIAL">Material/Peça</option></select></div>' +
      '<div><label class="fgl">Qtd</label><input class="fgi" id="oi-qtd" type="number" value="1" min="0.01" step="0.01"/></div></div>' +
      '<label class="fgl">Descrição</label><input class="fgi" id="oi-desc" placeholder="Ex.: Substituição do compressor 36.000 BTU"/>' +
      '<label class="fgl" style="margin-top:8px">Valor unitário (R$)</label><input class="fgi" id="oi-vu" type="number" min="0" step="0.01" placeholder="0,00"/>' +
      '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="ctAddOrcItem(\''+osId+'\')"><i class="fas fa-plus mr1" aria-hidden="true"></i>Adicionar item</button></div>';
  }
  if(o.status==='ORCAMENTO' && o.parecer_aprovacao){
    h += '<div style="margin-top:8px;font-size:11px;color:#B46800;background:#FEF3E2;border-radius:8px;padding:8px"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolvida: '+esc(o.parecer_aprovacao)+'</div>';
  }
  if(o.aprovador){
    h += '<div style="margin-top:8px;font-size:11px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Aprovado por '+esc(o.aprovador)+' em '+fmtDate(o.data_aprovacao)+'</div>';
  }
  /* botões do orçamento */
  h += '<div class="ct-btn-row">';
  if(!ro && o.status==='SOLICITADA' && itens.length && ctCan('orcar'))
    h += '<button class="btn-primary" onclick="ctMudarStatus(\''+osId+'\',\'ORCAMENTO\')"><i class="fas fa-paper-plane mr1" aria-hidden="true"></i>Enviar p/ aprovação</button>';
  if(!ro && o.status==='ORCAMENTO' && ctCan('aprovar')){
    h += '<button class="btn-success" onclick="ctAprovar(\''+osId+'\')"><i class="fas fa-check mr1" aria-hidden="true"></i>Aprovar orçamento</button>';
    h += '<button class="btn-danger" onclick="ctDevolver(\''+osId+'\')"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolver</button>';
  }
  h += '</div></div>';

  /* — Execução — */
  var stepExec = (CT_STATUS[o.status]||CT_STATUS['SOLICITADA']).step;
  if(stepExec>=2 && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-hard-hat mr1" aria-hidden="true"></i>3 · Execução ('+regs.length+' registro'+(regs.length===1?'':'s')+')</div>';
    regs.forEach(function(r){
      var med = r.medicoes||{};
      var medTxt = [];
      if(med.temp_insuflamento) medTxt.push('Insufl.: '+med.temp_insuflamento+'°C');
      if(med.temp_retorno) medTxt.push('Retorno: '+med.temp_retorno+'°C');
      if(med.corrente) medTxt.push('Corrente: '+med.corrente+'A');
      if(med.pressao) medTxt.push('Pressão: '+med.pressao+' psi');
      var fotos = (r.fotos||[]).map(function(p){
        var u = supa.storage.from('os-fotos').getPublicUrl(p).data.publicUrl;
        return '<a href="'+u+'" target="_blank"><img src="'+u+'" loading="lazy"/></a>';
      }).join('');
      h += '<div class="exec-reg"><div class="le-hdr"><span class="le-date">'+fmtDate(r.data)+'</span>' +
        (r.executor?'<span class="le-tec"><i class="fas fa-user mr1" aria-hidden="true"></i>'+esc(r.executor)+'</span>':'')+'</div>' +
        (r.descricao?'<div class="le-desc">'+esc(r.descricao)+'</div>':'') +
        (medTxt.length?'<div class="le-chk"><i class="fas fa-thermometer-half mr1" aria-hidden="true"></i>'+medTxt.join(' · ')+'</div>':'') +
        (fotos?'<div class="foto-grid">'+fotos+'</div>':'') +
        '</div>';
    });
    var podeExec = !ro && ctCan('executar');
    if(podeExec && o.status==='EM_EXECUCAO'){
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<label class="fgl">Descrição do serviço executado</label>' +
        '<textarea class="fgt" id="ex-desc" placeholder="O que foi feito, peças aplicadas…"></textarea>' +
        '<div class="fg2" style="margin-top:8px">' +
        '<div><label class="fgl">Insufl. (°C)</label><input class="fgi" id="ex-ti" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Retorno (°C)</label><input class="fgi" id="ex-tr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Corrente (A)</label><input class="fgi" id="ex-corr" type="number" step="0.1"/></div>' +
        '<div><label class="fgl">Pressão (psi)</label><input class="fgi" id="ex-press" type="number" step="1"/></div></div>' +
        '<label class="fgl" style="margin-top:8px">Fotos</label>' +
        '<input class="fgi" id="ex-fotos" type="file" accept="image/*" capture="environment" multiple/>' +
        '<button class="btn-secondary" style="width:100%;margin-top:8px" onclick="ctAddExec(\''+osId+'\')"><i class="fas fa-camera mr1" aria-hidden="true"></i>Registrar execução</button></div>';
    }
    h += '<div class="ct-btn-row">';
    if(podeExec && o.status==='APROVADA')
      h += '<button class="btn-primary" onclick="ctMudarStatus(\''+osId+'\',\'EM_EXECUCAO\')"><i class="fas fa-play mr1" aria-hidden="true"></i>Iniciar execução</button>';
    if(podeExec && o.status==='EM_EXECUCAO' && regs.length)
      h += '<button class="btn-success" onclick="ctMudarStatus(\''+osId+'\',\'EXECUTADA\')"><i class="fas fa-flag-checkered mr1" aria-hidden="true"></i>Concluir execução</button>';
    h += '</div></div>';
  }

  /* — Fiscalização — */
  if(((CT_STATUS[o.status]||{}).step>=4) && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-user-shield mr1" aria-hidden="true"></i>4 · Fiscalização</div>';
    if(o.fiscal){
      h += '<div style="font-size:12px;color:#168821"><i class="fas fa-check-circle mr1" aria-hidden="true"></i>Aprovada por '+esc(o.fiscal)+' em '+fmtDate(o.data_fiscalizacao)+'</div>' +
        (o.parecer_fiscal?'<div class="le-desc" style="margin-top:4px">'+esc(o.parecer_fiscal)+'</div>':'');
    } else if(!ro && o.status==='EXECUTADA' && ctCan('fiscalizar')){
      h += '<label class="fgl">Parecer do fiscal</label>' +
        '<textarea class="fgt" id="fis-parecer" placeholder="Serviços conferidos conforme orçamento aprovado…"></textarea>' +
        '<div class="ct-btn-row">' +
        '<button class="btn-success" onclick="ctFiscalizar(\''+osId+'\',true)"><i class="fas fa-check mr1" aria-hidden="true"></i>Aprovar execução</button>' +
        '<button class="btn-danger" onclick="ctFiscalizar(\''+osId+'\',false)"><i class="fas fa-undo mr1" aria-hidden="true"></i>Devolver</button></div>';
    } else {
      h += '<div style="font-size:12px;color:#999">Aguardando conclusão da execução.</div>';
    }
    h += '</div>';
  }

  /* — Certificação / NF + composição da ata — */
  if(((CT_STATUS[o.status]||{}).step>=5) && o.status!=='CANCELADA'){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-file-invoice mr1" aria-hidden="true"></i>5 · NF · Composição da Ata · Certificação</div>';
    /* composição */
    var compTotal = ctCompTotal(osId);
    if(comps.length){
      h += comps.map(function(c){
        var it = ctArp.find(function(a){return a.item===c.item_arp;})||{descricao:'',valor_unit:0};
        return '<div class="orc-item"><span class="orc-tipo SERVICO">ATA</span>' +
          '<div class="orc-desc">Item '+c.item_arp+' — '+esc(it.descricao)+'<div style="color:#999;font-size:10px">'+c.qtd+' × '+fmtMoney(it.valor_unit)+'</div></div>' +
          '<span class="orc-val">'+fmtMoney(c.qtd*it.valor_unit)+'</span>' +
          (!ro && o.status==='FISCALIZADA' && ctCan('certificar')?'<button class="orc-del" title="Excluir item" aria-label="Excluir item" onclick="ctDelComp(\''+osId+'\',\''+c.id+'\')"><i class="fas fa-trash" aria-hidden="true"></i></button>':'') +
          '</div>';
      }).join('');
      var dif = (o.valor_orcado||total) - compTotal;
      h += '<div class="ct-total-row"><span>COMPOSTO (ATA)</span><span>'+fmtMoney(compTotal)+'</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:'+(Math.abs(dif)<1?'#168821':'#E52207')+';margin-top:2px">' +
        '<span>Diferença vs orçado</span><span>'+fmtMoney(dif)+'</span></div>';
    }
    if(!ro && o.status==='FISCALIZADA' && ctCan('certificar')){
      var arpOpts = ctArp.map(function(it){
        var saldo = ctSaldoItem(it);
        return '<option value="'+it.item+'" '+(saldo<=0?'disabled':'')+'>'+it.item+' · '+(it.ne==='2026NE000335'?'WINS':'RLP')+' · '+fmtMoney(it.valor_unit)+' · saldo '+saldo+'</option>';
      }).join('');
      h += '<div style="margin-top:8px;border-top:1px dashed #DDD;padding-top:10px">' +
        '<label class="fgl">Item da ata</label><select class="fgs" id="cp-item">'+arpOpts+'</select>' +
        '<div class="fg2" style="margin-top:8px"><div><label class="fgl">Qtd</label><input class="fgi" id="cp-qtd" type="number" value="1" min="1" step="1"/></div>' +
        '<div style="display:flex;align-items:flex-end"><button class="btn-secondary" style="width:100%" onclick="ctAddComp(\''+osId+'\')"><i class="fas fa-plus mr1" aria-hidden="true"></i>Adicionar</button></div></div>' +
        '<div class="fg2" style="margin-top:10px">' +
        '<div><label class="fgl">Nota Fiscal</label><input class="fgi" id="cf-nf" value="'+esc(o.nf||'')+'" placeholder="NF nº"/></div>' +
        '<div><label class="fgl">Data NF</label><input class="fgi" id="cf-datanf" type="date" value="'+(o.data_nf||today())+'"/></div></div>' +
        '<button class="btn-success" style="width:100%;margin-top:10px" onclick="ctCertificar(\''+osId+'\')"><i class="fas fa-stamp mr1" aria-hidden="true"></i>Certificar e encerrar OS</button></div>';
    }
    if(o.status==='ENCERRADA'){
      h += '<div style="margin-top:8px;font-size:12px;color:#168821"><i class="fas fa-stamp mr1" aria-hidden="true"></i>NF '+esc(o.nf||'—')+' ('+fmtDate(o.data_nf)+') certificada por '+esc(o.certificador||'—')+' em '+fmtDate(o.data_certificacao)+'</div>';
    }
    h += '</div>';
  }

  /* — Histórico / auditoria — */
  var evts = ctEvt[osId]||[];
  if(evts.length){
    h += '<div class="ds"><div class="ds-title"><i class="fas fa-history mr1" aria-hidden="true"></i>Histórico / Auditoria ('+evts.length+')</div>' +
      evts.map(function(ev){
        var dt = ev.criado_em ? new Date(ev.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
        var tx = ctEvtTexto(ev);
        return '<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #F0F0F0;font-size:11px">' +
          '<span style="color:#999;white-space:nowrap">'+dt+'</span>' +
          '<div style="flex:1;min-width:0"><strong>'+esc(ev.evento)+'</strong>'+(tx?' — '+esc(tx):'')+
          (ev.usuario?'<div style="color:#888">'+esc(ev.usuario)+'</div>':'')+'</div></div>';
      }).join('')+'</div>';
  }

  el('drawer-body').innerHTML = h;

  var foot = '<button class="btn-secondary" onclick="closeDrawer()" title="Fechar" aria-label="Fechar"><i class="fas fa-times" aria-hidden="true"></i></button>' +
    '<button class="btn-secondary" onclick="ctPrintOS(\''+osId+'\')" title="Imprimir OS" aria-label="Imprimir OS"><i class="fas fa-print" aria-hidden="true"></i></button>';
  if(!ro && ctCan('cancelar') && ['SOLICITADA','ORCAMENTO','APROVADA'].indexOf(o.status)>=0)
    foot += '<button class="btn-danger" style="flex:1" onclick="ctCancelar(\''+osId+'\')"><i class="fas fa-ban mr1" aria-hidden="true"></i>Cancelar OS</button>';
  el('drawer-footer').innerHTML = foot;
  openDrawer();
}

/* ══ AÇÕES ══ */
function ctNomeEvento(msg){
  return msg || 'Atualização';
}
function ctDetalheEvento(statusAnterior, patch){
  if(!patch || patch.status===undefined || patch.status===statusAnterior) return '';
  var de = statusAnterior ? (CT_STATUS[statusAnterior] ? CT_STATUS[statusAnterior].label : statusAnterior) : '—';
  var para = CT_STATUS[patch.status] ? CT_STATUS[patch.status].label : patch.status;
  return de + ' → ' + para;
}
function ctUsuarioEvento(u){
  if(!u) return '';
  return u.nome + (u.role ? ' ('+u.role+')' : '');
}

async function ctRegistrarEvento(osId, statusAnterior, patch, msg){
  try{
    var r = await supa.from('os_eventos').insert({
      os_id: osId,
      evento: ctNomeEvento(msg),
      detalhe: ctDetalheEvento(statusAnterior, patch) || null,
      usuario: ctUsuarioEvento(ctUser) || null
    }).select().single();
    if(r.error){ console.warn('ctRegistrarEvento', r.error); return false; }
    (ctEvt[osId]=ctEvt[osId]||[]).push(r.data); // D-jpd-06: cache atualizado na hora, sem realtime
    return true;
  }catch(e){ console.warn('ctRegistrarEvento', e); return false; }
}

async function ctUpd(osId, patch, msg){
  var anterior = ctOS.find(function(o){return o.id===osId;});
  var statusAnterior = anterior ? anterior.status : undefined; // lido ANTES do update (senão sai X → X)
  var r = await supa.from('os_contratacao').update(patch).eq('id',osId).select().single();
  if(r.error){ showToast('Erro ao atualizar','error'); return false; }
  var i = ctOS.findIndex(function(o){return o.id===osId;});
  if(i>=0) ctOS[i]=r.data;
  await ctRegistrarEvento(osId, statusAnterior, patch, msg); // D-jpd-05: falha aqui não derruba a ação
  if(msg) showToast(msg,'ok');
  return true;
}

async function ctMudarStatus(osId, novo){
  var patch = {status:novo};
  if(novo==='ORCAMENTO'){ patch.valor_orcado = ctOrcTotal(osId); patch.parecer_aprovacao = null; }
  if(await ctUpd(osId, patch, 'Status: '+(CT_STATUS[novo]||{}).label)){ ctOpenOS(osId); ctRenderList(); }
}

async function ctAprovar(osId){
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'APROVADA',aprovador:nome,data_aprovacao:today(),valor_orcado:ctOrcTotal(osId)},'Orçamento aprovado')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctDevolver(osId){
  var motivo = prompt('Motivo da devolução do orçamento:');
  if(motivo===null) return;
  if(await ctUpd(osId,{status:'SOLICITADA',parecer_aprovacao:motivo},'Devolvida p/ ajuste')){ ctOpenOS(osId); ctRenderList(); }
}

async function ctFiscalizar(osId, aprovado){
  var parecer = val('fis-parecer').trim();
  var nome = ctUser?ctUser.nome:'';
  if(aprovado){
    if(await ctUpd(osId,{status:'FISCALIZADA',fiscal:nome,data_fiscalizacao:today(),parecer_fiscal:parecer},'Execução aprovada pelo fiscal')){ ctOpenOS(osId); ctRenderList(); }
  } else {
    if(!parecer){ showToast('Informe o motivo no parecer','error'); return; }
    if(await ctUpd(osId,{status:'EM_EXECUCAO',parecer_fiscal:parecer},'Devolvida p/ correção')){ ctOpenOS(osId); ctRenderList(); }
  }
}

/* ── histórico da contratação ── */
function ctMarcadorHistorico(o){
  return 'Contratação ' + (o.numero || o.id);
}
function ctDescricaoHistorico(o){
  var desc = ctMarcadorHistorico(o) + ' — ' + (o.problema || 'Serviço executado por empresa contratada');
  if(o.nf) desc += ' · NF ' + o.nf;
  return desc;
}
function ctJaTemHistorico(linhas, marcador){
  return (linhas||[]).some(function(l){
    var texto = l.descricao!==undefined ? l.descricao : l.desc;
    return typeof texto==='string' && texto.indexOf(marcador)===0;
  });
}
async function ctEncerrarHistorico(o){
  if(!o.equip_id) return false;
  var data = o.data_nf || today();
  var r = await supa.from('logs_manutencao').select('id,descricao').eq('equip_id', o.equip_id);
  if(r.error){ console.warn('ctEncerrarHistorico', r.error); return false; }
  if(ctJaTemHistorico(r.data||[], ctMarcadorHistorico(o))) return false;
  var id = await addLogEntryAsync(o.equip_id, {date:data, tipo:'CORRETIVA', status:'CONCLUÍDA', tecnico:(o.empresa||''), desc:ctDescricaoHistorico(o), checklist:[]});
  if(id) await atualizarUltimaManutencao(o.equip_id, data);
  return !!id;
}

async function ctCertificar(osId){
  var nf = val('cf-nf').trim();
  if(!nf){ showToast('Informe o nº da NF','error'); return; }
  var comps = ctComp[osId]||[];
  if(!comps.length){ showToast('Adicione a composição de itens da ata','error'); return; }
  var nome = ctUser?ctUser.nome:'';
  if(await ctUpd(osId,{status:'ENCERRADA',nf:nf,data_nf:val('cf-datanf')||today(),certificador:nome,data_certificacao:today()},'OS certificada e encerrada')){
    var o = ctOS.find(function(x){return x.id===osId;});
    if(o) await ctEncerrarHistorico(o);
    ctOpenOS(osId); ctRenderList();
  }
}

async function ctCancelar(osId){
  if(!confirm('Cancelar esta OS?')) return;
  if(await ctUpd(osId,{status:'CANCELADA'},'OS cancelada')){ closeDrawer(); ctRenderList(); }
}

async function ctAddOrcItem(osId){

  var qtd = parseFloat(val('oi-qtd'))||0;

/* — execução: fotos comprimidas + upload — */
function ctCompressFoto(file){
  return new Promise(function(res, rej){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1280;
      var w = img.width, hh = img.height;
      if(w>max||hh>max){ var k=Math.min(max/w,max/hh); w=Math.round(w*k); hh=Math.round(hh*k); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error('blob')); },'image/jpeg',0.8);
    };
    img.onerror = rej;
    img.src = url;
  });
}

async function ctAddExec(osId){
  var desc = val('ex-desc').trim();
  var files = (el('ex-fotos')||{files:[]}).files;
  if(!desc && !files.length){ showToast('Descreva o serviço ou anexe fotos','error'); return; }
  showToast('Enviando registro…','');
  var paths = [];
  for(var i=0;i<files.length;i++){
    try{
      var blob = await ctCompressFoto(files[i]);
      var path = osId+'/'+Date.now()+'_'+i+'.jpg';
      var up = await supa.storage.from('os-fotos').upload(path, blob, {contentType:'image/jpeg'});
      if(up.error) throw up.error;
      paths.push(path);
    }catch(e){ console.error('foto',e); showToast('Falha no upload de uma foto','error'); }
  }
  var med = {};
  if(val('ex-ti')) med.temp_insuflamento = parseFloat(val('ex-ti'));
  if(val('ex-tr')) med.temp_retorno = parseFloat(val('ex-tr'));
  if(val('ex-corr')) med.corrente = parseFloat(val('ex-corr'));
  if(val('ex-press')) med.pressao = parseFloat(val('ex-press'));
  var nome = ctUser?ctUser.nome:'';
  var r = await supa.from('os_execucao').insert({
    os_id:osId, data:today(), executor:nome, descricao:desc, medicoes:med, fotos:paths
  }).select().single();
  if(r.error){ showToast('Erro ao registrar execução','error'); return; }
  (ctExec[osId]=ctExec[osId]||[]).push(r.data);
  showToast('Execução registrada','ok');
  ctOpenOS(osId);
}

/* — composição da ata — */
async function ctAddComp(osId){
  var item = parseInt(val('cp-item'));
  var qtd = parseFloat(val('cp-qtd'))||0;
  if(!item || qtd<=0){ showToast('Selecione item e quantidade','error'); return; }
  var it = ctArp.find(function(a){return a.item===item;});
  if(!it){ showToast('Item inválido','error'); return; }
  var saldo = ctSaldoItem(it);
  if(qtd>saldo){ showToast('Excede o saldo do item ('+saldo+')','error'); return; }
  // teto financeiro da NE (empenho global)
  var dispNE = ctSaldoNE(it.ne);
  if(qtd*Number(it.valor_unit) > dispNE + 0.005){
    showToast('Excede o teto da NE — disponível '+fmtMoney(dispNE),'error'); return;
  }
  var r = await supa.from('os_composicao').insert({os_id:osId,item_arp:item,qtd:qtd}).select().single();
  if(r.error){ showToast('Erro ao adicionar','error'); return; }
  (ctComp[osId]=ctComp[osId]||[]).push(r.data);
  ctOpenOS(osId);
}

async function ctDelComp(osId, compId){
  var r = await supa.from('os_composicao').delete().eq('id',compId);
  if(r.error){ showToast('Erro ao remover','error'); return; }
  ctComp[osId] = (ctComp[osId]||[]).filter(function(c){return c.id!==compId;});
  ctOpenOS(osId);
}

<script>
/* paleta categórica (validada dataviz: CVD-safe sobre superfície clara) */
var DV_CAT = {'SPLIT':'#1351B4','PISO/TETO':'#E65100','SELF CONTAINED':'#7B1FA2','JANELA':'#00897B'};
var DV_SEQ = ['#B8CBEA','#5E85CB','#1351B4'];        /* NOVA→SEMI→VELHA (um matiz, claro→escuro) */

function dvFmt(n,dec){ return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }

function dvPotenciaW(e){
  var v=e.tensao||220, i=e.correnteNominal||0;
  return v===380 ? Math.round(1.732*v*i) : Math.round(v*i);
}

function dvDonut(segs, centerTop, centerBot){
  var total = segs.reduce(function(s,x){return s+x.value;},0)||1;
  var R=40, C=2*Math.PI*R, off=C*0.25, gap=2;
  var h='<svg viewBox="0 0 100 100" width="112" height="112" style="flex-shrink:0">';
  segs.forEach(function(s){
    var frac=s.value/total, len=Math.max(0,frac*C-gap);
    h+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="13" stroke-linecap="butt" '+
       'stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+off+'"><title>'+s.label+': '+dvFmt(s.value)+'</title></circle>';
    off-=frac*C;
  });
  h+='<text x="50" y="48" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#1B1B1B">'+centerTop+'</text>' +
     '<text x="50" y="61" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:#999">'+centerBot+'</text></svg>';
  return h;
}

function dvGetTarifa(){
  var t = parseFloat(localStorage.getItem('pmoc_tarifa_kwh'));
  return (t>0&&t<20)?t:0.85;
}
function dvSetTarifa(v){
  var t=parseFloat(String(v).replace(',','.'))||0.85;
  try{ localStorage.setItem('pmoc_tarifa_kwh',t); }catch(e){}
  renderDash();
}

function dvRenderCharts(){
  var host = el('dash-charts');
  if(!host){
    host = document.createElement('div');
    host.id = 'dash-charts';
    var kpi = el('kpi-area');
    kpi.insertAdjacentElement('afterend', host);
  }
  // D-uyz-10: só instalado entra no gráfico. O filtro legado de RETIRADO fica —
  // casa com zero linha hoje (as 2 foram excluídas na importação) e removê-lo
  // seria conserto não pedido.
  var ativos = equipamentosOperacionais(DATA).filter(function(e){ return e.tipo!=='RETIRADO'; });
  // D-q57-07: um aparelho com restrição está ligado e consome energia — continua
  // entrando no cálculo de potência/kWh, diferente do KPI "Fora de Operação" (só INOP).
  var emOperacao = ativos.filter(function(e){ return equipOperante(e) || equipComRestricao(e); });

  /* ── capacidade térmica ── */
  var btuTotal = ativos.reduce(function(s,e){return s+(e.btu||0);},0);
  var btuOk = emOperacao.reduce(function(s,e){return s+(e.btu||0);},0);
  var tr = btuTotal/12000, kwTerm = btuTotal/3412;
  var tipos = ['SPLIT','PISO/TETO','SELF CONTAINED','JANELA'];
  var segTipo = tipos.map(function(t){
    var lst = ativos.filter(function(e){return e.tipo===t;});
    return {label:t, color:DV_CAT[t], value:lst.reduce(function(s,e){return s+(e.btu||0);},0), n:lst.length};
  }).filter(function(s){return s.value>0;});
  var htmlCap =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-snowflake" aria-hidden="true"></i>Capacidade Térmica Instalada</div>' +
    '<div class="hero-num">'+dvFmt(tr,1)+' TR</div>' +
    '<div class="hero-sub">'+dvFmt(btuTotal)+' BTU/h · '+dvFmt(kwTerm)+' kW térmicos · '+dvFmt(btuOk/btuTotal*100)+'% operacional</div>' +
    '<div class="donut-wrap">'+dvDonut(segTipo, dvFmt(tr,0)+' TR', ativos.length+' equip.')+
    '<div class="donut-legend">'+segTipo.map(function(s){
      return '<div class="dl-row"><span class="dl-dot" style="background:'+s.color+'"></span>' +
        '<span class="dl-name">'+s.label+' ('+s.n+')</span>' +
        '<span class="dl-val">'+dvFmt(s.value/1000)+'K</span>' +
        '<span class="dl-pct">'+dvFmt(s.value/btuTotal*100)+'%</span></div>';
    }).join('')+'</div></div></div>';

  /* ── energia elétrica ── */
  var FATOR_CICLO = 0.7;
  var potW = emOperacao.reduce(function(s,e){return s+dvPotenciaW(e);},0);
  var kwhMes = emOperacao.reduce(function(s,e){
    return s + dvPotenciaW(e)/1000*(e.horasDia||0)*(e.diasSemana||0)*4.345*FATOR_CICLO;
  },0);
  var tarifa = dvGetTarifa();
  var custoMes = kwhMes*tarifa;
  var areas = ['AZUL','VERMELHA'];
  var kwhArea = areas.map(function(a){
    return {label:'Área '+a, value: emOperacao.filter(function(e){return e.area===a;})
      .reduce(function(s,e){return s+dvPotenciaW(e)/1000*(e.horasDia||0)*(e.diasSemana||0)*4.345*FATOR_CICLO;},0)};
  });
  var maxA = Math.max.apply(null, kwhArea.map(function(x){return x.value;}))||1;
  var htmlEn =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-bolt" aria-hidden="true"></i>Energia Elétrica — Estimativa</div>' +
    '<div class="stat-grid" style="margin-top:0">' +
    '<div class="stat-mini"><div class="v">'+dvFmt(potW/1000,1)+' kW</div><div class="l">Potência instalada (OK)</div></div>' +
    '<div class="stat-mini"><div class="v">'+dvFmt(kwhMes)+'</div><div class="l">kWh / mês estimado</div></div></div>' +
    '<div style="margin-top:8px">'+kwhArea.map(function(x){
      return '<div class="hbar-row"><span class="hbar-label">'+x.label+'</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+(x.value/maxA*100)+'%;background:'+(x.label.indexOf('AZUL')>=0?'#1351B4':'#E52207')+'" title="'+dvFmt(x.value)+' kWh/mês"></div></div>' +
        '<span class="hbar-val">'+dvFmt(x.value)+' kWh</span></div>';
    }).join('')+'</div>' +
    '<div class="tarifa-row"><span style="font-size:11px;color:#666;font-weight:600;flex:1">Tarifa (R$/kWh)</span>' +
    '<input type="number" step="0.01" min="0" value="'+tarifa.toFixed(2)+'" onchange="dvSetTarifa(this.value)"/>' +
    '<span style="font-size:15px;font-weight:800;color:#1351B4">'+('R$ '+dvFmt(custoMes,2))+'/mês</span></div>' +
    '<div class="chart-note">Estimativa: corrente nominal de placa × tensão (380 V trifásico ×√3), horas de uso semanais cadastradas e fator de ciclo do compressor de 70%. Considera apenas máquinas operacionais (OK). O consumo real varia com carga térmica e regulagem.</div></div>';

  /* ── BTU por prédio (top 8) ── */
  var byPredio = {};
  ativos.forEach(function(e){ byPredio[e.predio]=(byPredio[e.predio]||0)+(e.btu||0); });
  var predios = Object.keys(byPredio).map(function(p){return {label:p,value:byPredio[p]};})
    .sort(function(a,b){return b.value-a.value;});
  var top = predios.slice(0,8);
  var resto = predios.slice(8).reduce(function(s,x){return s+x.value;},0);
  if(resto>0) top.push({label:'Outros ('+(predios.length-8)+')',value:resto,outro:true});
  var maxP = top[0]?top[0].value:1;
  var htmlPred =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-building" aria-hidden="true"></i>Capacidade por Prédio (BTU/h)</div>' +
    top.map(function(x){
      return '<div class="hbar-row"><span class="hbar-label">'+esc(x.label)+'</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+(x.value/maxP*100)+'%;background:'+(x.outro?'#B8CBEA':'#1351B4')+'" title="'+dvFmt(x.value)+' BTU/h"></div></div>' +
        '<span class="hbar-val">'+dvFmt(x.value/1000)+'K</span></div>';
    }).join('')+'</div>';

  /* ── estado da frota ── */
  // Três segmentos, um por EQUIP_ESTADOS — a mesma lista fechada que a pílula e o
  // chip do inventário usam, na mesma ordem (EQUIP_ORDEM).
  var CORES_ESTADO_FROTA = {'OP':'#168821','OR':'#B46800','INOP':'#E52207'};
  var estFrota = EQUIP_ORDEM.map(function(k){
    return {chave:k, label:EQUIP_ESTADOS[k].curto, color:CORES_ESTADO_FROTA[k],
      value: ativos.filter(function(e){ return equipEstado(e)===k; }).length};
  });
  var nFrota = estFrota.reduce(function(s,x){return s+x.value;},0)||1;
  var idades = ['NOVA','SEMI','VELHA'].map(function(st,i){
    return {label:st, value:ativos.filter(function(e){return e.estado===st;}).length, color:DV_SEQ[i]};
  });
  var nIdade = idades.reduce(function(s,x){return s+x.value;},0)||1;
  var htmlFrota =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-heartbeat" aria-hidden="true"></i>Estado da Frota</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:2px;flex-wrap:wrap;gap:4px">' +
    estFrota.map(function(x){
      return '<span style="color:'+x.color+'">'+x.label+' '+x.value+' ('+dvFmt(x.value/nFrota*100)+'%)</span>';
    }).join('') +
    '</div>' +
    '<div class="seg-bar">'+estFrota.map(function(x){
      return '<div style="width:'+(x.value/nFrota*100)+'%;background:'+x.color+'" title="'+x.label+': '+x.value+'"></div>';
    }).join('')+'</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:#666;margin-top:12px;margin-bottom:2px">' +
    idades.map(function(x){return '<span><span class="dl-dot" style="display:inline-block;background:'+x.color+';vertical-align:-1px"></span> '+x.label+' '+x.value+'</span>';}).join('') + '</div>' +
    '<div class="seg-bar">'+idades.map(function(x){
      return '<div style="width:'+(x.value/nIdade*100)+'%;background:'+x.color+'" title="'+x.label+': '+x.value+'"></div>';
    }).join('')+'</div>' +
    '<div class="chart-note">Idade aparente conforme inventário (NOVA → VELHA).</div></div>';

  /* ── manutenções últimos 12 meses ── */
  var allLogs = [];
  Object.keys(_logCache).forEach(function(id){ (_logCache[id]||[]).forEach(function(x){ allLogs.push(x); }); });
  var months=[], now=new Date();
  for(var m=11;m>=0;m--){
    var d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    months.push({key:d.toISOString().slice(0,7), lbl:['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()], count:0});
  }
  allLogs.forEach(function(x){
    var k=(x.date||'').slice(0,7);
    var mo=months.find(function(mm){return mm.key===k;});
    if(mo) mo.count++;
  });
  var maxM = Math.max.apply(null, months.map(function(x){return x.count;}))||1;
  var tot12 = months.reduce(function(s,x){return s+x.count;},0);
  var semHist = DATA.filter(function(e){ return !e.ultimaManutencao && !getLatestLogDate(e.id); }).length;
  var porTipo = {};
  allLogs.forEach(function(x){ porTipo[x.tipo]=(porTipo[x.tipo]||0)+1; });
  var htmlMnt =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-tools" aria-hidden="true"></i>Manutenções — Últimos 12 Meses</div>' +
    '<div class="stat-grid" style="margin-top:0">' +
    '<div class="stat-mini"><div class="v">'+tot12+'</div><div class="l">registros em 12 meses</div></div>' +
    '<div class="stat-mini"><div class="v" style="color:'+(semHist>0?'#E52207':'#168821')+'">'+semHist+'</div><div class="l">sem histórico</div></div></div>' +
    '<div class="colchart">'+months.map(function(x){
      return '<div class="col-item">'+(x.count?'<span class="col-cnt">'+x.count+'</span>':'')+
        '<div class="col-fill" style="height:'+Math.max(2,x.count/maxM*66)+'px" title="'+x.key+': '+x.count+'"></div>' +
        '<span class="col-lbl">'+x.lbl+'</span></div>';
    }).join('')+'</div>' +
    (Object.keys(porTipo).length?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">'+
      Object.keys(porTipo).sort(function(a,b){return porTipo[b]-porTipo[a];}).map(function(t){
        return '<span class="pill pill-tipo">'+esc(t)+' · '+porTipo[t]+'</span>';
      }).join('')+'</div>':'')+'</div>';

  /* ── contratações / saldo das atas ── */
  var htmlCt = '';
  if(ctLoaded && ctArp.length){
    var nes = Object.keys(CT_NES).map(function(k){ return {ne:k, forn:CT_NES[k].forn, emp:CT_NES[k].valor}; });
    var andamento = ctOS.filter(function(o){return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;}).length;
    var aprovar = ctOS.filter(function(o){return o.status==='ORCAMENTO'||o.status==='EXECUTADA';}).length;
    var encerradas = ctOS.filter(function(o){return o.status==='ENCERRADA';}).length;
    htmlCt = '<div class="chart-card"><div class="chart-title"><i class="fas fa-file-signature" aria-hidden="true"></i>Contratações (ARP) — Saldos</div>' +
      nes.map(function(x){
        var saldo = ctSaldoNE(x.ne);
        var pct = Math.max(0,Math.min(100,saldo/x.emp*100));
        return '<div class="hbar-row"><span class="hbar-label">'+x.forn+' · NE'+x.ne.slice(-3)+'</span>' +
          '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'" title="Saldo: R$ '+dvFmt(saldo,2)+'"></div></div>' +
          '<span class="hbar-val">'+dvFmt(pct)+'%</span></div>';
      }).join('') +
      '<div style="font-size:11px;color:#666;margin-top:2px;font-weight:600">Saldo total: <span style="color:#1351B4;font-weight:800">R$ '+dvFmt(ctSaldoNE('2026NE000335')+ctSaldoNE('2026NE000334'),2)+'</span> de R$ 65.447,86</div>' +
      '<div class="stat-grid"><div class="stat-mini"><div class="v">'+andamento+'</div><div class="l">OS em andamento</div></div>' +
      '<div class="stat-mini"><div class="v" style="color:'+(aprovar>0?'#B46800':'#1B1B1B')+'">'+aprovar+'</div><div class="l">aguardando aprovação</div></div>' +
      '<div class="stat-mini"><div class="v" style="color:#168821">'+encerradas+'</div><div class="l">encerradas</div></div>' +
      '<div class="stat-mini"><div class="v">'+ctOS.length+'</div><div class="l">total de OS</div></div></div></div>';
  }

  host.innerHTML = htmlCap + htmlEn + htmlFrota + htmlMnt + htmlPred + htmlCt;
}

/* integração: roda o dashboard original e acrescenta os gráficos */
var _origRenderDash = renderDash;
renderDash = function(){
  _origRenderDash();
  try{ dvRenderCharts(); }catch(e){ console.error('dashboard charts', e); }
};

/* quando as contratações terminarem de carregar, atualiza o dashboard */
var _origCtLoad = ctLoad;
ctLoad = function(){
  return _origCtLoad().then(function(r){
    try{
      var pg = el('page-dash');
      if(pg && pg.classList.contains('active')) renderDash();
    }catch(e){}
    return r;
  });
};
</script>

     LOGIN POR FUNÇÃO v4 — botões de cargo + senha (contas fixas)
     Contas: gestor/fiscal/tecnico/rlp/wins @pmoc.local · admin via e-mail.
═══════════════════════════════════════════════════════════════════ -->
<style>
.rl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rl-btn{background:#F8F9FA;border:2px solid #E0E0E0;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .15s}
.rl-btn i{font-size:20px;color:#888}
.rl-btn span{font-size:12px;font-weight:700;color:#555}
.rl-btn.sel{border-color:#1351B4;background:#E8ECF5}
.rl-btn.sel i,.rl-btn.sel span{color:#1351B4}
</style>
<script>
var CT_LOGO_URI = new URL('/refrigeracao/icone-192.png', location.href).href;
var CT_LOGINS = [
  {email:'gestor@pmoc.local',  label:'Gestor',       icon:'fa-user-tie'},
  {email:'fiscal@pmoc.local',  label:'Fiscal',       icon:'fa-user-shield'},
  {email:'tecnico@pmoc.local', label:'Técnico',      icon:'fa-tools'},
  {email:'rlp@pmoc.local',     label:'Empresa RLP',  icon:'fa-briefcase'},
  {email:'wins@pmoc.local',    label:'Empresa WINS', icon:'fa-briefcase'}
];
var _rlSel = null;

renderLoginMobile = function(){
  var appEl = document.getElementById('app');
  var fabEl = document.getElementById('fab');
  if (appEl) appEl.style.display = 'none';
  if (fabEl) fabEl.style.display = 'none';
  var old = document.getElementById('login-mobile');
  if (old) old.remove();
  _rlSel = null;
  var botoes = CT_LOGINS.map(function(r,i){
    return '<div class="rl-btn" id="rl-'+i+'" onclick="rlPick('+i+')">' +
      '<i class="fas '+r.icon+'"></i><span>'+r.label+'</span></div>';
  }).join('');
  var wrap = document.createElement('div');
  wrap.id = 'login-mobile';
  wrap.innerHTML = '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#F0F2F5">' +
    '<img src="'+CT_LOGO_URI+'" alt="" style="width:84px;height:84px;margin-bottom:14px"/>' +
    '<div style="font-size:20px;font-weight:800;color:#071D41;margin-bottom:4px">PMOC.Refrigeração</div>' +
    '<div style="font-size:12px;color:#888;margin-bottom:24px">CMASM · DME · UASG 744030</div>' +
    '<div style="width:100%;max-width:340px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.1)">' +

    /* ── modo por função ── */
    '<div id="rl-modo-funcao">' +
    '<div style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px">Entrar como</div>' +
    '<div class="rl-grid">'+botoes+'</div>' +
    '<div id="rl-pass-wrap" style="display:none">' +
    '<label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px">Senha — <span id="rl-sel-nome" style="color:#1351B4"></span></label>' +
    '<input id="rl-pass" type="password" autocomplete="current-password" placeholder="••••••••"' +
    ' style="width:100%;padding:11px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:15px;outline:none" onkeydown="if(event.key===\'Enter\')doLoginRole()"/>' +
    '<button id="rl-btn-entrar" onclick="doLoginRole()"' +
    ' style="width:100%;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px">Entrar</button>' +
    '</div>' +
    '<div id="rl-err" style="margin-top:10px;color:#E52207;font-size:12px;text-align:center;display:none"></div>' +
    '</div>' +

    /* ── modo e-mail (admin) ── */
    '<div id="rl-modo-email" style="display:none">' +
    '<div style="margin-bottom:14px"><label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px">E-mail</label>' +
    '<input id="li-email" type="email" autocomplete="email" placeholder="usuario@marinha.mil.br"' +
    ' style="width:100%;padding:11px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:15px;outline:none"/></div>' +
    '<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px">Senha</label>' +
    '<input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••"' +
    ' style="width:100%;padding:11px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:15px;outline:none"/></div>' +
    '<button id="li-btn" onclick="doLoginMobile()"' +
    ' style="width:100%;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer">Entrar</button>' +
    '<div id="li-err" style="margin-top:10px;color:#E52207;font-size:12px;text-align:center;display:none"></div>' +
    '</div>' +

    '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">' +
    '<button id="rl-toggle" onclick="rlToggleModo()" style="background:none;border:none;color:#1351B4;font-size:12px;font-weight:700;cursor:pointer"><i class="fas fa-at mr1" aria-hidden="true"></i>Entrar com e-mail (admin)</button>' +
    '<button onclick="acessoLivre()" style="background:none;border:1.5px solid #ccc;color:#666;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;width:100%">' +
    '<i class="fas fa-eye" style="margin-right:6px"></i>Visualizar sem login</button>' +
    '</div>' +
    '</div></div>';
  document.body.appendChild(wrap);
};

function rlPick(i){
  _rlSel = CT_LOGINS[i];
  CT_LOGINS.forEach(function(_,j){
    var b = document.getElementById('rl-'+j);
    if(b) b.className = 'rl-btn'+(j===i?' sel':'');
  });
  var w = document.getElementById('rl-pass-wrap');
  if(w) w.style.display = 'block';
  var n = document.getElementById('rl-sel-nome');
  if(n) n.textContent = _rlSel.label;
  var p = document.getElementById('rl-pass');
  if(p){ p.value=''; p.focus(); }
  var e = document.getElementById('rl-err');
  if(e) e.style.display = 'none';
}

function rlToggleModo(){
  var f = document.getElementById('rl-modo-funcao');
  var m = document.getElementById('rl-modo-email');
  var t = document.getElementById('rl-toggle');
  var emailOn = m.style.display === 'none';
  m.style.display = emailOn ? 'block' : 'none';
  f.style.display = emailOn ? 'none' : 'block';
  t.innerHTML = emailOn ? '<i class="fas fa-th-large mr1" aria-hidden="true"></i>Entrar por função'
                        : '<i class="fas fa-at mr1" aria-hidden="true"></i>Entrar com e-mail (admin)';
}

async function doLoginRole(){
  if(!_rlSel) return;
  var pass = (document.getElementById('rl-pass')||{value:''}).value;
  var btn = document.getElementById('rl-btn-entrar');
  var err = document.getElementById('rl-err');
  if(!pass){ err.textContent='Digite a senha.'; err.style.display='block'; return; }
  btn.textContent = 'Entrando…'; btn.disabled = true; err.style.display = 'none';
  var r = await supa.auth.signInWithPassword({ email:_rlSel.email, password:pass });
  if(r.error){
    err.textContent = 'Senha incorreta para '+_rlSel.label+'.';
    err.style.display = 'block';
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     v5 — QR CODE (tela inicial) + IMPRESSÃO DA OS
     Lib QR: qrcode-generator 1.4.4 (MIT, Kazuhiko Arase) embutida.
═══════════════════════════════════════════════════════════════════ -->
<script src="/refrigeracao/qrcode.js"></script>
<style>
#qr-mini{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid #E0E0E0;color:#1351B4;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:5}
#qr-pop{position:fixed;inset:0;z-index:300;background:rgba(7,29,65,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
#qr-card{background:#fff;border-radius:18px;padding:22px;max-width:330px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#qr-svg-wrap svg{width:100%;max-width:250px;height:auto}
/* ── QR da ficha (D-tyx-01/D-tyx-02): teto de largura próprio, 200px, não
   compartilhado com o de 250px acima — a ficha divide a gaveta com quatro
   outros blocos, o modal desenha sozinho num cartão de 330px. */
.qr-ficha{text-align:center;margin:8px 0}
.qr-ficha svg{width:100%;max-width:200px;height:auto}
</style>
<script>
/* ══ QR CODE — tela inicial ══ */
var CT_APP_URL = 'https://pmoc-orcin.vercel.app/refrigeracao';
function qrGetUrl(){
  return urlBaseApp();
}
function qrSetUrl(v){
  try{ localStorage.setItem('pmoc_app_url', (v||'').trim()); }catch(e){}
  qrRender();
}
function qrRender(){
  var wrap = document.getElementById('qr-svg-wrap');
  if(!wrap) return;
  var url = qrGetUrl();
  if(!url){
    wrap.innerHTML = '<div style="padding:26px 12px;color:#999;font-size:12px;line-height:1.5"><i class="fas fa-link" style="font-size:22px;display:block;margin-bottom:8px;color:#DDD"></i>Informe abaixo o endereço (URL) onde o app está hospedado para gerar o QR.</div>';
    return;
  }
  try{
    var q = qrcode(0,'M');
    q.addData(url);
    q.make();
    wrap.innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true});
  }catch(e){
    wrap.innerHTML = '<div style="padding:20px;color:#E52207;font-size:12px">URL longa demais para o QR.</div>';
  }
}
function qrOpen(){
  var pop = document.createElement('div');
  pop.id = 'qr-pop';
  pop.onclick = function(ev){ if(ev.target===pop) qrClose(); };
  pop.innerHTML = '<div id="qr-card">' +
    '<img src="'+CT_LOGO_URI+'" style="width:44px;height:44px;margin-bottom:8px" alt=""/>' +
    '<div style="font-size:15px;font-weight:800;color:#071D41;margin-bottom:2px">Acesse pelo celular</div>' +

/* ── QR e etiquetas do equipamento ── */
/* Um gerador de SVG só, três destinos: o QR na tela da ficha, o QR embutido
   no papel (D-s3h-06) e o QR de cada etiqueta. urlBaseApp() é a única origem
   de URL — sempre sem query e sem hash (D-s3h-05) — para o QR "Acesse pelo
   celular" nunca herdar o ?equip= da página que o gerou. */
function urlBaseApp(){
  var salvo = '';
  try{ salvo = localStorage.getItem('pmoc_app_url')||''; }catch(e){}
  var base = linkSeguro(salvo);
  if(!base){
    base = (location.protocol==='http:'||location.protocol==='https:') ? (location.origin+location.pathname) : CT_APP_URL;
  }
  return base.split('#')[0].split('?')[0].replace(/\/$/,'');
}

function urlFichaEquip(id){
  var n = parseInt(id, 10);
  if(!isFinite(n)) return urlBaseApp();
  return urlBaseApp() + '?' + PARAM_FICHA + '=' + n;
}

function qrSvgDe(url, cell){
  if(typeof qrcode !== 'function') return '';
  try{
    var q = qrcode(0,'M');
    q.addData(url);
    q.make();
    return q.createSvgTag({cellSize: cell||4, margin: 2, scalable: true});
  }catch(e){
    return '';
  }
}

/* ── NFC: gravação de tag ── */
/* A tag guarda a mesma URL do QR (D-s3h-10) — não há formato próprio, e nada
   do lado do site é necessário para LER uma tag: o celular abre o navegador
   sozinho. O que o site faz é GRAVAR, e só onde funciona (D-s3h-11). */
var NFC_ESPERA_MS = 30000;

function nfcDisponivel(){
  return typeof window !== 'undefined' && ('NDEFReader' in window) && window.isSecureContext === true;
}

/* Puro, lista fechada por e.name (D-s3h-12) — cada frase diz o que fazer,
   nunca só "erro", e a palavra "undefined" nunca aparece no texto. */
function mensagemErroNfc(nome, mensagem){
  if(nome==='NotAllowedError') return 'Permissão negada ou tag somente-leitura. Autorize o NFC para este site e tente de novo.';
  if(nome==='NotSupportedError') return 'A tag não tem espaço para esta URL, ou o aparelho não grava.';
  if(nome==='NotReadableError') return 'O NFC está desligado no aparelho. Ligue e tente de novo.';
  if(nome==='NetworkError') return 'A tag foi afastada antes de terminar. Encoste e mantenha parado até o aviso.';
  if(nome==='AbortError') return 'Nenhuma tag encostada no tempo de espera. Toque de novo e encoste a tag na parte de trás do celular.';
  return 'Não foi possível gravar a tag' + (mensagem ? ' (' + mensagem + ')' : '') + '.';
}

async function gravarTagNfc(id){
  if(!nfcDisponivel()){
    showToast('Este aparelho/navegador não grava tags NFC — use a URL acima com um app de NFC', 'error');
    return false;
  }
  var url = urlFichaEquip(id); // a mesma URL do QR (D-s3h-10)
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, NFC_ESPERA_MS);
  showToast('Encoste a tag NFC no celular…', '');
  try{
    await new window.NDEFReader().write({records:[{recordType:'url', data:url}]}, {signal: ctrl.signal});
    showToast('Tag gravada para o equipamento #'+id, 'ok');
    return true;
  }catch(e){
    showToast(mensagemErroNfc(e && e.name, e && e.message), 'error');
    return false;
  }finally{
    clearTimeout(timer);
  }
}

/* Com suporte, o botão de gravação; sem suporte, nenhum botão — a instrução
   de gravar por app de NFC no lugar dele. Nos dois casos a URL já está
   visível no bloco 5, que é o caminho principal (D-s3h-10). */
function blocoNfc(id){
  if(nfcDisponivel()){
    return '<button class="btn-secondary" onclick="gravarTagNfc('+id+')"><i class="fas fa-wifi mr1" aria-hidden="true"></i>Gravar tag NFC</button>' +
      '<div style="font-size:11px;color:#888;margin-top:6px">Basta encostar uma tag regravável no celular.</div>';
  }
  return '<div style="font-size:11px;color:#888">A gravação pelo site só funciona no Chrome do Android, em https. Em qualquer outro aparelho, grave a URL acima como registro do tipo URL com um app de NFC (por exemplo, NFC Tools) — a tag guarda só esse endereço.</div>';
}

    '.num{text-align:right;white-space:nowrap}.tot td{font-weight:800;background:#F0F2F5}' +
    '.hdr{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #071D41;padding-bottom:8px}' +
    '.fotos{display:flex;gap:5mm;flex-wrap:wrap;margin:3mm 0}.fotos img{max-height:42mm;max-width:60mm;border:1px solid #CCC}' +
    '.ass{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:14mm}.ass div{border-top:1px solid #000;padding-top:2mm;text-align:center;font-size:8pt}' +
    '.meta{font-size:8pt;color:#888}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}' +
    '@page{size:A4;margin:12mm}' + estilo +
    '</style></head><body>' +

    '<div style="flex:1"><h1>'+esc(titulo)+'</h1>' +

    '<div style="text-align:right;font-size:9pt">'+subtitulo+'</div></div>' +

  var w = window.open('','_blank','width=900,height=700');

  w.document.write(h);
  w.document.close();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 700);

          '<td>'+esc(entry.desc||'')+'</td></tr>';
      }).join('') + '</table>';
  } else {
    corpo += '<div class="meta">Nenhuma OS/manutenção registrada ainda.</div>';
  }

  var qrFicha = qrSvgDe(urlFichaEquip(equipId), 3);

  imprimirDocumento({
    titulo: 'FICHA DO EQUIPAMENTO — #'+equipId,
    subtitulo: esc(e.predio)+' / '+esc(e.local) + qrFicha,
    estilo: '.hdr svg{width:20mm;height:20mm;display:block;margin-left:auto;margin-top:2mm}',
    corpo: corpo,
    assinaturas: [
      {papel:'Responsável técnico', nome:''},
      {papel:'Chefe da DME', nome:''}
    ]
  });
}
</script>
</body>
