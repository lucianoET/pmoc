<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<title>PMOC.Refrigeração | CMASM</title>

<style>
/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*,::before,::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #1351B4;outline-offset:2px}
#topbar :focus-visible,#bottom-nav :focus-visible,#fab:focus-visible{outline-color:#fff;outline-offset:-3px}
html,body{margin:0;padding:0;height:100%;background:#F0F2F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;color:#1B1B1B;overflow:hidden}

/* ═══════════════════════════════════════════
   LAYOUT PRINCIPAL
═══════════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#topbar{background:#071D41;color:#fff;padding:0 16px;display:flex;align-items:center;gap:10px;height:56px;flex-shrink:0;z-index:10}
#topbar .logo{font-size:13px;font-weight:800;letter-spacing:.5px;line-height:1.1;flex:1}
#topbar .logo span{display:block;font-weight:400;font-size:11px;opacity:.7}
#topbar-action{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:8px;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
#topbar-action:active{background:rgba(255,255,255,.15)}

#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0)}
#content::-webkit-scrollbar{display:none}

/* ═══════════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════════ */
#bottom-nav{
  background:#fff;
  border-top:1px solid #E0E0E0;
  display:flex;
  align-items:stretch;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0);
  z-index:10;
  box-shadow:0 -2px 8px rgba(0,0,0,.08)
}
.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:8px 4px;
  background:none;
  border:none;
  cursor:pointer;
  color:#888;
  font-size:10px;
  font-weight:600;
  letter-spacing:.2px;
  transition:color .15s;
  position:relative;
  -webkit-user-select:none;user-select:none
}
.nav-btn i{font-size:20px;line-height:1}
.nav-btn.active{color:#1351B4}
.nav-btn.active i{color:#1351B4}
.nav-badge{
  position:absolute;top:5px;right:50%;
  transform:translateX(calc(50% + 6px));
  background:#E52207;color:#fff;
  font-size:9px;font-weight:800;
  border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;
  line-height:14px
}

/* ═══════════════════════════════════════════
   PAGES
═══════════════════════════════════════════ */
.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}
.page::-webkit-scrollbar{display:none}
.page.active{display:block}

/* ═══════════════════════════════════════════
   KPI CARDS
═══════════════════════════════════════════ */
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi-wide{grid-column:1/-1}
.kpi-card{
  background:#fff;border-radius:12px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  border-left:4px solid #ccc;
  position:relative;overflow:hidden
}
.kpi-label{font-size:11px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:2px}
.kpi-sub{font-size:11px;color:#999}

/* ═══════════════════════════════════════════
   SECTION HEADERS
═══════════════════════════════════════════ */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px;padding:0 2px;flex-wrap:wrap}
.sec-title{font-size:13px;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:.4px}
.sec-count{background:#E8ECF5;color:#1351B4;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.sec-ordem{margin-left:auto;margin-right:8px;font-size:11px;font-weight:600;color:#555;border:1.5px solid #E0E0E0;border-radius:8px;background:#fff;padding:3px 6px;max-width:52%}
.sec-etq{background:#E8ECF5;color:#1351B4;border:none;border-radius:8px;width:26px;height:26px;font-size:12px;cursor:pointer;margin-right:8px;flex-shrink:0}

/* ═══════════════════════════════════════════
   EQUIPMENT CARDS
═══════════════════════════════════════════ */
.equip-card{
  background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;flex-direction:column;gap:6px;
  cursor:pointer;active-transform:.97;
  transition:transform .1s;
  border-left:4px solid #ddd
}
.equip-card:active{transform:scale(.98)}
.equip-card.ok{border-left-color:#168821}
.equip-card.nok{border-left-color:#E52207}
.equip-card.or{border-left-color:#B46800}
.equip-card.ver{border-left-color:#B46800}
.ec-row1{display:flex;align-items:flex-start;gap:8px}
.ec-num{font-size:11px;color:#aaa;font-weight:700;min-width:28px;padding-top:2px}
.ec-main{flex:1;min-width:0}
.ec-local{font-size:14px;font-weight:700;color:#1B1B1B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-predio{font-size:12px;color:#666;margin-top:1px}
.ec-status{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;line-height:1}
.pill-ok{background:#E6F4EA;color:#168821}
.pill-nok{background:#FDECEA;color:#E52207}
.pill-or{background:#FEF3E2;color:#B46800}
.pill-ver{background:#FEF3E2;color:#B46800}
.pill-crit{background:#FDECEA;color:#B71C1C}
.pill-alta{background:#FFF3E0;color:#E65100}
.pill-media{background:#E3F2FD;color:#1565C0}
.pill-baixa{background:#F1F8E9;color:#33691E}
.pill-tipo{background:#F3F4F6;color:#555}
.pill-sit-removido{background:#F3F4F6;color:#555}
.pill-sit-baixado{background:#FDECEA;color:#B71C1C}
.ec-info{display:flex;gap:12px;font-size:11px;color:#888}
.ec-info span i{margin-right:3px}

/* ═══════════════════════════════════════════
   SEARCH BAR
═══════════════════════════════════════════ */
.search-wrap{position:sticky;top:0;z-index:5;padding:8px 0 4px;background:#F0F2F5}
.search-box{
  width:100%;padding:10px 14px 10px 38px;
  border:1.5px solid #E0E0E0;border-radius:12px;
  font-size:15px;background:#fff;
  outline:none;transition:border .15s
}
.search-box:focus{border-color:#1351B4}
.search-wrap{position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-size:15px;pointer-events:none}

/* ═══════════════════════════════════════════
   FILTER CHIPS
═══════════════════════════════════════════ */
.chips{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid #E0E0E0;background:#fff;font-size:12px;font-weight:600;color:#666;cursor:pointer;transition:all .15s}
.chip.active{background:#1351B4;color:#fff;border-color:#1351B4}
.chip:active{opacity:.7}

/* ═══════════════════════════════════════════
   ALERT CARDS
═══════════════════════════════════════════ */
.alert-card{
  background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;align-items:flex-start;gap:10px;
  border-left:4px solid #E52207;cursor:pointer
}
.alert-card:active{transform:scale(.98)}
.alert-icon{font-size:18px;margin-top:2px;flex-shrink:0}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:13px;font-weight:700;color:#1B1B1B}
.alert-sub{font-size:12px;color:#666;margin-top:2px}
.alert-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;align-self:flex-start}

/* ═══════════════════════════════════════════
   PMOC PAGE
═══════════════════════════════════════════ */
.pmoc-row{
  background:#fff;border-radius:10px;padding:12px;margin-bottom:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  display:flex;align-items:center;gap:8px;cursor:pointer
}
.pmoc-row:active{transform:scale(.98)}
.pmoc-info{flex:1;min-width:0}
.pmoc-predio{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmoc-local{font-size:12px;color:#666}
.due-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.due-late{background:#FDECEA;color:#E52207}
.due-soon{background:#FFF8E1;color:#F57F17}
.due-ok{background:#E6F4EA;color:#168821}
.due-none{background:#F5F5F5;color:#999}

/* ═══════════════════════════════════════════
   DRAWER / DETAIL MODAL
═══════════════════════════════════════════ */
#drawer{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  pointer-events:none;
}
#drawer.open{pointer-events:all}
#drawer-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.45);
  opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)
}
#drawer.open #drawer-overlay{opacity:1}
#drawer-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:#fff;border-radius:20px 20px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)
}
#drawer.open #drawer-panel{transform:translateY(0)}
#drawer-handle{width:40px;height:4px;border-radius:2px;background:#DDD;margin:10px auto 0;flex-shrink:0}
#drawer-hdr{
  display:flex;align-items:flex-start;gap:12px;
  padding:16px 16px 12px;border-bottom:1px solid #F0F0F0;flex-shrink:0
}
#drawer-hdr-info{flex:1;min-width:0}
#dh-id{font-size:12px;color:#aaa;font-weight:600}
#dh-local{font-size:17px;font-weight:800;line-height:1.2;margin:2px 0 4px}
#dh-predio{font-size:13px;color:#666}
#drawer-body{overflow-y:auto;flex:1;padding:16px;-webkit-overflow-scrolling:touch}
#drawer-body::-webkit-scrollbar{display:none}
#drawer-footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid #F0F0F0;display:flex;gap:8px;flex-shrink:0}

/* ═══════════════════════════════════════════
   DETAIL SECTIONS
═══════════════════════════════════════════ */
.ds{background:#F8F9FA;border-radius:12px;padding:12px;margin-bottom:12px}
.ds-title{font-size:11px;font-weight:700;color:#1351B4;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dfield{margin-bottom:8px}
.dfield label{display:block;font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;font-weight:600}
.dfield .dval{font-size:14px;color:#1B1B1B;font-weight:500}
.dfields2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Log entries */
.log-entry{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #1351B4}
.le-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.le-date{font-size:12px;font-weight:700;color:#1B1B1B}
.le-tipo{font-size:11px;background:#E8ECF5;color:#1351B4;padding:2px 7px;border-radius:5px;font-weight:600}
.le-status{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
.le-desc{font-size:12px;color:#555;margin-top:4px;line-height:1.4}
.le-tec{font-size:11px;color:#999;margin-top:3px}
.le-chk{font-size:11px;color:#666;margin-top:4px}
.le-del{background:none;border:none;color:#E52207;cursor:pointer;padding:4px 8px;font-size:11px;font-weight:600;border-radius:6px;margin-top:4px}

/* Form elements */
.fgl{display:block;font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.fgi{width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#fff;outline:none;transition:border .15s}
.fgi:focus{border-color:#1351B4}
.fgs{width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#fff;outline:none;-webkit-appearance:none}
.fgt{width:100%;padding:10px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:14px;background:#fff;outline:none;resize:none;min-height:80px}
.fgt:focus,.fgi:focus,.fgs:focus{border-color:#1351B4}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fg-full{grid-column:1/-1}

/* Checklist */
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #F0F0F0;cursor:pointer}
.chk-item:last-child{border-bottom:none}
.chk-item input{width:18px;height:18px;margin:0;flex-shrink:0;margin-top:1px;accent-color:#1351B4}
.chk-item span{font-size:13px;color:#333;line-height:1.3}

/* Buttons */
.btn-primary{flex:1;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn-primary:active{background:#0C326F}
.btn-secondary{background:#F3F4F6;color:#333;border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-secondary:active{background:#E5E7EB}
.btn-danger{background:#FDECEA;color:#E52207;border:none;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-success{background:#168821;color:#fff;border:none;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}
.btn-sm{padding:7px 12px;font-size:12px;font-weight:700;border-radius:8px;border:none;cursor:pointer}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
#toast{
  position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0) + 12px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:#1B1B1B;color:#fff;padding:10px 20px;
  border-radius:100px;font-size:13px;font-weight:600;
  white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;z-index:200
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#168821}
#toast.error{background:#E52207}
#toast.del{background:#555}

/* ═══════════════════════════════════════════
   OS PAGE
═══════════════════════════════════════════ */
.os-card{
  background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);
  border-left:4px solid #1351B4;cursor:pointer
}
.os-card:active{transform:scale(.98)}
.os-card.concluida{border-left-color:#168821}
.os-card.parcial{border-left-color:#B46800}
.os-card.pendente{border-left-color:#E52207}
.os-card.cancelada{border-left-color:#999}
.os-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.os-id{font-size:11px;color:#aaa;font-weight:700}
.os-local{font-size:14px;font-weight:700;color:#1B1B1B}
.os-predio{font-size:12px;color:#888}
.os-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.os-desc{font-size:12px;color:#666;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ═══════════════════════════════════════════
   FAB
═══════════════════════════════════════════ */
#fab{
  position:fixed;right:16px;
  bottom:calc(70px + env(safe-area-inset-bottom,0) + 16px);
  width:52px;height:52px;border-radius:50%;
  background:#1351B4;color:#fff;border:none;
  font-size:22px;cursor:pointer;z-index:50;
  box-shadow:0 4px 16px rgba(19,81,180,.4);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s
}
#fab:active{transform:scale(.92)}

/* ═══════════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════════ */
.empty{text-align:center;padding:40px 20px;color:#999}
.empty i{font-size:40px;margin-bottom:12px;color:#DDD;display:block}
.empty p{font-size:14px;margin:0}

/* ═══════════════════════════════════════════
   MISC
═══════════════════════════════════════════ */
.mr1{margin-right:4px}
</style>

  id: 'id', area: 'area', predio: 'predio', local: 'local', tipo: 'tipo',
  fabricante: 'fabricante', modelo: 'modelo', btu: 'btu',

  refrigPermanente: 'refrig_permanente', horasDia: 'horas_dia', diasSemana: 'dias_semana',
  criticidade: 'criticidade', tensao: 'tensao', correnteNominal: 'corrente_nominal',
  patrimonio: 'patrimonio', dataFabricacao: 'data_fabricacao', dataInstalacao: 'data_instalacao',
  ultimaManutencao: 'ultima_manutencao', refrigerante: 'refrigerante',

/* Lista fechada do que o formulário de cadastro GRAVA (D-q57-08). `lat`/`lon`/
   `localId` ficam de fora porque posição é trabalho de campo do /mapa (D-03);
   `ultimaManutencao` fica de fora porque é derivada da conferência da OS
   (atualizarUltimaManutencao) — um formulário de cadastro que gravasse
   qualquer um dos dois desfaria em silêncio o trabalho de outro módulo. `id`
   fica de fora porque nunca se edita a própria chave. `situacao`/
   `dataRemocao`/`dataBaixa` ficam de fora pelo MESMO motivo (D-uyz-12): elas
   mudam só por conferência de OS de movimentação (aplicarInstalacao/
   aplicarRemocao) — um <select> de situação no cadastro deixaria qualquer
   gestor dar baixa numa máquina sem OS, sem checklist de partes, sem
   assinatura e sem a trava de admin. */
var EQUIP_EDITAVEIS = [
  'area', 'predio', 'local', 'tipo', 'fabricante', 'modelo', 'btu',
  'funciona', 'estado', 'criticidade', 'tensao', 'correnteNominal',
  'patrimonio', 'dataFabricacao', 'dataInstalacao', 'refrigerante',
  'link', 'manualUrl', 'refrigPermanente', 'horasDia', 'diasSemana', 'obs'
];
var EQUIP_NUMERICOS = ['btu', 'tensao', 'horasDia', 'diasSemana'];

/* Caminho inverso de dbToEquip: duas guardas (chave fora de CAMPOS_EQUIP OU
   fora de EQUIP_EDITAVEIS caem juntas), texto vazio vira null (um
   data_fabricacao:'' é erro de cast no Postgres; um link:'' viola a trava de
   esquema de URL por nada) — nunca texto vazio é gravado. */
function equipParaDb(patch) {
  var alvo = {};
  Object.keys(patch || {}).forEach(function(k){
    if (EQUIP_EDITAVEIS.indexOf(k) < 0 || !CAMPOS_EQUIP.hasOwnProperty(k)) return;
    var coluna = CAMPOS_EQUIP[k];
    var v = patch[k];
    if (v === '' || v === undefined) { alvo[coluna] = null; return; }
    if (k === 'correnteNominal') { var f = parseFloat(v); alvo[coluna] = isNaN(f) ? null : f; return; }
    if (EQUIP_NUMERICOS.indexOf(k) >= 0) { var n = parseInt(v, 10); alvo[coluna] = isNaN(n) ? null : n; return; }
    alvo[coluna] = v;
  });
  return alvo;
}

/* D-q57-09: mesma barreira do `check` do banco, escrita na tela para o
   usuário ver o erro antes de mandar. Sem trim, sem normalização — o valor é
   comparado como veio. */
function linkSeguro(u) {
  if (typeof u !== 'string') return '';
  return /^https?:\/\//i.test(u) ? u : '';
}

/* Mesmo nome do helper equivalente em maquinas/app.js, de propósito — mesma
   ideia, vale ser reconhecível. Uma lista, quatro pontos de chamada (botão da
   ficha, abertura do formulário, gravação e o campo de estado no formulário). */
function podeEditarCadastro() {
  if (somenteLeitura()) return false;
  var r = ctUser ? ctUser.role : '';
  return r === 'admin' || r === 'gestor';
}

/* D-uyz-07: a baixa exige cargo admin, não gestor — desinstalar é ato de
   manutenção, dar baixa é ato patrimonial formal. Uma lista, os pontos de
   chamada todos citando-a: o <select> de destino da remoção, o botão, o
   salvar (salvarMovOS) e a conferência (aplicarRemocao). */
function podeDarBaixa() {
  if (somenteLeitura()) return false;
  var r = ctUser ? ctUser.role : '';
  return r === 'admin';
}

/* ── ponte de campos de logs_manutencao ── */
/* Todo o camelCase do app ↔ snake_case do Postgres de logs_manutencao passa
   por este mapa só — lido por dbToLog (entrada) e logParaDb (saída). Um campo
   fora daqui é gravado como null sem erro nenhum (lição já paga em
   /calibracao) — por isso o gate compara este mapa coluna a coluna com a
   migração 40 + as colunas da migração 04. campanha_id fica deliberadamente
   fora do mapa: o app nunca leu nem gravou essa coluna. */
var CAMPOS_LOG = {
  id: 'id',
  equipId: 'equip_id',
  date: 'data_os',
  tipo: 'tipo',
  status: 'status',
  tecnico: 'tecnico',
  desc: 'descricao',
  checklist: 'checklist',
  fotos: 'fotos',
  insuflamento: 'temp_insuflamento',
  retorno: 'temp_retorno',
  deltaT: 'delta_t',
  corrente: 'corrente_medida',
  pressao: 'pressao_succao',
  capMarcha: 'capacitor_marcha',
  capPartida: 'capacitor_partida',
  tensaoMedida: 'tensao_medida',
  delineadoPor: 'delineado_por',
  delineadoEm: 'delineado_em',
  aprovador: 'aprovador',
  dataAprovacao: 'data_aprovacao',
  parecerAprovacao: 'parecer_aprovacao',
  conferente: 'conferente',
  dataConferencia: 'data_conferencia',
  parecerConferencia: 'parecer_conferencia',
  localDestinoId: 'local_destino_id',
  localOrigemId: 'local_origem_id',
  equipSubstituidoId: 'equip_substituido_id',
  destinoRemocao: 'destino_remocao'
};

function dbToLog(r) {
  var o = {};
  Object.keys(CAMPOS_LOG).forEach(function(k){ o[k] = r[CAMPOS_LOG[k]]; });
  o.tecnico = o.tecnico || '';
  o.desc = o.desc || '';
  o.checklist = o.checklist || [];
  o.fotos = o.fotos || [];
  return o;
}

function logParaDb(patch) {
  var alvo = {};
  Object.keys(patch).forEach(function(k){
    if (CAMPOS_LOG.hasOwnProperty(k)) alvo[CAMPOS_LOG[k]] = patch[k];
  });
  return alvo;
}

/* ── CAMADA DE DADOS SUPABASE ── */
var _logCache = {};

async function loadDataFromSupabase() {
  try {
    var { data, error } = await supa.from('equipamentos').select('*').order('id');
    if (error) throw error;
    DATA = data.map(dbToEquip);
    localStorage.setItem('pmoc_cache_v1', JSON.stringify(DATA));
    return true;
  } catch(e) {
    var s = localStorage.getItem('pmoc_cache_v1');
    if (s) { DATA = JSON.parse(s); return true; }
    return false;
  }
}

async function loadLogsFromSupabase() {
  try {
    var { data, error } = await supa.from('logs_manutencao')
      .select('*').order('data_os', { ascending: false });
    if (error) throw error;
    _logCache = {};
    data.forEach(function(r) {
      if (!_logCache[r.equip_id]) _logCache[r.equip_id] = [];
      _logCache[r.equip_id].push(dbToLog(r));
    });
    return true;
  } catch(e) {
    // fallback legado
    try {
      var s = localStorage.getItem('cmasm13_log_v1');
      if (s) {
        var lg = JSON.parse(s);
        _logCache = {};
        Object.keys(lg).forEach(function(id) { _logCache[parseInt(id)] = lg[id]; });
      }
    } catch(e2) {}
    return false;
  }
}

// Substitui getLog / getEquipLog / getLatestLogDate (serão redefinidas abaixo)
function getLog(){ return _logCache; }
function getEquipLog(id){ return _logCache[id] || []; }
function getLatestLogDate(id){
  var e = getEquipLog(id);
  if (!e.length) return null;
  return e.sort(function(a,b){return b.date.localeCompare(a.date);})[0].date;
}

async function addLogEntryAsync(equipId, entry) {
  try {
    // D-uyz: as quatro colunas de movimentação passam pela ponte única
    // (logParaDb) em vez de mais quatro nomes enumerados à mão aqui — numa
    // OS de manutenção comum elas vêm undefined e o JSON enviado nem as
    // menciona (undefined não serializa), então nada muda para ela.
    var extraMov = logParaDb({
      localDestinoId: entry.localDestinoId,
      localOrigemId: entry.localOrigemId,
      equipSubstituidoId: entry.equipSubstituidoId,
      destinoRemocao: entry.destinoRemocao
    });
    var payload = Object.assign({
      equip_id: equipId, data_os: entry.date, tipo: entry.tipo,
      status: entry.status, tecnico: entry.tecnico || null,
      descricao: entry.desc || null, checklist: entry.checklist || []
    }, extraMov);
    var { data, error } = await supa.from('logs_manutencao').insert(payload).select().single();
    if (error) throw error;
    if (!_logCache[equipId]) _logCache[equipId] = [];
    _logCache[equipId].unshift(dbToLog(data));
    return data.id;
  } catch(e) {
    showToast('Erro ao salvar OS', 'error');
    return null;
  }
}

async function delLogEntryAsync(equipId, logId) {
  try {
    var { error } = await supa.from('logs_manutencao').delete().eq('id', logId);
    if (error) throw error;
    if (_logCache[equipId])
      _logCache[equipId] = _logCache[equipId].filter(function(e){return e.id!==logId;});
    return true;
  } catch(e) { return false; }
}

/* ── fluxo da OS interna: porta de escrita ── */
var MAN_FLUXO_OK = false;

async function manSondarEsquema() {
  var r = await supa.from('logs_manutencao').select('id,fotos,aprovador,conferente').limit(1);
  MAN_FLUXO_OK = !r.error;
  return MAN_FLUXO_OK;
}

async function manAtualizarOS(logId, equipId, patch, msg) {
  var r = await supa.from('logs_manutencao').update(logParaDb(patch)).eq('id', logId).select().single();
  if(r.error){ showToast('Erro: '+r.error.message,'error'); return false; }
  var novo = dbToLog(r.data);
  var lista = _logCache[equipId];
  if (lista) {
    var i = lista.findIndex(function(e){ return e.id === logId; });
    if (i >= 0) lista[i] = novo;
  }
  if (msg) showToast(msg, 'ok');
  return true;
}

/* D-uyz-13: sonda PRÓPRIA, separada de manSondarEsquema/MAN_FLUXO_OK.
   Estender manSondarEsquema para pedir também as colunas da migração 42
   desligaria o fluxo INTEIRO num banco com 40+41 e sem 42 — uma regressão
   do que entrou hoje. São duas perguntas diferentes; são duas sondas. O
   terceiro segmento exige MAN_FLUXO_OK && MOV_OK. */
var MOV_OK = false;

async function movSondarEsquema() {
  var r = await supa.from('logs_manutencao').select('id,local_destino_id,destino_remocao').limit(1);
  MOV_OK = !r.error;
  return MOV_OK;
}

// carregarPerfil só é CHAMADA em initAppOnce, depois de todos os scripts terem rodado — por isso pode atribuir a ctUser mesmo estando num bloco <script> anterior ao que a declara.
async function carregarPerfil() {
  var s = await supa.auth.getSession();
  var uid = s.data && s.data.session ? s.data.session.user.id : null;

  var r = await supa.from('usuarios').select('*').eq('auth_id', uid).maybeSingle();
  ctUser = r.data || null;
}

/* ── REALTIME ── */
function setupRealtime() {
  supa.channel('pmoc-mobile')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'equipamentos' }, function(p) {
      if (p.eventType === 'UPDATE') {
        var i = DATA.findIndex(function(r){return r.id===p.new.id;});
        if (i>=0) DATA[i] = dbToEquip(p.new);
      } else if (p.eventType === 'INSERT') {
        if (!DATA.find(function(r){return r.id===p.new.id;})) DATA.push(dbToEquip(p.new));
      } else if (p.eventType === 'DELETE') {
        DATA = DATA.filter(function(r){return r.id!==p.old.id;});
      }
      renderDash(); renderInv();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'logs_manutencao' }, function(p) {
      if (p.eventType === 'INSERT') {
        var eid = p.new.equip_id;
        if (!_logCache[eid]) _logCache[eid] = [];
        if (!_logCache[eid].find(function(e){return e.id===p.new.id;}))
          _logCache[eid].unshift(dbToLog(p.new));
      } else if (p.eventType === 'UPDATE') {
        // equipamento vem no payload, mas o cache é por equipamento — varre as chaves.
        Object.keys(_logCache).forEach(function(id){
          var i = _logCache[id].findIndex(function(e){return e.id===p.new.id;});
          if (i>=0) _logCache[id][i] = dbToLog(p.new);
        });
      } else if (p.eventType === 'DELETE') {
        Object.keys(_logCache).forEach(function(id){
          _logCache[id] = _logCache[id].filter(function(e){return e.id!==p.old.id;});
        });
      }
      renderDash();
      var pgOs = el('page-os');
      if (pgOs && pgOs.classList.contains('active')) renderOS();
    })
    .subscribe();
}

<script>
/* ═══════════════════════════════════════════════════════════
   DATA & STORAGE
═══════════════════════════════════════════════════════════ */
var STORAGE_KEY = 'cmasm13_data_v1';
var LOG_KEY     = 'cmasm13_log_v1';

/* v2: INITIAL_DATA legado removido — os equipamentos são carregados do
   Supabase (loadDataFromSupabase) com fallback no cache localStorage. */
var INITIAL_DATA = [];

var PMOC_INT = {
  'CRÍTICA': {inspecao:30,  preventiva:90,  revisao:180},
  'ALTA':    {inspecao:60,  preventiva:180, revisao:365},
  'MÉDIA':   {inspecao:90,  preventiva:365, revisao:730},
  'BAIXA':   {inspecao:180, preventiva:365, revisao:730}
};
var MAINT_TIPOS = ['INSPEÇÃO','PREVENTIVA','CORRETIVA','REVISÃO','LIMPEZA','RECARGA GÁS','SUBSTITUIÇÃO'];
var CHECKLIST = {
  'SPLIT':['Limpeza dos filtros de ar da evaporadora','Limpeza e desobstrução do dreno de condensado','Verificação do nível de gás refrigerante','Medição de tensão (V) e corrente (A)','Verificação do funcionamento (termostato, modos)','Limpeza da serpentina evaporadora','Inspeção de vazamentos no circuito frigorífico','Verificação de contactores e capacitores','Lubrificação das partes móveis'],
  'PISO/TETO':['Limpeza dos filtros de ar','Limpeza e desobstrução do dreno de condensado','Verificação do nível de gás refrigerante','Medição de tensão (V) e corrente (A)','Verificação do funcionamento geral','Limpeza da serpentina evaporadora e condensadora','Inspeção de vazamentos','Verificação de contactores e capacitores','Lubrificação das partes móveis'],
  'SELF CONTAINED':['Verificação das pressões de alta e baixa (manômetro)','Inspeção e ajuste da correia de transmissão','Limpeza e inspeção dos filtros de ar','Medição de tensão, corrente e potência','Verificação do nível de gás refrigerante','Inspeção do circuito frigorífico (vazamentos)','Limpeza da serpentina condensadora','Verificação dos controles e termostatos','Inspeção do quadro elétrico (fusíveis, contactores)','Análise de vibração e ruídos anormais','Verificação do sistema de drenagem','Lubrificação de rolamentos e partes móveis'],
  'JANELA':['Limpeza do filtro de ar','Verificação do funcionamento geral','Limpeza geral da unidade','Verificação da vedação na parede','Medição de corrente (A)','Verificação de vibração excessiva']
};
var CRIT_COLORS = {'CRÍTICA':'#E52207','ALTA':'#E65100','MÉDIA':'#1565C0','BAIXA':'#33691E'};

var DATA = [];
var invChip = 'todos', osChip = 'todos', pmocChip = 'todos';
var invOrdem = 'local';

/* ═══════════════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════════════ */
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e?e.value:''; }
function fmtDate(iso){ if(!iso)return''; try{var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('pt-BR');}catch(e){return iso;} }
function today(){ return new Date().toISOString().slice(0,10); }

function showToast(msg, type){
  var t = el('toast');
  t.textContent = msg;
  t.className = 'show ' + (type||'');
  setTimeout(function(){ t.className = type||''; }, 2200);
}

function autoCrit(e){
  if(e.criticidadeManual) return e.criticidade;
  if(equipInoperante(e)) return e.criticidade;
  return e.criticidade;
}

/* ── Persistência → delegada para camada Supabase (ver bloco SDK) ── */
function addLogEntry(e,r){ console.warn('addLogEntry sync obsoleto'); }
function delLogEntry(e,i){ console.warn('delLogEntry sync obsoleto'); }
function saveLog(l){ /* no-op */ }

function nextPmoc(e, tipo){
  var crit = autoCrit(e);
  var interval = (PMOC_INT[crit]||PMOC_INT['BAIXA'])[tipo];
  var lastDate = e.ultimaManutencao || getLatestLogDate(e.id);
  if(!lastDate) return null;
  var d = new Date(lastDate+'T12:00:00');
  d.setDate(d.getDate()+interval);
  return d;
}

/* ── estado do equipamento: vocabulário OP/INOP/OR ── */
/* D-q57-01/02/06: o estado da máquina passa a ser um vocabulário de três
   palavras (era OK/NOK). EQUIP_EQUIVALENCIA existe para o frontend poder
   ir a produção ANTES do SQL (migração 41) — o banco continua respondendo
   OK/NOK até alguém rodar o .sql, e esta tradução faz a tela ler os dois
   vocabulários sem diferença nenhuma para o usuário (D-q57-06). Ela some
   no dia em que alguém confirmar que não há mais nenhuma linha em OK/NOK.
   `estado` (a coluna, não este bloco) NÃO é reaproveitada — guarda a
   idade aparente do aparelho, e a tela rotula esse campo "Idade aparente",
   nunca "Estado" (D-q57-02). */
var EQUIP_ESTADOS = {
  'OP':   {rotulo:'Operante',                curto:'OP',   classe:'pill-ok',  icone:'fa-check'},
  'OR':   {rotulo:'Operando com restrições',  curto:'OR',   classe:'pill-or',  icone:'fa-exclamation-triangle'},
  'INOP': {rotulo:'Inoperante',               curto:'INOP', classe:'pill-nok', icone:'fa-times'}
};
var EQUIP_ORDEM = ['OP','OR','INOP'];
var EQUIP_EQUIVALENCIA = {'OK':'OP','NOK':'INOP'};

/* Comparação estrita contra a lista fechada, sem trim, sem conversão de
   caixa, sem conversão para texto (ASVS V5) — mesma técnica de
   normalizarFlora/normalizarTema no resto do projeto. hasOwnProperty em
   vez de acesso direto: o valor vem do banco, e `constructor`/`__proto__`
   não podem devolver função nenhuma. */
function normalizarEstadoEquip(v){
  if (EQUIP_ESTADOS.hasOwnProperty(v)) return v;
  if (EQUIP_EQUIVALENCIA.hasOwnProperty(v)) return EQUIP_EQUIVALENCIA[v];
  return null;
}
function equipEstado(e){ return normalizarEstadoEquip(e && e.funciona); }
function equipOperante(e){ return equipEstado(e)==='OP'; }
function equipComRestricao(e){ return equipEstado(e)==='OR'; }
function equipInoperante(e){ return equipEstado(e)==='INOP'; }
function rotuloEstadoEquip(v){
  var n = normalizarEstadoEquip(v);
  return n ? EQUIP_ESTADOS[n].rotulo : 'Não cadastrado';
}

/* Ponto único do vocabulário de estado na tela — desenha os três estados
   a partir de EQUIP_ESTADOS; valor desconhecido ou nulo cai na pílula
   "VERIFICAR" de sempre, com o valor original escapado no title (não é
   estado inventado sendo exibido como texto, é um atributo auxiliar). */
function statusPill(fn){
  var n = normalizarEstadoEquip(fn);
  if(!n) return '<span class="pill pill-ver" title="'+esc(fn==null?'':String(fn))+'"><i class="fas fa-question" aria-hidden="true"></i> VERIFICAR</span>';
  var cfg = EQUIP_ESTADOS[n];
  return '<span class="pill '+cfg.classe+'"><i class="fas '+cfg.icone+'" aria-hidden="true"></i> '+esc(cfg.curto)+'</span>';
}

/* ── situação patrimonial do equipamento: instalado/removido/baixado ── */
/* D-uyz-05/11/20: `situacao` é um vocabulário fechado de três palavras,
   ORTOGONAL a `funciona` — uma diz onde a máquina está no ciclo
   patrimonial, a outra diz se ela funciona. `baixado` é terminal: uma OS
   de instalação recusa máquina baixada (D-uyz-14).
   `instalado` não desenha pílula nenhuma na lista — é o caso normal de
   171 de 171 hoje; uma pílula em todo cartão seria ruído. As classes
   novas chamam-se pill-sit-removido/pill-sit-baixado — NUNCA pill-baixa,
   que já existe e é a criticidade BAIXA. */
var EQUIP_SITUACOES = {
  'instalado': {rotulo:'Instalado',           curto:'INSTALADO', classe:'',                  icone:'fa-check'},
  'removido':  {rotulo:'Removido — sem local', curto:'REMOVIDO',  classe:'pill-sit-removido', icone:'fa-box'},
  'baixado':   {rotulo:'Baixado',              curto:'BAIXADO',   classe:'pill-sit-baixado',  icone:'fa-ban'}
};
var SITUACAO_ORDEM = ['instalado','removido','baixado'];

/* D-uyz-11: duas respostas DIFERENTES para dois problemas diferentes.
   undefined/null/'' → 'instalado': é o banco SEM a migração 42, ou uma
   consulta que não pediu a coluna — nesse caso as 171 máquinas de hoje
   ESTÃO instaladas; traduzir para null faria os KPIs zerarem no minuto
   do deploy, sem erro nenhum no console. Texto fora da lista fechada →
   null, que a tela mostra como desconhecido — é lixo, não ausência. Sem
   trim, sem conversão de caixa, sem conversão para texto (ASVS V5) —
   mesma técnica de normalizarEstadoEquip/normalizarFlora. */
function normalizarSituacaoEquip(v){
  if (v===undefined || v===null || v==='') return 'instalado';
  if (EQUIP_SITUACOES.hasOwnProperty(v)) return v;
  return null;
}
function equipSituacao(e){ return normalizarSituacaoEquip(e && e.situacao); }
function equipInstalado(e){ return equipSituacao(e)==='instalado'; }
function equipRemovido(e){ return equipSituacao(e)==='removido'; }
function equipBaixado(e){ return equipSituacao(e)==='baixado'; }
function rotuloSituacaoEquip(v){
  var n = normalizarSituacaoEquip(v);
  return n ? EQUIP_SITUACOES[n].rotulo : 'Situação desconhecida';
}
/* instalado devolve string vazia — nenhuma pílula no caso normal. */
function situacaoPill(v){
  var n = normalizarSituacaoEquip(v);
  if (!n || n==='instalado') return '';
  var cfg = EQUIP_SITUACOES[n];
  return '<span class="pill '+cfg.classe+'"><i class="fas '+cfg.icone+'" aria-hidden="true"></i> '+esc(cfg.curto)+'</span>';
}

/* Ponto único que o resto da tela chama para excluir removido/baixado das
   operações — KPIs, alertas, PMOC, gráficos e os dois seletores de
   equipamento das OS (D-uyz-10). Preserva a ordem da lista recebida. */
function equipamentosOperacionais(lista){
  return (lista||[]).filter(equipInstalado);
}

/* Quantos removidos/baixados casam com a mesma busca textual de
   filtrarInventario — para a tela vazia poder DIZER que eles existem em
   vez de calar (D-uyz-10). Pura, sem DOM. */
function contarNaoOperacionais(dados, busca){
  var q = (busca||'').toLowerCase().trim();
  return (dados||[]).filter(function(e){
    if (equipInstalado(e)) return false;
    if (q && !((e.local||'').toLowerCase().includes(q)||(e.predio||'').toLowerCase().includes(q)||(e.fabricante||'').toLowerCase().includes(q))) return false;
    return true;
  }).length;
}

/* ── alertas: contagem única ── */
function equipSemHist(e){
  return !e.ultimaManutencao && !getLatestLogDate(e.id);
}
function equipVencido(e, agora){
  agora = agora || new Date();
  var nx = nextPmoc(e,'inspecao');
  return !!nx && nx < agora;
}
function alertasPmoc(lista, agora){
  agora = agora || new Date();
  var nok=[], vencidos=[], semHist=[], restricao=[], todos=[];
  lista.forEach(function(e){
    var eNok = equipInoperante(e);
    var eRestricao = equipComRestricao(e); // D-q57-07: OR não conta em nok — "Fora de Operação" nomeia um fato específico
    var eVencido = equipVencido(e, agora);
    var eSemHist = equipSemHist(e);
    if(eNok) nok.push(e);
    if(eRestricao) restricao.push(e);
    if(eVencido) vencidos.push(e);
    if(eSemHist) semHist.push(e);
    if(eNok || eRestricao || eVencido || eSemHist) todos.push(e);
  });
  return {nok:nok, vencidos:vencidos, semHist:semHist, restricao:restricao, todos:todos, total:todos.length};
}
function contarOSPendentes(entradas){
  return entradas.filter(function(o){ return o.entry && manPendente(o.entry.status); }).length;
}

function dueBadgeHtml(d){
  if(!d) return '<span class="due-badge due-none">Sem hist.</span>';
  var now=new Date(); var diff=Math.round((d-now)/86400000);
  if(diff<0) return '<span class="due-badge due-late">Vencida '+Math.abs(diff)+'d</span>';
  if(diff<30) return '<span class="due-badge due-soon">'+diff+'d</span>';
  return '<span class="due-badge due-ok">'+fmtDate(d.toISOString().slice(0,10))+'</span>';
}

function critPill(crit){
  var map={'CRÍTICA':'pill-crit','ALTA':'pill-alta','MÉDIA':'pill-media','BAIXA':'pill-baixa'};
  return '<span class="pill '+(map[crit]||'')+'">'+esc(crit)+'</span>';
}
/* statusPill mora no bloco "estado do equipamento: vocabulário OP/INOP/OR", logo acima de "alertas: contagem única" — ponto único do vocabulário. */
/* ── fluxo da OS interna: vocabulário e transições ── */
/* Paleta nomeada por tom, referenciada por nome (reusa os hexadecimais que já
   existem no arquivo, na tabela CT_STATUS da contratação). CT_STATUS não é
   tocada — o gate da trilha recorta aquela tabela. */
var MAN_TONS = {
  info:   {bg:'#E3F2FD', fg:'#1565C0'},
  ok:     {bg:'#E6F4EA', fg:'#168821'},
  warn:   {bg:'#FEF3E2', fg:'#B46800'},
  erro:   {bg:'#FDECEA', fg:'#E52207'},
  neutro: {bg:'#F5F5F5', fg:'#999'}
};

/* Os rótulos nomeiam o que a etapa está ESPERANDO — a pergunta de quem varre
   a lista (idioma já usado em maquinas/contratacoes.js). step é 0..5, -1 para
   o cancelamento. */
var MAN_STATUS = {
  'ABERTA':       {label:'Aberta — aguardando delineamento',      tom:'info',  step:0},
  'DELINEAMENTO': {label:'Em delineamento',                       tom:'info',  step:1},
  'APROVACAO':    {label:'Aguardando aprovação do gestor',        tom:'warn',  step:2},
  'EM_EXECUCAO':  {label:'Em execução',                           tom:'info',  step:3},
  'EXECUTADA':    {label:'Executada — aguardando conferência',    tom:'warn',  step:4},
  'CONFERIDA':    {label:'Conferida',                             tom:'ok',    step:5},
  'CANCELADA':    {label:'Cancelada',                             tom:'neutro',step:-1}
};
var MAN_STEPS = ['Abertura','Delineam.','Aprovação','Execução','Executada','Conclusão'];
var MAN_ORDEM = ['ABERTA','DELINEAMENTO','APROVACAO','EM_EXECUCAO','EXECUTADA','CONFERIDA'];

/* D-l7n-02: a equivalência AGRUPA (filtro, badge, classe do cartão), nunca
   RENOMEIA — o rótulo de uma linha sem fluxo continua sendo a palavra da
   própria linha (manRotulo/statusPillOS). */
var MAN_EQUIVALENCIA = {'PENDENTE':'ABERTA', 'PARCIAL':'EM_EXECUCAO', 'CONCLUÍDA':'CONFERIDA'};

/* Cargos que podem executar cada ação do fluxo interno (D-l7n-05) — empresa e
   fiscal são papéis do ciclo de contratação (ctCan), não deste. */
var MAN_ACOES_CARGO = {
  abrir:    ['admin','gestor','tecnico'],
  delinear: ['admin','gestor','tecnico'],
  executar: ['admin','gestor','tecnico'],
  aprovar:  ['admin','gestor'],
  conferir: ['admin','gestor'],
  cancelar: ['admin','gestor']
};
/* Ação exigida para MOVER a OS para cada estado — usada pela guarda dupla de
   manMudarStatus. */
var MAN_ACAO_DESTINO = {
  'ABERTA':       'abrir',
  'DELINEAMENTO': 'delinear',
  'APROVACAO':    'delinear',
  'EM_EXECUCAO':  'aprovar',
  'EXECUTADA':    'executar',
  'CONFERIDA':    'conferir',
  'CANCELADA':    'cancelar'
};

function manNormalizar(s){
  if (MAN_EQUIVALENCIA.hasOwnProperty(s)) return MAN_EQUIVALENCIA[s];
  return s; // conhecido ou desconhecido: devolvido intacto
}
function manSemFluxo(s){ return MAN_EQUIVALENCIA.hasOwnProperty(s); }
function manEhTerminal(s){ var n = manNormalizar(s); return n==='CONFERIDA' || n==='CANCELADA'; }
function manPendente(s){ return !manEhTerminal(manNormalizar(s)); } // desconhecido conta como pendente, de propósito
function manPasso(s){ var n = manNormalizar(s); return MAN_STATUS[n] ? MAN_STATUS[n].step : -1; }
function manRotulo(s){
  if (manSemFluxo(s)) return s;             // D-l7n-02: a palavra da própria linha, nunca a do estado equivalente
  if (MAN_STATUS[s]) return MAN_STATUS[s].label;
  return s;                                  // desconhecido: o próprio id
}
function manProximos(s){
  var n = manNormalizar(s);
  if (manEhTerminal(n)) return [];
  var i = MAN_ORDEM.indexOf(n);
  var out = [];
  if (i>=0 && i+1<MAN_ORDEM.length) out.push(MAN_ORDEM[i+1]); // seguinte
  if (i>0) out.push(MAN_ORDEM[i-1]);                           // anterior
  out.push('CANCELADA');
  return out;
}
function manPodeIrPara(atual, destino){ return manProximos(atual).indexOf(destino) >= 0; }
function manDeltaT(insuflamento, retorno){
  if (insuflamento===undefined||insuflamento===null||insuflamento===''||retorno===undefined||retorno===null||retorno==='') return null;
  var ins = parseFloat(insuflamento), ret = parseFloat(retorno);
  if (isNaN(ins) || isNaN(ret)) return null;
  return Math.round((ret-ins)*10)/10; // ΔT é sempre derivado, nunca digitado
}
function manPodeCargo(acao, cargo){ return (MAN_ACOES_CARGO[acao]||[]).indexOf(cargo) >= 0; }
function manClasseCard(s){
  var n = manNormalizar(s);
  if (n==='CONFERIDA') return 'concluida';
  if (n==='CANCELADA') return 'cancelada';
  if (n==='ABERTA') return 'pendente';
  return 'parcial';
}

/* Régua com dois consumidores (D-l7n-10): o corpo de ctTimeline de hoje,
   parametrizado. ctTimeline (bloco da contratação) vira a casca que injeta
   CT_STEPS/CT_STATUS — CT_STATUS não é tocada. */
function reguaPassos(passoAtual, passos){
  if (passoAtual===-1) return '<div style="font-size:12px;color:#999;margin-bottom:8px"><i class="fas fa-ban mr1" aria-hidden="true"></i>Cancelada</div>';
  var h = '<div class="ct-timeline">';
  passos.forEach(function(s,i){
    var cls = i<passoAtual?'done':(i===passoAtual?'curr':'');
    h += '<div class="ct-step '+cls+'"><div class="ct-dot">'+(i<passoAtual?'<i class="fas fa-check" aria-hidden="true"></i>':(i+1))+'</div><span>'+s+'</span></div>';
    if(i<passos.length-1) h += '<div class="ct-bar '+(i<passoAtual?'done':'')+'"></div>';
  });
  return h+'</div>';
}

function statusPillOS(s){
  if (manSemFluxo(s)) {
    var clsLeg = s==='CONCLUÍDA'?'pill-ok':s==='PARCIAL'?'pill-ver':'pill-nok';
    return '<span class="pill '+clsLeg+'" title="Registro direto — não percorreu as etapas de aprovação">'+esc(s)+'</span>';
  }
  if (MAN_STATUS[s]) {
    var t = MAN_TONS[MAN_STATUS[s].tom] || MAN_TONS.neutro;
    return '<span class="pill" style="background:'+t.bg+';color:'+t.fg+'">'+esc(MAN_STATUS[s].label)+'</span>';
  }
  var tu = MAN_TONS.neutro;
  return '<span class="pill" style="background:'+tu.bg+';color:'+tu.fg+'">'+esc(s)+'</span>';
}

/* Dois wrappers que leem estado global — o gate testa a versão pura acima. */
function manPode(acao){
  if (somenteLeitura()) return false;
  return manPodeCargo(acao, ctUser && ctUser.role);
}
function manCargoAtual(){ return ctUser ? ctUser.role : ''; }

function loadData(){ /* no-op: dados carregados via loadDataFromSupabase() */ }
function saveData(){
  try{ localStorage.setItem('pmoc_cache_v1',JSON.stringify(DATA)); }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   NAV
═══════════════════════════════════════════════════════════ */
function navTo(page, btn){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  el('page-'+page).classList.add('active');
  if(btn) btn.classList.add('active');
  el('fab').style.display = page==='os' ? 'flex' : 'none';
  if(page==='inv') renderInv();
  if(page==='os') renderOS();
  if(page==='pmoc') renderPmoc();
  if(page==='alert') renderAlerts();
  if(page==='dash') renderDash();
}

  var critica = opDATA.filter(function(e){ return autoCrit(e)==='CRÍTICA'; }).length;
  var ag = alertasPmoc(opDATA, now);

  var restricao = ag.restricao.length;

  el('kpi-area').innerHTML =
    '<div class="kpi-card" style="border-left-color:#1351B4">' +

    '<div class="kpi-sub">equipamentos cadastrados</div></div>' +
    '<div class="kpi-card" style="border-left-color:#168821">' +
    '<div class="kpi-label"><i class="fas fa-check-circle mr1" aria-hidden="true"></i> Operacionais</div>' +
    '<div class="kpi-val" style="color:#168821">'+ok+'</div>' +
    '<div class="kpi-sub">'+pct+'% do total</div></div>' +
    '<div class="kpi-card" style="border-left-color:#E52207">' +
    '<div class="kpi-label"><i class="fas fa-times-circle mr1" aria-hidden="true"></i> Fora de Operação</div>' +
    '<div class="kpi-val" style="color:#E52207">'+nok+'</div>' +
    '<div class="kpi-sub">'+(total?Math.round(nok/total*100):0)+'% do total'+(restricao?' · '+restricao+' com restrições':'')+'</div></div>' +
    '<div class="kpi-card" style="border-left-color:#B71C1C">' +
    '<div class="kpi-label"><i class="fas fa-exclamation-circle mr1" aria-hidden="true"></i> Área Crítica</div>' +
    '<div class="kpi-val" style="color:#B71C1C">'+critica+'</div>' +

    '<div class="kpi-card kpi-wide" style="border-left-color:#F57F17">' +
    '<div class="kpi-label"><i class="fas fa-calendar-times mr1" aria-hidden="true"></i> Atenção PMOC</div>' +
    '<div class="kpi-val" style="color:#F57F17">'+alertCount+'</div>' +
    '<div class="kpi-sub">'+vencidas+' vencidas · '+semHist+' sem histórico</div></div>';

  // Alertas top 5
  var alerts = ag.todos.slice().sort(function(a,b){
    var ord=['CRÍTICA','ALTA','MÉDIA','BAIXA'];
    return ord.indexOf(autoCrit(a))-ord.indexOf(autoCrit(b));
  }).slice(0,5);

  var alertHtml = '<div class="sec-head"><span class="sec-title">Prioridade Imediata</span>' +
    '<span class="sec-count">'+alerts.length+'</span></div>';
  alerts.forEach(function(e){
    var crit=autoCrit(e);
    var cc = CRIT_COLORS[crit]||'#999';
    var reason = equipInoperante(e) ? 'INOP — '+esc(e.obs||'Verificar') :
                 equipComRestricao(e) ? 'Restrição — '+esc(e.obs||'Verificar') :
                 !getLatestLogDate(e.id)&&!e.ultimaManutencao ? 'Sem histórico de manutenção' : 'Manutenção vencida';
    var alertIcon = equipInoperante(e) ? 'fa-times-circle' : equipComRestricao(e) ? 'fa-exclamation-triangle' : 'fa-calendar-exclamation';
    alertHtml += '<div class="alert-card" style="border-left-color:'+cc+'" onclick="openDetail('+e.id+')">' +
      '<div class="alert-icon"><i class="fas '+alertIcon+'" style="color:'+cc+'"></i></div>' +

      critPill(crit)+'</div>';
  });
  el('dash-alerts-section').innerHTML = alertHtml;

  // PMOC próximas
  var pmocDue = opDATA.filter(function(e){
    var nx=nextPmoc(e,'inspecao');
    return nx && ((nx-now)/86400000)<30;
  }).sort(function(a,b){

    return na-nb;
  }).slice(0,6);

  if(pmocDue.length){
    var pmocHtml = '<div class="sec-head"><span class="sec-title">PMOC — Próximas 30d</span>' +
      '<span class="sec-count">'+pmocDue.length+'</span></div>';

  el('os-badge').style.display = osPend>0?'block':'none';
  var pmocVenc = opDATA.filter(function(e){ var nx=nextPmoc(e,'inspecao'); return nx&&nx<now; }).length;
  el('pmoc-badge').textContent = pmocVenc;
  el('pmoc-badge').style.display = pmocVenc>0?'block':'none';
  el('os-cnt').textContent = osAll.length;
  el('pmoc-cnt').textContent = pmocVenc;
}

/* ═══════════════════════════════════════════════════════════
   INVENTÁRIO
═══════════════════════════════════════════════════════════ */
var CRIT_ORDEM = {'CRÍTICA':0,'ALTA':1,'MÉDIA':2,'BAIXA':3};

/* Próxima manutenção do equipamento: a mais próxima entre inspeção e preventiva.
   null quando não há histórico — nextPmoc() não tem de onde contar o intervalo. */
function proxManut(e){
  var ni = nextPmoc(e,'inspecao'), np = nextPmoc(e,'preventiva');
  if(!ni) return np; if(!np) return ni;
  return ni < np ? ni : np;
}
function isVencido(e){
  var d = proxManut(e);
  return !!d && d < new Date();
}
function cmpInv(a, b){
  if(invOrdem==='predio'){
    var p = (a.predio||'').localeCompare(b.predio||'','pt-BR');
    return p || (a.local||'').localeCompare(b.local||'','pt-BR');
  }
  if(invOrdem==='criticidade'){
    var ca = CRIT_ORDEM[autoCrit(a)], cb = CRIT_ORDEM[autoCrit(b)];
    if(ca===undefined) ca = 99; if(cb===undefined) cb = 99;   // criticidade fora da lista vai para o fim
    return (ca-cb) || (a.local||'').localeCompare(b.local||'','pt-BR');
  }
  if(invOrdem==='vencimento'){
    var da = proxManut(a), db = proxManut(b);
    if(!da && !db) return (a.local||'').localeCompare(b.local||'','pt-BR');
    if(!da) return 1; if(!db) return -1;                       // sem histórico sempre no fim
    return da - db;
  }
  return (a.local||'').localeCompare(b.local||'','pt-BR');
}

/* ── inventário: a seleção filtrada, com dois consumidores ── */
/* Mesmo filter de sempre, movido sem mudança de regra — a única correção é
   ler local/predio com (e.local||''), como fabricante já era: um local nulo
   lançaria TypeError na busca (nenhum dos 171 registros tem, o que é sorte,
   não garantia). Dois consumidores: a lista da tela (renderInv) e a folha de
   etiquetas (etiquetasDoInventario, D-s3h-08). Sem ordenar — cmpInv continua
   sendo quem ordena, com gate próprio. */
/* D-uyz-10: removido/baixado somem dos chips de sempre e ganham dois chips
   próprios (D-uyz-05) — a busca textual continua valendo dentro de cada um. */
/* D-8rz-09: quarto parâmetro opcional — filtro por coluna da tabela de
   computador. Ausente, o comportamento é BYTE A BYTE o de antes (é isso que
   mantém verde tests/refrigeracao-qr-nfc.test.js, que chama com três
   argumentos). Presente, aplica-se em CONJUNÇÃO com o filtro de sempre,
   por COLS_INV — que mora no bloco novo, no fim do arquivo; esta função só
   é CHAMADA depois de todos os scripts terem carregado. Tela, etiqueta e
   CSV passam pelos mesmos quatro argumentos (D-8rz-09) — nunca divergem. */
function filtrarInventario(dados, busca, chip, filtrosColuna){
  var q = (busca||'').toLowerCase().trim();
  var out = (dados||[]).filter(function(e){
    if(q && !((e.local||'').toLowerCase().includes(q)||(e.predio||'').toLowerCase().includes(q)||(e.fabricante||'').toLowerCase().includes(q))) return false;
    if(chip==='removidos') return equipRemovido(e);
    if(chip==='baixados') return equipBaixado(e);
    if(!equipInstalado(e)) return false; // qualquer outro chip (inclusive 'todos') exige instalado antes da regra de hoje
    if(chip==='nok') return equipInoperante(e);
    if(chip==='ok') return equipOperante(e);
    if(chip==='or') return equipComRestricao(e);
    if(chip==='ver') return e.obs && e.obs.toLowerCase().includes('verificar');
    if(chip==='critica') return autoCrit(e)==='CRÍTICA';
    if(chip==='vencidos') return isVencido(e);
    if(chip==='vermelha') return e.area==='VERMELHA';
    if(chip==='azul') return e.area==='AZUL';
    return true;
  });
  if(filtrosColuna){
    var pares = [];
    for(var k in filtrosColuna){
      if(Object.prototype.hasOwnProperty.call(filtrosColuna,k) && filtrosColuna[k]) pares.push([k, filtrosColuna[k]]);
    }
    if(pares.length){
      out = out.filter(function(e){
        return pares.every(function(par){
          var col = null;
          for(var i=0;i<COLS_INV.length;i++){ if(COLS_INV[i].id===par[0]){ col=COLS_INV[i]; break; } }
          if(!col) return true; // coluna de filtro ausente da definição é ignorada, não zera a lista
          return tabNormalizar(col.texto(e)).indexOf(tabNormalizar(par[1])) >= 0;
        });
      });
    }
  }
  return out;
}

      '<div class="ec-local">'+esc(e.local)+'</div>' +
      '<div class="ec-predio">'+esc(e.predio)+' · '+esc(e.area)+'</div>' +
      '</div></div>' +
      '<div class="ec-status">' +
      statusPill(e.funciona)+critPill(autoCrit(e))+situacaoPill(e.situacao)+
      '<span class="pill pill-tipo">'+esc(e.tipo)+'</span></div>' +
      '<div class="ec-info">' +
      '<span><i class="fas fa-snowflake" aria-hidden="true"></i>'+btuK+'</span>' +
      '<span><i class="fas fa-clock" aria-hidden="true"></i>'+(horas||'—')+'h/sem</span>' +

      (e.obs?'<span style="color:#E52207"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i>Obs.</span>':'')+

/* ═══════════════════════════════════════════════════════════
   OS (extrai de todos os logs)
═══════════════════════════════════════════════════════════ */
function getAllOSEntries(){
  var log = getLog();
  var entries = [];
  Object.keys(log).forEach(function(equipId){
    var e = DATA.find(function(r){ return r.id===parseInt(equipId); });
    if(!e) return;
    (log[equipId]||[]).forEach(function(entry){
      entries.push({ equipId:parseInt(equipId), equip:e, entry:entry });
    });
  });
  entries.sort(function(a,b){ return b.entry.date.localeCompare(a.entry.date); });
  return entries;
}

function setOSChip(btn, val){
  document.querySelectorAll('#os-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  osChip = val;
  renderOS();
}

/* Regra dos chips da aba OS, em função pura — o "Todos" é a FILA DE
   TRABALHO, não o arquivo: uma OS conferida ou cancelada só aparece no chip
   que a nomeia. Antes ela ficava no Todos para sempre, e a lista crescia
   monótona até esconder o que ainda precisa de alguém. "Crítica" continua
   respondendo pelo equipamento, não pelo estado da OS — é a pergunta "que
   máquina crítica passou por aqui", e recortá-la por estado responderia
   outra coisa. */
function osNoChip(chip, entry, ehCritica){
  var n = manNormalizar(entry.status);
  if(chip==='aberto')    return manPendente(entry.status);
  if(chip==='aprovacao') return n==='APROVACAO';
  if(chip==='concluida') return n==='CONFERIDA';
  if(chip==='cancelada') return n==='CANCELADA';
  if(chip==='critica')   return !!ehCritica;
  return !manEhTerminal(entry.status); // 'todos' e qualquer chip desconhecido
}

function renderOS(){
  var all = getAllOSEntries().filter(function(o){
    if(osEhMovimentacao(o.entry)) return false; // D-uyz-01: as OS de movimentação vivem no terceiro segmento
    return osNoChip(osChip, o.entry, autoCrit(o.equip)==='CRÍTICA');
  });

  el('os-cnt').textContent = all.length;

  if(!all.length){
    var vazioMsg = osChip==='concluida' ? 'Nenhuma OS concluída.'
      : osChip==='cancelada' ? 'Nenhuma OS cancelada.'
      : osChip==='todos' ? 'Nenhuma OS em andamento.<br>As concluídas e canceladas estão nos chips ao lado.'
      : 'Nenhuma OS neste filtro.';
    el('os-list').innerHTML = '<div class="empty"><i class="fas fa-clipboard-list" aria-hidden="true"></i>' +
      '<p>'+vazioMsg+'<br>Toque <strong>+</strong> para criar uma nova.</p></div>';
    return;
  }

  if(TELA_LARGA){ el('os-list').innerHTML = tabDesenhar('os', COLS_OS, all, MAN_FLUXO_OK ? 'manAbrirOS' : 'openDetail'); return; }

  el('os-list').innerHTML = all.map(function(o){
    var st = o.entry.status||'PENDENTE';
    var cls = manClasseCard(st);
    var done = (o.entry.checklist||[]).filter(function(c){ return c.done; }).length;
    var total = (o.entry.checklist||[]).length;
    var abrir = MAN_FLUXO_OK ? "manAbrirOS('"+esc(o.entry.id||'')+"')" : ('openDetail('+o.equipId+')');
    return '<div class="os-card '+cls+'" onclick="'+abrir+'">' +
      '<div class="os-hdr"><div><div class="os-local">'+esc(o.equip.local)+'</div>' +
      '<div class="os-predio">'+esc(o.equip.predio)+'</div></div>' +
      statusPillOS(st)+'</div>' +
      '<div class="os-meta">'+critPill(autoCrit(o.equip))+
      '<span class="pill pill-tipo">'+esc(o.entry.tipo||'—')+'</span>' +
      '<span style="font-size:11px;color:#888"><i class="fas fa-calendar mr1" aria-hidden="true"></i>'+fmtDate(o.entry.date)+'</span>' +
      (total?'<span style="font-size:11px;color:#888"><i class="fas fa-check-double mr1" aria-hidden="true"></i>'+done+'/'+total+'</span>':'') +
      '</div>' +
      (o.entry.tecnico?'<div style="font-size:12px;color:#666;margin-top:2px"><i class="fas fa-user mr1" aria-hidden="true"></i>'+esc(o.entry.tecnico)+'</div>':'') +
      (o.entry.desc?'<div class="os-desc">'+esc(o.entry.desc)+'</div>':'') +
      '</div>';
  }).join('');
}

/* Quantos equipamentos INSTALADOS hoje apontam para este local — a base de
   D-uyz-03 (casoDeInstalacao). excluirEquipId evita contar a própria
   máquina quando ela já estiver instalada no destino escolhido. */
function ocupantesDoLocal(localId, excluirEquipId){
  if (localId===undefined || localId===null) return 0;
  return DATA.filter(function(e){
    return equipInstalado(e) && e.localId===localId && e.id!==excluirEquipId;
  }).length;
}

/* renderMovim é o espelho de renderOS: lista só as OS de movimentação,
   ordenadas como getAllOSEntries() já ordena. Reusa .os-card/statusPillOS/
   manClasseCard/critPill e acrescenta uma linha com o rótulo do caso
   (instalação) ou o destino (remoção, com "Baixa patrimonial" em
   destaque). Clicar abre manAbrirOS — é a mesma OS, na mesma gaveta. */
function renderMovim(){
  var all = getAllOSEntries().filter(function(o){
    if(!osEhMovimentacao(o.entry)) return false;
    if(movChipSel==='aberto') return manPendente(o.entry.status);
    if(movChipSel==='aprovacao') return manNormalizar(o.entry.status)==='APROVACAO';
    if(movChipSel==='instalacoes') return o.entry.tipo==='INSTALAÇÃO';
    if(movChipSel==='remocoes') return o.entry.tipo==='REMOÇÃO';
    return true;
  });

  el('os-cnt').textContent = all.length;

  if(!all.length){
    el('os-list').innerHTML = '<div class="empty"><i class="fas fa-truck-loading" aria-hidden="true"></i>' +
      '<p>Nenhuma OS de instalação/remoção registrada.<br>Toque <strong>+</strong> para criar uma nova.</p></div>';
    return;
  }

  if(TELA_LARGA){ el('os-list').innerHTML = tabDesenhar('movim', COLS_MOVIM, all, 'manAbrirOS'); return; }

  el('os-list').innerHTML = all.map(function(o){
    var st = o.entry.status||'ABERTA';
    var cls = manClasseCard(st);
    var linha;
    if (o.entry.tipo==='INSTALAÇÃO') {

        ? '<strong style="color:#E52207">Baixa patrimonial</strong>'

    }

      '</div>' +

  }).join('');
}

function setPmocChip(btn, val){
  document.querySelectorAll('#pmoc-chips .chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  pmocChip = val;
  renderPmoc();
}

function renderPmoc(){
  var now = new Date();
  var list = equipamentosOperacionais(DATA).filter(function(e){
    var nx = nextPmoc(e,'inspecao');
    if(pmocChip==='vencida') return nx && nx<now;
    if(pmocChip==='sem-hist') return !e.ultimaManutencao && !getLatestLogDate(e.id);
    if(pmocChip==='critica') return autoCrit(e)==='CRÍTICA';
    return true;
  }).sort(function(a,b){
    var ord=['CRÍTICA','ALTA','MÉDIA','BAIXA'];
    var ca=ord.indexOf(autoCrit(a)), cb=ord.indexOf(autoCrit(b));
    if(ca!==cb) return ca-cb;
    var na=nextPmoc(a,'inspecao'), nb=nextPmoc(b,'inspecao');
    if(!na&&!nb) return 0; if(!na) return 1; if(!nb) return -1;
    return na-nb;
  });

  el('pmoc-cnt').textContent = list.length;

  if(!list.length){
    el('pmoc-list').innerHTML = '<div class="empty"><i class="fas fa-calendar-check" aria-hidden="true"></i><p>Tudo em dia neste filtro!</p></div>';
    return;
  }

  if(TELA_LARGA){ el('pmoc-list').innerHTML = tabDesenhar('pmoc', COLS_PMOC, list, 'openDetail'); return; }

  el('pmoc-list').innerHTML = list.map(function(e){
    var nx = nextPmoc(e,'inspecao');
    var np = nextPmoc(e,'preventiva');
    var logCnt = getEquipLog(e.id).length;
    return '<div class="pmoc-row" onclick="openDetail('+e.id+')">' +
      critPill(autoCrit(e)) +
      '<div class="pmoc-info">' +
      '<div class="pmoc-predio">'+esc(e.predio)+'</div>' +
      '<div class="pmoc-local">'+esc(e.local)+' · '+esc(e.tipo)+'</div>' +
      '<div style="font-size:11px;color:#999;margin-top:2px">' +
      'Inspeção: '+dueBadgeHtml(nx)+' Prev.: '+dueBadgeHtml(np)+'</div>' +
      '</div>' +
      '<div style="font-size:11px;color:#aaa;text-align:right"><i class="fas fa-clipboard-list mr1" aria-hidden="true"></i>'+logCnt+'</div>' +
      '</div>';
  }).join('');
}

═══════════════════════════════════════════════════════════ */
function renderAlerts(){
  var now = new Date();
  var ag = alertasPmoc(equipamentosOperacionais(DATA), now);
  var nokList = ag.nok.slice()
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var restList = ag.restricao.slice()
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var vencList = ag.vencidos.slice()
    .sort(function(a,b){ var o=['CRÍTICA','ALTA','MÉDIA','BAIXA']; return o.indexOf(autoCrit(a))-o.indexOf(autoCrit(b)); });
  var semHistCrit = ag.semHist.filter(function(e){ return autoCrit(e)==='CRÍTICA'; });

  if(TELA_LARGA){
    atualizarBadgeAlertas(ag);
    var linhasTab = linhasAlertas(ag, now);
    if(!linhasTab.length){ el('alert-list').innerHTML = '<div class="empty"><i class="fas fa-check-circle" style="color:#168821"></i><p>Nenhum alerta ativo!</p></div>'; return; }
    el('alert-list').innerHTML = '<div style="font-size:11px;color:#888;padding:2px 2px 8px">Total sem repetição: '+ag.total+'. Um equipamento aparece em mais de uma seção quando tem mais de um motivo.</div>' + tabDesenhar('alert', COLS_ALERT, linhasTab, 'openDetail');
    return;
  }

  var html = '';

  if(nokList.length){
    html += '<div class="sec-head"><span class="sec-title" style="color:#E52207"><i class="fas fa-times-circle mr1" aria-hidden="true"></i>Inoperantes — Fora de Operação</span><span class="sec-count">'+nokList.length+'</span></div>';
    html += nokList.map(function(e){
      return '<div class="alert-card" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-times-circle" style="color:#E52207"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+(e.obs?' · '+esc(e.obs):'')+'</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(restList.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title" style="color:#B46800"><i class="fas fa-exclamation-triangle mr1" aria-hidden="true"></i>Operando com restrições</span><span class="sec-count">'+restList.length+'</span></div>';
    html += restList.map(function(e){
      return '<div class="alert-card" style="border-left-color:#B46800" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-exclamation-triangle" style="color:#B46800"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+(e.obs?' · '+esc(e.obs):'')+'</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(vencList.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title" style="color:#F57F17"><i class="fas fa-calendar-times mr1" aria-hidden="true"></i>PMOC Vencida</span><span class="sec-count">'+vencList.length+'</span></div>';
    html += vencList.map(function(e){
      var nx = nextPmoc(e,'inspecao');
      var diff = nx?Math.round((now-nx)/86400000):0;
      return '<div class="alert-card" style="border-left-color:#F57F17" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-calendar-times" style="color:#F57F17"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+' · Vencida há '+diff+'d</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
  }

  if(ag.semHist.length){
    html += '<div class="sec-head" style="margin-top:16px"><span class="sec-title"><i class="fas fa-question-circle mr1" aria-hidden="true"></i>Críticos Sem Histórico</span><span class="sec-count">'+ag.semHist.length+'</span></div>';
    html += semHistCrit.map(function(e){
      return '<div class="alert-card" style="border-left-color:#B71C1C" onclick="openDetail('+e.id+')">' +
        '<div class="alert-icon"><i class="fas fa-history" style="color:#B71C1C"></i></div>' +
        '<div class="alert-body"><div class="alert-title">'+esc(e.local)+'</div>' +
        '<div class="alert-sub">'+esc(e.predio)+' · Nenhum registro de manutenção</div></div>' +
        critPill(autoCrit(e))+'</div>';
    }).join('');
    if(ag.semHist.length > semHistCrit.length){
      html += '<div class="alert-sub" style="padding:6px 2px;color:#888">+'+(ag.semHist.length-semHistCrit.length)+' não críticos sem registro de manutenção</div>';
    }
  }

  if(html){
    html = '<div style="font-size:11px;color:#888;padding:2px 2px 8px">Total sem repetição: '+ag.total+'. Um equipamento aparece em mais de uma seção quando tem mais de um motivo.</div>' + html;
  }
  if(!html) html = '<div class="empty"><i class="fas fa-check-circle" style="color:#168821"></i><p>Nenhum alerta ativo!</p></div>';

  el('alert-list').innerHTML = html;

  atualizarBadgeAlertas(ag);
}

   gravado que não passe (ex: javascript:, ou herança de um cadastro antigo)
   aparece como texto simples, nunca como âncora (D-q57-09/T-q57-01). */
function campoLinkFicha(rotulo, valor){
  if(!valor) return '<div class="dfield"><label>'+rotulo+'</label><div class="dval">—</div></div>';

/* D-92t-02: cinco strings, nunca já concatenadas — a gaveta faz .join(''),
   a página (Task 2) distribui por FICHA_COLUNAS. crit/lastDate/ni/np são
   calculados uma vez só, aqui. */
function fichaBlocos(e, logs, id){
  var lastDate = e.ultimaManutencao || getLatestLogDate(id);
  var crit = autoCrit(e);
  var ni = nextPmoc(e,'inspecao'); var np = nextPmoc(e,'preventiva');
  return [
    fichaBlocoLocal(e),
    fichaBlocoDados(e),
    fichaBlocoEstado(e, logs, crit, lastDate, ni, np),
    fichaBlocoHistorico(id, logs),
    blocoQrFicha(id)
  ];
}

/* D-92t-09: distribuição fechada das colunas da ficha-página — coluna 1 =
   Local+Dados, coluna 2 = Estado e PMOC (o bloco mais denso), coluna 3 =
   Histórico+QR. Achatada é permutação de [0,1,2,3,4] (gate). */
var FICHA_COLUNAS = [[0,1],[2],[3,4]];

/* D-92t-11: as cinco abas de navegação, na mesma ordem de #bottom-nav — dado
   fechado e função pura, sem API de navegador, para o gate exercitar como
   comportamento em vez de regex. */
var ABAS_NAV = ['dash','inv','os','pmoc','alert'];
function indiceDaAba(chave){
  return ABAS_NAV.indexOf(chave);

/* D-92t-01/03/05/06/07/09/10/11: abre a ficha como PÁGINA — mesma fonte de
   dados de abrirFichaGaveta, continente diferente. */
function abrirFichaPagina(id){
  var e = DATA.find(function(r){ return r.id===id; }); if(!e) return;
  var logs = getEquipLog(id);
  var crit = autoCrit(e);
  var ident = fichaIdentidade(e, crit);

  // Fecha a gaveta se estiver aberta — impede gaveta órfã. closeDrawer() é
  // quem devolve o overflow do body.
  var drawer = el('drawer');
  if(drawer && drawer.classList.contains('open')) closeDrawer();

  // Origem: .page.active no momento da abertura. indiceDaAba já devolve -1
  // tanto para uma chave desconhecida quanto para 'ficha' (ABAS_NAV não a
  // lista) — um só teste cobre os dois casos do D-92t-11.
  var ativa = document.querySelector('.page.active');
  var chaveAtiva = (ativa && ativa.id) ? ativa.id.replace('page-','') : '';
  FICHA_ORIGEM = indiceDaAba(chaveAtiva) >= 0 ? chaveAtiva : 'inv';

  el('fh-id').textContent = ident.id;
  el('fh-local').textContent = ident.local;
  el('fh-predio').textContent = ident.predio;
  el('fh-pills').innerHTML = ident.pills;
  el('fh-voltar-txt').textContent = rotuloVolta(FICHA_ORIGEM);
  el('fh-acoes').innerHTML = fichaAcoes(id, 'pagina');

  var blocos = fichaBlocos(e, logs, id);
  FICHA_COLUNAS.forEach(function(indices, i){
    var col = el('ficha-col-'+(i+1));
    col.innerHTML = indices.map(function(idx){ return blocos[idx]; }).join('');
    col.scrollTop = 0; // D-92t: as três colunas voltam ao topo a cada abertura
  });

  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  el('page-ficha').classList.add('active');
  el('fab').style.display = 'none';

  FICHA_ABERTA = id; // depois do closeDrawer(), nunca antes
