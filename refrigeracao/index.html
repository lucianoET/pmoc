<script>
/* paleta categórica (validada dataviz: CVD-safe sobre superfície clara) */
var DV_CAT = {'SPLIT':'#1351B4','PISO/TETO':'#E65100','SELF CONTAINED':'#7B1FA2','JANELA':'#00897B'};
var DV_SEQ = ['#B8CBEA','#5E85CB','#1351B4'];        /* NOVA→SEMI→VELHA (um matiz, claro→escuro) */

function dvFmt(n,dec){ return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }

function dvPotenciaW(e){
  var v=e.tensao||220, i=e.correnteNominal||0;
  return v===380 ? Math.round(1.732*v*i) : Math.round(v*i);
}

function dvDonut(segs, centerTop, centerBot){
  var total = segs.reduce(function(s,x){return s+x.value;},0)||1;
  var R=40, C=2*Math.PI*R, off=C*0.25, gap=2;
  var h='<svg viewBox="0 0 100 100" width="112" height="112" style="flex-shrink:0">';
  segs.forEach(function(s){
    var frac=s.value/total, len=Math.max(0,frac*C-gap);
    h+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+s.color+'" stroke-width="13" stroke-linecap="butt" '+
       'stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+off+'"><title>'+s.label+': '+dvFmt(s.value)+'</title></circle>';
    off-=frac*C;
  });
  h+='<text x="50" y="48" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#1B1B1B">'+centerTop+'</text>' +
     '<text x="50" y="61" text-anchor="middle" style="font-size:7.5px;font-weight:700;fill:#999">'+centerBot+'</text></svg>';
  return h;
}

function dvGetTarifa(){
  var t = parseFloat(localStorage.getItem('pmoc_tarifa_kwh'));
  return (t>0&&t<20)?t:0.85;
}
function dvSetTarifa(v){
  var t=parseFloat(String(v).replace(',','.'))||0.85;
  try{ localStorage.setItem('pmoc_tarifa_kwh',t); }catch(e){}
  renderDash();
}

function dvRenderCharts(){
  var host = el('dash-charts');
  if(!host){
    host = document.createElement('div');
    host.id = 'dash-charts';
    var kpi = el('kpi-area');
    kpi.insertAdjacentElement('afterend', host);
  }
  // D-uyz-10: só instalado entra no gráfico. O filtro legado de RETIRADO fica —
  // casa com zero linha hoje (as 2 foram excluídas na importação) e removê-lo
  // seria conserto não pedido.
  var ativos = equipamentosOperacionais(DATA).filter(function(e){ return e.tipo!=='RETIRADO'; });
  // D-q57-07: um aparelho com restrição está ligado e consome energia — continua
  // entrando no cálculo de potência/kWh, diferente do KPI "Fora de Operação" (só INOP).
  var emOperacao = ativos.filter(function(e){ return equipOperante(e) || equipComRestricao(e); });

  /* ── capacidade térmica ── */
  var btuTotal = ativos.reduce(function(s,e){return s+(e.btu||0);},0);
  var btuOk = emOperacao.reduce(function(s,e){return s+(e.btu||0);},0);
  var tr = btuTotal/12000, kwTerm = btuTotal/3412;
  var tipos = ['SPLIT','PISO/TETO','SELF CONTAINED','JANELA'];
  var segTipo = tipos.map(function(t){
    var lst = ativos.filter(function(e){return e.tipo===t;});
    return {label:t, color:DV_CAT[t], value:lst.reduce(function(s,e){return s+(e.btu||0);},0), n:lst.length};
  }).filter(function(s){return s.value>0;});
  var htmlCap =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-snowflake" aria-hidden="true"></i>Capacidade Térmica Instalada</div>' +
    '<div class="hero-num">'+dvFmt(tr,1)+' TR</div>' +
    '<div class="hero-sub">'+dvFmt(btuTotal)+' BTU/h · '+dvFmt(kwTerm)+' kW térmicos · '+dvFmt(btuOk/btuTotal*100)+'% operacional</div>' +
    '<div class="donut-wrap">'+dvDonut(segTipo, dvFmt(tr,0)+' TR', ativos.length+' equip.')+
    '<div class="donut-legend">'+segTipo.map(function(s){
      return '<div class="dl-row"><span class="dl-dot" style="background:'+s.color+'"></span>' +
        '<span class="dl-name">'+s.label+' ('+s.n+')</span>' +
        '<span class="dl-val">'+dvFmt(s.value/1000)+'K</span>' +
        '<span class="dl-pct">'+dvFmt(s.value/btuTotal*100)+'%</span></div>';
    }).join('')+'</div></div></div>';

  /* ── energia elétrica ── */
  var FATOR_CICLO = 0.7;
  var potW = emOperacao.reduce(function(s,e){return s+dvPotenciaW(e);},0);
  var kwhMes = emOperacao.reduce(function(s,e){
    return s + dvPotenciaW(e)/1000*(e.horasDia||0)*(e.diasSemana||0)*4.345*FATOR_CICLO;
  },0);
  var tarifa = dvGetTarifa();
  var custoMes = kwhMes*tarifa;
  var areas = ['AZUL','VERMELHA'];
  var kwhArea = areas.map(function(a){
    return {label:'Área '+a, value: emOperacao.filter(function(e){return e.area===a;})
      .reduce(function(s,e){return s+dvPotenciaW(e)/1000*(e.horasDia||0)*(e.diasSemana||0)*4.345*FATOR_CICLO;},0)};
  });
  var maxA = Math.max.apply(null, kwhArea.map(function(x){return x.value;}))||1;
  var htmlEn =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-bolt" aria-hidden="true"></i>Energia Elétrica — Estimativa</div>' +
    '<div class="stat-grid" style="margin-top:0">' +
    '<div class="stat-mini"><div class="v">'+dvFmt(potW/1000,1)+' kW</div><div class="l">Potência instalada (OK)</div></div>' +
    '<div class="stat-mini"><div class="v">'+dvFmt(kwhMes)+'</div><div class="l">kWh / mês estimado</div></div></div>' +
    '<div style="margin-top:8px">'+kwhArea.map(function(x){
      return '<div class="hbar-row"><span class="hbar-label">'+x.label+'</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+(x.value/maxA*100)+'%;background:'+(x.label.indexOf('AZUL')>=0?'#1351B4':'#E52207')+'" title="'+dvFmt(x.value)+' kWh/mês"></div></div>' +
        '<span class="hbar-val">'+dvFmt(x.value)+' kWh</span></div>';
    }).join('')+'</div>' +
    '<div class="tarifa-row"><span style="font-size:11px;color:#666;font-weight:600;flex:1">Tarifa (R$/kWh)</span>' +
    '<input type="number" step="0.01" min="0" value="'+tarifa.toFixed(2)+'" onchange="dvSetTarifa(this.value)"/>' +
    '<span style="font-size:15px;font-weight:800;color:#1351B4">'+('R$ '+dvFmt(custoMes,2))+'/mês</span></div>' +
    '<div class="chart-note">Estimativa: corrente nominal de placa × tensão (380 V trifásico ×√3), horas de uso semanais cadastradas e fator de ciclo do compressor de 70%. Considera apenas máquinas operacionais (OK). O consumo real varia com carga térmica e regulagem.</div></div>';

  /* ── BTU por prédio (top 8) ── */
  var byPredio = {};
  ativos.forEach(function(e){ byPredio[e.predio]=(byPredio[e.predio]||0)+(e.btu||0); });
  var predios = Object.keys(byPredio).map(function(p){return {label:p,value:byPredio[p]};})
    .sort(function(a,b){return b.value-a.value;});
  var top = predios.slice(0,8);
  var resto = predios.slice(8).reduce(function(s,x){return s+x.value;},0);
  if(resto>0) top.push({label:'Outros ('+(predios.length-8)+')',value:resto,outro:true});
  var maxP = top[0]?top[0].value:1;
  var htmlPred =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-building" aria-hidden="true"></i>Capacidade por Prédio (BTU/h)</div>' +
    top.map(function(x){
      return '<div class="hbar-row"><span class="hbar-label">'+esc(x.label)+'</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+(x.value/maxP*100)+'%;background:'+(x.outro?'#B8CBEA':'#1351B4')+'" title="'+dvFmt(x.value)+' BTU/h"></div></div>' +
        '<span class="hbar-val">'+dvFmt(x.value/1000)+'K</span></div>';
    }).join('')+'</div>';

  /* ── estado da frota ── */
  // Três segmentos, um por EQUIP_ESTADOS — a mesma lista fechada que a pílula e o
  // chip do inventário usam, na mesma ordem (EQUIP_ORDEM).
  var CORES_ESTADO_FROTA = {'OP':'#168821','OR':'#B46800','INOP':'#E52207'};
  var estFrota = EQUIP_ORDEM.map(function(k){
    return {chave:k, label:EQUIP_ESTADOS[k].curto, color:CORES_ESTADO_FROTA[k],
      value: ativos.filter(function(e){ return equipEstado(e)===k; }).length};
  });
  var nFrota = estFrota.reduce(function(s,x){return s+x.value;},0)||1;
  var idades = ['NOVA','SEMI','VELHA'].map(function(st,i){
    return {label:st, value:ativos.filter(function(e){return e.estado===st;}).length, color:DV_SEQ[i]};
  });
  var nIdade = idades.reduce(function(s,x){return s+x.value;},0)||1;
  var htmlFrota =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-heartbeat" aria-hidden="true"></i>Estado da Frota</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:2px;flex-wrap:wrap;gap:4px">' +
    estFrota.map(function(x){
      return '<span style="color:'+x.color+'">'+x.label+' '+x.value+' ('+dvFmt(x.value/nFrota*100)+'%)</span>';
    }).join('') +
    '</div>' +
    '<div class="seg-bar">'+estFrota.map(function(x){
      return '<div style="width:'+(x.value/nFrota*100)+'%;background:'+x.color+'" title="'+x.label+': '+x.value+'"></div>';
    }).join('')+'</div>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:#666;margin-top:12px;margin-bottom:2px">' +
    idades.map(function(x){return '<span><span class="dl-dot" style="display:inline-block;background:'+x.color+';vertical-align:-1px"></span> '+x.label+' '+x.value+'</span>';}).join('') + '</div>' +
    '<div class="seg-bar">'+idades.map(function(x){
      return '<div style="width:'+(x.value/nIdade*100)+'%;background:'+x.color+'" title="'+x.label+': '+x.value+'"></div>';
    }).join('')+'</div>' +
    '<div class="chart-note">Idade aparente conforme inventário (NOVA → VELHA).</div></div>';

  /* ── manutenções últimos 12 meses ── */
  var allLogs = [];
  Object.keys(_logCache).forEach(function(id){ (_logCache[id]||[]).forEach(function(x){ allLogs.push(x); }); });
  var months=[], now=new Date();
  for(var m=11;m>=0;m--){
    var d=new Date(now.getFullYear(), now.getMonth()-m, 1);
    months.push({key:d.toISOString().slice(0,7), lbl:['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()], count:0});
  }
  allLogs.forEach(function(x){
    var k=(x.date||'').slice(0,7);
    var mo=months.find(function(mm){return mm.key===k;});
    if(mo) mo.count++;
  });
  var maxM = Math.max.apply(null, months.map(function(x){return x.count;}))||1;
  var tot12 = months.reduce(function(s,x){return s+x.count;},0);
  var semHist = DATA.filter(function(e){ return !e.ultimaManutencao && !getLatestLogDate(e.id); }).length;
  var porTipo = {};
  allLogs.forEach(function(x){ porTipo[x.tipo]=(porTipo[x.tipo]||0)+1; });
  var htmlMnt =
    '<div class="chart-card"><div class="chart-title"><i class="fas fa-tools" aria-hidden="true"></i>Manutenções — Últimos 12 Meses</div>' +
    '<div class="stat-grid" style="margin-top:0">' +
    '<div class="stat-mini"><div class="v">'+tot12+'</div><div class="l">registros em 12 meses</div></div>' +
    '<div class="stat-mini"><div class="v" style="color:'+(semHist>0?'#E52207':'#168821')+'">'+semHist+'</div><div class="l">sem histórico</div></div></div>' +
    '<div class="colchart">'+months.map(function(x){
      return '<div class="col-item">'+(x.count?'<span class="col-cnt">'+x.count+'</span>':'')+
        '<div class="col-fill" style="height:'+Math.max(2,x.count/maxM*66)+'px" title="'+x.key+': '+x.count+'"></div>' +
        '<span class="col-lbl">'+x.lbl+'</span></div>';
    }).join('')+'</div>' +
    (Object.keys(porTipo).length?'<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">'+
      Object.keys(porTipo).sort(function(a,b){return porTipo[b]-porTipo[a];}).map(function(t){
        return '<span class="pill pill-tipo">'+esc(t)+' · '+porTipo[t]+'</span>';
      }).join('')+'</div>':'')+'</div>';

  /* ── contratações / saldo das atas ── */
  var htmlCt = '';
  if(ctLoaded && ctArp.length){
    var nes = Object.keys(CT_NES).map(function(k){ return {ne:k, forn:CT_NES[k].forn, emp:CT_NES[k].valor}; });
    var andamento = ctOS.filter(function(o){return ['SOLICITADA','ORCAMENTO','APROVADA','EM_EXECUCAO','EXECUTADA','FISCALIZADA'].indexOf(o.status)>=0;}).length;
    var aprovar = ctOS.filter(function(o){return o.status==='ORCAMENTO'||o.status==='EXECUTADA';}).length;
    var encerradas = ctOS.filter(function(o){return o.status==='ENCERRADA';}).length;
    htmlCt = '<div class="chart-card"><div class="chart-title"><i class="fas fa-file-signature" aria-hidden="true"></i>Contratações (ARP) — Saldos</div>' +
      nes.map(function(x){
        var saldo = ctSaldoNE(x.ne);
        var pct = Math.max(0,Math.min(100,saldo/x.emp*100));
        return '<div class="hbar-row"><span class="hbar-label">'+x.forn+' · NE'+x.ne.slice(-3)+'</span>' +
          '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+(pct<20?'#E52207':pct<50?'#F57F17':'#168821')+'" title="Saldo: R$ '+dvFmt(saldo,2)+'"></div></div>' +
          '<span class="hbar-val">'+dvFmt(pct)+'%</span></div>';
      }).join('') +
      '<div style="font-size:11px;color:#666;margin-top:2px;font-weight:600">Saldo total: <span style="color:#1351B4;font-weight:800">R$ '+dvFmt(ctSaldoNE('2026NE000335')+ctSaldoNE('2026NE000334'),2)+'</span> de R$ 65.447,86</div>' +
      '<div class="stat-grid"><div class="stat-mini"><div class="v">'+andamento+'</div><div class="l">OS em andamento</div></div>' +
      '<div class="stat-mini"><div class="v" style="color:'+(aprovar>0?'#B46800':'#1B1B1B')+'">'+aprovar+'</div><div class="l">aguardando aprovação</div></div>' +
      '<div class="stat-mini"><div class="v" style="color:#168821">'+encerradas+'</div><div class="l">encerradas</div></div>' +
      '<div class="stat-mini"><div class="v">'+ctOS.length+'</div><div class="l">total de OS</div></div></div></div>';
  }

  host.innerHTML = htmlCap + htmlEn + htmlFrota + htmlMnt + htmlPred + htmlCt;
}

/* integração: roda o dashboard original e acrescenta os gráficos */
var _origRenderDash = renderDash;
renderDash = function(){
  _origRenderDash();
  try{ dvRenderCharts(); }catch(e){ console.error('dashboard charts', e); }
};

/* quando as contratações terminarem de carregar, atualiza o dashboard */
var _origCtLoad = ctLoad;
ctLoad = function(){
  return _origCtLoad().then(function(r){
    try{
      var pg = el('page-dash');
      if(pg && pg.classList.contains('active')) renderDash();
    }catch(e){}
    return r;
  });
};
</script>

     LOGIN POR FUNÇÃO v4 — botões de cargo + senha (contas fixas)
     Contas: gestor/fiscal/tecnico/rlp/wins @pmoc.local · admin via e-mail.
═══════════════════════════════════════════════════════════════════ -->
<style>
.rl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rl-btn{background:#F8F9FA;border:2px solid #E0E0E0;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .15s}
.rl-btn i{font-size:20px;color:#888}
.rl-btn span{font-size:12px;font-weight:700;color:#555}
.rl-btn.sel{border-color:#1351B4;background:#E8ECF5}
.rl-btn.sel i,.rl-btn.sel span{color:#1351B4}
</style>
<script>
var CT_LOGO_URI = new URL('/refrigeracao/icone-192.png', location.href).href;
var CT_LOGINS = [
  {email:'gestor@pmoc.local',  label:'Gestor',       icon:'fa-user-tie'},
  {email:'fiscal@pmoc.local',  label:'Fiscal',       icon:'fa-user-shield'},
  {email:'tecnico@pmoc.local', label:'Técnico',      icon:'fa-tools'},
  {email:'rlp@pmoc.local',     label:'Empresa RLP',  icon:'fa-briefcase'},
  {email:'wins@pmoc.local',    label:'Empresa WINS', icon:'fa-briefcase'}
];
var _rlSel = null;

renderLoginMobile = function(){
  var appEl = document.getElementById('app');
  var fabEl = document.getElementById('fab');
  if (appEl) appEl.style.display = 'none';
  if (fabEl) fabEl.style.display = 'none';
  var old = document.getElementById('login-mobile');
  if (old) old.remove();
  _rlSel = null;
  var botoes = CT_LOGINS.map(function(r,i){
    return '<div class="rl-btn" id="rl-'+i+'" onclick="rlPick('+i+')">' +
      '<i class="fas '+r.icon+'"></i><span>'+r.label+'</span></div>';
  }).join('');
  var wrap = document.createElement('div');
  wrap.id = 'login-mobile';
  wrap.innerHTML = '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#F0F2F5">' +
    '<img src="'+CT_LOGO_URI+'" alt="" style="width:84px;height:84px;margin-bottom:14px"/>' +
    '<div style="font-size:20px;font-weight:800;color:#071D41;margin-bottom:4px">PMOC.Refrigeração</div>' +
    '<div style="font-size:12px;color:#888;margin-bottom:24px">CMASM · DME · UASG 744030</div>' +
    '<div style="width:100%;max-width:340px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.1)">' +

    /* ── modo por função ── */
    '<div id="rl-modo-funcao">' +
    '<div style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px">Entrar como</div>' +
    '<div class="rl-grid">'+botoes+'</div>' +
    '<div id="rl-pass-wrap" style="display:none">' +
    '<label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px">Senha — <span id="rl-sel-nome" style="color:#1351B4"></span></label>' +
    '<input id="rl-pass" type="password" autocomplete="current-password" placeholder="••••••••"' +
    ' style="width:100%;padding:11px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:15px;outline:none" onkeydown="if(event.key===\'Enter\')doLoginRole()"/>' +
    '<button id="rl-btn-entrar" onclick="doLoginRole()"' +
    ' style="width:100%;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px">Entrar</button>' +
    '</div>' +
    '<div id="rl-err" style="margin-top:10px;color:#E52207;font-size:12px;text-align:center;display:none"></div>' +
    '</div>' +

    /* ── modo e-mail (admin) ── */
    '<div id="rl-modo-email" style="display:none">' +
    '<div style="margin-bottom:14px"><label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px">E-mail</label>' +
    '<input id="li-email" type="email" autocomplete="email" placeholder="usuario@marinha.mil.br"' +
    ' style="width:100%;padding:11px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:15px;outline:none"/></div>' +
    '<div style="margin-bottom:16px"><label style="font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px">Senha</label>' +
    '<input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••"' +
    ' style="width:100%;padding:11px 12px;border:1.5px solid #E0E0E0;border-radius:10px;font-size:15px;outline:none"/></div>' +
    '<button id="li-btn" onclick="doLoginMobile()"' +
    ' style="width:100%;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer">Entrar</button>' +
    '<div id="li-err" style="margin-top:10px;color:#E52207;font-size:12px;text-align:center;display:none"></div>' +
    '</div>' +

    '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">' +
    '<button id="rl-toggle" onclick="rlToggleModo()" style="background:none;border:none;color:#1351B4;font-size:12px;font-weight:700;cursor:pointer"><i class="fas fa-at mr1" aria-hidden="true"></i>Entrar com e-mail (admin)</button>' +
    '<button onclick="acessoLivre()" style="background:none;border:1.5px solid #ccc;color:#666;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;width:100%">' +
    '<i class="fas fa-eye" style="margin-right:6px"></i>Visualizar sem login</button>' +
    '</div>' +
    '</div></div>';
  document.body.appendChild(wrap);
};

function rlPick(i){
  _rlSel = CT_LOGINS[i];
  CT_LOGINS.forEach(function(_,j){
    var b = document.getElementById('rl-'+j);
    if(b) b.className = 'rl-btn'+(j===i?' sel':'');
  });
  var w = document.getElementById('rl-pass-wrap');
  if(w) w.style.display = 'block';
  var n = document.getElementById('rl-sel-nome');
  if(n) n.textContent = _rlSel.label;
  var p = document.getElementById('rl-pass');
  if(p){ p.value=''; p.focus(); }
  var e = document.getElementById('rl-err');
  if(e) e.style.display = 'none';
}

function rlToggleModo(){
  var f = document.getElementById('rl-modo-funcao');
  var m = document.getElementById('rl-modo-email');
  var t = document.getElementById('rl-toggle');
  var emailOn = m.style.display === 'none';
  m.style.display = emailOn ? 'block' : 'none';
  f.style.display = emailOn ? 'none' : 'block';
  t.innerHTML = emailOn ? '<i class="fas fa-th-large mr1" aria-hidden="true"></i>Entrar por função'
                        : '<i class="fas fa-at mr1" aria-hidden="true"></i>Entrar com e-mail (admin)';
}

async function doLoginRole(){
  if(!_rlSel) return;
  var pass = (document.getElementById('rl-pass')||{value:''}).value;
  var btn = document.getElementById('rl-btn-entrar');
  var err = document.getElementById('rl-err');
  if(!pass){ err.textContent='Digite a senha.'; err.style.display='block'; return; }
  btn.textContent = 'Entrando…'; btn.disabled = true; err.style.display = 'none';
  var r = await supa.auth.signInWithPassword({ email:_rlSel.email, password:pass });
  if(r.error){
    err.textContent = 'Senha incorreta para '+_rlSel.label+'.';
    err.style.display = 'block';
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     v5 — QR CODE (tela inicial) + IMPRESSÃO DA OS
     Lib QR: qrcode-generator 1.4.4 (MIT, Kazuhiko Arase) embutida.
═══════════════════════════════════════════════════════════════════ -->
<script src="/refrigeracao/qrcode.js"></script>
<style>
#qr-mini{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:12px;background:#fff;border:1.5px solid #E0E0E0;color:#1351B4;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:5}
#qr-pop{position:fixed;inset:0;z-index:300;background:rgba(7,29,65,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px}
#qr-card{background:#fff;border-radius:18px;padding:22px;max-width:330px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#qr-svg-wrap svg{width:100%;max-width:250px;height:auto}
/* ── QR da ficha (D-tyx-01/D-tyx-02): teto de largura próprio, 200px, não
   compartilhado com o de 250px acima — a ficha divide a gaveta com quatro
   outros blocos, o modal desenha sozinho num cartão de 330px. */
.qr-ficha{text-align:center;margin:8px 0}
.qr-ficha svg{width:100%;max-width:200px;height:auto}
@media (min-width:1024px){
  /* ── layout de computador — quick-260822-8rz, D-8rz-01/19 ── */
  /* Todo o CSS novo do módulo mora dentro deste bloco único, e todo
     seletor de tabela é escopado em .lista-tabela — nunca um seletor de
     elemento solto (tabela, cabeçalho, linha, célula), que atingiria as
     12 tabelas de impressão e a do painel de erros da planilha, no
     celular inclusive. */

  /* Navegação dentro da barra do topo (quick-260823-3a6, D-3a6-07/08): a
     coluna lateral fixa morreu — #app vira grade de duas LINHAS e
     CINCO colunas (ícone, marca, navegação, buscar, sair), todas na linha
     1; #content ocupa a linha 2 inteira. #topbar vira display:contents
     (não gera caixa própria — os quatro filhos passam a ser itens reais
     da grade), e por isso o fundo escuro migra para #app e #content
     precisa do seu próprio fundo claro: sem essas duas regras o topo
     sairia claro (texto branco invisível) e o conteúdo sairia escuro. */
  #app{
    display:grid;
    grid-template-columns:auto auto 1fr auto auto;
    grid-template-rows:56px 1fr;
    column-gap:10px;
    background:#071D41;
    height:100vh;height:100dvh;
  }
  #topbar{ display:contents; }
  /* Não confie em posicionamento automático — com #bottom-nav como item
     externo no meio da linha, a ordem só é determinística se estiver
     escrita: 1 ícone, 2 marca, (3 é #bottom-nav, abaixo), 4 buscar, 5
     sair. Os recuos de 16px eram o padding do #topbar, que sumiu junto
     com a caixa. */
  #topbar img{ grid-row:1; grid-column:1; align-self:center; margin-left:16px; }
  #topbar .logo{ grid-row:1; grid-column:2; align-self:center; }
  #topbar-action{ grid-row:1; grid-column:4; align-self:center; }
  #topbar>button:last-child{ grid-row:1; grid-column:5; align-self:center; margin-right:16px; }
  #content{ grid-row:2; grid-column:1/-1; background:#F0F2F5; }

  #bottom-nav{
    grid-row:1;
    grid-column:3;
    min-width:0;
    background:transparent;
    border:none;
    box-shadow:none;
    flex-direction:row;
    justify-content:flex-start;
    align-items:stretch;
    overflow-x:auto;
    padding-bottom:0;
  }
  .nav-btn{
    flex:0 0 auto;
    flex-direction:row;
    align-items:center;
    gap:8px;
    padding:0 14px;
    font-size:13px;
    color:rgba(255,255,255,.72);
    position:relative;
  }
  .nav-btn i{ width:16px; flex-shrink:0; text-align:center; }
  /* Estado ativo com os mesmos quatro sinais de 260819-4gq (barra + fundo
     + peso + cor), girados de eixo: era barra lateral numa navegação em
     coluna, vira sublinhado na base numa aba horizontal — e na paleta do
     escuro (#071D41), não na do claro. */
  .nav-btn::before{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:3px;
    background:transparent;
  }
  .nav-btn.active{ background:rgba(255,255,255,.10); font-weight:700; color:#fff; }
  .nav-btn.active i{ color:#fff; }
  .nav-btn.active::before{ background:#fff; }
  .nav-badge{
    position:static;
    top:auto; right:auto;
    transform:none;
    margin-left:6px;
  }

  /* Largura útil: o conteúdo para de esticar em 1400px. */
  .page{
    max-width:1400px;
    margin:0 auto;
    padding:20px 24px 32px;
  }
  #fab{ bottom:24px; }
  #toast{ bottom:calc(24px + 12px); }
  /* D-8rz-20: cabeçalho da tabela gruda no topo, .search-wrap deixa de
     grudar — as duas em top:0 se sobreporiam. */
  .search-wrap{ position:static; }

  /* ── tabela (D-8rz-19: tudo escopado em .lista-tabela) ── */
  .lista-tabela{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
  }
  .lista-tabela th,
  .lista-tabela td{
    padding:10px 12px;
    font-size:13px;
    text-align:left;
    border-bottom:1px solid #F0F0F0;
  }
  .lista-tabela th.num,
  .lista-tabela td.num{ text-align:right; }
  .lista-tabela thead th{
    position:sticky; top:0; z-index:2;
    background:#F8F9FA;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.3px;
    color:#555;
    white-space:nowrap;
  }
  .lista-tabela tbody tr:nth-child(even){ background:#FAFBFC; }
  .lista-tabela tbody tr:hover{ background:#EEF2FA; cursor:pointer; }
  .lista-tabela .th-acao{
    background:none; border:none; cursor:pointer;
    color:inherit; font:inherit; padding:2px 4px; margin-left:4px;
  }
  .lista-tabela .th-acao:focus-visible{ outline:2px solid #1351B4; outline-offset:1px; }
  .lista-tabela .cel-abrir{
    background:none; border:none; padding:0; margin:0;
    font:inherit; color:inherit; text-align:left; cursor:pointer;
  }
  .lista-tabela input[type=search]{
    width:100%;
    padding:6px 8px;
    border:1px solid #E0E0E0;
    border-radius:6px;
    font-size:12px;
    background:#fff;
  }
  .lista-tabela :focus-visible{ outline:2px solid #1351B4; outline-offset:-2px; }

  /* D-3a6-23: só #inv-list — as outras cinco tabelas têm no máximo seis
     colunas e cabem sem rolar. O teto de altura EXISTE PARA O
     position:sticky DO <thead> CONTINUAR FUNCIONANDO: com overflow no
     próprio contêiner, o cabeçalho passa a se prender a ele, e sem altura
     limitada ele nunca gruda — remover o max-height por achá-lo
     arbitrário mataria D-8rz-20 em silêncio. Sem largura de coluna nem
     table-layout (D-3a6-14): quem cede é a rolagem, nunca a coluna. */
  #inv-list{
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    max-height:calc(100vh - 240px);
    min-height:320px;
  }

  .tab-barra{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-size:12px;
    color:#777;
  }
  .tab-barra button{
    background:#E8ECF5; color:#1351B4;
    border:none; border-radius:8px;
    padding:4px 10px; font-size:12px;
    font-weight:600; cursor:pointer;
  }

  /* ── gaveta vira painel lateral (D-8rz-17) — marcação de #drawer intacta ── */
  #drawer-panel{
    top:0; right:0; bottom:0; left:auto;
    width:min(560px,46vw);
    max-height:none;
    border-radius:0;
    transform:translateX(100%);
  }
  #drawer.open #drawer-panel{ transform:translateX(0); }
  #drawer-handle{ display:none; }
  #drawer-footer{ padding:12px 16px; }

  /* ── #page-ficha: a ficha do equipamento como página inteira
     (quick-260823-92t, D-92t-05) — a PÁGINA não rola, cada coluna rola por
     dentro. D-92t-08: #app já tem height:100vh;height:100dvh e #page-ficha
     é a linha 2 (1fr) dessa grade — um segundo dvh aqui deixaria a faixa de
     topo mais alta que a viewport e reintroduziria a rolagem que este
     pedido proíbe. D-92t-16: tudo dentro deste bloco (min-width:1024px)
     que já existe — nada de bloco novo. */
  #page-ficha{ max-width:none; padding:0; overflow:hidden; }
  #page-ficha.active{ display:grid; grid-template-rows:auto 1fr; height:100%; min-height:0; }
  #ficha-hdr{
    grid-row:1;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    padding:12px 24px;
    background:#fff;
    border-bottom:1px solid #E0E0E0;
  }
  #fh-voltar{
    background:none; border:none; cursor:pointer;
    font:inherit; font-weight:700; color:#1351B4;
    padding:4px 8px; display:flex; align-items:center; gap:6px;
  }
  #fh-acoes{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  /* D-92t-10: min-height:0 em #ficha-colunas e em cada coluna, obrigatório
     — item de grade nasce com min-height:auto e se recusa a encolher
     abaixo do conteúdo; sem isto a coluna empurra a página e a rolagem
     volta para o lugar de onde este pedido a tirou. */
  #ficha-colunas{
    grid-row:2;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr) minmax(0,1fr);
    gap:16px;
    padding:16px 24px;
  }
  .ficha-col{ min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  /* D-92t-09: um único bloco (min-width:1024px), sem limiar novo — o que
     adapta entre 1024px e 1400px é o INTERIOR da coluna, não o número de
     colunas. */
  #page-ficha .dfields2{ grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
}</style>
<script>
/* ══ QR CODE — tela inicial ══ */
var CT_APP_URL = 'https://pmoc-orcin.vercel.app/refrigeracao';
function qrGetUrl(){
  return urlBaseApp();
}
function qrSetUrl(v){
  try{ localStorage.setItem('pmoc_app_url', (v||'').trim()); }catch(e){}
  qrRender();
}
function qrRender(){
  var wrap = document.getElementById('qr-svg-wrap');
  if(!wrap) return;
  var url = qrGetUrl();
  if(!url){
    wrap.innerHTML = '<div style="padding:26px 12px;color:#999;font-size:12px;line-height:1.5"><i class="fas fa-link" style="font-size:22px;display:block;margin-bottom:8px;color:#DDD"></i>Informe abaixo o endereço (URL) onde o app está hospedado para gerar o QR.</div>';
    return;
  }
  try{
    var q = qrcode(0,'M');
    q.addData(url);
    q.make();
    wrap.innerHTML = q.createSvgTag({cellSize:4, margin:2, scalable:true});
  }catch(e){
    wrap.innerHTML = '<div style="padding:20px;color:#E52207;font-size:12px">URL longa demais para o QR.</div>';
  }
}
function qrOpen(){
  var pop = document.createElement('div');
  pop.id = 'qr-pop';
  pop.onclick = function(ev){ if(ev.target===pop) qrClose(); };
  pop.innerHTML = '<div id="qr-card">' +
    '<img src="'+CT_LOGO_URI+'" style="width:44px;height:44px;margin-bottom:8px" alt=""/>' +
    '<div style="font-size:15px;font-weight:800;color:#071D41;margin-bottom:2px">Acesse pelo celular</div>' +
    '<div style="font-size:11px;color:#888;margin-bottom:12px">Aponte a câmera para o código</div>' +
    '<div id="qr-svg-wrap"></div>' +
    '<input id="qr-url" placeholder="https://…" value="'+esc(qrGetUrl())+'" onchange="qrSetUrl(this.value)"' +
    ' style="width:100%;margin-top:12px;padding:9px 10px;border:1.5px solid #E0E0E0;border-radius:9px;font-size:11px;color:#666;text-align:center;outline:none"/>' +
    '<button onclick="qrClose()" style="width:100%;margin-top:12px;background:#1351B4;color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer">Fechar</button>' +
    '</div>';
  document.body.appendChild(pop);
  qrRender();
}
function qrClose(){
  var p = document.getElementById('qr-pop');
  if(p) p.remove();
}
/* injeta o botão pequeno na tela de login */
var _v4RenderLogin = renderLoginMobile;

/* ── QR e etiquetas do equipamento ── */
/* Um gerador de SVG só, três destinos: o QR na tela da ficha, o QR embutido
   no papel (D-s3h-06) e o QR de cada etiqueta. urlBaseApp() é a única origem
   de URL — sempre sem query e sem hash (D-s3h-05) — para o QR "Acesse pelo
   celular" nunca herdar o ?equip= da página que o gerou. */
function urlBaseApp(){
  var salvo = '';
  try{ salvo = localStorage.getItem('pmoc_app_url')||''; }catch(e){}
  var base = linkSeguro(salvo);
  if(!base){
    base = (location.protocol==='http:'||location.protocol==='https:') ? (location.origin+location.pathname) : CT_APP_URL;
  }
  return base.split('#')[0].split('?')[0].replace(/\/$/,'');
}

function urlFichaEquip(id){
  var n = parseInt(id, 10);
  if(!isFinite(n)) return urlBaseApp();
  return urlBaseApp() + '?' + PARAM_FICHA + '=' + n;
}

function qrSvgDe(url, cell){
  if(typeof qrcode !== 'function') return '';
  try{
    var q = qrcode(0,'M');
    q.addData(url);
    q.make();
    return q.createSvgTag({cellSize: cell||4, margin: 2, scalable: true});
  }catch(e){
    return '';
  }
}

var ESTILO_ETIQUETAS =
  'body{margin:0}' +
  '.etq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}' +
  '.etq{border:1px dashed #999;padding:3mm;display:flex;align-items:center;gap:3mm;page-break-inside:avoid;break-inside:avoid}' +
  '.etq-qr svg{width:22mm;height:22mm;display:block}' +
  '.etq-id{font-size:14pt;font-weight:800;color:#071D41}' +
  '.etq-local{font-size:8pt;font-weight:700;word-break:break-word}' +
  '.etq-tipo{font-size:7pt;color:#888}';

/* Uma etiqueta: o SVG à esquerda, dado do equipamento à direita. Toda
   interpolação de dado passa por esc() — o único HTML cru é o SVG produzido
   pela biblioteca a partir de uma URL já validada por urlBaseApp (T-s3h-03).
   Sem SVG (biblioteca ausente/URL longa) a etiqueta ainda sai, com a URL em
   texto pequeno no lugar do desenho. */
function etiquetaHtml(e){
  var svg = qrSvgDe(urlFichaEquip(e.id), 3);
  var qr = svg || ('<div style="font-size:6pt;word-break:break-all">'+esc(urlFichaEquip(e.id))+'</div>');
  return '<div class="etq">' +
    '<div class="etq-qr">'+qr+'</div>' +
    '<div>' +
    '<div class="etq-id">#'+e.id+'</div>' +
    '<div class="etq-local">'+esc(e.predio||'')+' · '+esc(e.local||'')+'</div>' +
    '<div class="etq-tipo">'+esc(e.tipo||'')+(e.btu?' · '+(e.btu/1000).toFixed(0)+'K BTU':'')+'</div>' +
    '</div></div>';
}

/* Seleção vazia avisa e não abre janela nenhuma (D-s3h-08). */
function imprimirEtiquetas(lista){
  if(!lista || !lista.length){
    showToast('Nenhum equipamento na seleção atual', 'error');
    return;
  }
  var corpo = '<div class="etq-grid">' + lista.map(etiquetaHtml).join('') + '</div>';
  imprimirDocumento({
    titulo: 'Etiquetas — '+lista.length+' equipamento(s)',
    subtitulo: 'Recorte no tracejado',
    estilo: ESTILO_ETIQUETAS,
    corpo: corpo,
    assinaturas: []
  });
}

/* Botão da ficha: a mesma função de impressão, lista de um. */
function imprimirEtiquetaDe(id){
  var e = DATA.find(function(r){ return r.id===id; });
  if(!e) return;
  imprimirEtiquetas([e]);
}

function copiarLinkFicha(id){
  try{
    if(!navigator.clipboard){ showToast('Selecione e copie a URL manualmente','error'); return; }
    navigator.clipboard.writeText(urlFichaEquip(id))
      .then(function(){ showToast('Link copiado','ok'); })
      .catch(function(){ showToast('Não foi possível copiar — selecione a URL manualmente','error'); });
  }catch(e){
    showToast('Não foi possível copiar — selecione a URL manualmente','error');
  }
}

/* Bloco 5 da ficha (D-s3h-09): empilhado na vertical, sem botão novo no
   rodapé da gaveta. A Task 3 troca a frase provisória de NFC por blocoNfc(id). */
function blocoQrFicha(id){
  var url = urlFichaEquip(id);
  var svg = qrSvgDe(url, 4);
  return '<div class="ds">' +
    '<div class="ds-title"><i class="fas fa-qrcode mr1" aria-hidden="true"></i>5 · Etiqueta, QR e NFC</div>' +
    '<div class="qr-ficha">' +
    (svg ? svg : '<div style="color:#999;font-size:12px">QR indisponível — use a URL abaixo.</div>') +
    '</div>' +
    '<div style="word-break:break-all;background:#F8F9FA;border:1px solid #E0E0E0;border-radius:8px;padding:8px;font-size:11px;color:#444;margin-bottom:8px">'+esc(url)+'</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
    '<button class="btn-secondary" onclick="copiarLinkFicha('+id+')"><i class="fas fa-copy mr1" aria-hidden="true"></i>Copiar link</button>' +
    '<button class="btn-secondary" onclick="imprimirEtiquetaDe('+id+')"><i class="fas fa-tag mr1" aria-hidden="true"></i>Imprimir etiqueta</button>' +
    '</div>' +
    blocoNfc(id) +
    '</div>';
}

/* ── NFC: gravação de tag ── */
/* A tag guarda a mesma URL do QR (D-s3h-10) — não há formato próprio, e nada
   do lado do site é necessário para LER uma tag: o celular abre o navegador
   sozinho. O que o site faz é GRAVAR, e só onde funciona (D-s3h-11). */
var NFC_ESPERA_MS = 30000;

function nfcDisponivel(){
  return typeof window !== 'undefined' && ('NDEFReader' in window) && window.isSecureContext === true;
}

/* Puro, lista fechada por e.name (D-s3h-12) — cada frase diz o que fazer,
   nunca só "erro", e a palavra "undefined" nunca aparece no texto. */
function mensagemErroNfc(nome, mensagem){
  if(nome==='NotAllowedError') return 'Permissão negada ou tag somente-leitura. Autorize o NFC para este site e tente de novo.';
  if(nome==='NotSupportedError') return 'A tag não tem espaço para esta URL, ou o aparelho não grava.';
  if(nome==='NotReadableError') return 'O NFC está desligado no aparelho. Ligue e tente de novo.';
  if(nome==='NetworkError') return 'A tag foi afastada antes de terminar. Encoste e mantenha parado até o aviso.';
  if(nome==='AbortError') return 'Nenhuma tag encostada no tempo de espera. Toque de novo e encoste a tag na parte de trás do celular.';
  return 'Não foi possível gravar a tag' + (mensagem ? ' (' + mensagem + ')' : '') + '.';
}

async function gravarTagNfc(id){
  if(!nfcDisponivel()){
    showToast('Este aparelho/navegador não grava tags NFC — use a URL acima com um app de NFC', 'error');
    return false;
  }
  var url = urlFichaEquip(id); // a mesma URL do QR (D-s3h-10)
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, NFC_ESPERA_MS);
  showToast('Encoste a tag NFC no celular…', '');
  try{
    await new window.NDEFReader().write({records:[{recordType:'url', data:url}]}, {signal: ctrl.signal});
    showToast('Tag gravada para o equipamento #'+id, 'ok');
    return true;
  }catch(e){
    showToast(mensagemErroNfc(e && e.name, e && e.message), 'error');
    return false;
  }finally{
    clearTimeout(timer);
  }
}

/* Com suporte, o botão de gravação; sem suporte, nenhum botão — a instrução
   de gravar por app de NFC no lugar dele. Nos dois casos a URL já está
   visível no bloco 5, que é o caminho principal (D-s3h-10). */
function blocoNfc(id){
  if(nfcDisponivel()){
    return '<button class="btn-secondary" onclick="gravarTagNfc('+id+')"><i class="fas fa-wifi mr1" aria-hidden="true"></i>Gravar tag NFC</button>' +
      '<div style="font-size:11px;color:#888;margin-top:6px">Basta encostar uma tag regravável no celular.</div>';
  }
  return '<div style="font-size:11px;color:#888">A gravação pelo site só funciona no Chrome do Android, em https. Em qualquer outro aparelho, grave a URL acima como registro do tipo URL com um app de NFC (por exemplo, NFC Tools) — a tag guarda só esse endereço.</div>';
}

/* ══ IMPRESSÃO DA OS ══ */
/* Tabela de duas colunas, usada pelos dois consumidores da folha timbrada. */
function row2(l,v){ return '<tr><td class="l">'+l+'</td><td>'+(v||'—')+'</td></tr>'; }

/* ── folha timbrada A4: dois consumidores (D-q57-10) ── */
/* ctPrintOS (contratação) e printFicha (ficha do equipamento) chamam esta
   função — ela guarda só o que é comum: DOCTYPE, o CSS de A4 inteiro, o
   cabeçalho (logo + linha institucional do CMASM), a grade de assinaturas, o
   rodapé com data/hora de geração, e o window.open + document.write +
   document.close + print com o mesmo aviso de pop-up bloqueado. `corpo` e
   `subtitulo` chegam como HTML JÁ ESCAPADO pelo chamador em cada interpolação
   (T-q57-02) — esta função não escapa o que recebe pronto, só o que recebe
   como dado cru (titulo, papel/nome das assinaturas). */
function imprimirDocumento(opcoes){
  opcoes = opcoes || {};
  var titulo = opcoes.titulo || '';
  var subtitulo = opcoes.subtitulo || '';
  var corpo = opcoes.corpo || '';
  var assinaturas = opcoes.assinaturas || [];
  var rodape = opcoes.rodape || ('Documento gerado pelo PMOC.Refrigeração · CMASM/DME em '+new Date().toLocaleString('pt-BR'));
  var estilo = opcoes.estilo || '';
  var ass = assinaturas.map(function(a){ return '<div>'+esc(a.papel)+'<br/>'+esc(a.nome||'')+'</div>'; }).join('');
  var h = '<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"/><title>'+esc(titulo)+'</title><style>' +
    'body{font-family:Arial,sans-serif;font-size:10pt;color:#1B1B1B;margin:14mm}' +
    'h1{font-size:14pt;color:#071D41;margin:0}h2{font-size:10pt;color:#1351B4;border-bottom:1.5px solid #1351B4;padding-bottom:2px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}' +
    'table{width:100%;border-collapse:collapse;font-size:9pt}td,th{padding:4px 6px;border:1px solid #CCC;vertical-align:top;text-align:left}' +
    'th{background:#E8ECF5;color:#071D41}td.l{width:130px;font-weight:700;background:#F8F9FA}' +
    '.num{text-align:right;white-space:nowrap}.tot td{font-weight:800;background:#F0F2F5}' +
    '.hdr{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #071D41;padding-bottom:8px}' +
    '.fotos{display:flex;gap:5mm;flex-wrap:wrap;margin:3mm 0}.fotos img{max-height:42mm;max-width:60mm;border:1px solid #CCC}' +
    '.ass{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:14mm}.ass div{border-top:1px solid #000;padding-top:2mm;text-align:center;font-size:8pt}' +
    '.meta{font-size:8pt;color:#888}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}' +
    '@page{size:A4;margin:12mm}' + estilo +
    '</style></head><body>' +
    '<div class="hdr"><img src="'+CT_LOGO_URI+'" style="width:52px;height:52px"/>' +
    '<div style="flex:1"><h1>'+esc(titulo)+'</h1>' +
    '<div class="meta">CMASM · Divisão de Manutenção Especializada · UASG 744030 · ARP Nº 04/2024 (PE 90026/2024 — CMRJ) · Processo 63099.002208/2025-06</div></div>' +
    '<div style="text-align:right;font-size:9pt">'+subtitulo+'</div></div>' +
    corpo +
    (ass?'<div class="ass">'+ass+'</div>':'') +
    '<div class="meta" style="margin-top:8mm;border-top:1px solid #CCC;padding-top:2mm">'+esc(rodape)+'</div>' +
    '</body></html>';
  var w = window.open('','_blank','width=900,height=700');
  if(!w){ showToast('Permita pop-ups para imprimir','error'); return; }
  w.document.write(h);
  w.document.close();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 700);
}

function ctPrintOS(osId){
  var o = ctOS.find(function(x){return x.id===osId;}); if(!o) return;
  var e = ctEquip(o.equip_id);
  var itens = ctOrc[osId]||[], regs = ctExec[osId]||[], comps = ctComp[osId]||[], evts = ctEvt[osId]||[];
  var total = ctOrcTotal(osId), compTotal = ctCompTotal(osId);
  var st = (CT_STATUS[o.status]||{}).label || o.status;
  var corpo = '<h2>1. Identificação</h2><table>' +
    row2('Equipamento', '#'+o.equip_id+' — '+esc(e.predio)+' / '+esc(e.local)+' ('+esc(e.tipo)+(e.btu?', '+(e.btu/1000).toFixed(0)+'K BTU':'')+')') +
    row2('Empresa', esc(o.empresa||'')+' · '+esc(o.ne||'')) +
    row2('Solicitante', esc(o.solicitante||'')+' em '+fmtDate(o.data_solicitacao)) +
    row2('Problema / serviço', esc(o.problema||'')) + '</table>';
  if(itens.length){
    corpo += '<h2>2. Orçamento aprovado</h2><table><tr><th>Tipo</th><th>Descrição</th><th class="num">Qtd</th><th class="num">Vlr Unit.</th><th class="num">Total</th></tr>' +
      itens.map(function(i){ return '<tr><td>'+(i.tipo==='SERVICO'?'Serviço':'Material')+'</td><td>'+esc(i.descricao)+'</td>' +
        '<td class="num">'+i.qtd+'</td><td class="num">'+fmtMoney(i.valor_unit)+'</td><td class="num">'+fmtMoney(i.qtd*i.valor_unit)+'</td></tr>'; }).join('') +
      '<tr class="tot"><td colspan="4">TOTAL ORÇADO</td><td class="num">'+fmtMoney(o.valor_orcado||total)+'</td></tr></table>' +
      (o.aprovador?'<div class="meta" style="margin-top:2mm">Aprovado por '+esc(o.aprovador)+' em '+fmtDate(o.data_aprovacao)+'.</div>':'');
  }
  if(regs.length){
    corpo += '<h2>3. Execução</h2>';
    regs.forEach(function(r){
      var med = r.medicoes||{}, mt=[];
      if(med.temp_insuflamento!=null) mt.push('Insuflamento: '+med.temp_insuflamento+'°C');
      if(med.temp_retorno!=null) mt.push('Retorno: '+med.temp_retorno+'°C');
      if(med.corrente!=null) mt.push('Corrente: '+med.corrente+' A');
      if(med.pressao!=null) mt.push('Pressão: '+med.pressao+' psi');
      corpo += '<table style="margin-bottom:3mm">'+row2('Data / Executor', fmtDate(r.data)+' · '+esc(r.executor||''))+
        row2('Serviços', esc(r.descricao||''))+(mt.length?row2('Medições', mt.join(' · ')):'')+'</table>';
      var fs = (r.fotos||[]).map(function(p){
        var u = supa.storage.from('os-fotos').getPublicUrl(p).data.publicUrl;
        return '<img src="'+u+'"/>';
      }).join('');
      if(fs) corpo += '<div class="fotos">'+fs+'</div>';
    });
  }
  corpo += '<h2>4. Fiscalização</h2><table>'+row2('Fiscal', esc(o.fiscal||'—')+(o.data_fiscalizacao?' em '+fmtDate(o.data_fiscalizacao):''))+
    row2('Parecer', esc(o.parecer_fiscal||'—'))+'</table>';
  if(comps.length){
    corpo += '<h2>5. Composição de pagamento — itens da ata</h2><table><tr><th>Item ARP</th><th>Descrição</th><th class="num">Qtd</th><th class="num">Vlr Unit.</th><th class="num">Total</th></tr>' +
      comps.map(function(c){
        var it = ctArp.find(function(a){return a.item===c.item_arp;})||{descricao:'',valor_unit:0};
        return '<tr><td>'+c.item_arp+'</td><td>'+esc(it.descricao)+'</td><td class="num">'+c.qtd+'</td>' +
          '<td class="num">'+fmtMoney(it.valor_unit)+'</td><td class="num">'+fmtMoney(c.qtd*it.valor_unit)+'</td></tr>';
      }).join('') +
      '<tr class="tot"><td colspan="4">TOTAL COMPOSTO</td><td class="num">'+fmtMoney(compTotal)+'</td></tr></table>' +
      '<div class="meta" style="margin-top:2mm">Diferença vs orçado: '+fmtMoney((o.valor_orcado||total)-compTotal)+'. Em atendimento ao art. 86 da Lei 14.133/2021 — pagamento composto por itens registrados na ARP; orçamento aprovado anexo.</div>';
  }
  corpo += '<h2>'+(comps.length?'6':'5')+'. Certificação</h2><table>'+row2('Nota Fiscal', esc(o.nf||'—')+(o.data_nf?' de '+fmtDate(o.data_nf):''))+

  if(evts.length){
    corpo += '<h2>'+(comps.length?'7':'6')+'. Histórico (auditoria)</h2><table><tr><th>Data/Hora</th><th>Evento</th><th>Detalhe</th><th>Usuário</th></tr>' +
      evts.map(function(ev){
        return '<tr><td>'+(ev.criado_em?new Date(ev.criado_em).toLocaleString('pt-BR'):'')+'</td><td>'+esc(ev.evento)+'</td>' +
          '<td>'+esc(ctEvtTexto(ev))+'</td>' +
          '<td>'+esc(ev.usuario||'')+'</td></tr>';
      }).join('')+'</table>';
  }
  imprimirDocumento({
    titulo: 'ORDEM DE SERVIÇO — '+o.numero,
    subtitulo: '<strong>'+esc(st)+'</strong><br/><span class="meta">'+(o.ne?esc(o.ne):'')+'</span>',
    corpo: corpo,
    assinaturas: [
      {papel:'Solicitante', nome:o.solicitante||''},
      {papel:'Gestor Administrativo', nome:o.aprovador||''},
      {papel:'Fiscal', nome:o.fiscal||''},
      {papel:'Certificador', nome:o.certificador||''}

}

/* ── ficha: impressão A4 (D-q57-10, segundo consumidor de imprimirDocumento) ── */
function printFicha(equipId){
  var e = DATA.find(function(r){ return r.id===equipId; }); if(!e) return;
  var logsTodos = getEquipLog(equipId);
  var logs = logsTodos.slice(0, 10);
  var horas = (e.horasDia||0)*(e.diasSemana||0);
  var btuK = e.btu? (e.btu/1000).toFixed(0)+'K BTU' : '—';
  var kw = e.btu? (e.btu/3412).toFixed(2)+' kW' : '—';
  var lastDate = e.ultimaManutencao || getLatestLogDate(equipId);

  var corpo = '<h2>1. Local</h2><table>' +
    row2('Área', esc(e.area)) +
    row2('Prédio', esc(e.predio)) +
    row2('Local', esc(e.local)) +
    row2('Patrimônio', e.patrimonio?esc(e.patrimonio):'') +
    '</table>';

  corpo += '<h2>2. Dados do equipamento</h2><table>' +
    row2('Tipo', esc(e.tipo)) +
    row2('Fabricante', e.fabricante&&e.fabricante!=='-'?esc(e.fabricante):'') +
    row2('Modelo', e.modelo?esc(e.modelo):'') +
    row2('Capacidade', btuK+' / '+kw) +
    row2('Tensão nominal', e.tensao?e.tensao+'V':'') +
    row2('Corrente nominal', e.correnteNominal?e.correnteNominal+'A':'') +
    row2('Refrigerante', e.refrigerante?esc(e.refrigerante):'') +
    row2('Data de fabricação', e.dataFabricacao?fmtDate(e.dataFabricacao):'') +
    row2('Data de instalação', e.dataInstalacao?fmtDate(e.dataInstalacao):'') +
    row2('Link', e.link?esc(e.link):'') +
    row2('Manual', e.manualUrl?esc(e.manualUrl):'') +
    '</table>';

  corpo += '<h2>3. Estado e PMOC</h2><table>' +
    row2('Estado', esc(rotuloEstadoEquip(e.funciona))) +
    row2('Criticidade', esc(autoCrit(e)||'')) +
    row2('Idade aparente', e.estado?esc(e.estado):'') +
    row2('h/semana', horas?horas+'h':'') +
    row2('Última manutenção', lastDate?fmtDate(lastDate):'') +
    row2('Observações', e.obs?esc(e.obs):'') +
    medicoesFichaLinhasImpressao(logsTodos) +
    '</table>';

  corpo += '<h2>4. Histórico de OS/manutenções ('+logs.length+' de '+logsTodos.length+')</h2>';
  if(logs.length){
    corpo += '<table><tr><th>Data</th><th>Tipo</th><th>Status</th><th>Técnico</th><th>Descrição</th></tr>' +
      logs.map(function(entry){
        return '<tr><td>'+fmtDate(entry.date)+'</td><td>'+esc(entry.tipo||'')+'</td>' +
          '<td>'+esc(manRotulo(entry.status))+'</td><td>'+esc(entry.tecnico||'')+'</td>' +
          '<td>'+esc(entry.desc||'')+'</td></tr>';
      }).join('') + '</table>';
  } else {
    corpo += '<div class="meta">Nenhuma OS/manutenção registrada ainda.</div>';
  }

  var qrFicha = qrSvgDe(urlFichaEquip(equipId), 3);

  imprimirDocumento({

    ]

}

/* ── planilha do inventário: núcleo puro ── */
/* quick-260822-5hy. Exportar/reimportar o cadastro por CSV, no modo que o
   usuário escolheu (atualiza + cria + arquiva por ausência) depois de eu
   recomendar contra — o trabalho aqui é tornar o modo sobrevivível, não
   recusá-lo. Nada neste bloco toca DOM nem `supa` (D-5hy-03): tudo aqui é
   função pura, testável em Node, consumida pela tela em
   "planilha do inventário: tela e gravação" logo abaixo. */

var PLANILHA_MARCA = '#pmoc-refrigeracao';
var PLANILHA_VERSAO = 'v1';
var PLANILHA_SEP = ';';
var PLANILHA_FRACAO_ARQUIVAR = 0.10;
var PLANILHA_PISO_ARQUIVAR = 5;

/* As duas colunas que a planilha mostra mas nunca grava (D-5hy-07): sem
   `situacao` a planilha pareceria 171 linhas iguais quando algumas não
   estão mais no cadastro ativo; `ultimaManutencao` é o que quem edita mais
   quer ver ao lado. Nenhuma das duas está em EQUIP_EDITAVEIS, e continua
   fora — uma divergência nelas é ignorada e anunciada, nunca gravada. */
var PLANILHA_LEITURA = {
  situacao: 'Situação (somente leitura)',
  ultimaManutencao: 'Última manutenção (somente leitura)'
};

/* D-5hy-06: as colunas nascem de EQUIP_EDITAVEIS, nunca de uma segunda
   lista escrita à mão — escrever as 22 colunas de novo criaria duas listas
   que divergem no primeiro campo novo. As coordenadas geográficas e o
   vínculo com o local não entram (D-5hy-08): posição é trabalho de campo
   do mapa operacional, e nenhuma delas está em EQUIP_EDITAVEIS. */
function planilhaColunas(){
  var cols = [{chave:'id', rotulo:'id', leitura:true}];
  Object.keys(PLANILHA_LEITURA).forEach(function(k){
    cols.push({chave:k, rotulo:PLANILHA_LEITURA[k], leitura:true});
  });
  EQUIP_EDITAVEIS.forEach(function(k){
    cols.push({chave:k, rotulo: EQUIP_ROTULOS[k] || k, leitura:false});
  });
  return cols;
}

/* Mesma forma de maquinas/app.js:2782/2787 (a forma, copiada; nada é
   importado — a refrigeração é congelada e standalone, D-04), reescrita em
   ES5. Uma célula começando com =, +, - ou @ vira comando ao abrir na
   planilha; csvSeguro prefixa aspa simples para desarmar, csvEscape cerca
   em aspas quando o texto carrega separador, aspas ou quebra de linha. */
function csvSeguro(valor){
  var texto = String(valor === null || valor === undefined ? '' : valor);
  return /^[=+\-@]/.test(texto) ? "'" + texto : texto;
}
function csvEscape(valor){
  var texto = String(valor === null || valor === undefined ? '' : valor);
  return /[";\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
}

/* D-5hy-22: desfaz csvSeguro na leitura. Sem isso, uma observação começando
   com hífen voltaria diferente do que saiu e o ciclo fechado (D-5hy-04)
   quebraria. Só remove quando o caractere seguinte é um dos quatro — um
   apóstrofo seguido de letra é texto do usuário, preservado como veio. */
function csvSemGuarda(t){
  if (typeof t !== 'string' || t.charAt(0) !== "'") return t;
  return /^[=+\-@]/.test(t.slice(1)) ? t.slice(1) : t;
}

function planPad2(n){ return (n < 10 ? '0' : '') + n; }

/* D-5hy-12: a serialização única — consumida tanto pela exportação quanto
   pelo diff da importação. Comparar SEMPRE esta forma (nunca o valor
   tipado) é o que faz D-5hy-04 valer por construção e some com a briga
   null vs 0 de correnteNominal. Data em ISO; booleano na palavra afirmativa
   ou negativa (nunca célula vazia, D-5hy-19); resto pelo texto cru, vazio
   só quando o valor é nulo/indefinido. Exporta o valor BRUTO das três
   listas fechadas (funciona/criticidade/idade aparente), nunca o rótulo. */
function planilhaValor(chave, e){
  if (!e) return '';
  if (chave === 'id') return e.id === null || e.id === undefined ? '' : String(e.id);
  if (chave === 'situacao') return normalizarSituacaoEquip(e.situacao) || '';
  if (chave === 'ultimaManutencao') return e.ultimaManutencao || '';
  if (chave === 'funciona') return normalizarEstadoEquip(e.funciona) || '';
  if (chave === 'refrigPermanente') {
    if (e.refrigPermanente === true) return 'SIM';
    if (e.refrigPermanente === false) return 'NÃO';
    return '';
  }
  var v = e[chave];
  if (v === null || v === undefined) return '';
  return String(v);
}

/* D-5hy-13: a primeira linha do CSV declara o próprio escopo. Começa com #
   — visivelmente não-dado no Excel, e fora do conjunto de guarda de
   fórmula (=+-@). */
function planilhaLinhaEscopo(qtdInstaladosNoArquivo, escopoCompleto, dataIso){
  return [
    PLANILHA_MARCA,
    PLANILHA_VERSAO,
    'escopo=' + (escopoCompleto ? 'completo' : 'parcial'),
    'instalados=' + qtdInstaladosNoArquivo,
    'exportado=' + dataIso
  ].join(PLANILHA_SEP);
}

/* Quando a primeira célula não começa com a marca, devolve null — a linha 1
   é tratada como cabeçalho, e um arquivo feito à mão continua funcionando,
   só que sem arquivar (D-5hy-13). */
function lerLinhaEscopo(celulas){
  if (!celulas || !celulas.length || String(celulas[0] || '').indexOf(PLANILHA_MARCA) !== 0) return null;
  var out = {versao: celulas[1] || '', escopo: '', instalados: null};
  for (var i = 2; i < celulas.length; i++){
    var par = String(celulas[i] || '').split('=');
    if (par[0] === 'escopo') out.escopo = par.slice(1).join('=');
    if (par[0] === 'instalados') out.instalados = parseInt(par[1], 10);
  }
  return out;
}

/* D-5hy-14: o escopo é derivado do CONTEÚDO, nunca do estado da tela (chip
   ativo, texto da busca) — um estado de tela é falsificável por qualquer
   alteração futura no filtro; a comparação de conjuntos não. `lista` é
   sempre um subconjunto de `dados` (vem de filtrarInventario(DATA,...)),
   então "completo" vale sse todo item ativo de `dados` está em `lista`. */
function escopoCompletoDe(lista, dados){
  var idsLista = {};
  (lista || []).forEach(function(e){ idsLista[e.id] = true; });
  return (dados || []).every(function(e){
    return !equipInstalado(e) || idsLista.hasOwnProperty(e.id);
  });
}

/* montarCsv recebe `dados` (o DATA inteiro), não só a contagem: precisa
   dele tanto para o total de instalados quanto para escopoCompletoDe — um
   número sozinho não bastaria para decidir completude por conjunto
   (D-5hy-14). Sem a marca de ordem de byte, que a tela acrescenta no
   download (Tarefa 2). */
function montarCsv(lista, dados, dataIso){
  lista = lista || [];
  dados = dados || [];
  var instaladosTotal = dados.filter(equipInstalado).length;
  var completo = escopoCompletoDe(lista, dados);
  var colunas = planilhaColunas();
  var linhas = [];
  linhas.push(planilhaLinhaEscopo(instaladosTotal, completo, dataIso));
  linhas.push(colunas.map(function(c){ return csvEscape(csvSeguro(c.rotulo)); }).join(PLANILHA_SEP));
  lista.forEach(function(e){
    linhas.push(colunas.map(function(c){ return csvEscape(csvSeguro(planilhaValor(c.chave, e))); }).join(PLANILHA_SEP));
  });
  return linhas.join('\n');
}

/* Máquina de estados de um caractere por vez — o coração do task (o parser
   é onde o gate tem de morder, não o caminho feliz). Fora/dentro de aspas;
   "" dentro de aspas emite uma aspa; separador e quebra de linha só
   terminam campo/linha FORA de aspas — dentro delas viram texto normal, o
   que preserva quebra de linha embutida numa observação. \r\n e \r sozinho
   tratados sem deixar retorno de carro no último campo. Marca de ordem de
   byte removida se for o primeiro caractere do texto inteiro (nunca gruda
   no primeiro cabeçalho). Cada célula passa por csvSemGuarda ao ser
   emitida. Texto vazio devolve lista vazia, sem lançar. */
function csvParse(texto){
  var t = String(texto || '');
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  var linhas = [];
  var linha = [];
  var campo = '';
  var dentroAspas = false;
  var i = 0;
  var n = t.length;
  while (i < n){
    var c = t.charAt(i);
    if (dentroAspas){
      if (c === '"'){
        if (t.charAt(i + 1) === '"'){ campo += '"'; i += 2; continue; }
        dentroAspas = false; i++; continue;
      }
      campo += c; i++; continue;
    }
    if (c === '"'){ dentroAspas = true; i++; continue; }
    if (c === PLANILHA_SEP){ linha.push(csvSemGuarda(campo)); campo = ''; i++; continue; }
    if (c === '\r'){
      linha.push(csvSemGuarda(campo)); campo = '';
      linhas.push(linha); linha = [];
      i++;
      if (t.charAt(i) === '\n') i++;
      continue;
    }
    if (c === '\n'){
      linha.push(csvSemGuarda(campo)); campo = '';
      linhas.push(linha); linha = [];
      i++; continue;
    }
    campo += c; i++;
  }
  // última linha sem quebra final — mas se ela é só a cauda vazia de uma
  // quebra de linha que já fechou a linha anterior, não vira linha nova.
  if (campo !== '' || linha.length){
    linha.push(csvSemGuarda(campo));
    linhas.push(linha);
  }
  return linhas;
}

/* D-5hy-09: casamento por igualdade estrita do rótulo do cabeçalho, ordem
   de coluna irrelevante — o Excel reordena. Coluna com rótulo desconhecido
   é ignorada e devolvida em `ignoradas`, pelo nome; coluna conhecida
   ausente é legítima (uma planilha com só id + Observações atualiza só
   observações). Sem coluna id, `temId` sai falso e o chamador recusa o
   arquivo inteiro. */
function mapearCabecalho(celulas){
  var colunas = planilhaColunas();
  var porRotulo = {};
  colunas.forEach(function(c){ porRotulo[c.rotulo] = c; });
  var porChave = {};
  var ignoradas = [];
  var temId = false;
  (celulas || []).forEach(function(rotulo, idx){
    var c = porRotulo.hasOwnProperty(rotulo) ? porRotulo[rotulo] : null;
    if (!c){ ignoradas.push(rotulo); return; }
    porChave[c.chave] = idx;
    if (c.chave === 'id') temId = true;
  });
  return {porChave: porChave, ignoradas: ignoradas, temId: temId};
}

/* D-5hy-18: data validada por RECONSTRUÇÃO (monta a data e confere se os
   três componentes voltam iguais), nunca por expressão regular sozinha —
   é o único jeito honesto de pegar 31/02. dd/mm/aa é recusado por século
   ambíguo; um número puro é a data virada serial do Excel, e escolher
   entre a época de 1900 e a de 1904 seria chutar. */
function celulaParaData(t){
  if (/^\d{2}\/\d{2}\/\d{2}$/.test(t)){
    return {ok:false, erro:'ano com dois dígitos é ambíguo — use aaaa-mm-dd ou dd/mm/aaaa'};
  }
  var mIso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t);
  var mBr = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t);
  if (!mIso && !mBr){
    if (/^\d+(\.\d+)?$/.test(t)) return {ok:false, erro:'célula formatada como número — provável data serial do Excel'};
    return {ok:false, erro:'data em formato não reconhecido — use aaaa-mm-dd ou dd/mm/aaaa'};
  }
  var ano, mes, dia;
  if (mIso){ ano = parseInt(mIso[1], 10); mes = parseInt(mIso[2], 10); dia = parseInt(mIso[3], 10); }
  else { dia = parseInt(mBr[1], 10); mes = parseInt(mBr[2], 10); ano = parseInt(mBr[3], 10); }
  var d = new Date(Date.UTC(ano, mes - 1, dia));
  if (d.getUTCFullYear() !== ano || d.getUTCMonth() !== (mes - 1) || d.getUTCDate() !== dia){
    return {ok:false, erro:'data impossível'};
  }
  return {ok:true, valor: ano + '-' + planPad2(mes) + '-' + planPad2(dia)};
}

/* D-5hy-20: vírgula decimal aceita (o Excel em pt-BR escreve 7,5); duas
   vírgulas ou separador de milhar (ponto convivendo com vírgula) são
   recusados em vez de adivinhados. */
function celulaParaCorrente(t){
  var virgulas = (t.match(/,/g) || []).length;
  if (virgulas > 1) return {ok:false, erro:'corrente com mais de um separador decimal'};
  if (virgulas === 1 && t.indexOf('.') >= 0) return {ok:false, erro:'corrente com separador de milhar não é aceito — use só vírgula ou ponto decimal'};
  var normalizado = virgulas === 1 ? t.replace(',', '.') : t;
  if (!/^-?\d+(\.\d+)?$/.test(normalizado)) return {ok:false, erro:'corrente inválida'};
  return {ok:true, valor: parseFloat(normalizado)};
}

/* Travessia de tipos de D-5hy-18/19/20/21, uma célula por vez. `texto` chega
   cru — a mesma forma que planilhaValor produziria para uma célula intocada,
   o que é o que faz o diff (planoDeImportacao) funcionar por comparação de
   texto contra texto, nunca de valor tipado contra valor tipado. */
function celulaParaValor(chave, texto){
  var t = texto === null || texto === undefined ? '' : String(texto);
  if (chave === 'refrigPermanente'){
    var up = t.trim().toUpperCase(); // D-5hy-19: normalização EXPLÍCITA, não implícita
    if (up === '') return {ok:true, valor:null};
    if (up === 'SIM' || up === '1' || up === 'VERDADEIRO' || up === 'TRUE') return {ok:true, valor:true};
    if (up === 'NÃO' || up === 'NAO' || up === '0' || up === 'FALSO' || up === 'FALSE') return {ok:true, valor:false};
    return {ok:false, erro:'valor booleano não reconhecido — use SIM ou NÃO'};
  }
  if (chave === 'dataFabricacao' || chave === 'dataInstalacao'){
    if (t === '') return {ok:true, valor:null};
    return celulaParaData(t);
  }
  if (chave === 'correnteNominal'){
    if (t === '') return {ok:true, valor:null};
    return celulaParaCorrente(t);
  }
  if (EQUIP_NUMERICOS.indexOf(chave) >= 0){
    if (t === '') return {ok:true, valor:null};
    if (!/^-?\d+$/.test(t)) return {ok:false, erro:'esperado número inteiro'};
    return {ok:true, valor: parseInt(t, 10)};
  }
  if (chave === 'funciona'){
    if (t === '') return {ok:true, valor:null};
    if (EQUIP_ORDEM.indexOf(t) < 0) return {ok:false, erro:'estado fora da lista fechada (' + EQUIP_ORDEM.join('/') + ')'};
    return {ok:true, valor:t};
  }
  if (chave === 'criticidade'){
    if (t === '') return {ok:true, valor:null};
    if (EQUIP_CRITICIDADES.indexOf(t) < 0) return {ok:false, erro:'criticidade fora da lista fechada'};
    return {ok:true, valor:t};
  }
  if (chave === 'estado'){
    if (t === '') return {ok:true, valor:null};
    if (EQUIP_IDADES.indexOf(t) < 0) return {ok:false, erro:'idade aparente fora da lista fechada'};
    return {ok:true, valor:t};
  }
  if (chave === 'link' || chave === 'manualUrl'){
    if (t === '') return {ok:true, valor:null};
    if (!linkSeguro(t)) return {ok:false, erro:'link inválido — use http:// ou https://'};
    return {ok:true, valor:t};
  }
  return {ok:true, valor: t === '' ? null : t};
}

/* D-5hy-15: guarda de escala. Este banco nunca registrou uma remoção (0 de
   171) — um primeiro lote grande é, por evidência, muito mais provável que
   seja acidente de planilha do que remoção em massa real. Piso de 5 para
   um inventário pequeno não travar o uso normal. */
function tetoArquivar(instalados){
  return Math.max(PLANILHA_PISO_ARQUIVAR, Math.ceil(instalados * PLANILHA_FRACAO_ARQUIVAR));
}

/* A função pura central — sem DOM, sem rede, sem conhecer `supa`. Ordem que
   importa: casar cabeçalho → percorrer linhas produzindo atualizar/criar/
   erros → só então decidir arquivar, avaliando as três pré-condições de
   D-5hy-13 e depois a guarda de escala (D-5hy-15). Um arquivo com qualquer
   linha recusada não arquiva nada (D-5hy-11), mas atualizar/criar das
   linhas boas continuam valendo. */
function planoDeImportacao(texto, dados){
  dados = dados || [];
  var linhasCsv = csvParse(texto);
  var plano = {
    escopo: null, versaoArquivo: null, instaladosDeclarados: null,
    instaladosAgora: dados.filter(equipInstalado).length,
    atualizar: [], criar: [], arquivar: [], candidatosArquivar: [], erros: [], ignoradas: [],
    leituraIgnorada: [], bloqueios: [], teto: 0
  };
  if (!linhasCsv.length){
    plano.bloqueios.push('arquivo vazio');
    return plano;
  }

  var idxCabecalho = 0;
  var linhaEscopo = lerLinhaEscopo(linhasCsv[0]);
  if (linhaEscopo){
    plano.escopo = linhaEscopo.escopo;
    plano.versaoArquivo = linhaEscopo.versao;
    plano.instaladosDeclarados = linhaEscopo.instalados;
    idxCabecalho = 1;
  }

  var cabecalho = linhasCsv[idxCabecalho];
  if (!cabecalho){
    plano.bloqueios.push('arquivo sem cabeçalho');
    return plano;
  }
  var mapa = mapearCabecalho(cabecalho);
  plano.ignoradas = mapa.ignoradas;
  if (!mapa.temId){
    plano.bloqueios.push('arquivo sem coluna id — recusado inteiro, não há chave para casar');
    return plano;
  }

  var porId = {};
  dados.forEach(function(e){ porId[e.id] = e; });

  // primeira passada: separa id inválido (nunca coagido a número) e conta
  // repetição de id — D-5hy-10, as três formas de errar a chave.
  var idxPrimeiraLinha = idxCabecalho + 1;
  var candidatas = [];
  var idsVistos = {};
  for (var li = idxPrimeiraLinha; li < linhasCsv.length; li++){
    var cels = linhasCsv[li];
    var numeroLinha = li + 1;
    var idTexto = cels[mapa.porChave.id];
    idTexto = idTexto === undefined || idTexto === null ? '' : String(idTexto);
    if (idTexto !== '' && !/^\d{1,9}$/.test(idTexto)){
      plano.erros.push({linha: numeroLinha, coluna: 'id', mensagem: 'id inválido — não é número'});
      continue;
    }
    if (idTexto !== '') idsVistos[idTexto] = (idsVistos[idTexto] || 0) + 1;
    candidatas.push({numeroLinha: numeroLinha, cels: cels, idTexto: idTexto});
  }

  candidatas.forEach(function(item){
    var numeroLinha = item.numeroLinha, cels = item.cels, idTexto = item.idTexto;
    if (idTexto !== '' && idsVistos[idTexto] > 1){
      plano.erros.push({linha: numeroLinha, coluna: 'id', mensagem: 'id repetido no arquivo — qual vence não é decisão que o app possa tomar sozinho'});
      return;
    }
    var equipAtual = null;
    if (idTexto !== ''){
      equipAtual = porId.hasOwnProperty(idTexto) ? porId[idTexto] : null;
      if (!equipAtual){
        plano.erros.push({linha: numeroLinha, coluna: 'id', mensagem: 'id não existe no inventário'});
        return;
      }
    }

    var patch = {};
    var camposMudados = [];
    var erroLinha = false;
    EQUIP_EDITAVEIS.forEach(function(chave){
      if (!mapa.porChave.hasOwnProperty(chave)) return; // coluna ausente é legítimo — atualiza só o que veio
      var textoCel = cels[mapa.porChave[chave]];
      var r = celulaParaValor(chave, textoCel);
      if (!r.ok){
        plano.erros.push({linha: numeroLinha, coluna: EQUIP_ROTULOS[chave] || chave, mensagem: r.erro});
        erroLinha = true;
        return;
      }
      var novoSerial = textoCel === null || textoCel === undefined ? '' : String(textoCel);
      if (equipAtual){
        var atualSerial = planilhaValor(chave, equipAtual);
        if (atualSerial !== novoSerial){ patch[chave] = r.valor; camposMudados.push(chave); }
      } else if (r.valor !== null && r.valor !== undefined && r.valor !== ''){
        patch[chave] = r.valor;
      }
    });

    // D-5hy-07: coluna somente-leitura divergente nunca entra no patch —
    // só é contada e nomeada.
    Object.keys(PLANILHA_LEITURA).forEach(function(chaveLeitura){
      if (!mapa.porChave.hasOwnProperty(chaveLeitura)) return;
      var textoCel = cels[mapa.porChave[chaveLeitura]];
      var novoSerial = textoCel === null || textoCel === undefined ? '' : String(textoCel);
      var atualSerial = equipAtual ? planilhaValor(chaveLeitura, equipAtual) : '';
      if (atualSerial !== novoSerial){
        plano.leituraIgnorada.push({linha: numeroLinha, coluna: PLANILHA_LEITURA[chaveLeitura]});
      }
    });

    if (erroLinha) return;
    if (equipAtual){
      if (camposMudados.length > 0) plano.atualizar.push({id: equipAtual.id, equip: equipAtual, patch: patch, campos: camposMudados});
    } else {
      plano.criar.push({linha: numeroLinha, patch: patch});
    }
  });

  // D-5hy-16: arquivar nunca inclui quem não está instalado, e presença no
  // arquivo nunca muda situação — só a AUSÊNCIA de um id instalado é o gatilho.
  var idsNoArquivo = {};
  candidatas.forEach(function(item){ if (item.idTexto !== '') idsNoArquivo[item.idTexto] = true; });
  var candidatosArquivar = dados.filter(function(e){
    return equipInstalado(e) && !idsNoArquivo.hasOwnProperty(String(e.id));
  });
  plano.teto = tetoArquivar(plano.instaladosAgora);

  var podeArquivar = true;
  if (!linhaEscopo){
    plano.bloqueios.push('arquivo sem linha de escopo — arquivamento desligado');
    podeArquivar = false;
  } else if (linhaEscopo.escopo !== 'completo'){
    plano.bloqueios.push('escopo parcial declarado no arquivo — este arquivo nunca arquiva');
    podeArquivar = false;
  }
  if (plano.erros.length > 0){
    plano.bloqueios.push('arquivo tem linha(s) recusada(s) — um arquivo com identidade corrompida não arquiva nada');
    podeArquivar = false;
  }
  if (linhaEscopo && linhaEscopo.instalados !== plano.instaladosAgora){
    plano.bloqueios.push('contagem de instalados do arquivo (' + linhaEscopo.instalados + ') diverge da atual (' + plano.instaladosAgora + ') — o inventário mudou desde a exportação');
    podeArquivar = false;
  }
  if (podeArquivar && candidatosArquivar.length > plano.teto){
    plano.bloqueios.push('arquivamento de ' + candidatosArquivar.length + ' equipamento(s) excede o teto de ' + plano.teto + ' — reduza o arquivo ou use a OS de movimentação');
    podeArquivar = false;
  }
  // candidatosArquivar é sempre populada (informativa) — é o que permite a
  // tela mostrar, em tom neutro, quem SERIA arquivado mesmo quando uma
  // guarda desligou o arquivamento; `arquivar` só recebe a mesma lista
  // quando as pré-condições de fato passam, e é `arquivar` (nunca
  // candidatosArquivar) que aplicarPlanoPlanilha lê para gravar.
  plano.candidatosArquivar = candidatosArquivar.map(function(e){ return {id: e.id, predio: e.predio, local: e.local}; });
  if (podeArquivar){
    plano.arquivar = plano.candidatosArquivar;
  }

  return plano;
}
/* ── planilha do inventário: tela e gravação ── */
/* D-5hy-23: um botão só na .sec-head (#btn-planilha, antes de

/* D-s3h-08: seleção vazia avisa e não abre janela nem gera arquivo, mesmo

function exportarInventarioCsv(){
